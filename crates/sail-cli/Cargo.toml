[package]
name = "sail-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "CLI for the Sail framework — build, check, dev verbs over the sail-compiler crate."
publish = false

[dependencies]
sail-compiler = { path = "../sail-compiler" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "sail"
path = "src/main.rs"
