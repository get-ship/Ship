[package]
name = "ship-sui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Thin re-export facade over ship-sui-host + ship-sui-server."

[lib]
name = "ship_sui"
path = "src/lib.rs"

[features]
default = []
specta = ["dep:specta", "ship-sui-server/specta"]

[dependencies]
ship-sui-host = { path = "../ship-sui-host" }
ship-sui-server = { path = "../ship-sui-server" }
specta = { workspace = true, features = ["serde_json"], optional = true }
