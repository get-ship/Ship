[package]
name = "sui-lint"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sui_lint"
path = "src/lib.rs"

[dependencies]
# Re-use the j2 lint crate's report types — Finding/Severity/Category
# are stack-agnostic and shared across all Ship lint surfaces.
lint = { path = "../../core/lint" }

# Rust-native TS/JS parsing — Solid-shaped fine-grained AST. Walks via
# the Visit trait. No tsc dependency.
oxc_parser    = "0.128"
oxc_ast       = "0.128"
oxc_ast_visit = "0.128"
oxc_allocator = "0.128"
oxc_span      = "0.128"

# Loading the canonical CSS-token registry from
# crates/sui-compiler/tokens.json (compile-time `include_str!`).
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
