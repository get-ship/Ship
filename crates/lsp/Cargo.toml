[package]
name = "lsp"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "lsp"
path = "src/lib.rs"

[dependencies]
lint = { path = "../core/lint" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
crossbeam-channel = "0.5"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
