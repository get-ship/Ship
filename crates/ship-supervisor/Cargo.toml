[package]
name = "ship-supervisor"
version = "0.1.0"
edition = "2024"
publish = false
description = "OS-level agent supervision — executors, isolation, terminal launching, graceful exit. Consumes the platform's orchestrator traits and provides the concrete daemon-side implementations."

[dependencies]
ship-substrate = { path = "../core/ship-substrate" }
ship-platform = { path = "../core/ship-platform" }
ship-types = { path = "../core/ship-types" }

anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }
nanoid = { workspace = true }
portable-pty = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
