[package]
name = "harness-adaptors"
version = "0.1.0"
edition = "2024"
publish = false
description = "Third-party-harness driver box — emits and mines harness-native config trees (.claude/, codex, opencode, pi)"

[features]
default = []
# Derive specta::Type on all public types — used by the Tauri bridge.
specta = ["dep:specta", "stack-model/specta"]

[dependencies]
stack-model = { path = "../stack-model" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
toml = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
minijinja = { workspace = true }
nanoid = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
semver = { workspace = true }
specta = { workspace = true, features = ["serde_json"], optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true }

[lints]
workspace = true
