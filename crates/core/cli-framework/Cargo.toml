[package]
name = "cli-framework"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Shared primitives for Ship CLI binaries — typed action types (event/mcp/harness/skill), dispatch handlers, and hook integration. Keeps `ship-cli` subcommands as thin wrappers over typed actions."

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
ship-substrate = { path = "../ship-substrate" }
ship-platform = { path = "../ship-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
tracing = { workspace = true }
home = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
