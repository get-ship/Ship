[package]
name = "ship-ops-rpc"
version = "0.1.0"
edition = "2024"
publish = false
description = "ConnectRPC surface for the Ship operation registry (ship.ops.v1). Generated in build.rs from proto/ship/ops/v1/*.proto — proto owns op shapes + policy (capability/blast-radius). The daemon implements the OpsService trait; CLI/GUI are generated clients."

[dependencies]
# Connect-RPC runtime. `client` for the generated client (CLI/GUI); `axum`
# for the daemon to mount the generated service on the existing router.
connectrpc = { version = "0.4", features = ["client", "axum"] }
# Must match the version connectrpc 0.4.x pulls transitively (two-buffa-version
# diagnostic otherwise — see ship-gateway-client).
buffa = { version = "0.5", features = ["json"] }
# Generated code names ::serde:: and ::http_body:: paths directly.
serde = { workspace = true }
http-body = "1"
http = "1"
thiserror = { workspace = true }

[build-dependencies]
connectrpc-build = "0.4"
# Bundles protoc so fresh clones need no system-wide install.
protoc-bin-vendored = "3"
