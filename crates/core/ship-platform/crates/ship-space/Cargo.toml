[package]
name = "ship-space"
version = "0.1.0"
edition = "2024"
publish = false
description = "SpaceService — space identity + per-space config overlay + space registry + install lifecycle (L1). Implements space.proto's RPCs via DataStore + KernelLog; no direct sqlite/raw-fs access."

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-reactive = { path = "../ship-reactive" }
ship-ops-rpc = { path = "../../../ship-ops-rpc" }
# `install_stack` / `unregister_stack` / `list_installed` consume the
# `ship_store::Registry` trait + `install_stack` orchestrator. The wire
# trait exposes them via `Arc<dyn Registry + Send + Sync>` so the install
# pipeline can be mocked (the round-trip test in ship-store uses this seam).
ship-store = { path = "../ship-store" }
# `rules::list_space_rules` reads the per-space `settings_overlay` partition
# through ship-config's overlay accessor (the typed reader over the
# substrate's DataStore port, shared by the SPACE/ACCOUNT SettingsService
# scopes). No circular dep — ship-config stays ship-space-free.
ship-config = { path = "../ship-config" }
# `rules::SpaceRule::into_stack_rule` projects into the `stack_model::Rule`
# shape the harness compile flow consumes (the same struct
# `ExtensionLibrary::rules` carries). stack-model stays leaf (no ship-*
# back-edge), so this is a one-way dep.
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "de7599e1163559aaa1da7dbae6be1768c4ad5d09" }
stack-model = { path = "../../../stack-model" }

async-trait = { workspace = true }
async-stream = "0.3"
connectrpc = { version = "0.4", features = ["axum"] }
buffa = { version = "0.5" }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
chrono = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
ship-substrate = { path = "../../../ship-substrate" }
ship-collection = { path = "../ship-collection" }
ship-artifacts = { path = "../ship-artifacts" }
ship-reactive = { path = "../ship-reactive" }
ship-config = { path = "../ship-config" }
ship-store = { path = "../ship-store" }

[lints]
workspace = true
