[package]
name = "floki"
version = "0.1.0"
edition = "2024"
publish = false
description = """
Deprecated package name. Yoke (native harness) lives in get-ship/bridge.
This crate re-exports `yoke` so Ship can migrate call sites; delete when
shipd uses Bridge RPC only.
"""

[lints]
workspace = true

[dependencies]
# Sibling layout: bridge checkout next to ship.
yoke = { path = "../../../../../../bridge/crates/yoke" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
