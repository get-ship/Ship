[package]
name = "ship-account"
version = "0.1.0"
edition = "2024"
publish = false
description = "AccountService — Ship Cloud identity (login / logout / state / key) over substrate ports (L1). Token at rest via config_doc secret-doc (no raw fs); account.* audit via KernelLog; gateway exchange via ship-gateway-client. Implements account.proto's typed AccountService."

[dependencies]
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "03f917d5e51921754c1a6a12a4aa2beb56b4a405" }
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-gateway-client = { path = "../../../ship-gateway-client" }
ship-ops-rpc = { path = "../../../ship-ops-rpc" }
ship-proto = { git = "https://github.com/get-ship/ship-contracts.git", branch = "feat/next" }

async-trait = { workspace = true }
connectrpc = { version = "0.4", features = ["axum"] }
buffa = { version = "0.5" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
chrono = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
urlencoding = "2"
# specta export of the account value types (AccountState / MeView) for the
# deck SDK TS codegen (xtask gen-types). Off by default; xtask enables it.
specta = { workspace = true, features = ["chrono"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }

[features]
specta = ["dep:specta"]

[lints]
workspace = true
