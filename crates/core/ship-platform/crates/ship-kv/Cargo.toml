[package]
name = "ship-kv"
version = "0.1.0"
edition = "2024"
publish = false
description = "Key-value state store (L1) — namespaced, JSON values. Backed by kv.db, separate from platform.db so KV writes never compete with the event log for WAL locks. Only dep is ship-substrate (the L0 substrate that owns the db primitives); consumers (skill_vars, init migration) re-export this crate through ship-platform."

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }

[lints]
workspace = true
