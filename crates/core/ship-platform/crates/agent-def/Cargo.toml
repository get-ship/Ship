[package]
name = "agent-def"
version = "0.1.0"
edition = "2024"
publish = false
description = "L1: the unified agent-definition domain — config / harnesses / rules / permissions / skills / imports. The ONE definition both Floki and ship-code read; the control plane + shipd depend on it for config CRUD without pulling a runtime. (Carved from ship-agents.)"

[lints]
workspace = true

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
agent-driver = { path = "../agent-driver" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-kernel = { path = "../../../ship-substrate/crates/ship-kernel" }
# `SessionEventSink` is a thin wrapper around `&dyn ship_kernel::EventSink`.
# Production callers wire it to a kernel-backed impl (e.g. the
# `ship_substrate::events::emit::KernelEventSink`); we depend on ship-kernel
# for the `EventSink` trait + `testing::MockSink` (test seam), and let the
# caller pull the L0 emit helpers via `ship_substrate`.
ship-config = { path = "../ship-config" }
ship-store = { path = "../ship-store" }
# Compose the on-disk source + locked cached packages + the operator-
# enabled library tier into a single `ComposedLibrary` (Phase-3 roll-up).
# `compile_project` routes through this so the post-Wave-5 single-source
# CLI path (`ship use`) sees the same composed world shipd's index and
# the dispatch path already see. Wave 5: the leaf no longer reads
# `.ship/agents/*.jsonc` / `.ship/skills/<id>/SKILL.md` — the roll-up is
# the only door for those nouns; `compile_project` has to walk it.
ship-resolver = { path = "../../../ship-resolver" }
# the compiler engine — services/compile is the wrapper
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "ed7c6a74b9a2702bdcbb22b267601ab663b6857b", features = ["specta"] }
stack-model = { path = "../../../stack-model", features = ["specta"] }
harness-config-compiler = { git = "https://github.com/get-ship/fleet.git", rev = "ed7c6a74b9a2702bdcbb22b267601ab663b6857b", features = ["specta"], optional = true }
inventory = { workspace = true }
include_dir = "0.7"
# sqlx is optional: only skill_vars_store + compile/projection need it.
# Yoke/floki links agent-def with `default-features = false` so the native
# harness graph does not pull sqlite for definition types alone.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"], optional = true }
# The `file_changed_consumer` module (job/transient-events) spawns a tokio
# task on the kernel-log broadcast. The runner mechanism pulls tokio in
# transitively, but the consumer needs direct access to `tokio::spawn` /
# `tokio::sync::broadcast` error types — declare the dep here.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
specta = { workspace = true, features = ["chrono", "serde_json"] }
jsonschema = { version = "0.46", default-features = false }
tempfile = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
home = { workspace = true }

[dev-dependencies]
# Test helper (`testutil::init_project`) installs platform defaults; this is a
# dev-only edge (Cargo permits the dev-dependency cycle through ship-platform).
# The `testutil` feature enables `ship_platform::testutil` (gated on that
# feature + cfg(test) in lib.rs) so agent-def tests can re-export it without a
# local copy.
ship-platform = { path = "../..", features = ["testutil"] }
tempfile = { workspace = true }
chrono = { workspace = true }
walkdir = "2.3"

[features]
# Default keeps prior behavior for platform consumers (skills service, CLI).
# Floki/Yoke opts out via `default-features = false` so sqlx is not required
# for the thin Agent + session-event surface.
default = ["kv"]
# KV-backed skill variables (`skill_vars` / `skill_vars_store`) — needs sqlx.
kv = ["dep:sqlx"]
# The stack->harness compile driver (compile/): ship-code's world.
# Compile projection + skill_parser vars loading need kv/sqlx.
ship-code = ["dep:harness-config-compiler", "kv"]
fixtures = []
specta = []
