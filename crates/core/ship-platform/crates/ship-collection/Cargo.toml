[package]
name = "ship-collection"
version = "0.1.0"
edition = "2024"
publish = false
description = "CollectionService — schema registry + thin RPC facade over substrate ports (L1). Implements collection.proto's 10 RPCs via DataStore + KernelLog; no direct sqlite access."

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-reactive = { path = "../ship-reactive" }
ship-ops-rpc = { path = "../../../ship-ops-rpc" }
ship-proto = { git = "https://github.com/get-ship/ship-contracts.git", branch = "feat/next" }

sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
anyhow = { workspace = true }

async-trait = { workspace = true }
async-stream = "0.3"
connectrpc = { version = "0.4", features = ["axum"] }
buffa = { version = "0.5" }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
chrono = { workspace = true }
specta = { workspace = true, features = ["serde_json"], optional = true }

[features]
default = []
specta = ["dep:specta"]

[dev-dependencies]
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "6967f155ca795c19c44a145701c138b2d079c89c" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
ship-substrate = { path = "../../../ship-substrate" }

[lints]
workspace = true
