[package]
name = "ship-terminal"
version = "0.1.0"
edition = "2024"
publish = false
description = "Terminal domain (L1) — PTY session registry + shell spawn over the supervisor primitive. Replaces the legacy `ship_agents::services::sessions::{SessionRegistry, shell_actor}`."

[dependencies]
# L0 substrate — supervisor primitive (spawn_actor, ActorHandle, ActorProfile).
ship-substrate = { path = "../../../ship-substrate" }
process-supervisor = { path = "../../../ship-substrate/crates/process-supervisor" }
harness-adapter = { path = "../harness-adapter" }
# L0 harness adapter — PtySession's event_tx carries HarnessEvent.
ship-harnesses = { path = "../ship-harnesses" }

anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
