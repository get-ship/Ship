[package]
name = "ship-config"
version = "0.1.0"
edition = "2024"
publish = false
description = "SettingsService home — unified scope-discriminated settings (SPACE/ACCOUNT/RUNTIME) over substrate ports + the legacy declarative-tier file projection (agents/watcher over FsBroker). Implements settings.proto's 4 RPCs, event-sourced via settings.changed; ZERO raw fs. (Crate-name rename ship-config→ship-settings is deferred to S4.)"

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-reactive = { path = "../ship-reactive" }
ship-ops-rpc = { path = "../ship-ops-rpc" }
compiler = { path = "../compiler" }

anyhow = { workspace = true }
async-trait = { workspace = true }
home = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
async-stream = "0.3"
chrono = { workspace = true }
connectrpc = { version = "0.4", features = ["axum"] }
buffa = { version = "0.5" }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
futures-util = { workspace = true }
ship-reactive = { path = "../ship-reactive" }

[lints]
workspace = true
