[package]
name = "ship-artifacts"
version = "0.1.0"
edition = "2024"
publish = false
description = "ArtifactsService — content-addressed blob store + metadata projection (L1). Implements artifacts.proto's 5 RPCs via DataStore + KernelLog; blob bytes stay on a private FS backend until the substrate BlobStore port lands."

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-reactive = { path = "../ship-reactive" }
ship-ops-rpc = { path = "../../../ship-ops-rpc" }

async-trait = { workspace = true }
async-stream = "0.3"
connectrpc = { version = "0.4", features = ["axum"] }
buffa = { version = "0.5" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
chrono = { workspace = true }
ulid = { workspace = true }
anyhow = { workspace = true }
# Optional: derive(specta::Type) on wire-facing records so the daemon's
# specta-gated TS surface (apps/shipd wire.rs `ArtifactsListResponse`) can
# embed `ArtifactRecord` under the `specta` feature. Off by default — the
# production daemon/binary never pulls specta.
specta = { workspace = true, features = ["chrono", "serde_json"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
ship-substrate = { path = "../../../ship-substrate" }

[lints]
workspace = true
