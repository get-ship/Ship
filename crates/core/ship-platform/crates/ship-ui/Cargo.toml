[package]
name = "ship-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "View authoring service (L1) — agent-driven .sui edit ops: source read/write, snapshot/restore, annotate, edit-mode capability. Built on substrate ports + collection/artifact services."

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-collection = { path = "../ship-collection" }
ship-artifacts = { path = "../ship-artifacts" }
# ConnectRPC wire layer (wire.rs) — implements UiService for shipd mount.
connectrpc = { version = "0.4", features = ["axum"] }
ship-ops-rpc = { path = "../../../ship-ops-rpc" }
ship-proto = { git = "https://github.com/get-ship/ship-contracts.git", branch = "feat/next" }
# SUI/SAIL compiler analysis facade (diagnostics / hover / dependencies).
# Crate id on remote sail feat/next is still `sui-compiler` (rename follow-up
# when sail publishes `sail-compiler`). Git dep on get-ship/sail.
sui-compiler = { git = "https://github.com/get-ship/sail.git", branch = "feat/next" }

async-trait = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
# Optional: derive(specta::Type) on the view wire types so the daemon's
# specta-gated TS surface can embed them. Off by default.
specta = { workspace = true, features = ["chrono", "serde_json"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tempfile = { workspace = true }
