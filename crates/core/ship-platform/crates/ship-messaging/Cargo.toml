[package]
name = "ship-messaging"
version = "0.1.0"
edition = "2024"
publish = false
description = "Human-messaging egress — notification adapters (Telegram today; Slack, WhatsApp, etc. tomorrow) and the human-gateway service that forwards pipeline.run.blocked to a human. L1 home for the outbound HTTP that previously leaked into ship-substrate (L0)."

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }

anyhow = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[lints]
workspace = true
