[package]
name = "ship-triggers"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reactive trigger engine — JSONC triggers that match Ship events and dispatch actions (L1). Carved from ship-platform/src/triggers."

[dependencies]
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "6967f155ca795c19c44a145701c138b2d079c89c" }
ship-substrate = { path = "../../../ship-substrate" }
fs-watch = { path = "../../../ship-substrate/crates/fs-watch" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-config = { path = "../ship-config" }
ship-collection = { path = "../ship-collection" }
stack-model = { path = "../../../stack-model" }

serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
minijinja = { workspace = true }
cron = "0.12"
chrono = { workspace = true }
jsonschema = { version = "0.46", default-features = false }
globset = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
ship-substrate = { path = "../../../ship-substrate" }
fs-watch = { path = "../../../ship-substrate/crates/fs-watch" }
# hydrate_registry lives in ship-store; consumed only in integration tests.
ship-store = { path = "../ship-store" }

[lints]
workspace = true
