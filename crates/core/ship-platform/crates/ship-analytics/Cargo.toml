[package]
name = "ship-analytics"
version = "0.1.0"
edition = "2024"
publish = false
description = "Analytics rollups over hook.* events — per-session duration, per-tool counts, cost. Lives downstream of ship-substrate's event log; will grow harness data-dir mining (~/.claude/, ~/.codex/, etc.) so Ship's GUI surface can render the same data the harnesses already write to disk."

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }

anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
