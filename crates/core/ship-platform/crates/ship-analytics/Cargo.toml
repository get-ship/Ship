[package]
name = "ship-analytics"
version = "0.1.0"
edition = "2024"
publish = false
description = "Analytics rollups over hook.* events — per-session duration, per-tool counts, cost. Lives downstream of ship-substrate's event log; will grow harness data-dir mining (~/.claude/, ~/.codex/, etc.) so Ship's GUI surface can render the same data the harnesses already write to disk."

[dependencies]
agent-def = { path = "../agent-def" }
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "354bfd591ad71df9f933d8faaa8fae3b9c783378" }
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-ops-rpc = { path = "../../../ship-ops-rpc" }
ship-proto = { git = "https://github.com/get-ship/ship-contracts.git", branch = "feat/next" }
connectrpc = { version = "0.4", features = ["axum"] }

anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
