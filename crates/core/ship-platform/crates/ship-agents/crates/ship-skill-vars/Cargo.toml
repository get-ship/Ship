[package]
name = "ship-skill-vars"
version = "0.1.0"
edition = "2024"
publish = false
description = "Skill-variable persistence for ship-agents — namespaced JSON values backed by kv.db (physically separate from the event log so writes never compete for WAL locks). Internal sub-crate of ship-agents."

[dependencies]
ship-substrate = { path = "../../../../../ship-substrate" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }

[lints]
workspace = true
