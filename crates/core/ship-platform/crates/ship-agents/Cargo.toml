[package]
name = "ship-agents"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agent domain (L1) — agent-session dispatch, agent-domain policy/resolver/skill/import, hooks engine, and L1 service wrappers (agents/mcp/rules/permissions/skills/sessions/compile). Carved from ship-platform (C8 keystone)."

[dependencies]
# RPC wire layer (ConnectRPC trait impls for rules/mcp/permissions/skills/agents)
ship-ops-rpc = { path = "../../../ship-ops-rpc" }
ship-reactive = { path = "../ship-reactive" }
connectrpc = { version = "0.4", features = ["axum"] }
async-stream = "0.3"
buffa = "0.5"
# L0 substrate
ship-substrate = { path = "../../../ship-substrate" }
process-supervisor = { path = "../../../ship-substrate/crates/process-supervisor" }
agent-driver = { path = "../agent-driver" }
# L0 git capability — git2-backed; baseline SHA capture on the ship-code path.
ship-git = { path = "../../../ship-git", optional = true }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-kernel = { path = "../../../ship-substrate/crates/ship-kernel" }
# L1 crates (carved siblings, no cycle)
agent-def = { path = "../agent-def" }
ship-code = { path = "../../../../../../bridge/crates/ship-code", features = ["ship-code"], optional = true }
ship-config = { path = "../ship-config" }
ship-harnesses = { path = "../ship-harnesses" }
ship-files = { path = "../ship-files" }
ship-store = { path = "../ship-store" }
# Agent-run assembly deps (supervisor split — `runtime::executors`):

#   ship-auth — per-process scoped token mint/drop on the spawn path.
ship-auth = { path = "../ship-auth" }
# compiler crate (the engine; services/compile is only the wrapper)
stack-model = { path = "../../../stack-model", features = ["specta"] }
harness-config-compiler = { path = "../../../../../../bridge/crates/harness-config-compiler", features = ["specta"], optional = true }
# Phase-3 space roll-up — the no-index agent read composes through the SAME
# world `compile_project`/dispatch-compile do (format-migration W5 follow-up).
ship-resolver = { path = "../../../ship-resolver" }

ulid = { workspace = true }

async-trait = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "macros", "process", "io-util"] }
chrono = { workspace = true }
specta = { workspace = true, features = ["chrono", "serde_json"] }
home = { workspace = true }
thiserror = { workspace = true }
shell-words = { workspace = true }
base64 = { workspace = true }
semver = { workspace = true, features = ["serde"] }
tempfile = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
# RFC 6902 JSON Patch
json-patch = "4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
tempfile = { workspace = true }
chrono = { workspace = true }
ship-platform = { path = "../.." }
libc = { workspace = true }

[features]
fixtures = []
specta = []
# ship-code: pull in the third-party-harness driver stack.
# With this feature ON:  cancel, terminal_guard, the harness dispatch path,
#                        executor/isolation/registry/etc. ports, baseline SHA,
#                        and the `runtime` re-export are all compiled in.
# With this feature OFF: only the yoke path (YokeRunFn + the floki branch
#                        in dispatch.rs) is compiled; ship-code and ship-git are absent.
ship-code = ["dep:ship-code", "dep:ship-git", "dep:harness-config-compiler", "agent-def/ship-code"]

[lints]
workspace = true
