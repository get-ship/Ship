[package]
name = "ship-agents"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agent domain (L1) — agent-session dispatch, agent-domain policy/resolver/skill/import, hooks engine, and L1 service wrappers (agents/mcp/rules/permissions/skills/sessions/compile). Carved from ship-platform (C8 keystone)."

[dependencies]
# RPC wire layer (ConnectRPC trait impls for rules/mcp/permissions/skills/agents)
ship-ops-rpc = { path = "../../../ship-ops-rpc" }
ship-reactive = { path = "../ship-reactive" }
connectrpc = { version = "0.4", features = ["axum"] }
async-stream = "0.3"
buffa = "0.5"
# L0 substrate
ship-substrate = { path = "../../../ship-substrate" }
# L0 git capability — git2-backed; single git implementation.
ship-git = { path = "../../../ship-git" }
ship-runner = { path = "../../../ship-substrate/crates/ship-runner" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
ship-kernel = { path = "../../../ship-substrate/crates/ship-kernel" }
# L1 crates (carved siblings, no cycle)
agent-def = { path = "../agent-def" }
ship-code = { path = "../ship-code", features = ["harness-drivers"] }
ship-config = { path = "../ship-config" }
ship-harnesses = { path = "../ship-harnesses" }
ship-files = { path = "../ship-files" }
ship-store = { path = "../ship-store" }
# Agent-run assembly deps (supervisor split — `runtime::executors`):
#   ship-auth     — per-process scoped token mint/drop on the spawn path.
#   ship-device   — isolation-execution sandbox dispatcher bookkeeping.
#   ship-isolation — isolation decision + sandbox backends (L0; default-off
#                    keeps the youki/sidecar backends opt-in, matching the
#                    daemon's feature wiring).
ship-auth = { path = "../ship-auth" }
ship-device = { path = "../ship-device" }
ship-isolation = { path = "../../../ship-isolation", default-features = false }
# compiler crate (the engine; services/compile is only the wrapper)
compiler = { path = "../../../compiler", features = ["specta"] }
jsonschema = { version = "0.46", default-features = false }

ulid = "1"

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "macros", "process", "io-util"] }
chrono = { workspace = true }
specta = { workspace = true, features = ["chrono", "serde_json"] }
indexmap = { workspace = true, features = ["serde"] }
nanoid = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
home = { workspace = true }
thiserror = { workspace = true }
shell-words = { workspace = true }
futures-util = { workspace = true }
walkdir = "2.3"
globset = "0.4"
minijinja = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
semver = { workspace = true, features = ["serde"] }
tempfile = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
portable-pty = "0.9"
# SIGTERM/SIGKILL on the headless ProcessExecutor stop path (unix only).
libc = { workspace = true }
include_dir = "0.7"
# RFC 6902 JSON Patch
json-patch = "4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
tempfile = { workspace = true }
chrono = { workspace = true }
ship-platform = { path = "../.." }

[features]
fixtures = []
specta = []

[lints]
workspace = true
