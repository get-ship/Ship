[package]
name = "ship-store"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "Ship package registry — dependency resolver, content-addressed cache, compose, install, schema loaders. Depends on L0 only; no cycle back into ship-platform."

[features]
# Opt-in gate for release builds. Enable this feature when cutting a release
# to fail compilation if FIRST_PARTY_KID still contains the PLACEHOLDER stub
# (see crates/ship-store/src/bundle_sig.rs). Dev builds leave this unset so
# normal `cargo build` / `cargo test` work without a real signing key.
# Release-engineering sets: `cargo build -p ship-store --features release`
release = []

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
content-scan = { path = "../../../ship-substrate/crates/content-scan" }
ship-collection = { path = "../ship-collection" }
compiler = { path = "../../../compiler" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
semver = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true, features = ["json"] }
jsonwebtoken = "9"
walkdir = "2.3"
tracing = { workspace = true }
home = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
