[package]
name = "ship-store"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "Ship package registry — dependency resolver, content-addressed cache, compose, install, schema loaders. Depends on L0 only; no cycle back into ship-platform."

[features]
# Opt-in gate for release builds. Enable this feature when cutting a release
# to fail compilation if FIRST_PARTY_KID still contains the PLACEHOLDER stub
# (see crates/ship-store/src/bundle_sig.rs). Dev builds leave this unset so
# normal `cargo build` / `cargo test` work without a real signing key.
# Release-engineering sets: `cargo build -p ship-store --features release`
release = []

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }
content-scan = { path = "../../../ship-substrate/crates/content-scan" }
ship-collection = { path = "../ship-collection" }
# `ship-gateway-client` is the typed Connect-RPC surface for the cloud
# gateway; the install pipeline drives `RegistryService.{ResolveVersion,
# FetchBundle}` through it (the bundle bytes download from the signed
# CDN URL the FetchBundle response returns).
ship-gateway-client = { path = "../../../ship-gateway-client" }
bundle-limits = { path = "../bundle-limits" }
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "6967f155ca795c19c44a145701c138b2d079c89c" }
stack-model = { path = "../../../stack-model" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
semver = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
thiserror = { workspace = true }
jsonwebtoken = "9"
walkdir = "2.3"
tracing = { workspace = true }
home = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
parking_lot = { workspace = true }

[lints]
workspace = true
