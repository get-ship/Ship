[package]
name = "agent-driver"
version = "0.1.0"
edition = "2024"
publish = false
description = "L1 agent-driver contract: the `AgentDriver` trait + its value types (LaunchCommand/LaunchProfile, ServerSession). The trait every third-party agent runtime implements and ship-code drives. Peer implementations — Floki (in-process, native) and the third-party-harness drivers in `ship-harnesses` — both reach the same contract leaf without a cycle, so harness concerns live in L1, out of the substrate."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[lints]
workspace = true
