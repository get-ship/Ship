[package]
name = "ship-reactive"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generic snapshot-diff resolver — turns kernel events into live patch streams (L1)."

[dependencies]
ship-substrate = { path = "../../../ship-substrate" }
ship-types = { path = "../../../ship-substrate/crates/ship-types" }

futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }

[lints]
workspace = true
