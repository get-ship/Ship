[package]
name = "stack-model"
version = "0.1.0"
edition = "2024"
publish = false
description = "The stack model — manifest, lockfile, skills, compose law, library types (standard; shared by floki and ship-code)"

[features]
default = []
# Derive specta::Type on all public types — used by the Tauri bridge.
specta = [
    "dep:specta",
    "agent-schema/specta",
    "ship-collection/specta",
    "ship-pipelines/specta",
    "ship-triggers/specta",
    "ship-ui/specta",
]

[dependencies]
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "03f917d5e51921754c1a6a12a4aa2beb56b4a405" }
# Product-owned noun schemas (stack inversion): ExtensionLibrary fields.
ship-collection = { path = "../ship-platform/crates/ship-collection" }
ship-pipelines = { path = "../ship-substrate/crates/ship-pipelines" }
ship-triggers = { path = "../ship-platform/crates/ship-triggers" }
ship-ui = { path = "../ship-platform/crates/ship-ui" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
toml = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
minijinja = { workspace = true }
nanoid = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
semver = { workspace = true }
specta = { workspace = true, features = ["serde_json"], optional = true }

[dev-dependencies]
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "03f917d5e51921754c1a6a12a4aa2beb56b4a405" }
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true }

[lints]
workspace = true
