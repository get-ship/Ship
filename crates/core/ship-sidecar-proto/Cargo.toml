[package]
name = "ship-sidecar-proto"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generated ConnectRPC bindings for the ship.sidecar.v1 protocol. Source of truth at proto/ship/sidecar/v1/sidecar.proto. Consumed by ship-isolation (host driver), bin/ship-sidecar (in-sandbox handler), and the upcoming substrate transport (so substrate can speak the boundary protocol without depending on ship-isolation)."

[dependencies]
# Generated sidecar bindings now live in the published `ship-proto` crate
# (ship-contracts SSOT); this crate is a thin re-export so consumers keep
# importing `ship_sidecar_proto::*`.
ship-proto = { git = "file:///home/madvib/dev/ship-contracts", branch = "master" }
connectrpc = { version = "0.4", features = ["client"] }
buffa = { version = "0.5", features = ["json"] }
serde = { workspace = true }
http-body = "1"
http = "1"

[lints]
workspace = true
