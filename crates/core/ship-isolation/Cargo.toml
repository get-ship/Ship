[package]
name = "ship-isolation"
version = "0.1.0"
edition = "2024"
publish = false
description = "Ship-specific isolation strategies. The Isolator trait + abstract policy types live in ship-substrate; this crate provides the concrete backends (Docker, Youki, SandboxRuntime, sidecar) plus the recommender + registry + settings layer."

[features]
default = []
youki-backend = ["dep:libc"]
sidecar-mode = ["dep:reqwest", "dep:base64", "dep:futures-util"]

[dependencies]
ship-substrate = { path = "../ship-substrate" }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "process", "io-util", "macros", "rt", "fs", "net"] }
tracing = { workspace = true }
nanoid = { workspace = true }
libc = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, optional = true, features = ["json", "stream"] }
base64 = { version = "0.22", optional = true }
futures-util = { workspace = true, optional = true }
# v1 protocol bindings — codegen via build.rs from proto/ship/sidecar/v1.
# Matches the gateway-client setup so both crates share the toolchain.
connectrpc = { version = "0.4" }
buffa = { version = "0.5", features = ["json"] }
http-body = "1"
http = "1"

[build-dependencies]
connectrpc-build = "0.4"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "process", "time"] }

[[example]]
name = "run_claude"
required-features = ["youki-backend"]

[[example]]
name = "run_claude_sidecar"
required-features = ["youki-backend", "sidecar-mode"]

[lints]
workspace = true
