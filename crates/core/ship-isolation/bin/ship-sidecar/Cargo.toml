[package]
name = "ship-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
description = "In-sandbox daemon. Speaks ship.sidecar.v1 over ConnectRPC. Hosts (Docker / Youki / Fly backends) drive process control + the bidi event channel through this binary."

[[bin]]
name = "ship-sidecar"
path = "src/main.rs"

[dependencies]
ship-isolation = { path = "../.." }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "process", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = { workspace = true }
nanoid = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
futures-util = { workspace = true }
libc = "0.2"
connectrpc = { version = "0.4", features = ["axum"] }
buffa = { version = "0.5" }
# vsock transport for the Tier-3 microVM substrate (Firecracker/Lima): the
# sidecar binds AF_VSOCK inside the guest; the host dials it. Same Connect
# protocol, different listener — see main.rs.
tokio-vsock = "0.7"
http = "1"
portable-pty = "0.9"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync"] }
ship-isolation = { path = "../.." }
connectrpc = { version = "0.4", features = ["client"] }
futures-util = { workspace = true }

[lints]
workspace = true
