[package]
name = "ship-sidecar"
version = "0.1.0"
edition = "2024"
publish = false
description = "In-sandbox daemon. Skeleton — implements only /v1/health today. See ship-isolation::sidecar::protocol for the wire types it will speak."

[[bin]]
name = "ship-sidecar"
path = "src/main.rs"

[dependencies]
ship-isolation = { path = "../.." }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
tracing = { workspace = true }
axum = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "net"] }
ship-isolation = { path = "../.." }

[lints]
workspace = true
