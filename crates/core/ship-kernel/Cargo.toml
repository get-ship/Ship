[package]
name = "ship-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ship-types = { path = "../ship-types" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
