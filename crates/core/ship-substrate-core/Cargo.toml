[package]
name = "ship-substrate-core"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "Shared substrate slice carved out of `ship-substrate`: collection/reactive port surface, db/persistence/projections/queries — no object_store/notify/portable-pty. Mounted by shipd (via the heavy facade) AND by lightweight L1 consumers (ship-collection, ship-reactive, ship-artifacts) so the same shared collection/reactive slice runs in-process."

[features]
unstable = []

[dependencies]
ship-kernel = { path = "../ship-substrate/crates/ship-kernel" }
ship-types = { path = "../ship-substrate/crates/ship-types" }
ship-paths = { path = "../ship-substrate/crates/ship-paths" }
fs-util = { path = "../ship-substrate/crates/fs-util" }
config-doc = { path = "../ship-substrate/crates/config-doc" }
ship-pipelines = { path = "../ship-substrate/crates/ship-pipelines", features = ["specta"] }

inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
nanoid = { workspace = true }
ulid = { workspace = true }
specta = { workspace = true, features = ["chrono", "serde_json"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
async-trait = { workspace = true }
bytes = "1"
futures-util = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
home = { workspace = true }
# Pure path-layout helper for composed traveling-artifact overlays. No ship
# deps — compiler depends only on serde/serde_json/anyhow/minijinja/etc.
compiler = { path = "../compiler" }
walkdir = "2.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"

[lints]
workspace = true
