[package]
name = "lint"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
regex = "1"
once_cell = "1"
minijinja = { version = "2", features = ["unstable_machinery", "loop_controls"] }

[dev-dependencies]
tempfile = "3"
