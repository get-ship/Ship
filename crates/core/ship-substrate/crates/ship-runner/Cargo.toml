[package]
name = "ship-runner"
version = "0.1.0"
edition = "2024"
publish = false
description = "L0 runner mechanism — kernel-emit primitives (`persist_and_route`, `KernelEventSink`, pipeline/process/executor emitters) and the `HarnessAdapter` trait. The lifecycle engine (router, dedup, teardown) lives in `ship_code::runner`."

[dependencies]
ship-substrate = { path = "../.." }
ship-types = { path = "../ship-types" }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing = { workspace = true }

[lints]
workspace = true
