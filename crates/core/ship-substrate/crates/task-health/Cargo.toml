[package]
name = "task-health"
version = "0.1.0"
edition = "2024"
publish = false
description = "L0 supervised-task spawner — runs a background task with panic-catch + restart/backoff and a serde health snapshot. Used by the daemon to keep long-lived jobs alive."

[dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[lints]
workspace = true
