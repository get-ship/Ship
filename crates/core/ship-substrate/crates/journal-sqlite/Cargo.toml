[package]
name = "journal-sqlite"
version = "0.1.0"
edition = "2024"
publish = false
description = "sqlx/SQLite-backed durable-execution JournalStore. The heavy (sqlx) journal backend, carved off the facade so durable-execution's persistence adapter is its own leaf and sqlx stays off consumers that don't journal."

[dependencies]
ship-substrate = { path = "../.." }
durable-execution = { git = "https://github.com/get-ship/ship-exec.git", rev = "40e694384108ce298eccd3e0da22e9f5e9855beb" }
async-trait = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
