[package]
name = "journal-sqlite"
version = "0.1.0"
edition = "2024"
publish = false
description = "sqlx/SQLite-backed durable-execution JournalStore. The heavy (sqlx) journal backend, carved off the facade so durable-execution's persistence adapter is its own leaf and sqlx stays off consumers that don't journal."

[dependencies]
durable-execution = { path = "../durable-execution" }
async-trait = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
