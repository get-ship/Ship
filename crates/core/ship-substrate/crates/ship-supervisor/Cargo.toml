[package]
name = "ship-supervisor"
version = "0.1.0"
edition = "2024"
publish = false
description = "OS-level agent supervision — executors, isolation, terminal launching, graceful exit. Consumes the platform's orchestrator traits and provides the concrete daemon-side implementations."

[dependencies]
ship-substrate = { path = "../.." }
ship-platform = { path = "../../../ship-platform" }
# L0 runner mechanism (agents-arc S2). The supervisor emits process/executor
# lifecycle events through the runner's kernel-emit helpers — an L0-to-L0 reach
# that replaces the historic up-reach into `ship_platform::…::orchestrator::emit`
# (the parked PHASE-3-TODO layer-direction violation in executors/process.rs).
ship-runner = { path = "../ship-runner" }
ship-isolation = { path = "../../../ship-isolation", default-features = false }
ship-types = { path = "../ship-types" }

anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }
nanoid = { workspace = true }
portable-pty = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
