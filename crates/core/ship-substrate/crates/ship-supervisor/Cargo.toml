[package]
name = "ship-supervisor"
version = "0.1.0"
edition = "2024"
publish = false
description = "L0 OS-level process primitives — terminal-tab launching and process-event emit. The agent-run assembly (executors, isolation, harness selection, token minting) moved up into ship-agents; the daemon composition root moved into apps/shipd."
[dependencies]
ship-substrate = { path = "../.." }
# L0 runner mechanism — process-event emit helpers re-exported by
# `process_events`.
ship-runner = { path = "../ship-runner" }

tracing = { workspace = true }

[dev-dependencies]
ship-harnesses = { path = "../../../ship-platform/crates/ship-harnesses" }

[lints]
workspace = true
