[package]
name = "ship-js"
version = "0.1.0"
edition = "2024"
publish = false
description = "L0: the Ship JS engine — a deno_core/V8 isolate with a one-wire host-dispatch seam. The `deno` feature gates the V8 runtime; the dispatch contract is always available."

[lints]
workspace = true

[features]
default = []
# The deno_core / V8 runtime. Off by default so `cargo build --workspace` pays
# no V8; the `dispatch` contract (the trait + error) is always available without
# it, so a consumer can depend on the contract without pulling V8.
deno = ["dep:deno_core", "dep:deno_error", "dep:tokio", "dep:anyhow"]

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
# Always present: the `Dispatch` seam is async.
async-trait = { workspace = true }
# deno runtime (feature = "deno"). Versions pinned to the spike that proved them.
deno_core = { version = "0.403.0", optional = true }
deno_error = { version = "0.7", optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "macros", "time"] }
anyhow = { workspace = true, optional = true }
