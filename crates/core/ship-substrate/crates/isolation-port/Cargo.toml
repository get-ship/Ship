[package]
name = "isolation-port"
version = "0.1.0"
edition = "2024"
publish = false
description = "The isolation contract (the L0 seam of #49): the `Isolator` trait + sandbox policy/handle/owner types that ship-isolation's backends (docker/firecracker/lima/wsl/...) implement. Policy is the trust boundary and lives here; the mechanism/backends are the L1 ship-isolation crate."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
nanoid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
