[package]
name = "ship-types"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared domain types across the Ship workspace — EventEnvelope, ActorIdentity, Scope, Vector, CallerKind. Zero internal dependencies; every other Ship crate may depend on this."

[dependencies]
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "de7599e1163559aaa1da7dbae6be1768c4ad5d09" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
inventory = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
specta = { workspace = true, features = ["chrono"], optional = true }


[features]
default = []
specta = ["dep:specta"]

[lints]
workspace = true
