[package]
name = "ship-types"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared domain types across the Ship workspace — EventEnvelope, ActorIdentity, Scope, Vector, CallerKind. Zero internal dependencies; every other Ship crate may depend on this."

[dependencies]
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "6967f155ca795c19c44a145701c138b2d079c89c" }
event-core = { git = "https://github.com/get-ship/ship-exec.git", rev = "ee39e5273ce8829d90043626a01f564e660dd477" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
specta = { workspace = true, features = ["chrono"], optional = true }


[features]
default = []
specta = ["dep:specta"]

[lints]
workspace = true
