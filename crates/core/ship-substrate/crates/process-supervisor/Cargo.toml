[package]
name = "process-supervisor"
version = "0.1.0"
edition = "2024"
publish = false
description = "The process supervisor — the single spawn primitive. Spawns + supervises a child process over a transport (PTY today), registers it on the kernel, and returns a handle. A substrate engine; the pty/portable-pty transport is its adapter."

[dependencies]
ship-substrate-core = { path = "../../../ship-substrate-core" }
isolation-port = { path = "../isolation-port" }
ship-substrate-host = { path = "../ship-substrate-host" }
portable-pty = "0.9"
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
