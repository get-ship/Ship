[package]
name = "ship-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ship-types = { path = "../ship-types" }
parking_lot = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
serde_json = { workspace = true }

[features]
default = []
# Unchecked `Stamped` mint for tests. Production builds never enable this.
test-support = ["ship-types/test-support"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
# Unit tests mint Stamped via unchecked.
ship-types = { path = "../ship-types", features = ["test-support"] }

[lints]
workspace = true
