[package]
name = "durable-execution"
version = "0.1.0"
edition = "2024"
publish = false
description = "L0: the durable-execution engine. Journals every op; suspends and resumes by replaying the journal — completed ops (incl. model calls) return logged results, so a recovered run never re-runs effects or re-burns tokens. The substrate agents and pipelines execute on."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
# The op-execution contract (`Dispatch` + `DispatchError`) is shared with the JS
# engine — durable-execution CONSUMES ship-js. `default-features = false` takes
# only the dispatch seam (no deno/V8); code-mode (deno) is activated by the
# consumer (floki), not by a feature on this crate.
# ship-js lives in the standalone ship-exec repo (#61 cutover): one canonical
# home, no duplicate workspace member. ABSOLUTE path — ship-exec is a SHARED
# external repo (NOT worktreed; only `ship` is), so an absolute path resolves from
# the main checkout AND any helmd worktree depth (relative paths broke at the
# Ship/worktrees/<n> depth helmd actually provisions).
ship-js = { git = "https://github.com/get-ship/ship-exec.git", branch = "feat/next", default-features = false }

[dev-dependencies]
# Only the tests need a runtime (`#[tokio::test]`); the engine itself is
# runtime-agnostic — it awaits futures but spawns nothing.
tokio = { workspace = true, features = ["rt", "macros"] }
