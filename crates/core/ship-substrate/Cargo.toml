[package]
name = "ship-substrate"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "The L0 substrate engine: truth-and-storage (db/persistence/projections/queries) + the kernel/event plumbing + the port surface (DataStore/KernelLog/BlobStore/FsBroker). One crate — the heavy adapters (blob-s3, fs-watch, process-supervisor, isolation-port, journal-sqlite) are leaves. Consumed by shipd and by lightweight L1 crates (ship-collection/reactive/artifacts) alike; no object_store/notify/portable-pty pulled in transitively."

[features]
unstable = []

[dependencies]
event-core = { git = "file:///home/madvib/dev/Ship/ship-exec", rev = "ee39e5273ce8829d90043626a01f564e660dd477" }
agent-schema = { git = "https://github.com/get-ship/fleet.git", rev = "6967f155ca795c19c44a145701c138b2d079c89c" }
ship-kernel = { path = "crates/ship-kernel" }
ship-types = { path = "crates/ship-types" }
ship-paths = { path = "crates/ship-paths" }
fs-util = { path = "crates/fs-util" }
config-doc = { path = "crates/config-doc" }
bounded-spawn = { git = "file:///home/madvib/dev/Ship/ship-exec", rev = "ee39e5273ce8829d90043626a01f564e660dd477" }
process-supervisor = { git = "file:///home/madvib/dev/Ship/ship-exec", rev = "ee39e5273ce8829d90043626a01f564e660dd477" }
path-layout = { path = "crates/path-layout" }
task-health = { path = "crates/task-health" }
blobstore = { path = "crates/blobstore" }
fs-cap = { path = "crates/fs-cap" }
ship-pipelines = { path = "crates/ship-pipelines", features = ["specta"] }

inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
specta = { workspace = true, features = ["chrono", "serde_json"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
async-trait = { workspace = true }
bytes = "1"
futures-util = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
home = { workspace = true }
# Pure path-layout helper for composed traveling-artifact overlays. No ship
# deps — compiler depends only on serde/serde_json/anyhow/minijinja/etc.
stack-model = { path = "../stack-model" }
walkdir = "2.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"

# T1 storage-torture (S3): a real child process opens the scope db and begins
# an append; the parent test SIGKILLs it mid-transaction to prove WAL
# recovery leaves an all-or-nothing state. Gated behind `unstable` so it
# never builds (or ships) outside the torture-test gate.
[[bin]]
name = "torture_crash_child"
path = "src/bin/torture_crash_child.rs"
required-features = ["unstable"]

[lints]
workspace = true
