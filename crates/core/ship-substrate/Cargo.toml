[package]
name = "ship-substrate"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[features]
unstable = []

[dependencies]
ship-kernel = { path = "crates/ship-kernel" }
ship-substrate-host = { path = "crates/ship-substrate-host" }
ship-types = { path = "crates/ship-types" }
ship-paths = { path = "crates/ship-paths" }
ship-pipelines = { path = "crates/ship-pipelines", features = ["specta"] }
durable-execution = { path = "crates/durable-execution" }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
nanoid = { workspace = true }
ulid = { workspace = true }
specta = { workspace = true, features = ["chrono", "serde_json"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
portable-pty = "0.9"
async-trait = { workspace = true }
object_store = { version = "0.13", features = ["aws"] }
bytes = "1"
futures-util = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
sea-query = { version = "0.32.7", features = ["backend-sqlite"] }
indexmap = { workspace = true, features = ["serde"] }
rmp-serde = "1"
home = { workspace = true }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
serde_yaml = { workspace = true }
notify = { workspace = true }
# Pure path-layout helper for composed traveling-artifact overlays. No ship
# deps — compiler depends only on serde/serde_json/anyhow/minijinja/etc.
compiler = { path = "../compiler" }
walkdir = "2.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
ship-runner = { path = "crates/ship-runner" }

[lints]
workspace = true
