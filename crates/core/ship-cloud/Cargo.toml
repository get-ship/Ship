[package]
name = "ship-cloud"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "Ship Cloud sync transport — HTTP push/pull of elevated events to the cloud gateway. Lives as an independent sibling of ship-platform so the cloud integration can evolve without dragging platform rebuilds."

[dependencies]
ship-substrate = { path = "../ship-substrate" }
ship-types = { path = "../ship-substrate/crates/ship-types" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# The HTTP client. `SyncClient` runs from a sync `ServiceHandler::handle`
# call inside a tokio task, so it uses the blocking client rather than async
# reqwest — reqwest::blocking runs its transport on a dedicated background
# thread, so it doesn't nest a runtime inside the caller's tokio worker.
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
tracing = { workspace = true }

[features]
# Enables SyncServiceHandler — the ServiceHandler actor that drives the push
# cycle. Requires ship-substrate's unstable feature for the services runtime.
unstable = ["ship-substrate/unstable"]

[dev-dependencies]
tempfile = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }

[lints]
workspace = true
