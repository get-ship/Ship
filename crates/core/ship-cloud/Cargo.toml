[package]
name = "ship-cloud"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "Ship Cloud sync transport — HTTP push/pull of elevated events to the cloud gateway. Lives as an independent sibling of ship-platform so the cloud integration can evolve without dragging platform rebuilds."

[dependencies]
ship-substrate = { path = "../ship-substrate" }
ship-types = { path = "../ship-substrate/crates/ship-types" }
ship-gateway-client = { path = "../ship-platform/crates/ship-gateway-client" }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# The HTTP client. `json` feature gates `send_json` and `read_json` (the
# `Body` reader used by `SyncClient`); without it the `ureq 3` `RequestBuilder`
# and `Body` APIs are byte-only.
ureq = { workspace = true, features = ["json"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
