[package]
name = "ship-git"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "Git domain — repository operations, status, diffs, annotations. Carved from ship-platform/services/git."

[dependencies]
ship-substrate = { path = "../ship-substrate" }
ship-collection = { path = "../ship-platform/crates/ship-collection" }

git2 = "0.19"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[features]
specta = ["dep:specta"]

[dependencies.specta]
workspace = true
features = ["chrono", "serde_json"]
optional = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true
