[package]
name = "ship-git"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "Git domain — repository operations, status, diffs. git2-backed L0 capability."

[dependencies]
ship-substrate = { path = "../ship-substrate" }
ship-ops-rpc = { path = "../ship-ops-rpc" }

git2 = "0.19"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
tempfile = { workspace = true }

[lints]
workspace = true
