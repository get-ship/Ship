[package]
name = "runtime"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[dependencies]
compiler = { path = "../compiler", features = ["specta"] }
ship-kernel = { path = "../ship-kernel" }
ship-types = { path = "../ship-types" }
ship-jobs = { path = "../ship-jobs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }
home = "0.5"
anyhow = "1.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
nanoid = "0.4"
ulid = "1"
walkdir = "2.3"
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
async-trait = "0.1"
sha2 = "0.10"
semver = { version = "1.0", features = ["serde"] }
tempfile = "3.3"
ureq = { version = "3", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
rmp-serde = "1"
tracing = "0.1"
sea-query = { version = "0.32.7", features = ["backend-sqlite"] }
indexmap = { version = "2.14.0", features = ["serde"] }
globset = "0.4"
minijinja = "2"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }

[features]
unstable = []

[dev-dependencies]
