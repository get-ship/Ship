[package]
name = "runtime"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[dependencies]
compiler = { path = "../compiler", features = ["specta"] }
ship-substrate = { path = "../ship-substrate" }
ship-primitives = { path = "../ship-primitives" }
ship-kernel = { path = "../ship-kernel" }
ship-types = { path = "../ship-types" }
ship-jobs = { path = "../ship-jobs" }
ship-pipelines = { path = "../ship-pipelines", features = ["specta"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
home = "0.5"
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
nanoid = { workspace = true }
ulid = { workspace = true }
walkdir = "2.3"
specta = { workspace = true, features = ["chrono", "serde_json"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
portable-pty = "0.9"
async-trait = { workspace = true }
sha2 = { workspace = true }
semver = { workspace = true, features = ["serde"] }
tempfile = { workspace = true }
ureq = { workspace = true, features = ["json"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
rmp-serde = "1"
tracing = { workspace = true }
sea-query = { version = "0.32.7", features = ["backend-sqlite"] }
indexmap = { workspace = true, features = ["serde"] }
globset = "0.4"
minijinja = { workspace = true }
notify = { workspace = true }
cron = "0.12"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
jsonschema = { version = "0.46", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
unstable = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
