[package]
name = "ship-ops"
version = "0.1.0"
edition = "2024"
publish = false
description = "The op ABI vocabulary: descriptor + handler + registry, generic over a host-provided context. Logic-owning crates (platform services, later extensions) declare Op tables; shipd mounts, gates, and serves them. Holds no business logic and no transport."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
