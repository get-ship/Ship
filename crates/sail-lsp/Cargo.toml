[package]
name = "sail-lsp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Language server for Sail .set single-file components."
publish = false

[[bin]]
name = "sail-lsp"
path = "src/main.rs"

[dependencies]
sail-compiler = { path = "../sail-compiler" }
tree-sitter-set = { path = "../../grammars/tree-sitter-set" }
lsp-server = "0.7"
lsp-types = "0.95"
tree-sitter = "0.26"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
crossbeam-channel = "0.5"

[lints]
workspace = true
