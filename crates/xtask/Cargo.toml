[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Ship-internal dev tasks: layer + import + anti-theater + residue lints, topology check, audit generators, and coverage. The cross-repo codegen tools (gen-sdk, gen-events, etc.) were removed in commit <this commit's hash> — they live with their output SSOT in ship-contracts / sui once the input source crates are published."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Lean post-cleanup: only deps the in-ship lints + audit tools need.
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
