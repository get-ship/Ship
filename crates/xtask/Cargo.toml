[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dev-time tasks: type generation, code-gen, etc."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
compiler = { path = "../core/compiler", features = ["specta"] }
runtime = { path = "../core/runtime" }
# TODO(Phase 4): sui-compiler will replace sail-compiler here once available.
ship-types = { path = "../core/ship-types", features = ["specta"] }
ship-sui = { path = "../ship-sui", features = ["specta"] }
shipd = { path = "../../apps/shipd", features = ["specta"] }
specta = { workspace = true, features = ["chrono", "serde_json"] }
specta-typescript = "0.0.9"
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
