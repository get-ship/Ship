[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dev-time tasks: type generation, code-gen, etc."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
stack-model = { path = "../core/stack-model", features = ["specta"] }
ship-substrate = { path = "../core/ship-substrate" }
# Account value types (AccountState / MeView) for the deck SDK TS codegen.
ship-account = { path = "../core/ship-platform/crates/ship-account", features = ["specta"] }
ship-platform = { path = "../core/ship-platform", features = ["specta"] }
ship-agents = { path = "../core/ship-platform/crates/ship-agents" }
ship-ui = { path = "../core/ship-platform/crates/ship-ui" }
ship-pipeline-runtime = { path = "../ship-pipeline-runtime" }
# Event envelope type for the cloud-side TS surface (build_cloud_types).
ship-types = { path = "../core/ship-substrate/crates/ship-types", features = ["specta"] }
# `deck` is a thin re-export facade in the external sui repo post-carve.
# Path-dep smell: build only worked if sui was at a specific local
# path. Replaced with a version pin (0.1.0-dev) to draw attention
# to the smell. See .artifacts/handoff-post-cleanup.md.
deck = { git = "https://github.com/get-ship/sui.git", branch = "feat/next", features = ["specta"] }
# `shipd` is in apps/, not crates/ — used for fixtures only.
shipd = { path = "../../apps/shipd", features = ["specta"] }
# validate fixtures against the wire SSOT.
ship-ops-rpc = { path = "../core/ship-ops-rpc" }
specta = { workspace = true, features = ["chrono", "serde_json"] }
specta-typescript = "0.0.9"
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# gen-eval-stub: reads @ship/stack's noun shapes (TS) to regenerate
# agent-config-eval's SDK stub. Same oxc version agent-config-eval already
# pins for its type-strip; here used to walk the AST instead of codegen.
oxc_allocator = "0.133"
oxc_ast = "0.133"
oxc_parser = "0.133"
oxc_span = "0.133"

[features]
# Compile the `example()` fixture constructors into ship-platform so
# `cargo xtask gen-fixtures` can serialize them to committed JSON.
fixtures = ["ship-platform/fixtures", "shipd/fixtures"]

[lints]
workspace = true
