[package]
name = "ship-pipeline-runtime"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "L1 pipeline runtime — definition CRUD for the pipeline spec tree. The orchestrator (run/step engine) was retired 2026-07-10; the bare agent-session wiring in this crate is the L1 port-impl layer shared with helmd."

[dependencies]
# L0 — events, ports, projections registry, persistence, text utils, dispatch gate.
ship-substrate = { path = "../core/ship-substrate" }
# L0 data — pure-logic pipeline spec types (no fs/process/tokio).
ship-pipelines = { path = "../core/ship-substrate/crates/ship-pipelines" }
# L0 types — Authority principal carried on dispatch events.
ship-types = { path = "../core/ship-substrate/crates/ship-types" }
# L1 file tree — `FilesService` backing the `PipelinesService` CRUD.
ship-files = { path = "../core/ship-platform/crates/ship-files" }
# Connect-RPC generated server traits (`PipelinesService`, request/response
# types) for the L1 wire layer.
ship-ops-rpc = { path = "../core/ship-ops-rpc" }
connectrpc = { version = "0.4", features = ["axum"] }
# Bare-agent wiring (load_sessions) — the canonical sessions projection read
# is the only remaining "projection" surface after the engine cut.
ship-agents = { path = "../core/ship-platform/crates/ship-agents" }
# Shared dispatch port traits used by the L1 `ConfigSpawnPolicy` +
# `ProjectionsReader` impls. Kept below ship-code so this crate no longer pulls
# the harness-driver stack in shipd's no-default-features posture.
agent-driver = { git = "https://github.com/get-ship/fleet.git", rev = "de7599e1163559aaa1da7dbae6be1768c4ad5d09" }
# Config — SpaceManifest read by `ConfigSpawnPolicy` to resolve the agent's
# declared role at spawn time.
ship-platform = { path = "../core/ship-platform" }
# Auth — role → scope resolution used by `ConfigSpawnPolicy` for the
# spawned agent's session token.
ship-auth = { path = "../core/ship-platform/crates/ship-auth" }

serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
tracing = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
json-patch = "4"
minijinja = { workspace = true }

[dev-dependencies]
stack-model = { path = "../core/stack-model" }
tokio = { workspace = true, features = ["test-util"] }
ship-substrate = { path = "../core/ship-substrate" }

[lints]
workspace = true
