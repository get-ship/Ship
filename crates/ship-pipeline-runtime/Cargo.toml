[package]
name = "ship-pipeline-runtime"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
description = "L1 pipeline runtime — CRUD over the pipeline spec tree plus the job advancement / step dispatch / fanout / sweep / merge runtime. Sits above `ship-pipelines` (pure-logic types), `ship-runner` (L0 mechanism), and `ship-substrate` (ports + events). The orchestrator is NOT a service: it owns no orchestrator.* events, only pipeline.*."

[dependencies]
# L0 — events, ports, projections registry, persistence, fs_util.
ship-substrate = { path = "../core/ship-substrate" }
# L0 data — pure-logic pipeline spec types (no fs/process/tokio).
ship-pipelines = { path = "../core/ship-substrate/crates/ship-pipelines", features = ["specta"] }
# L0 mechanism — kernel-emit plumbing, event dedup, exit-signal routing,
# router gate, spawn-env builder, invocation-mode resolution. Re-exported
# by this crate at the historic `orchestrator::{dedup, emit, exit_handler}`
# paths so consumers stay on the same surface.
ship-runner = { path = "../core/ship-substrate/crates/ship-runner" }
# L0 types — Authority principal carried on dispatch events.
ship-types = { path = "../core/ship-substrate/crates/ship-types" }
# L1 platform — `FilesService` (file-tree helper) and the live SQL-backed
# `pipeline_run` / `agent_session` projections the runtime reads. This
# crate is a DOWNSTREAM consumer of `ship-platform`; `ship-platform` does
# not depend on us, so no cycle.
ship-platform = { path = "../core/ship-platform" }
# L1 artifacts service — fanout/step_io use ArtifactService + ArtifactScope
# (typed artifact metadata) for step-input/output wiring.
ship-artifacts = { path = "../core/ship-platform/crates/ship-artifacts" }

serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "io-util"] }
tracing = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
json-patch = "4"
minijinja = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
ship-substrate = { path = "../core/ship-substrate" }

[features]
default = []
# Enable derive(Type) on the `PipelinesService` view types so xtask can emit
# TypeScript bindings via `cargo xtask gen-types`. Off by default; on
# automatically under `cfg(test)`. Mirrors the flag in `ship-platform`.
specta = ["dep:specta", "ship-pipelines/specta"]

[dependencies.specta]
workspace = true
optional = true

[lints]
workspace = true
