[package]
name = "sail-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Compiler for the Sail single-file component format. Layer 2 of the Sail framework."
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
