[package]
name = "ship-set-compiler"
version = "0.1.0"
edition = "2024"
publish = false
description = "Ahead-of-time compiler for `.html.set` source files. Emits ESM JS that hydrates against `@ship-set/runtime` without re-parsing at load time."

[lib]
path = "src/lib.rs"

[[bin]]
name = "ship-set-compiler"
path = "src/bin/ship-set-compiler.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
