[package]
name = "sui-compiler"
version = "0.1.0"
edition = "2024"
publish = false
description = "Ahead-of-time compiler for `.sui` source files. Emits ESM JS that hydrates against `@ship/ui-runtime` without re-parsing at load time."

[lib]
path = "src/lib.rs"

[[bin]]
name = "sui-compiler"
path = "src/bin/sui-compiler.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
