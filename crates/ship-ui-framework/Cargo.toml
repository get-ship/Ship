[package]
name = "ship-ui-framework"
version = "0.1.0"
edition = "2024"
publish = false
description = "Ship's UI framework — server-side hosting (compile, payload, HMR, SSE) for SUI views."

[lib]
name = "ship_ui_framework"
path = "src/lib.rs"

[dependencies]
sui-compiler = { path = "../sui-compiler" }
sui-signals = { path = "../sui-signals" }
runtime = { path = "../core/runtime" }

axum = { workspace = true, features = ["http1", "tokio", "ws"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { workspace = true }
async-trait = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
datastar = { version = "=0.3.1", features = ["axum"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
