# Spike crate — declares its OWN workspace so the main Ship workspace does
# not pull it into build/CI (root Cargo.toml excludes `spikes`). Lives in git
# (the worktree branch is the throwaway mechanism), not in `.artifacts` scratch.
[workspace]

[package]
name = "ship-harness-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# rig as the provider SUBSTRATE. Aliased to `rig` so code matches upstream
# examples 1:1. Pinned to crates.io (local eval checkout no longer needed).
rig = { version = "0.38.1", package = "rig-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
