[workspace]
members = [
    "crates/core/ship-substrate",
    "crates/core/stack-model",
    "crates/core/ship-substrate/crates/ship-types",
    "crates/core/ship-substrate/crates/ship-paths",
    "crates/core/ship-substrate/crates/ship-auth-types",
    "crates/core/ship-substrate/crates/ship-kernel",
    "crates/core/ship-substrate/crates/ship-pipelines",
    "crates/core/ship-substrate/crates/fs-util",
    "crates/core/ship-substrate/crates/config-doc",
    "crates/core/path-layout",
    "crates/core/ship-substrate/crates/blobstore",
    "crates/core/ship-substrate/crates/blob-s3",
    "crates/core/ship-substrate/crates/fs-watch",
    "crates/core/ship-substrate/crates/fs-cap",
    "crates/core/ship-platform",
    "crates/core/ship-cloud",
    "crates/core/ship-substrate/crates/pipeline-defs",
    "crates/core/ship-platform/crates/ship-analytics",
    "crates/core/ship-platform/crates/ship-search",
    "crates/core/ship-gateway-client",
    "crates/core/ship-ops-rpc",
    "crates/core/agent-config-eval",
    "crates/core/space-resolver",
    "crates/core/ship-platform/crates/ship-reactive",
    "crates/core/ship-platform/crates/ship-collection",
    "crates/core/ship-platform/crates/ship-artifacts",
    "crates/core/ship-platform/crates/ship-ui",
    "crates/core/ship-platform/crates/ship-space",
    "crates/core/ship-platform/crates/ship-settings",
    "crates/core/ship-platform/crates/ship-triggers",
    "crates/core/ship-platform/crates/ship-account",
    "crates/core/ship-platform/crates/agent-def",
    "crates/core/ship-platform/crates/ship-agents",
    "crates/core/ship-platform/crates/ship-files",
    "crates/core/ship-platform/crates/ship-store",
    "crates/core/ship-platform/crates/bundle-limits",
    "crates/core/ship-platform/crates/ship-auth",
    # ship-isolation / ship-device / ship-sidecar-proto / ship-sidecar moved to
    # ship-infra (j-09). ship-git moved to ship-infra (j-04).
    # Consumers use git deps with pinned revs.
    # crates/sui/* + crates/deck/* moved to the external sui repo (phase 2 carve).
    # Consumers that used to depend on them via path-deps now use version
    # pins (see apps/shipd, ship-ui, xtask Cargo.toml) — the build is
    # broken until sui publishes the deck + sui-compiler crates.
    "crates/xtask",
    "apps/shipd",
    "apps/shipctl",
    "apps/host",
    "tests/contract",
]
# (crate ship-host). ship-host pulls in webkit2gtk/Tauri system libs that aren't
# present in headless CI or a fresh dev box; building it must be opt-in via
# `cargo build -p ship-host`. `members` above stays complete so the crate is
# still part of the workspace (path deps, `cargo build -p ship-host`, lockfile).
default-members = [
    "crates/build-info",
    "crates/core/ship-substrate",
    "crates/core/stack-model",
    "crates/core/ship-substrate/crates/ship-types",
    "crates/core/ship-substrate/crates/ship-paths",
    "crates/core/ship-substrate/crates/ship-auth-types",
    "crates/core/ship-substrate/crates/ship-kernel",
    "crates/core/ship-substrate/crates/ship-pipelines",
    "crates/core/ship-platform",
    "crates/core/ship-cloud",
    "crates/core/ship-substrate/crates/pipeline-defs",
    "crates/core/ship-platform/crates/ship-analytics",
    "crates/core/ship-platform/crates/ship-search",
    "crates/core/ship-gateway-client",
    "crates/core/ship-ops-rpc",
    "crates/core/agent-config-eval",
    "crates/core/space-resolver",
    "crates/core/ship-platform/crates/ship-reactive",
    "crates/core/ship-platform/crates/ship-collection",
    "crates/core/ship-platform/crates/ship-artifacts",
    "crates/core/ship-platform/crates/ship-ui",
    "crates/core/ship-platform/crates/ship-space",
    "crates/core/ship-platform/crates/ship-settings",
    "crates/core/ship-platform/crates/ship-triggers",
    "crates/core/ship-platform/crates/ship-account",
    "crates/core/ship-platform/crates/agent-def",
    "crates/core/ship-platform/crates/ship-files",
    "crates/core/ship-platform/crates/bundle-limits",
    "crates/core/ship-platform/crates/ship-store",
    "crates/core/ship-platform/crates/ship-auth",
    "crates/xtask",
    "apps/shipd",
    "apps/shipctl",
    "tests/contract",
]
resolver = "2"

# Hoisted dependency versions. Member crates inherit via `{ workspace = true, features = [...] }`.
# Only deps used by 2+ member crates are hoisted; single-consumer deps stay in their member crate.
# Per devx-01 (.artifacts/specs/devx/01-build-hygiene.md): single source of truth for shared
# version pins, eliminates skew (e.g. the recent `dirs 5/6` split).
[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = "0.9"
toml = "0.8"

# Errors
anyhow = "1.0"
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async runtime / utilities (members specify their needed feature subset; features are additive)
tokio = "1"
tokio-util = "0.7"
async-trait = "0.1"
futures-util = "0.3"

# HTTP / RPC (members add features as needed)
axum = { version = "0.8" }
reqwest = { version = "0.12", default-features = false }
rmcp = "0.16.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Tracing
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Filesystem / paths
home = "0.5"
shell-words = "1"
tempfile = "3"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }

# Crypto / encoding
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# Platform
libc = "0.2"

# Locking
parking_lot = "0.12"

# Misc
semver = "1.0"
nanoid = "0.4"
indexmap = "2"
ulid = "1"
regex = "1"

# Type-bridging (RC pin shared by every consumer)
specta = { version = "=2.0.0-rc.22", features = ["derive"] }

# Cross-crate distributed registry (event registry assembly)
inventory = "0.3"

# Proc-macro support
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Templating (members add features as needed)
minijinja = "2"

# Workspace-wide lint posture. Member crates opt in via `[lints] workspace = true`.
# Conservative phase-1 set: warns only, no errors. Phase-2 escalation tracked separately.
[workspace.lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
# Demoted from "warn" — workspace has hundreds of intentional uses across
# lib + test code. Per-crate enforcement via `-W clippy::expect_used` on
# crates that should be clean (e.g. sui-signals) keeps targeted pressure
# without blocking the workspace-wide `-D warnings` gate.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "warn"

# Style preferences we don't enforce — keeps `cargo clippy -D warnings`
# focused on correctness lints, not formatting opinion. Each carries the
# rationale for the demotion.
collapsible_if = "allow"
collapsible_match = "allow"
doc_overindented_list_items = "allow"
# Same doc-formatting class as the overindent lint above — clippy 1.93 flags
# continuation lines in doc lists; we don't enforce doc-prose layout.
doc_lazy_continuation = "allow"
empty_line_after_doc_comments = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
new_without_default = "allow"
needless_pass_by_ref_mut = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
# Pure formatting opinion (write! + "\n" vs writeln!) — codegen files build
# strings line-by-line; not a correctness signal.
write_with_newline = "allow"
# Same "complexity we don't enforce" class as too_many_arguments — clippy 1.93
# flags query/projection signatures and large error enums; not worth churning
# type aliases / boxing across the workspace for the gate.
type_complexity = "allow"
result_large_err = "allow"
search_is_some = "allow"

# Cargo profile defaults.
# `line-tables-only` keeps panic backtraces useful at a fraction of the binary size of full debug.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

