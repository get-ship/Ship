[workspace]
members = [
    "crates/core/build-info",
    "crates/core/cli-framework",
    "crates/core/compiler",
    "crates/core/mcp-framework",
    "crates/core/ship-substrate",
    "crates/core/ship-platform",
    "crates/core/ship-kernel",
    "crates/core/ship-pipelines",
    "crates/core/ship-types",
    "crates/core/ship-gateway-client",
    "crates/ship-supervisor",
    "crates/sui/compiler",
    "crates/sui/lint",
    "crates/sui/signals",
    "crates/ship/ship-sui-host",
    "crates/ship/ship-sui-server",
    "crates/ship/ship-sui",
    "crates/xtask",
    "packages/sui/grammar",
    "apps/mcp",
    "apps/shipd",
    "apps/ship-cli",
]
resolver = "2"

# Hoisted dependency versions. Member crates inherit via `{ workspace = true, features = [...] }`.
# Only deps used by 2+ member crates are hoisted; single-consumer deps stay in their member crate.
# Per devx-01 (.artifacts/specs/devx/01-build-hygiene.md): single source of truth for shared
# version pins, eliminates skew (e.g. the recent `dirs 5/6` split).
[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = "0.9"
toml = "0.8"

# Errors
anyhow = "1.0"
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async runtime / utilities (members specify their needed feature subset; features are additive)
tokio = "1"
tokio-util = "0.7"
async-trait = "0.1"
futures-util = "0.3"

# HTTP / RPC (members add features as needed)
axum = { version = "0.8" }
reqwest = { version = "0.12", default-features = false }
ureq = "3"
rmcp = "0.16.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Tracing
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# Filesystem / paths
home = "0.5"
shell-words = "1"
tempfile = "3"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }

# Crypto / encoding
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# Platform
libc = "0.2"

# Misc
semver = "1.0"
nanoid = "0.4"
indexmap = "2"
ulid = "1"
regex = "1"

# Type-bridging (RC pin shared by every consumer)
specta = { version = "=2.0.0-rc.22", features = ["derive"] }

# Templating (members add features as needed)
minijinja = "2"

# Workspace-wide lint posture. Member crates opt in via `[lints] workspace = true`.
# Conservative phase-1 set: warns only, no errors. Phase-2 escalation tracked separately.
[workspace.lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
# Demoted from "warn" — workspace has hundreds of intentional uses across
# lib + test code. Per-crate enforcement via `-W clippy::expect_used` on
# crates that should be clean (e.g. sui-signals) keeps targeted pressure
# without blocking the workspace-wide `-D warnings` gate.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "warn"

# Style preferences we don't enforce — keeps `cargo clippy -D warnings`
# focused on correctness lints, not formatting opinion. Each carries the
# rationale for the demotion.
collapsible_if = "allow"
collapsible_match = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
new_without_default = "allow"
needless_pass_by_ref_mut = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
search_is_some = "allow"

# Cargo profile defaults.
# `line-tables-only` keeps panic backtraces useful at a fraction of the binary size of full debug.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
