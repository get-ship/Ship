# Codegen for the shared @ship/sdk TypeScript client (ship.ops.v1 + gateway).
# Separate from buf.gen.yaml (which targets apps/gateway) so the SDK can be
# generated without touching the gateway's committed output. protoc-gen-es v2
# emits message types + service shapes consumed by @connectrpc/connect@2.
# Run: bun --cwd packages/sdk run proto:generate
version: v2
inputs:
  # The public SDK ships the public packages only. `ship/internal` is the
  # launch-internal surface (e.g. ship.internal.v1.GitService) — it is
  # deliberately EXCLUDED here so @ship/sdk never carries internal ops. Helm
  # picks it up via its own target (buf.gen.helm.yaml). This asymmetry is the
  # whole proof of the internal/public codegen split (spike
  # session_01RP76PB8FAHirne921cx3Rg).
  - directory: proto
    exclude_paths:
      - proto/ship/internal
plugins:
  - local: protoc-gen-es
    out: packages/sdk/src/gen
    opt:
      - target=ts
      - import_extension=js
