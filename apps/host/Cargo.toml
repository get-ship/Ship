[package]
name = "ship-host"
version = "0.1.0"
edition = "2021"
description = "Ship's single native host — opens a Tauri window for whatever `--app` it's handed. Daemon lifecycle, updater, native C3 escalation gate. The webview runs the SUI scaffold served by the loopback daemon."

[lib]
# Tauri's mobile/desktop split wants the app logic in a lib; the bin is a thin shim.
name = "ship_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ship-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ship-substrate = { path = "../../crates/core/ship-substrate" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = "1"
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
