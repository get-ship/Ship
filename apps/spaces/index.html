<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship Space</title>
  <link rel="icon" type="image/svg+xml" href="/ship-logo.svg" />

  <!-- Daemon mode (shipd rewrites to production when it serves directly). -->
  <meta name="ship-mode" content="development" />

  <link rel="stylesheet" href="/api/assets/view-tokens.css" />
  <link rel="stylesheet" href="/src/chrome/layout.css" />

  <!-- Pre-paint theme (FOUC guard) — spaces honour the persisted theme too. -->
  <script>
    try {
      var _t = localStorage.getItem('ship-site-theme')
      if (_t) document.documentElement.setAttribute('data-theme', _t)
    } catch (_e) {}
  </script>

  <!-- Importmap MUST precede any module script. Same /_deck scheme the hub uses:
       ONE shared SUI runtime (the daemon's /_deck/runtime.js) so the scaffold and
       the confined view bundles live in one runtime universe (#149). -->
  <script type="importmap">
    {
      "imports": {
        "@ship/sui-runtime":                "/_deck/runtime.js",
        "@ship/sui-runtime/route":          "/_deck/runtime.js",
        "@ship/sui-runtime/template-hooks": "/_deck/runtime.js",
        "@ship/sui-runtime/patch":          "/_deck/runtime.js",
        "@ship/sui-dom":                    "/_deck/dom.js",
        "@ship/sdk-client":                 "/_deck/sdk-client.js"
      }
    }
  </script>

  <!-- Component registry the space's views need (domain primitives). A space
       loads only this umbrella by default; user/third-party chrome is loaded by
       the scaffold at runtime, confined. -->
  <script>
    (function () {
      var s = document.createElement('script')
      s.type = 'module'
      s.src = '/_deck/components.js'
      document.head.appendChild(s)
    })()
  </script>

  <!-- Bootstrap the shared runtime onto window before main.ts (same pattern as
       the hub) so the bare specifier resolves to the one /_deck/runtime.js. -->
  <script>
    (function () {
      window.__suiRuntimeReady = new Promise(function (res) {
        var s = document.createElement('script')
        s.type = 'module'
        s.textContent =
          "import * as r from '@ship/sui-runtime'; window.__suiRuntime = r; window.dispatchEvent(new Event('sui-runtime-ready'));"
        document.head.appendChild(s)
        window.addEventListener('sui-runtime-ready', function () { res(window.__suiRuntime) }, { once: true })
      })
    })()
  </script>
</head>
<body>
  <main id="space-content" class="space-content"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
