# helmd — Helm's daemon: the compositional root that mounts Helm's dev-RPC
# wires over compiler-free ship-core leaves. Today it serves one wire — the
# git surface (`ship.internal.v1.GitService`) over `ship-git` — with more to
# follow. Parallels `apps/shipd` (the heavy product daemon); helmd is the
# leaf-backed dev daemon Helm (TS/Hono, in ship-ops) dials.
#
# DETACHED COMPOSITIONAL ROOT — note the empty `[workspace]` table at the
# bottom. helmd is deliberately NOT a member of the ship root workspace, so it
# resolves against itself as its own workspace. The path dep on `ship-git`
# still resolves its own `workspace = true` inheritance against the ship root
# workspace that `ship-git` belongs to.
#
# SUBSTRATE CONSUMER (was LEAF PROOF): two of helmd's wires are still over the
# LEAF crates ship-git + compiler (compiler-free / pure-transform). The THIRD
# wire — `ship.ops.v1.AgentsService` (read methods List/Get/Sessions) — is a
# DELIBERATE substrate consumption: it is owned by `ship-agents` (L1), so
# mounting it pulls the substrate into helmd's graph. helmd implements only the
# *core* `AgentsHost` trait and calls the LEAN `mount` (no ship-auth/grant, no
# ship-reactive/watch, no ship-code/dispatch). The lean trait keeps helmd's
# DIRECT substrate dep at `ship-substrate-core` (not the heavy `ship-substrate`
# facade) — see below.
#
# MONOLITH MEASUREMENT (spine 2a.1): although helmd only wants the lean read
# path, `ship-agents`'s own Cargo.toml depends on the FULL `ship-substrate`
# facade plus `ship-reactive`, `ship-auth`, `ship-device`, `ship-isolation`,
# `ship-store`, `ship-terminal`, `ship-config`, `agent-def`, `ship-ops-rpc`,
# `compiler`, … — so the heavy facade lands in helmd's TRANSITIVE graph
# regardless of helmd's lean direct deps. The leaf-clean claim above is
# therefore retired for the agents wire: `cargo tree` now shows
# ship-substrate(-core)/ship-kernel/ship-store in the graph. Honest finding:
# the substrate is too monolithic for a truly lean read-only consumer to stay
# off the facade today; the split would need to reach UP into ship-agents.
[package]
name = "helmd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Helm's daemon — leaf compositional root mounting dev-RPC wires (git now: ship.internal.v1.GitService over compiler-free ship-git; more later)."

[[bin]]
name = "helmd"
path = "src/main.rs"

[dependencies]
# The leaf domain crate — git2 + ship-paths + ship-types, no compiler/substrate.
ship-git = { path = "../../crates/core/ship-git" }
# The harness-compiler leaf — L0 pure transform (serde / minijinja / toml /
# semver / indexmap), NO ship-substrate, NO kernel/runtime/store. Backs the
# ship.internal.v1.HarnessService wire. `cargo tree` must show only its pure
# deps — the same leaf-clean contract ship-git holds.
compiler = { path = "../../crates/core/compiler" }
# Substrate consumer (spine 2a.1): the agent domain (L1). Backs the
# `ship.ops.v1.AgentsService` read wire. NO `harness-drivers` feature — helmd
# serves reads only, so the ship-code dispatch stack stays out. NOTE: this dep
# transitively pulls the full `ship-substrate` facade + ship-reactive/ship-auth
# (see MONOLITH MEASUREMENT in the header) even though helmd implements only the
# lean `AgentsHost` core trait.
ship-agents = { path = "../../crates/core/ship-platform/crates/ship-agents" }
# Lean substrate core (NOT the heavy `ship-substrate` facade) — for the types
# helmd must name in its `AgentsHost` impl: `KernelRouter`, `KernelLog`,
# `ShipHome`, `init_kernel_router`, `project::get_project_dir`. These are the
# SAME types the facade re-exports, so naming them via the core keeps helmd's
# direct dep lean. (The facade still arrives transitively via ship-agents.)
ship-substrate-core = { path = "../../crates/core/ship-substrate-core" }
# Forced by the daemon-side port traits (AgentDispatchPort / ViewBroadcastPort /
# CollectionPersistPort are `#[async_trait]`); helmd implements trivial no-op
# adapters for them. Pinned to the workspace version.
async-trait = "0.1"
# Connect-RPC runtime: `axum` to serve, `client` so the generated client type
# also compiles (handy for a future in-process test).
connectrpc = { version = "0.4", features = ["client", "axum"] }
# Must match the version connectrpc 0.4.x pulls transitively.
buffa = { version = "0.5", features = ["json"] }
# Generated code names ::serde:: / ::http_body:: / ::http:: paths directly.
serde = { version = "1.0", features = ["derive"] }
# The compile handler flattens `compiler::CompileOutput` (Json / Option<Json>)
# to wire `CompiledFile { path, content }` rows — needs `serde_json` to
# pretty-print the JSON fields. Helmd is detached from the ship workspace
# (see `[workspace]` at the bottom) so this must be a direct dep, not a
# `workspace = true` inheritance.
serde_json = { version = "1.0", features = ["preserve_order"] }
# Generated code names ::http:: / ::http_body:: as top-level crates.
http-body = "1"
http = "1"
axum = { version = "0.8", features = ["macros"] }
# `sync` added for spine 2a.1: the `AgentsHost::kernel_router` accessor returns
# `Arc<tokio::sync::Mutex<KernelRouter>>`, which helmd must name in its impl.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
# CORS so the browser (Helm's SPA, served by Hono on another origin) can dial
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1.0"

[dev-dependencies]
# The integration test (`tests/compile.rs`) mounts the ConnectRPC router
# in-process via the generated `HarnessServiceExt::register`. Needs the
# axum tower::ServiceExt::oneshot, http_body_util for body collection, and
# serde_json for request/response shapes.
axum = { version = "0.8", features = ["macros"] }
http-body-util = "0.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[build-dependencies]
connectrpc-build = "0.4"
# Bundles protoc so no system-wide install is needed.
protoc-bin-vendored = "3"

# Detach from the ship root workspace — helmd is its own compositional root.
[workspace]
