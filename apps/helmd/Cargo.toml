# helmd — Helm's daemon: the compositional root that mounts Helm's dev-RPC
# wires over compiler-free ship-core leaves. Today it serves one wire — the
# git surface (`ship.internal.v1.GitService`) over `ship-git` — with more to
# follow. Parallels `apps/shipd` (the heavy product daemon); helmd is the
# leaf-backed dev daemon Helm (TS/Hono, in ship-ops) dials.
#
# DETACHED COMPOSITIONAL ROOT — note the empty `[workspace]` table at the
# bottom. helmd is deliberately NOT a member of the ship root workspace, so it
# resolves against itself as its own workspace. The path dep on `ship-git`
# still resolves its own `workspace = true` inheritance against the ship root
# workspace that `ship-git` belongs to.
#
# SUBSTRATE CONSUMER (was LEAF PROOF): two of helmd's wires are still over the
# LEAF crates ship-git + compiler (compiler-free / pure-transform). The THIRD
# wire — `ship.ops.v1.AgentsService` (read methods List/Get/Sessions) — is a
# DELIBERATE substrate consumption: it is owned by `ship-agents` (L1), so
# mounting it pulls the substrate into helmd's graph. helmd implements only the
# *core* `AgentsHost` trait and calls the LEAN `mount` (no ship-auth/grant, no
# ship-reactive/watch, no ship-code/dispatch). The lean trait keeps helmd's
# DIRECT substrate dep at `ship-substrate-core` (not the heavy `ship-substrate`
# facade) — see below.
#
# MONOLITH MEASUREMENT (spine 2a.1): although helmd only wants the lean read
# path, `ship-agents`'s own Cargo.toml depends on the FULL `ship-substrate`
# facade plus `ship-reactive`, `ship-auth`, `ship-device`, `ship-isolation`,
# `ship-store`, `ship-config`, `agent-def`, `ship-ops-rpc`,
# `compiler`, … — so the heavy facade lands in helmd's TRANSITIVE graph
# regardless of helmd's lean direct deps. The leaf-clean claim above is
# therefore retired for the agents wire: `cargo tree` now shows
# ship-substrate(-core)/ship-kernel/ship-store in the graph. Honest finding:
# the substrate is too monolithic for a truly lean read-only consumer to stay
# off the facade today; the split would need to reach UP into ship-agents.
[package]
name = "helmd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Helm's daemon — leaf compositional root mounting dev-RPC wires (git now: ship.internal.v1.GitService over stack-model-free ship-git; more later)."

[[bin]]
name = "helmd"
path = "src/main.rs"

[dependencies]
# The leaf domain crate — git2 + ship-paths + ship-types, no compiler/substrate.
ship-git = { path = "../../crates/core/ship-git" }
# Env vars (SHIP_REPO_DIR, SHIP_WORKTREE_DIR, etc.) read by the canonical
# worktrees-root resolver. Leaf-level dep; same shape as ship-git above.
ship-paths = { path = "../../crates/core/ship-substrate/crates/ship-paths" }
ship-agents = { path = "../../crates/core/ship-platform/crates/ship-agents" }
ship-substrate = { path = "../../crates/core/ship-substrate" }
ship-types = { path = "../../crates/core/ship-substrate/crates/ship-types" }
# Format-migration Wave 4 phase A + rules-format cut: the
# `HarnessService.Compile` RPC routes through
# `ship_resolver::roll_up_blocking` so the V8 TS eval populates the
# `ExtensionLibrary`'s mcp_servers + collections + triggers + pipelines
# (the leaf `compiler::load_library` no longer reads `.ship/mcp.jsonc`,
# and rules arrive exclusively via `defineAgent({ rules: { inline } })`).
# Without this dep, the compiled `.mcp.json` and `CLAUDE.md` outputs
# are empty.
ship-resolver = { path = "../../crates/core/ship-resolver" }
stack-model = { path = "../../crates/core/stack-model" }
harness-config-compiler = { path = "../../../bridge/crates/harness-config-compiler" }
# Direct dep on ship-proto so build.rs can read DEP_SHIP_PROTO_PROTO_DIR
# (the canonical proto root, propagated via `links = "ship-proto"` from
# ship-proto's own build.rs). Without this, helmd's build.rs would need a
# hand-set SHIP_PROTO_DIR. The compile-time footprint is unchanged — ship-proto
# is already in the transitive graph via ship-ops-rpc + ship-config.
ship-proto = { git = "https://github.com/get-ship/ship-contracts.git", branch = "feat/next" }
# helmd must name in its `AgentsHost` impl: `KernelRouter`, `KernelLog`,
# `ShipHome`, `init_kernel_router`, `project::get_project_dir`. These are the
# SAME types the facade re-exports, so naming them via the core keeps helmd's
# direct dep lean. (The facade still arrives transitively via ship-agents.)

# ── collections (S5 dogfood cutover, Slice 0): helmd serves CollectionsService ──
# helmd's next substrate service after AgentsService — event-sourced typed
# collections over the active space's `spaces/<id>/space.db`. ship-collection
# owns CollectionWire + CollectionItemProjection; ship-store hydrates the
# user `.ship/collections/*.jsonc` schemas; ship-ops-rpc carries the generated
# CollectionsServiceExt. All already in helmd's transitive graph via ship-agents;
# named directly here to register the projection + mount the wire.
ship-collection = { path = "../../crates/core/ship-platform/crates/ship-collection" }
ship-artifacts = { path = "../../crates/core/ship-platform/crates/ship-artifacts" }
ship-space = { path = "../../crates/core/ship-platform/crates/ship-space" }
ship-store = { path = "../../crates/core/ship-platform/crates/ship-store" }
ship-ops-rpc = { path = "../../crates/core/ship-ops-rpc" }
# Canonical worktrees-root resolver (ship_config::worktrees::worktrees_dir).
# Honors SHIP_WORKTREE_DIR; named directly so the Land handler's worktree
# teardown path reads from the same explicit root the dispatcher writes to.
ship-config = { path = "../../crates/core/ship-platform/crates/ship-config" }

# ── spine 2b: REAL agent dispatch (the ship-code consumer construction) ──────
# All gated behind the `ship-code` feature (default ON). With the feature OFF
# every one of these is absent and helmd is back to the lean 2a.1 read path.
# These mirror shipd's dispatch deps (apps/shipd/Cargo.toml) — keep the set to
# exactly what `apps/helmd/src/dispatch.rs` names.
#
# The harness-driver stack: process registry, RoutingExecutor, dispatch_ports,
# helpers, agent_lifecycle, the `EventDedup` gate. helmd's dispatch runtime is
# Spine 1 (always on): floki dispatch closure + the L1 executor lib the
# dispatch composition root calls into (see dispatch.rs).
ship-code = { path = "../../crates/code/ship-code", features = ["ship-code"], optional = true }
# Spine 2b dispatch deps — pulled in only when `ship-code` is on.
ship-auth = { path = "../../crates/core/ship-platform/crates/ship-auth", optional = true }
ship-auth-types = { path = "../../crates/core/ship-substrate/crates/ship-auth-types", optional = true }
ship-pipeline-runtime = { path = "../../crates/ship-pipeline-runtime", optional = true }
tracing = { version = "0.1" }
# Subscriber for `tracing::*!` events. Initialized once in main() so the
# Land-cleanup gate's `tracing::info!` / `tracing::warn!` lines reach
# helmd's stderr (c-2026-07-05T17-30-00-000Z-f6a7b8c9).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# also compiles (handy for a future in-process test).
connectrpc = { version = "0.4", features = ["client", "axum"] }
async-trait = "0.1"
# Must match the version connectrpc 0.4.x pulls transitively.
buffa = { version = "0.5", features = ["json"] }
# Generated code names ::serde:: / ::http_body:: / ::http:: paths directly.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# Generated code names ::http:: / ::http_body:: as top-level crates.
http-body = "1"
http = "1"
axum = { version = "0.8", features = ["macros"] }
# `sync` added for spine 2a.1: the `AgentsHost::kernel_router` accessor returns
# `Arc<tokio::sync::Mutex<KernelRouter>>`, which helmd must name in its impl.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
# CORS so the browser (Helm's SPA, served by Hono on another origin) can dial
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1.0"

[dev-dependencies]
# The integration test (`tests/compile.rs`) mounts the ConnectRPC router
# in-process via the generated `HarnessServiceExt::register`. Needs the
# axum tower::ServiceExt::oneshot, http_body_util for body collection, and
http-body-util = "0.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
ship-store = { path = "../../crates/core/ship-platform/crates/ship-store" }
ship-proto = { git = "https://github.com/get-ship/ship-contracts.git", branch = "feat/next" }
ship-substrate = { path = "../../crates/core/ship-substrate" }
stack-model = { path = "../../crates/core/stack-model" }
parking_lot = "0.12"
jsonwebtoken = "9"
sha2 = "0.10"

[build-dependencies]
connectrpc-build = "0.4"
# Bundles protoc so no system-wide install is needed.
protoc-bin-vendored = "3"

[features]
# Default ON: helmd serves the REAL agent dispatch path (spine 2b). Mirrors
# shipd's `default = ["ship-code"]`. Build `--no-default-features` to get the
# lean 2a.1 read-only posture (NoopDispatch + dispatch_handle == None; none of
# the dispatch deps above are pulled).
default = ["ship-code"]
# ship-code: the harness-driver dispatch stack. Pulls the optional dispatch deps
# and forwards `ship-code` into ship-agents so its cfg gates align with
# helmd's (the `ship_agents::runtime` re-export + cancel module light up).
ship-code = [
    "dep:ship-code",
    "ship-agents/ship-code",
    "dep:ship-pipeline-runtime",
    "dep:ship-auth",
    "dep:ship-auth-types",
]

# Detach from the ship root workspace — helmd is its own compositional root.
[workspace]
