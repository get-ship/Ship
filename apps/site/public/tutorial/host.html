<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sail tutorial host</title>
  <script>
    // Pass the parent's full theme name through. Ship has six themes:
    // ship-light, ship-dark, paper, halo, console, contrast, glass.
    // The parent sets ?theme=<full-id> on iframe.src; we stamp it
    // onto data-theme and toggle .dark for any selector keyed on it.
    // Legacy 'light' / 'dark' short forms keep working.
    (function () {
      var DARK_THEMES = { 'ship-dark': 1, console: 1, contrast: 1 }
      var p = new URLSearchParams(location.search)
      var raw = p.get('theme') || ''
      var root = document.documentElement
      if (raw === 'light') raw = 'ship-light'
      else if (raw === 'dark') raw = 'ship-dark'
      if (raw) {
        root.dataset.theme = raw
        root.classList.toggle('dark', !!DARK_THEMES[raw])
      }
    })()
  </script>
  <!-- Ship design tokens. Same file the daemon serves at runtime;
       collect-skill-docs.ts concatenates tokens.css + themes.css
       into a single /api/assets/view-tokens.css. Loading it here
       makes every Sail primitive theme-aware inside the preview
       iframe — without it, components fall back to whatever default
       palette is in their shadow DOM. -->
  <link rel="stylesheet" href="/api/assets/view-tokens.css" />
  <style>
    body {
      margin: 0;
      font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      padding: 24px;
    }
    .err {
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 13px;
      background: var(--tone-destructive-bg, color-mix(in oklch, var(--destructive) 15%, transparent));
      color: var(--destructive);
      padding: 12px;
      border-radius: var(--radius-md, 6px);
      border-left: 3px solid var(--destructive);
      white-space: pre-wrap;
    }
    /* Tutorial example styles — read from Ship tokens so they flip
       with the parent theme. Hand-crafted .counter/.todo/.dash
       containers in the step templates pick these up. */
    .counter, .card, .todo, .dash, .form, .users, .clock,
    .branch, .chat, .grid, .metrics, .refs-demo,
    .effect, .slots-demo, .list, .hooks-demo, .catalog,
    .signup, .closer, .add-user, .fetcher, .signup,
    .branches {
      display: flex; flex-direction: column; gap: 12px;
      padding: 16px;
      background: var(--card);
      color: var(--card-foreground, var(--foreground));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg, 10px);
      max-width: 32rem;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    p { margin: 0; }
    strong { font-family: var(--font-mono, ui-monospace, monospace); }
    button:not([class^="sail-"]), input:not([class^="sail-"]) {
      background: transparent; color: inherit;
      border: 1px solid var(--border); padding: 6px 12px;
      border-radius: var(--radius-md, 6px); font: inherit; font-size: 14px; cursor: pointer;
    }
    input:not([class^="sail-"]) { cursor: text; min-width: 200px; }
    button:not([class^="sail-"]):hover { border-color: var(--primary); }
    .todo ul, .users ul, .chat ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    .todo li, .users li, .chat li { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md, 6px); }
    .todo li { cursor: pointer; transition: opacity 120ms; }
    .todo li.done { opacity: 0.5; text-decoration: line-through; }
    .todo li.empty { cursor: default; opacity: 0.6; font-style: italic; }
    .todo form, .add-user form { display: flex; gap: 8px; }
    .todo form input, .add-user form input { flex: 1; }
    .muted, .hint { color: var(--muted-foreground, var(--foreground)); font-size: 0.875rem; opacity: 0.7; }
    .err { color: var(--destructive); }
    .ok  { color: var(--success); }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="err" class="err" hidden></div>

  <!-- Importmap so compiled output's `import { ... } from "@ship/sail-runtime"` resolves. -->
  <script type="importmap">
    {
      "imports": {
        "@ship/sail-runtime": "/sail-runtime.js",
        "@ship/sail-runtime/route": "/sail-runtime.js",
        "@ship/sail-runtime/template-hooks": "/sail-runtime.js",
        "@ship/sail-dom": "/sail-dom.js"
      }
    }
  </script>

  <script type="module">
    // Mock-daemon service worker — intercepts /_deck/data/<source>
    // SSE requests and serves them from per-step scenarios. Tutorial
    // steps that exercise <data live>, {#while-loading}, morphs, or
    // any other daemon-shape feature route through this SW.
    //
    // Registration is best-effort; fall back to no SW if denied (the
    // tutorial steps that don't need a daemon work either way).
    async function registerSw() {
      if (!('serviceWorker' in navigator)) return null
      try {
        const reg = await navigator.serviceWorker.register('/tutorial/sw.js', {
          scope: '/tutorial/',
        })
        await navigator.serviceWorker.ready
        return reg
      } catch (e) {
        console.warn('[tutorial-host] sw register failed:', e)
        return null
      }
    }

    // Scenario plumbing — parent posts { kind: 'tutorial:scenario',
    // scenario: { '/users': {...}, 'api:/whoami': {...} } } and the
    // SW picks it up before any iframe fetch fires.
    async function loadScenario(scenario) {
      const reg = await registerSw()
      if (!reg) return false
      const ctrl = navigator.serviceWorker.controller ?? reg.active
      if (!ctrl) return false
      ctrl.postMessage({ kind: 'load-scenario', scenario })
      return true
    }

    // `ship` proxy — any `ship.<domain>.<op>(...)` call returns a
    // LiveSource that subscribes via SSE against /_deck/data/<domain>/<op>.
    // The SW intercepts those URLs and plays back scenario frames as
    // envelopes ({ kind: 'loading' | 'ok' | 'error', ... }).
    //
    // Lets tutorial templates write the same shape a real Ship view
    // would:
    //   <data name="users" source="ship.users.list()" live />
    window.ship = new Proxy({}, {
      get: (_t, domain) => new Proxy({}, {
        get: (_t2, op) => (..._args) => ({
          subscribe: (sig) => {
            const url = `/_deck/data/${String(domain)}/${String(op)}`
            const es = new EventSource(url)
            es.onmessage = (e) => {
              try { sig.set(JSON.parse(e.data)) } catch (err) {
                sig.set({ kind: 'error', error: { message: String(err) } })
              }
            }
            es.onerror = () => {
              sig.set({ kind: 'error', error: { message: 'SSE connection error' } })
            }
            return () => es.close()
          },
        }),
      }),
    })

    // Wait for a 'tutorial:run' postMessage from the parent containing
    // the compiled JS modules (template + controller). Inject them as
    // blob URLs so they import normally through the importmap.
    let lastBlobs = []
    function freeBlobs() {
      for (const b of lastBlobs) URL.revokeObjectURL(b)
      lastBlobs = []
    }
    function makeBlobUrl(code) {
      const blob = new Blob([code], { type: 'application/javascript' })
      const url = URL.createObjectURL(blob)
      lastBlobs.push(url)
      return url
    }

    window.addEventListener('message', async (e) => {
      // Scenario load — parent ships a per-step timeline for the SW
      // to play back. Independent of tutorial:run so the scenario
      // can be primed before the user's view mounts.
      if (e.data && e.data.kind === 'tutorial:scenario') {
        await loadScenario(e.data.scenario || {})
        return
      }
      if (!e.data || e.data.kind !== 'tutorial:run') return
      const { template, controller, tag } = e.data
      const errEl = document.getElementById('err')
      const root = document.getElementById('root')
      errEl.hidden = true
      errEl.textContent = ''

      // Drop any previous custom-element registration: blow away the
      // root and unregister the tag isn't possible (CE registrations
      // are permanent), so we instead use a fresh tag name per run
      // — the compiled module includes `component('<tag>', …)` with
      // a unique tag passed in by the parent.
      while (root.firstChild) root.removeChild(root.firstChild)
      freeBlobs()

      try {
        // The controller module references './template.sail' as the
        // type-import target. Compiled output imports the .ts file as
        // the setup module. We rewrite the controller to import from
        // a blob URL pointing at a sibling module that re-exports
        // signal/derived from @ship/sail-runtime (already in importmap).
        // For tutorial purposes we just inline the controller into the
        // template module since the compiled template has
        //   import setup from "../<stem>.controller.ts"
        // pointing at a path that doesn't exist. We pre-process the
        // template to point its setup import at a blob URL of the
        // compiled controller.
        const controllerBlob = makeBlobUrl(controller)
        const templateRewritten = template.replace(
          /from\s+["'][^"']*\.controller\.ts["']/,
          `from ${JSON.stringify(controllerBlob)}`,
        )
        const templateBlob = makeBlobUrl(templateRewritten)

        await import(templateBlob)
        // Mount: append a fresh instance of the custom element.
        const el = document.createElement(tag)
        root.appendChild(el)
      } catch (err) {
        errEl.hidden = false
        errEl.textContent = String(err && err.message || err)
      }
    })

    // Tell parent we're ready to receive runs.
    window.parent?.postMessage({ kind: 'tutorial:ready' }, '*')
  </script>
</body>
</html>
