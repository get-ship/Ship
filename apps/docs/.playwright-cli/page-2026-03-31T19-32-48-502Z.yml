      - main [ref=e131]:
        - heading "Agent Management" [level=1] [ref=e134]
        - generic [ref=e137]:
          - paragraph [ref=e138]:
            - text: Studio provides a visual interface for creating, editing, and managing agent profiles. Agents are JSONC files in
            - code [ref=e139]: .ship/agents/
            - text: . Studio reads and writes them through MCP tool calls.
          - generic [ref=e140]:
            - heading "Agent list" [level=2] [ref=e141]
            - link "Section titled “Agent list”" [ref=e142] [cursor=pointer]:
              - /url: "#agent-list"
              - img [ref=e144]
              - generic [ref=e146]: Section titled “Agent list”
          - paragraph [ref=e147]:
            - text: The agents page (
            - code [ref=e148]: /studio/agents/
            - text: ) displays all agents from both project and library sources in a responsive grid.
          - generic [ref=e149]:
            - heading "Agent cards" [level=3] [ref=e150]
            - link "Section titled “Agent cards”" [ref=e151] [cursor=pointer]:
              - /url: "#agent-cards"
              - img [ref=e153]
              - generic [ref=e155]: Section titled “Agent cards”
          - paragraph [ref=e156]: "Each card shows:"
          - list [ref=e157]:
            - listitem [ref=e158]:
              - strong [ref=e159]: Icon
              - text: — Tech stack icon (if configured) or a gradient initial letter
            - listitem [ref=e160]:
              - strong [ref=e161]: Name and description
              - text: — From the agent profile
            - listitem [ref=e162]:
              - strong [ref=e163]: Stats
              - text: — Skill count, MCP server count, rule count
            - listitem [ref=e164]:
              - strong [ref=e165]: Permission preset
              - text: — Displayed with the
              - code [ref=e166]: ship-
              - text: prefix stripped (e.g., “standard”, “autonomous”)
            - listitem [ref=e167]:
              - strong [ref=e168]: "Source badges:"
              - list [ref=e169]:
                - listitem [ref=e170]:
                  - text: Violet “Library” for agents from
                  - code [ref=e171]: ~/.ship/agents/
                - listitem [ref=e172]: Green “Local” for agents detected on the connected CLI
                - listitem [ref=e173]: Amber “Modified” when unsaved browser drafts exist
          - generic [ref=e174]:
            - heading "Filtering" [level=3] [ref=e175]
            - link "Section titled “Filtering”" [ref=e176] [cursor=pointer]:
              - /url: "#filtering"
              - img [ref=e178]
              - generic [ref=e180]: Section titled “Filtering”
          - paragraph [ref=e181]: "When library agents are present, a filter toggle appears: All, Project, Library. This controls which agents appear in the grid."
          - generic [ref=e182]:
            - heading "Creating agents" [level=3] [ref=e183]
            - link "Section titled “Creating agents”" [ref=e184] [cursor=pointer]:
              - /url: "#creating-agents"
              - img [ref=e186]
              - generic [ref=e188]: Section titled “Creating agents”
          - paragraph [ref=e189]: Click “New agent” to open the create dialog. Enter a name (auto-generates an ID) and optionally a description. The agent is created with default settings and appears immediately.
          - paragraph [ref=e190]: When disconnected from the CLI, an empty state shows the CLI install command and a “Create locally” button for browser-only drafts.
          - generic [ref=e191]:
            - heading "Agent detail" [level=2] [ref=e192]
            - link "Section titled “Agent detail”" [ref=e193] [cursor=pointer]:
              - /url: "#agent-detail"
              - img [ref=e195]
              - generic [ref=e197]: Section titled “Agent detail”
          - paragraph [ref=e198]:
            - text: Clicking a card navigates to
            - code [ref=e199]: "/studio/agents/{id}"
            - text: . The detail page has three structural components.
          - generic [ref=e200]:
            - heading "Activity bar" [level=3] [ref=e201]
            - link "Section titled “Activity bar”" [ref=e202] [cursor=pointer]:
              - /url: "#activity-bar"
              - img [ref=e204]
              - generic [ref=e206]: Section titled “Activity bar”
          - paragraph [ref=e207]: "A vertical icon bar on the left with section shortcuts: Skills, MCP Servers, Permissions, Rules, Providers. Clicking a section scrolls to it. The active section highlights based on scroll position (scrollspy)."
          - generic [ref=e208]:
            - heading "Sticky header" [level=3] [ref=e209]
            - link "Section titled “Sticky header”" [ref=e210] [cursor=pointer]:
              - /url: "#sticky-header"
              - img [ref=e212]
              - generic [ref=e214]: Section titled “Sticky header”
          - paragraph [ref=e215]: "A fixed header showing the agent name, description, and action buttons:"
          - list [ref=e216]:
            - listitem [ref=e217]:
              - strong [ref=e218]: Edit
              - text: — Opens a dialog for name, description, version, and provider list
            - listitem [ref=e219]:
              - strong [ref=e220]: Delete
              - text: — Removes the agent after confirmation
            - listitem [ref=e221]:
              - strong [ref=e222]: Discard
              - text: — Visible when drafts exist. Reverts all unsaved changes.
          - paragraph [ref=e223]: A “Modified” indicator appears when the agent has unsaved drafts.
          - generic [ref=e224]:
            - heading "Sections" [level=3] [ref=e225]
            - link "Section titled “Sections”" [ref=e226] [cursor=pointer]:
              - /url: "#sections"
              - img [ref=e228]
              - generic [ref=e230]: Section titled “Sections”
          - paragraph [ref=e231]: "The detail page scrolls through five sections:"
          - paragraph [ref=e232]:
            - strong [ref=e233]: Skills
            - text: — Lists skills attached to the agent with name and ID. Add skill opens a search dialog. Remove detaches a skill.
          - paragraph [ref=e234]:
            - strong [ref=e235]: MCP Servers
            - text: — Lists configured servers. Add MCP server opens a dialog for HTTP/SSE or stdio servers. Per-tool permission toggles (allow, deny) with bulk group controls.
          - paragraph [ref=e236]:
            - strong [ref=e237]: Permissions
            - text: — Shows the active preset and permission summary. A preset selector chooses from built-in presets. Changing any individual permission switches the display to “custom”.
          - paragraph [ref=e238]:
            - strong [ref=e239]: Rules
            - text: — Lists inline rules and rule file references. Add, edit, and remove actions available.
          - paragraph [ref=e240]:
            - strong [ref=e241]: Providers
            - text: "— Provider-specific configuration: model selection, available models allowlist, environment variables, agent limits (max turns, max cost per session), lifecycle hooks, and provider settings pass-through."
          - generic [ref=e242]:
            - heading "Draft system" [level=2] [ref=e243]
            - link "Section titled “Draft system”" [ref=e244] [cursor=pointer]:
              - /url: "#draft-system"
              - img [ref=e246]
              - generic [ref=e248]: Section titled “Draft system”
          - paragraph [ref=e249]: All edits in the agent detail page create local drafts, not immediate writes. This lets users make multiple changes before committing.
          - generic [ref=e250]:
            - heading "How drafts work" [level=3] [ref=e251]
            - link "Section titled “How drafts work”" [ref=e252] [cursor=pointer]:
              - /url: "#how-drafts-work"
              - img [ref=e254]
              - generic [ref=e256]: Section titled “How drafts work”
          - list [ref=e257]:
            - listitem [ref=e258]:
              - strong [ref=e259]: Edit
              - text: — Any change (add skill, change permission, edit rule) calls
              - code [ref=e260]: setDraft(agentId, patch)
              - text: .
            - listitem [ref=e261]:
              - strong [ref=e262]: Overlay
              - text: — The draft patch is deep-merged over pull data to produce the displayed agent state.
            - listitem [ref=e263]:
              - strong [ref=e264]: Persistence
              - text: — Drafts are stored in IndexedDB via
              - code [ref=e265]: useAgentDrafts()
              - text: . They survive page reloads and browser restarts.
            - listitem [ref=e266]:
              - strong [ref=e267]: Push
              - text: — The user explicitly pushes changes. This calls
              - code [ref=e268]: push_bundle
              - text: with a
              - code [ref=e269]: TransferBundle
              - text: containing the full agent config.
            - listitem [ref=e270]:
              - strong [ref=e271]: Confirm
              - text: — On success, the push invalidates the pull query. The re-pull confirms the write and the draft is cleared.
            - listitem [ref=e272]:
              - strong [ref=e273]: Discard
              - text: — The Discard button in the sticky header removes the IndexedDB entry and reverts to the last-known CLI state.
          - generic [ref=e274]:
            - heading "Draft indicators" [level=3] [ref=e275]
            - link "Section titled “Draft indicators”" [ref=e276] [cursor=pointer]:
              - /url: "#draft-indicators"
              - img [ref=e278]
              - generic [ref=e280]: Section titled “Draft indicators”
          - list [ref=e281]:
            - listitem [ref=e282]:
              - strong [ref=e283]: Agent list
              - text: — Amber “Modified” badge on the card
            - listitem [ref=e284]:
              - strong [ref=e285]: Agent detail
              - text: — “Modified” text in the sticky header, Discard button visible
            - listitem [ref=e286]:
              - strong [ref=e287]: Across sessions
              - text: — Drafts persist in IndexedDB. Returning to Studio later still shows unsaved changes.
          - generic [ref=e288]:
            - heading "Push to CLI" [level=2] [ref=e289]
            - link "Section titled “Push to CLI”" [ref=e290] [cursor=pointer]:
              - /url: "#push-to-cli"
              - img [ref=e292]
              - generic [ref=e294]: Section titled “Push to CLI”
          - paragraph [ref=e295]:
            - text: Studio does not auto-save agent changes to disk. The user must explicitly push when ready. The push operation sends a
            - code [ref=e296]: TransferBundle
            - text: (a Rust type auto-generated to TypeScript via Specta) that contains the complete agent configuration. The CLI writes the JSONC file to
            - code [ref=e297]: ".ship/agents/{id}.jsonc"
            - text: and recompiles.
          - paragraph [ref=e298]: This intentional friction prevents partial or accidental writes. The draft system acts as a staging area.
