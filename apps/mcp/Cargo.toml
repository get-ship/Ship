[package]
name = "mcp"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
name = "mcp"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { workspace = true }
serde_json = { workspace = true }
mcp-framework = { path = "../../crates/core/mcp-framework" }
async-trait = { workspace = true }
compiler = { path = "../../crates/core/compiler" }
lint = { path = "../../crates/core/lint" }
runtime = { path = "../../crates/core/runtime" }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
toml = { workspace = true }
tokio-util = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream", "multipart"] }
futures-util = { workspace = true }

[features]
unstable = ["runtime/unstable"]

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rmcp = { workspace = true, features = ["server", "client", "transport-io"] }
