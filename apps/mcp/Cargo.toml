[package]
name = "mcp"
version = "0.2.0"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
build-info = { path = "../../crates/core/build-info" }

[lib]
name = "mcp"
path = "src/lib.rs"

[dependencies]
build-info = { path = "../../crates/core/build-info" }
tokio = { workspace = true, features = ["full"] }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { workspace = true }
serde_json = { workspace = true }
mcp-framework = { path = "../../crates/core/mcp-framework" }
async-trait = { workspace = true }
compiler = { path = "../../crates/core/compiler" }
lint = { path = "../../crates/core/lint" }
ship-substrate = { path = "../../crates/core/ship-substrate" }
ship-platform = { path = "../../crates/core/ship-platform" }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
tokio-util = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
home = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream", "multipart"] }
futures-util = { workspace = true }

[features]
unstable = ["ship-platform/unstable"]

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rmcp = { workspace = true, features = ["server", "client", "transport-io"] }

[lints]
workspace = true
