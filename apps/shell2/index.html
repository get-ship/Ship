<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship</title>

  <link rel="stylesheet" href="/api/assets/view-tokens.css" />
  <link rel="stylesheet" href="/src/chrome/layout.css" />

  <!-- Importmap MUST come before any module script — browsers freeze it
       at first module fetch. Vite's HMR client injects module scripts
       early, so the importmap lives at the very top to win the race. -->
  <script type="importmap">
    {
      "imports": {
        "@ship/ui-runtime":    "/_sui/runtime.js",
        "@ship/ui-dom":        "/_sui/dom.js",
        "@ship/ui-sdk-client": "/_sui/sdk-client.js"
      }
    }
  </script>

  <!-- Components.js side-effect import — registers <sui-*> custom elements
       before any view template tries to instantiate one. Loaded via
       runtime IIFE so Vite's import-analysis doesn't try to resolve it
       as a local module. -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = '/_sui/components.js';
      document.head.appendChild(s);
    })();
  </script>

  <!-- Bootstrap @ship/ui-runtime onto window before main.ts runs. The
       IIFE-injected script is opaque to Vite's import-analysis (which
       would otherwise rewrite the bare specifier or append `?import`,
       creating a SECOND runtime instance separate from the one compiled
       view modules import). The browser's importmap resolves the bare
       specifier to /_sui/runtime.js — same URL view modules use — so
       all SUI code shares ONE runtime universe.

       `window.__suiRuntimeReady` is the gate main.ts awaits before
       calling mount(). Same pattern as apps/shell. -->
  <script>
    (function () {
      window.__suiRuntimeReady = new Promise(function (res) {
        var s = document.createElement('script');
        s.type = 'module';
        s.textContent =
          "import * as r from '@ship/ui-runtime'; window.__suiRuntime = r; window.dispatchEvent(new Event('sui-runtime-ready'));";
        document.head.appendChild(s);
        window.addEventListener('sui-runtime-ready', function () { res(window.__suiRuntime); }, { once: true });
      });
    })();
  </script>
</head>
<body>
  <div id="ship-app">
    <!-- Top bar: brand, nav breadcrumb, search, theme picker -->
    <header class="ship-top-bar" data-shell="top-bar">
      <span class="ship-brand-mark" aria-hidden="true">◐</span>
      <span class="ship-brand-title">Ship</span>
      <nav class="ship-top-nav" id="ship-top-nav"></nav>
      <sui-icon name="search" size="sm" label="Search" id="ship-search-icon"></sui-icon>
      <button id="ship-notify-btn" class="ship-theme-toggle" type="button" title="Send demo notification">Notify</button>
      <sui-theme-picker placement="bottom-end"></sui-theme-picker>
    </header>

    <!-- Left rail: vertical nav with collapse toggle -->
    <sui-rail id="ship-rail">
      <sui-rail-item icon="layout-dashboard" label="Dashboard" href="/" data-view="dashboard"></sui-rail-item>
      <sui-rail-item icon="zap" label="Pipelines" href="/pipelines" data-view="pipelines"></sui-rail-item>
      <sui-rail-item icon="bot" label="Agents" href="/agents" data-view="agents"></sui-rail-item>
      <sui-rail-item icon="git-branch" label="Git" href="/git" data-view="git"></sui-rail-item>
      <sui-rail-item icon="layers" label="UI Studio" href="/ship-ui-studio" data-view="ship-ui-studio"></sui-rail-item>
      <sui-rail-item icon="palette" label="SUI Demo" href="/sui-demo" data-view="sui-demo"></sui-rail-item>
    </sui-rail>

    <!-- Main content: view mounts here -->
    <main id="ship-content" class="ship-content"></main>

    <!-- Bottom status bar: connection, branch, theme -->
    <sui-status-bar id="ship-status-bar" branch="" theme="" agents=""></sui-status-bar>
  </div>

  <sui-toast-container position="bottom-right" id="sui-toast-container"></sui-toast-container>

  <!-- sui-loading demo: toggled via button in the view content area -->
  <div id="sui-loading-demo" style="display:none;position:fixed;inset:0;z-index:8000;background:var(--background,#fff)">
    <sui-loading messages="Loading demo|Warming up|Almost there"></sui-loading>
  </div>

  <!-- sui-edit-overlay: activated by body.edit-mode (same contract as ship-edit-overlay) -->
  <sui-edit-overlay id="sui-edit-overlay"></sui-edit-overlay>

  <!-- sui-annotation demo: hidden layer with sample markers; shown via toggle button -->
  <sui-annotation-layer id="sui-annotation-demo"
    mode="off"
    style="display:none;position:fixed;inset:0;z-index:8500"
  ></sui-annotation-layer>

  <!-- ── atoms-2 demos ─────────────────────────────────────────────────── -->

  <!-- sui-table: 3-row data grid with sort + sticky header -->
  <div id="sui-table-demo" style="display:none;position:fixed;inset:0;z-index:8600;background:var(--background);padding:40px;overflow:auto">
    <h2 style="font:var(--text-base)/1.4 var(--font-body);margin:0 0 16px;color:var(--foreground)">sui-table demo</h2>
    <sui-table variant="native" sticky-header style="max-height:300px">
      <table>
        <thead>
          <tr>
            <th data-sort-key="name">Name</th>
            <th data-sort-key="role">Role</th>
            <th data-sort-key="status" align="center">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr data-row-id="1"><td>Alice</td><td>Engineer</td><td align="center"><sui-badge tone="success">Active</sui-badge></td></tr>
          <tr data-row-id="2"><td>Bob</td><td>Designer</td><td align="center"><sui-badge tone="warning">Away</sui-badge></td></tr>
          <tr data-row-id="3"><td>Carol</td><td>Manager</td><td align="center"><sui-badge tone="muted">Offline</sui-badge></td></tr>
        </tbody>
      </table>
    </sui-table>
    <p style="margin-top:12px;font-size:var(--text-xs);color:var(--muted-foreground)">Click a header to sort · Click a row to fire sui-row-click</p>
    <button onclick="document.getElementById('sui-table-demo').style.display='none'" style="margin-top:16px;padding:6px 12px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--foreground)">Close</button>
  </div>

  <!-- sui-tree-view: 3-level expandable hierarchy -->
  <div id="sui-tree-demo" style="display:none;position:fixed;inset:0;z-index:8600;background:var(--background);padding:40px">
    <h2 style="font:var(--text-base)/1.4 var(--font-body);margin:0 0 16px;color:var(--foreground)">sui-tree-view demo</h2>
    <sui-tree-view style="width:280px">
      <sui-tree-item label="Pipelines" expanded>
        <sui-tree-item label="Build" expanded>
          <sui-tree-item label="compile.yml" leaf></sui-tree-item>
          <sui-tree-item label="test.yml" leaf></sui-tree-item>
        </sui-tree-item>
        <sui-tree-item label="Deploy" leaf></sui-tree-item>
      </sui-tree-item>
      <sui-tree-item label="Agents">
        <sui-tree-item label="scout" leaf></sui-tree-item>
      </sui-tree-item>
      <sui-tree-item label="Settings" leaf selected></sui-tree-item>
    </sui-tree-view>
    <button onclick="document.getElementById('sui-tree-demo').style.display='none'" style="margin-top:24px;display:block;padding:6px 12px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--foreground)">Close</button>
  </div>

  <!-- sui-app-icon: all variants + sizes -->
  <div id="sui-app-icon-demo" style="display:none;position:fixed;inset:0;z-index:8600;background:var(--background);padding:40px">
    <h2 style="font:var(--text-base)/1.4 var(--font-body);margin:0 0 16px;color:var(--foreground)">sui-app-icon demo</h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
      <sui-app-icon name="dashboard" variant="glyph" size="lg" label="Dashboard glyph"></sui-app-icon>
      <sui-app-icon name="pipelines" variant="tile" size="lg" label="Pipelines tile"></sui-app-icon>
      <sui-app-icon name="agents" variant="solid" size="lg" label="Agents solid"></sui-app-icon>
      <sui-app-icon name="git" variant="tile" size="md" label="Git md"></sui-app-icon>
      <sui-app-icon name="settings" variant="glyph" size="sm" label="Settings sm"></sui-app-icon>
      <sui-app-icon name="canvas" variant="solid" size="sm" label="Canvas sm solid"></sui-app-icon>
    </div>
    <button onclick="document.getElementById('sui-app-icon-demo').style.display='none'" style="margin-top:24px;display:block;padding:6px 12px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--foreground)">Close</button>
  </div>

  <!-- sui-toolbar: start/end groups with spacer -->
  <div id="sui-toolbar-demo" style="display:none;position:fixed;inset:0;z-index:8600;background:var(--background);padding:40px">
    <h2 style="font:var(--text-base)/1.4 var(--font-body);margin:0 0 16px;color:var(--foreground)">sui-toolbar demo</h2>
    <sui-toolbar variant="bordered" style="width:400px;border:1px solid var(--border);border-radius:var(--radius-md)">
      <sui-button size="sm" variant="ghost" aria-label="Bold"><sui-icon name="bold" size="sm"></sui-icon></sui-button>
      <sui-button size="sm" variant="ghost" aria-label="Italic"><sui-icon name="italic" size="sm"></sui-icon></sui-button>
      <sui-button size="sm" variant="ghost" aria-label="Underline"><sui-icon name="underline" size="sm"></sui-icon></sui-button>
      <span slot="spacer"></span>
      <sui-button size="sm" tone="primary">Save</sui-button>
    </sui-toolbar>
    <p style="margin-top:12px;font-size:var(--text-xs);color:var(--muted-foreground)">Use ArrowLeft/Right to move between toolbar items</p>
    <button onclick="document.getElementById('sui-toolbar-demo').style.display='none'" style="margin-top:16px;display:block;padding:6px 12px;background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--foreground)">Close</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
