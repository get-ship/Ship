<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship</title>

  <link rel="stylesheet" href="/api/assets/view-tokens.css" />
  <link rel="stylesheet" href="/src/chrome/layout.css" />

  <!-- Importmap MUST come before any module script — browsers freeze it
       at first module fetch. Vite's HMR client injects module scripts
       early, so the importmap lives at the very top to win the race. -->
  <script type="importmap">
    {
      "imports": {
        "@ship/ui-runtime":    "/_sui/runtime.js",
        "@ship/ui-dom":        "/_sui/dom.js",
        "@ship/ui-sdk-client": "/_sui/sdk-client.js"
      }
    }
  </script>

  <!-- Components.js side-effect import — registers <sui-*> custom elements
       before any view template tries to instantiate one. Loaded via
       runtime IIFE so Vite's import-analysis doesn't try to resolve it
       as a local module. -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = '/_sui/components.js';
      document.head.appendChild(s);
    })();
  </script>

  <!-- Bootstrap @ship/ui-runtime onto window before main.ts runs. The
       IIFE-injected script is opaque to Vite's import-analysis (which
       would otherwise rewrite the bare specifier or append `?import`,
       creating a SECOND runtime instance separate from the one compiled
       view modules import). The browser's importmap resolves the bare
       specifier to /_sui/runtime.js — same URL view modules use — so
       all SUI code shares ONE runtime universe.

       `window.__suiRuntimeReady` is the gate main.ts awaits before
       calling mount(). Same pattern as apps/shell. -->
  <script>
    (function () {
      window.__suiRuntimeReady = new Promise(function (res) {
        var s = document.createElement('script');
        s.type = 'module';
        s.textContent =
          "import * as r from '@ship/ui-runtime'; window.__suiRuntime = r; window.dispatchEvent(new Event('sui-runtime-ready'));";
        document.head.appendChild(s);
        window.addEventListener('sui-runtime-ready', function () { res(window.__suiRuntime); }, { once: true });
      });
    })();
  </script>
</head>
<body>
  <div id="ship-app">
    <header class="ship-top-bar" data-shell="top-bar">
      <span class="ship-brand-mark" aria-hidden="true">◐</span>
      <span class="ship-brand-title">Ship</span>
      <nav class="ship-top-nav" id="ship-top-nav"></nav>
      <sui-icon name="search" size="sm" label="Search" id="ship-search-icon"></sui-icon>
      <button id="ship-notify-btn" class="ship-theme-toggle" type="button" title="Send demo notification">Notify</button>
      <sui-theme-picker placement="bottom-end"></sui-theme-picker>
    </header>
    <main id="ship-content" class="ship-content"></main>

    <!-- S2 static-primitives demo — one of each new component, visible at all times.
         Satisfies acceptance gate §4 (shell2 integration probe). -->
    <footer id="sui-statics-demo" style="
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: var(--font-body);
    ">
      <!-- sui-separator -->
      <div>
        <sui-label size="sm">sui-separator</sui-label>
        <sui-separator orientation="horizontal" style="margin-top:4px"></sui-separator>
      </div>

      <!-- sui-label -->
      <div style="display:flex;gap:12px;align-items:center">
        <sui-label for="demo-input" required>sui-label</sui-label>
        <input id="demo-input" type="text" placeholder="focus me" style="border:1px solid var(--border);padding:4px 8px;border-radius:4px;background:var(--background);color:var(--foreground)" />
      </div>

      <!-- sui-alert -->
      <sui-alert tone="info">
        <span slot="title">sui-alert</span>
        Info banner — static, dismissible variant below
      </sui-alert>
      <sui-alert tone="warning" dismissible>
        <span slot="title">Warning</span>
        Dismissible alert. Click × to remove.
      </sui-alert>

      <!-- sui-tooltip -->
      <div style="display:flex;gap:12px;align-items:center">
        <sui-label>sui-tooltip</sui-label>
        <sui-tooltip placement="top">
          <button type="button" style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--background);color:var(--foreground);cursor:pointer">Hover me</button>
          <span slot="content">Tooltip text</span>
        </sui-tooltip>
        <sui-tooltip placement="right">
          <button type="button" style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--background);color:var(--foreground);cursor:pointer">Right</button>
          <span slot="content">Right placement</span>
        </sui-tooltip>
      </div>

      <!-- sui-collapsible -->
      <sui-collapsible>
        <button slot="trigger" type="button" style="width:100%;text-align:left;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--background);color:var(--foreground);cursor:pointer">
          sui-collapsible — click to expand ▾
        </button>
        <div style="padding:10px;border:1px solid var(--border);border-top:0;border-radius:0 0 4px 4px;color:var(--foreground)">
          Collapsible content. Grid-based height animation, keyboard-accessible.
        </div>
      </sui-collapsible>
    </footer>
  </div>
  <sui-toast-container position="bottom-right" id="sui-toast-container"></sui-toast-container>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
