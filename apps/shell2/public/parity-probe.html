<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Parity probe — Lit vs SUI</title>

  <!-- Same-origin with vite (proxies to daemon for /_sui/*, /api/*).
       Loads the importmap + components.js (SUI) + ship-elements.js
       (Lit) so test pages can mount both <ship-X> and <sui-X> for
       side-by-side comparisons. Used by .artifacts/probes/probe-parity-
       <name>.mjs through page.goto('/parity-probe.html?...'). -->

  <link rel="stylesheet" href="/api/assets/view-tokens.css" />

  <script type="importmap">
    {
      "imports": {
        "@ship/ui-runtime":    "/_sui/runtime.js",
        "@ship/ui-dom":        "/_sui/dom.js",
        "@ship/ui-sdk-client": "/_sui/sdk-client.js"
      }
    }
  </script>

  <!-- SUI components (registers <sui-*> custom elements). -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = '/_sui/components.js';
      document.head.appendChild(s);
    })();
  </script>

  <!-- Lit ship-elements (registers <ship-*> custom elements). -->
  <script type="module" src="/api/assets/ship-elements.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: var(--background, #fff); color: var(--foreground, #111); }
    table { border-collapse: collapse; }
    th, td { padding: 8px 12px; border: 1px solid var(--border, #ddd); vertical-align: middle; }
    th { font-size: 12px; background: var(--muted, #f5f5f5); text-align: left; }
    .label { font-size: 11px; max-width: 240px; word-break: break-all; font-family: var(--font-mono, ui-monospace, monospace); }
    .lit-cell, .sui-cell { text-align: center; min-width: 80px; }
    .ready-marker { display: none; }
    .ready .ready-marker { display: block; color: green; }
  </style>
</head>
<body>
  <h2 id="title">Parity probe</h2>
  <p class="ready-marker" data-probe-ready="1">Ready</p>
  <table id="grid">
    <thead><tr><th>Variant</th><th id="lit-th">&lt;ship-?&gt;</th><th id="sui-th">&lt;sui-?&gt;</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    // The probe driver passes test config in the query string:
    //   ?lit=ship-icon&sui=sui-icon&variants=<base64 json array>
    // Each variant is a flat record of attribute name → value.
    // The page renders one row per variant, then sets data-probe-ready.

    const params = new URLSearchParams(location.search)
    const lit = params.get('lit') || 'ship-icon'
    const sui = params.get('sui') || 'sui-icon'
    const variantsB64 = params.get('variants') || ''
    let variants = []
    try { variants = JSON.parse(atob(variantsB64)) } catch { variants = [] }

    document.getElementById('title').textContent = `Parity: <${lit}> vs <${sui}>`
    document.getElementById('lit-th').textContent = `<${lit}>`
    document.getElementById('sui-th').textContent = `<${sui}>`

    const tbody = document.getElementById('rows')
    function attrsHtml(rec) {
      return Object.entries(rec)
        .filter(([, v]) => v !== false)
        .map(([k, v]) => v === true ? k : `${k}="${String(v).replace(/"/g, '&quot;')}"`)
        .join(' ')
    }

    variants.forEach((v, i) => {
      // Keys prefixed with '--' are special directives, not HTML attributes.
      // '--inner': raw HTML injected as children into both lit and sui elements.
      const inner = v['--inner'] || ''
      const attrsRec = Object.fromEntries(Object.entries(v).filter(([k]) => !k.startsWith('--')))
      const tr = document.createElement('tr')
      tr.dataset.variant = String(i)
      tr.innerHTML = `
        <td class="label">${JSON.stringify(attrsRec)}</td>
        <td class="lit-cell"><${lit} ${attrsHtml(attrsRec)}>${inner}</${lit}></td>
        <td class="sui-cell"><${sui} ${attrsHtml(attrsRec)}>${inner}</${sui}></td>
      `
      tbody.appendChild(tr)
    })

    // Wait for both registries before signaling ready.
    Promise.all([
      customElements.whenDefined(lit),
      customElements.whenDefined(sui),
    ]).then(() => {
      // Settle effects + shadow DOM construction.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.body.classList.add('ready')
      }))
    }).catch(err => {
      const e = document.createElement('div')
      e.style.color = 'red'
      e.textContent = 'parity probe: registry wait failed: ' + err.message
      document.body.appendChild(e)
    })
  </script>
</body>
</html>
