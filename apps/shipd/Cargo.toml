[package]
name = "shipd"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
name = "shipd"
path = "src/lib.rs"

[[bin]]
name = "shipd"
path = "src/main.rs"

[dependencies]
runtime = { path = "../../crates/core/runtime" }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
anyhow = "1.0"
getrandom = "0.2"
libc = "0.2"
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
serde_yaml = "0.9"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
axum = { version = "0.8", features = ["http1", "tokio", "ws"] }
rmcp = { version = "0.16.0", features = ["server", "transport-streamable-http-server"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "timeout"] }
utoipa = { version = "5", features = ["axum_extras"] }
datastar = { version = "0.3.1", features = ["axum"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[features]
unstable = ["runtime/unstable"]

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1.0"
