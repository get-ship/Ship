[package]
name = "shipd"
version = "0.2.0"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
build-info = { path = "../../crates/build-info" }

[lib]
name = "shipd"
path = "src/lib.rs"

[[bin]]
name = "shipd"
path = "src/main.rs"

[dependencies]
ship-substrate = { path = "../../crates/core/ship-substrate" }
ship-platform = { path = "../../crates/core/ship-platform" }
ship-isolation = { path = "../../crates/core/ship-isolation", default-features = false }
ship-host = { path = "../../crates/core/ship-substrate/crates/ship-host" }
ship-pipelines = { path = "../../crates/core/ship-substrate/crates/ship-pipelines" }
ship-supervisor = { path = "../../crates/core/ship-substrate/crates/ship-supervisor" }
ship-types = { path = "../../crates/core/ship-substrate/crates/ship-types" }
ship-analytics = { path = "../../crates/core/ship-platform/crates/ship-analytics" }
ship-search = { path = "../../crates/core/ship-platform/crates/ship-search" }
ship-collection = { path = "../../crates/core/ship-platform/crates/ship-collection" }
ship-artifacts = { path = "../../crates/core/ship-platform/crates/ship-artifacts" }
ship-space = { path = "../../crates/core/ship-platform/crates/ship-space" }
compiler = { path = "../../crates/core/ship-platform/crates/compiler" }
build-info = { path = "../../crates/build-info" }
ship-ops-rpc = { path = "../../crates/core/ship-platform/crates/ship-ops-rpc" }
connectrpc = { version = "0.4", features = ["axum", "client"] }
# Descriptor decode for the op-policy gate (reads proto custom options).
buffa = "0.5"
buffa-descriptor = "0.5"
http = "1"
deck = { path = "../../crates/deck/deck" }
sui-compiler = { path = "../../crates/sui/compiler" }
sui-signals = { path = "../../crates/sui/signals" }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { workspace = true }
anyhow = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
# RFC 6902 JSON Patch — FilesService.patch_jsonc applies these against
# the current document. No shims; callers that want partial edits use
# this, callers that want full replace use write_jsonc/PUT.
json-patch = "4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-appender = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "ws", "multipart"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
async-trait = { workspace = true }
async-stream = "0.3"
futures = "0.3"
notify = { workspace = true }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "timeout"] }
datastar = { version = "=0.3.1", features = ["axum"] }
jsonwebtoken = "9"
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
minijinja = { workspace = true, features = ["loader", "builtins", "json"] }
ulid = { workspace = true }
thiserror = { workspace = true }
# HTML sanitizer — allowlist-based DOM cleaner used for agent-supplied
# canvas HTML (see apps/shipd/src/views/sanitize.rs).
ammonia = "4"
form_urlencoded = "1"
git2 = { version = "0.19" }
include_dir = "0.7"
# JSON Schema validator (Draft 2020-12). Used to validate pipeline
# documents on write — catches structural errors beyond parse errors.
jsonschema = { version = "0.46", default-features = false }
# Cross-platform pseudo-terminal allocation (PTY on Unix, ConPTY on
# Windows). Used by ProcessExecutor so spawned agents see a real TTY —
# stream-json and human output stay line-buffered, isatty checks work.
portable-pty = "0.9"
# Regex used by the SFC pipeline (apps/shipd/src/views/sfc) for block
# splitting and signal-attribute rewriting. The patterns are small and
# anchored — full PCRE features are not required.
regex = { workspace = true }
# Enable derive(Type) on every public daemon data struct so xtask can
# emit TypeScript bindings via `cargo xtask gen-types`. Production
# binaries omit this feature; specta isn't pulled into the daemon.
specta = { workspace = true, features = ["chrono", "serde_json"], optional = true }

[features]
unstable = ["ship-platform/unstable"]
specta = ["dep:specta", "deck/specta", "ship-artifacts/specta"]
# Compile the `example()` fixture constructors for the daemon-side wire
# shapes so `cargo xtask gen-fixtures` can serialize them to committed JSON.
# Forwards to ship-platform/fixtures so shared builders (e.g.
# `AgentSummary::example()`) are available to the daemon-side fixtures.
fixtures = ["ship-platform/fixtures"]

[dev-dependencies]
tempfile = { workspace = true }
ctor = "0.2"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde_json = { workspace = true }

[lints]
workspace = true
