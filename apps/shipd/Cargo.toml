[package]
name = "shipd"
version = "0.2.0"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
build-info = { path = "../../crates/build-info" }

[lib]
name = "shipd"
path = "src/lib.rs"

[[bin]]
name = "shipd"
path = "src/main.rs"

[dependencies]
agent-def = { path = "../../crates/core/ship-platform/crates/agent-def" }
ship-substrate = { path = "../../crates/core/ship-substrate" }
ship-platform = { path = "../../crates/core/ship-platform" }
ship-code = { path = "../../crates/core/ship-platform/crates/ship-code", features = ["harness-drivers"], optional = true }
ship-agents = { path = "../../crates/core/ship-platform/crates/ship-agents" }
ship-auth = { path = "../../crates/core/ship-platform/crates/ship-auth" }
ship-terminal = { path = "../../crates/core/ship-platform/crates/ship-terminal" }
ship-files = { path = "../../crates/core/ship-platform/crates/ship-files" }
ship-harnesses = { path = "../../crates/core/ship-platform/crates/ship-harnesses" }
ship-messaging = { path = "../../crates/core/ship-platform/crates/ship-messaging" }
ship-store = { path = "../../crates/core/ship-platform/crates/ship-store" }
ship-triggers = { path = "../../crates/core/ship-platform/crates/ship-triggers" }
ship-ui = { path = "../../crates/core/ship-platform/crates/ship-ui" }
ship-isolation = { path = "../../crates/core/ship-platform/crates/ship-isolation", default-features = false }
ship-substrate-host = { path = "../../crates/core/ship-substrate/crates/ship-substrate-host" }
ship-pipelines = { path = "../../crates/core/ship-substrate/crates/ship-pipelines" }
ship-pipeline-runtime = { path = "../../crates/ship-pipeline-runtime" }
# Dispatch composition root (supervisor split — `shipd::dispatch`):
#   ship-runner      — process/executor lifecycle emit helpers used by
#                      ShipdPlatform + orphan cleanup.
#   ship-auth-types  — DaemonSession + session-token mint in ShipdPlatform.
ship-runner = { path = "../../crates/core/ship-substrate/crates/ship-runner" }
ship-auth-types = { path = "../../crates/core/ship-substrate/crates/ship-auth-types" }
ship-types = { path = "../../crates/core/ship-substrate/crates/ship-types" }
ship-analytics = { path = "../../crates/core/ship-platform/crates/ship-analytics" }
ship-search = { path = "../../crates/core/ship-platform/crates/ship-search" }
ship-collection = { path = "../../crates/core/ship-platform/crates/ship-collection" }
ship-cloud = { path = "../../crates/core/ship-cloud" }
ship-git = { path = "../../crates/core/ship-git" }
ship-artifacts = { path = "../../crates/core/ship-platform/crates/ship-artifacts" }
ship-space = { path = "../../crates/core/ship-platform/crates/ship-space" }
ship-device = { path = "../../crates/core/ship-platform/crates/ship-device" }
ship-config = { path = "../../crates/core/ship-platform/crates/ship-config" }
ship-account = { path = "../../crates/core/ship-platform/crates/ship-account" }
compiler = { path = "../../crates/core/compiler" }
build-info = { path = "../../crates/build-info" }
ship-ops-rpc = { path = "../../crates/core/ship-ops-rpc" }
ship-reactive = { path = "../../crates/core/ship-platform/crates/ship-reactive" }
connectrpc = { version = "0.4", features = ["axum", "client"] }
# Descriptor decode for the op-policy gate (reads proto custom options).
buffa = "0.5"
buffa-descriptor = "0.5"
http = "1"
# deck* + sui-compiler crates live in the external sui repo post-carve.
# Path-dep smell: this build only works if sui is checked out at a
# specific local path. Replaced with version pins (0.1.0-dev) to draw
# attention to the smell — the build is broken on any machine until
# sui publishes these crates to a registry. See
# .artifacts/handoff-post-cleanup.md for the disposition.
# Once sui publishes, the version pin here tracks the consumed sui
# release; the path-dep version is recorded in git history for
# trace (commit 82909ba18 chore: phase 3 — carve deck+sui out).
# Relative (was absolute /home/madvib/...) so the path tracks the worktree —
# #61. Anchored at ~/dev (4x.. from apps/shipd) → resolves to Ship/sui from both
# the main checkout and an omp worktree (same depth under ~/dev).
deck = { path = "../../../../Ship/sui/crates/deck/deck", features = ["specta"] }
deck-core = { path = "../../../../Ship/sui/crates/deck/deck-core" }
deck-ssr = { path = "../../../../Ship/sui/crates/deck/deck-ssr", optional = true }
sui-compiler = { path = "../../../../Ship/sui/crates/sui/compiler" }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { workspace = true }
anyhow = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
# jemalloc global allocator — replaces the glibc malloc_trim(0) FFI the
# bundler was calling per build (crates/deck/deck-bundler/src/arena.rs,
# deleted as part of cut 4). jemalloc returns freed arenas to the OS
# by default; the trim-arenas workaround was a glibc-only band-aid
# for the bundler's transient module-graph allocations.
tikv-jemallocator = "0.6"
serde = { workspace = true }
base64 = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
# RFC 6902 JSON Patch — FilesService.patch_jsonc applies these against
# the current document. No shims; callers that want partial edits use
# this, callers that want full replace use write_jsonc/PUT.
json-patch = "4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-appender = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "ws", "multipart"] }
async-trait = { workspace = true }
async-stream = "0.3"
futures = "0.3"
notify = { workspace = true }
tower = { version = "0.5", features = ["timeout", "util"] }
# L1 floki agent runtime — shipd (L2) implements floki::Gateway via ShipdGateway.
# The floki crate gains no shipd dependency; this is the sole seam.
floki = { path = "../../crates/core/ship-platform/crates/floki" }
# Stage-2: durable-execution journal store and execute/resume API used directly
# by dispatch_floki_session to drive FlokiProgram durably.
durable-execution = { path = "../../crates/core/ship-substrate/crates/durable-execution" }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "timeout"] }
datastar = { version = "=0.3.1", features = ["axum"] }
jsonwebtoken = "9"
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
minijinja = { workspace = true, features = ["loader", "builtins", "json"] }
ulid = { workspace = true }
thiserror = { workspace = true }
# HTML sanitizer — allowlist-based DOM cleaner used for agent-supplied
# canvas HTML (see apps/shipd/src/views/sanitize.rs).
ammonia = "4"
form_urlencoded = "1"
git2 = { version = "0.19" }
include_dir = "0.7"
# JSON Schema validator (Draft 2020-12). Used to validate pipeline
# documents on write — catches structural errors beyond parse errors.
jsonschema = { version = "0.46", default-features = false }
# Regex used by the SFC pipeline (apps/shipd/src/views/sfc) for block
# splitting and signal-attribute rewriting. The patterns are small and
# anchored — full PCRE features are not required.
regex = { workspace = true }
# Enable derive(Type) on every public daemon data struct so xtask can
# emit TypeScript bindings via `cargo xtask gen-types`. Production
# binaries omit this feature; specta isn't pulled into the daemon.
specta = { workspace = true, features = ["chrono", "serde_json"], optional = true }

[features]
# Default feature set — normal daemon build with full harness machinery.
default = ["ship-code"]
# ship-code: harness-driver stack (dispatch, sessions, hooks, job routes).
# Turn off with --no-default-features to get a harness-free shipd build.
# Forwarded into ship-pipeline-runtime so the orchestrator (which depends on
# ship-code) is gated out of the harness-free build; the dispatch entry path
# (run_core::dispatch_one + loader::{pipeline_loader, git_helpers}) stays
# compiled without ship-code so the pipeline envelope can still be built and
# persisted.
ship-code = ["dep:ship-code", "harness-drivers", "ship-pipeline-runtime/ship-code"]
# harness-drivers: propagate down to ship-agents and ship-platform so their
# cfg gates align with shipd's ship-code gate. When ship-code is ON, both
# ship-agents and ship-platform get harness-drivers. With --no-default-features
# all three compile flag-off (ship-code is absent, harness-driver stack gone).
harness-drivers = ["ship-agents/harness-drivers", "ship-platform/harness-drivers"]
unstable = ["ship-platform/unstable"]
# ship-js-ssr: compile in deck-ssr (deno_core/V8) so the daemon can serve the
# synthetic ship-js SSR path. OFF by default — keeps V8 out of the normal build.
# Selected at runtime by DECK_SSR=ship-js; inert otherwise (render-eval serves).
ship-js-ssr = ["dep:deck-ssr"]
# G2 daemon RSS-soak regression gate (.artifacts/sui-arc/integrity/report.md §4).
# OFF by default so it never runs in `cargo test` / `just build`. The soak
# harness (`tests/rss_soak.rs`) drives the leak-prone substrate churn
# (actor_cursors / rate_counters / ReplayLog spawn-stop-emit cycles) and asserts
# the post-warmup RSS slope is ~flat. Those paths are themselves `unstable`-gated
# in the kernel router, so `soak` forwards to `unstable`.
#   cargo test -p shipd --features soak --test rss_soak -- --nocapture
soak = ["unstable"]
specta = ["dep:specta", "deck/specta", "ship-pipeline-runtime/specta"]
# Compile the `example()` fixture constructors for the daemon-side wire
# shapes so `cargo xtask gen-fixtures` can serialize them to committed JSON.
# Forwards to ship-platform/fixtures so shared builders (e.g.
# `AgentSummary::example()`) are available to the daemon-side fixtures.
fixtures = ["ship-platform/fixtures"]

[dev-dependencies]
tempfile = { workspace = true }
ctor = "0.2"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
chrono = { workspace = true }
# Structured Set-Cookie parsing in auth_tests (BT-08).
cookie = "0.18"
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde_json = { workspace = true }
# first-light smoke tests: mock model + mock event sink
rig = { version = "0.38.1", package = "rig-core", features = ["test-utils"] }
ship-kernel = { path = "../../crates/core/ship-substrate/crates/ship-kernel" }

[lints]
workspace = true
