<div id="pipelines-content">
  <div class="stats">
    <ship-stat accent="primary"><span slot="label">Definitions</span>2</ship-stat>
    <ship-stat accent="info"><span slot="label">Active</span>2</ship-stat>
    <ship-stat accent="success"><span slot="label">Completed</span>1</ship-stat>
    <ship-stat accent="destructive"><span slot="label">Failed</span>1</ship-stat>
    <ship-stat><span slot="label">Total runs</span>4</ship-stat>
  </div>

  <ship-tabs sticky data-attr-active="$tab" data-on-ship-tab-change="$tab = evt.detail.name">
    <ship-tab name="active" label="Active" count="2"></ship-tab>
    <ship-tab name="definitions" label="Definitions" count="2"></ship-tab>
    <ship-tab name="history" label="History" count="2"></ship-tab>

    <ship-tab-panel name="active"><div class="run-list"><ship-pipeline-run id="run-gate-wait" state="gatepending" slug="gate-wait" agent="coder"><ship-pipeline-dag><ship-pipeline-step name="impl" step-type="agent" state="completed" agent="coder"></ship-pipeline-step><span class="arrow">&rarr;</span><ship-pipeline-step name="gate" step-type="gate" state="running" agent="reviewer"></ship-pipeline-step></ship-pipeline-dag></ship-pipeline-run><ship-pipeline-run id="run-fix-bug" state="dispatched" slug="fix-bug" agent="coder"><ship-pipeline-dag><ship-pipeline-step name="impl" step-type="agent" state="running" agent="coder"></ship-pipeline-step><span class="arrow">&rarr;</span><ship-pipeline-step name="gate" step-type="gate" state="pending" agent="reviewer"></ship-pipeline-step></ship-pipeline-dag></ship-pipeline-run></div></ship-tab-panel>
    <ship-tab-panel name="definitions"><div class="def-grid"><ship-pipeline-definition name="tdd" steps="3" description="Test-driven dev loop"></ship-pipeline-definition><ship-pipeline-definition name="ship-it" steps="0" description=""></ship-pipeline-definition></div></ship-tab-panel>
    <ship-tab-panel name="history"><div class="history-wrap"><table class="history-table"><thead><tr>
<th>Slug</th><th>Pipeline</th><th>Status</th><th>Duration</th><th>Completed</th>
</tr></thead><tbody><ship-history-row state="failed">
<span slot="slug">regress</span>
<span slot="pipeline">2 steps</span>
<span slot="status"><ship-badge tone="destructive">failed</ship-badge></span>
<span slot="duration">0s</span>
<span slot="completed">2025-01-02 03:47</span>
</ship-history-row><ship-history-row state="completed">
<span slot="slug">feat-x</span>
<span slot="pipeline">2 steps</span>
<span slot="status"><ship-badge tone="success">completed</ship-badge></span>
<span slot="duration">0s</span>
<span slot="completed">2025-01-02 03:45</span>
</ship-history-row></tbody></table></div></ship-tab-panel>
  </ship-tabs>
</div>
