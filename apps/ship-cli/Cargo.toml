[package]
name = "ship-cli"
version = "0.2.0"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
build-info = { path = "../../crates/build-info" }

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
build-info = { path = "../../crates/build-info" }
clap = { workspace = true }
shipd = { path = "../shipd" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
stack-model = { path = "../../crates/core/stack-model" }
harness-adaptors = { path = "../../crates/core/harness-adaptors" }
ship-substrate = { path = "../../crates/core/ship-substrate" }
ship-platform = { path = "../../crates/core/ship-platform" }
ship-agents = { path = "../../crates/core/ship-platform/crates/ship-agents" }
ship-ops-rpc = { path = "../../crates/core/ship-ops-rpc" }
connectrpc = { version = "0.4", features = ["client"] }
http = "1"
ship-pipeline-runtime = { path = "../../crates/ship-pipeline-runtime" }
ship-types = { path = "../../crates/core/ship-substrate/crates/ship-types" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
home = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "blocking", "json"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
dhat = { version = "0.3", optional = true }

[features]
unstable = ["ship-platform/unstable", "shipd/unstable"]
# Heap profiling for the daemon-run process (#193 leak hunt). Off by default;
# build with `--features dhat-heap` to capture a dhat profile on graceful exit.
dhat-heap = ["dep:dhat"]

# ── cargo-deb (Linux .deb) ────────────────────────────────────────────────────
# Invoked by CI on tag push: `cargo deb -p ship-cli --no-build`.
# Bundles both `ship` and `shipd` binaries, plus the systemd user unit
# so `systemctl --user enable shipd` works out of the box.
[package.metadata.deb]
name = "ship"
maintainer = "Ship <hello@getship.dev>"
copyright = "2026, Ship contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """
Ship — agent configuration compiler. Installs the `ship` CLI and the
`shipd` background daemon; registers `shipd` as a systemd --user unit so
it starts on login. The post-install hook calls `ship daemon
install-service` in the invoking user's session; `ship uninstall`
removes the registration.
"""
section = "devel"
priority = "optional"
assets = [
    ["target/release/ship", "usr/bin/", "755"],
    ["target/release/shipd", "usr/bin/", "755"],
    ["../../packaging/shipd.service", "usr/lib/systemd/user/", "644"],
    ["../../packaging/launchers/linux/ship.desktop", "usr/share/applications/", "644"],
    ["../../packaging/launchers/linux/shipd-autostart.desktop", "etc/xdg/autostart/", "644"],
    ["../../packaging/installer-assets/ship-512.png", "usr/share/icons/hicolor/512x512/apps/ship.png", "644"],
    ["../../packaging/installer-assets/LICENSE-INSTALLER.txt", "usr/share/doc/ship/", "644"],
]
maintainer-scripts = "../../packaging/postinst/deb/"
# `postinst` → ship daemon install-service
# `prerm`    → ship daemon uninstall-service

# ── cargo-generate-rpm (Linux .rpm) ───────────────────────────────────────────
# Invoked by CI: `cargo generate-rpm -p ship-cli`.
[package.metadata.generate-rpm]
name = "ship"
summary = "Ship — agent configuration compiler"
license = "MIT"
assets = [
    { source = "target/release/ship", dest = "/usr/bin/ship", mode = "755" },
    { source = "target/release/shipd", dest = "/usr/bin/shipd", mode = "755" },
    { source = "packaging/shipd.service", dest = "/usr/lib/systemd/user/shipd.service", mode = "644" },
    { source = "packaging/launchers/linux/ship.desktop", dest = "/usr/share/applications/ship.desktop", mode = "644" },
    { source = "packaging/launchers/linux/shipd-autostart.desktop", dest = "/etc/xdg/autostart/shipd-autostart.desktop", mode = "644" },
    { source = "packaging/installer-assets/ship-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/ship.png", mode = "644" },
    { source = "packaging/installer-assets/LICENSE-INSTALLER.txt", dest = "/usr/share/doc/ship/LICENSE-INSTALLER.txt", mode = "644" },
    { source = "packaging/postinst/rpm-post.sh", dest = "/usr/share/doc/ship/rpm-post.sh", mode = "755" },
    { source = "packaging/postinst/rpm-preun.sh", dest = "/usr/share/doc/ship/rpm-preun.sh", mode = "755" },
]
post_install_script = """
#!/bin/sh
set -eu
/bin/sh /usr/share/doc/ship/rpm-post.sh || true
"""
pre_uninstall_script = """
#!/bin/sh
set -eu
/bin/sh /usr/share/doc/ship/rpm-preun.sh "$1" || true
"""

# The scriptlets above are tiny wrappers around the richer shell
# scripts we ship with the package — the RPM spec embeds them as
# strings but the real logic lives in packaging/postinst/rpm-*.sh and
# gets installed alongside the docs so admins can re-run it manually.

[dev-dependencies]
# Wave-1.1: ship-skill-vars dissolved into agent-def::skill_vars_store. The
# skill-vars KV round-trip in tests/registry_e2e.rs now uses agent-def directly.
agent-def = { path = "../../crates/core/ship-platform/crates/agent-def" }
tempfile = { workspace = true }
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
