[package]
name = "ship-cli"
version = "0.2.0"
edition = "2024"
publish = false
build = "build.rs"

[build-dependencies]
build-info = { path = "../../crates/build-info" }

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
build-info = { path = "../../crates/build-info" }
clap = { workspace = true }
shipd = { path = "../shipd" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
compiler = { path = "../../crates/core/ship-platform/crates/compiler" }
ship-substrate = { path = "../../crates/core/ship-substrate" }
ship-platform = { path = "../../crates/core/ship-platform" }
ship-isolation = { path = "../../crates/core/ship-isolation", default-features = false }
ship-ops-rpc = { path = "../../crates/core/ship-platform/crates/ship-ops-rpc" }
connectrpc = { version = "0.4", features = ["client"] }
http = "1"
ship-pipelines = { path = "../../crates/core/ship-substrate/crates/ship-pipelines" }
ship-types = { path = "../../crates/core/ship-substrate/crates/ship-types" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
home = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
ureq = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = [
    "client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest",
] }
reqwest = { workspace = true, features = ["rustls-tls", "blocking", "json"] }
sha2 = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
regex = { workspace = true }
ratatui = "0.29"
crossterm = "0.28"

[features]
unstable = ["ship-platform/unstable", "shipd/unstable"]

# ── cargo-deb (Linux .deb) ────────────────────────────────────────────────────
# Invoked by CI on tag push: `cargo deb -p ship-cli --no-build`.
# Bundles both `ship` and `shipd` binaries, plus the systemd user unit
# so `systemctl --user enable shipd` works out of the box.
[package.metadata.deb]
name = "ship"
maintainer = "Ship <hello@getship.dev>"
copyright = "2026, Ship contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """
Ship — agent configuration compiler. Installs the `ship` CLI and the
`shipd` background daemon; registers `shipd` as a systemd --user unit so
it starts on login. The post-install hook calls `ship daemon
install-service` in the invoking user's session; `ship uninstall`
removes the registration.
"""
section = "devel"
priority = "optional"
assets = [
    ["target/release/ship", "usr/bin/", "755"],
    ["target/release/shipd", "usr/bin/", "755"],
    ["../../contrib/shipd.service", "usr/lib/systemd/user/", "644"],
    ["../../contrib/launchers/linux/ship.desktop", "usr/share/applications/", "644"],
    ["../../contrib/launchers/linux/shipd-autostart.desktop", "etc/xdg/autostart/", "644"],
    ["../../contrib/installer-assets/ship-512.png", "usr/share/icons/hicolor/512x512/apps/ship.png", "644"],
    ["../../contrib/installer-assets/LICENSE-INSTALLER.txt", "usr/share/doc/ship/", "644"],
]
maintainer-scripts = "../../contrib/postinst/deb/"
# `postinst` → ship daemon install-service
# `prerm`    → ship daemon uninstall-service

# ── cargo-generate-rpm (Linux .rpm) ───────────────────────────────────────────
# Invoked by CI: `cargo generate-rpm -p ship-cli`.
[package.metadata.generate-rpm]
name = "ship"
summary = "Ship — agent configuration compiler"
license = "MIT"
assets = [
    { source = "target/release/ship", dest = "/usr/bin/ship", mode = "755" },
    { source = "target/release/shipd", dest = "/usr/bin/shipd", mode = "755" },
    { source = "contrib/shipd.service", dest = "/usr/lib/systemd/user/shipd.service", mode = "644" },
    { source = "contrib/launchers/linux/ship.desktop", dest = "/usr/share/applications/ship.desktop", mode = "644" },
    { source = "contrib/launchers/linux/shipd-autostart.desktop", dest = "/etc/xdg/autostart/shipd-autostart.desktop", mode = "644" },
    { source = "contrib/installer-assets/ship-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/ship.png", mode = "644" },
    { source = "contrib/installer-assets/LICENSE-INSTALLER.txt", dest = "/usr/share/doc/ship/LICENSE-INSTALLER.txt", mode = "644" },
    { source = "contrib/postinst/rpm-post.sh", dest = "/usr/share/doc/ship/rpm-post.sh", mode = "755" },
    { source = "contrib/postinst/rpm-preun.sh", dest = "/usr/share/doc/ship/rpm-preun.sh", mode = "755" },
]
post_install_script = """
#!/bin/sh
set -eu
/bin/sh /usr/share/doc/ship/rpm-post.sh || true
"""
pre_uninstall_script = """
#!/bin/sh
set -eu
/bin/sh /usr/share/doc/ship/rpm-preun.sh "$1" || true
"""

# The scriptlets above are tiny wrappers around the richer shell
# scripts we ship with the package — the RPM spec embeds them as
# strings but the real logic lives in contrib/postinst/rpm-*.sh and
# gets installed alongside the docs so admins can re-run it manually.

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = "2"
predicates = "3"
rmcp = { workspace = true, features = [
    "server", "transport-streamable-http-server",
] }
axum = { workspace = true, features = ["http1", "tokio"] }
tokio-util = { workspace = true, features = ["full"] }
schemars = "1"

[lints]
workspace = true
