[package]
name = "shipctl"
version = "0.1.0"
edition = "2024"
publish = false
description = "shipctl — operator/daemon management CLI. The 11 daemon verbs, doctor, and config; lives next to shipd, not the agent-facing ship-code."

[build-dependencies]
build-info = { path = "../../crates/build-info" }

[[bin]]
name = "shipctl"
path = "src/main.rs"

[dependencies]
build-info = { path = "../../crates/build-info" }
clap = { workspace = true }
shipd = { path = "../shipd" }
ship-platform = { path = "../../crates/core/ship-platform" }
ship-proto = { git = "https://github.com/get-ship/ship-contracts.git", branch = "feat/next" }
ship-substrate = { path = "../../crates/core/ship-substrate" }
ship-types = { path = "../../crates/core/ship-substrate/crates/ship-types" }
ship-agents = { path = "../../crates/core/ship-platform/crates/ship-agents" }
stack-model = { path = "../../crates/core/stack-model" }
connectrpc = { version = "0.4", features = ["client"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "blocking", "json"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
home = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
