<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #0f1115; color: #c9d1d9;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .frame {
      height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; letter-spacing: 0.02em; opacity: 0.72;
    }
  </style>
</head>
<body>
  <!--
    This document is the Tauri `frontendDist` payload for the Ship shell — a
    one-frame placeholder shown while the native `setup` callback discovers the
    daemon port and navigates the webview to `http://127.0.0.1:<port>/hub`
    (or `/space/<id>` for `--app=<id>` windows). The redirect fires before
    paint in the common case; this body is only seen if the daemon is slow to
    start, in which case the hub frontend will replace it as soon as the
    navigate resolves. There is no fallback / retry here on purpose — daemon
    lifecycle is the native shell's concern (see apps/shell/src-tauri/src/daemon.rs).
  -->
  <div class="frame">Connecting to daemon…</div>
</body>
</html>
