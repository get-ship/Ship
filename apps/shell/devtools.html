<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Shell — Component Gallery</title>
    <link rel="stylesheet" href="/vendor/tokens.css" />
    <link rel="stylesheet" href="/vendor/view-tokens.css" />
    <script type="module" src="/vendor/datastar.js"></script>
    <script type="module" src="/vendor/ship-elements.js"></script>
    <script>
      (() => {
        const saved = localStorage.getItem("ship-shell-theme");
        const prefers = matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = saved ? saved === "dark" : prefers;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>
      html, body { height: 100%; margin: 0; }
      * { box-sizing: border-box; }
      body {
        font-family: var(--font-body);
        background: var(--background);
        color: var(--foreground);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
      }
      header {
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        gap: 14px;
        align-items: center;
      }
      header .brand {
        font-family: var(--font-display);
        font-weight: var(--font-weight-semibold);
        font-size: var(--text-md);
        letter-spacing: -0.01em;
        color: var(--foreground);
      }
      header h1 {
        margin: 0;
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
        color: var(--muted-foreground);
      }
      header #count { color: var(--muted-foreground); font-size: var(--text-xs); }
      .spacer { flex: 1; }
      .icon-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted-foreground);
        padding: 5px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-family: inherit;
        font-size: var(--text-sm);
        text-decoration: none;
        transition: background var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out),
                    border-color var(--duration-fast) var(--ease-out);
      }
      .icon-btn:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
        border-color: color-mix(in oklch, var(--foreground) 20%, var(--border));
      }
      main { padding: 22px 28px 56px; max-width: 1600px; margin: 0 auto; }
      section.group { margin-bottom: 36px; }
      section.group > h2 {
        font-family: var(--font-display);
        font-size: var(--text-xs);
        font-weight: var(--font-weight-semibold);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted-foreground);
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
        margin: 0 0 14px;
      }
      .group-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 140px;
        transition:
          border-color var(--duration-fast) var(--ease-out),
          box-shadow var(--duration-fast) var(--ease-out);
      }
      .card:hover {
        border-color: color-mix(in oklch, var(--foreground) 18%, var(--border));
        box-shadow: var(--shadow-xs);
      }
      /* High-variance components span the full grid row so tone × variant
       * matrices get the breathing room they need. */
      .card-full { grid-column: 1 / -1; }
      .card-render {
        flex: 1;
        min-height: 88px;
        padding: 16px;
        background:
          linear-gradient(var(--background), var(--background)) padding-box,
          repeating-linear-gradient(
            45deg,
            color-mix(in oklch, var(--border) 26%, transparent) 0 1px,
            transparent 1px 10px
          );
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .card-full .card-render {
        padding: 16px;
        align-items: stretch;
        justify-content: flex-start;
      }
      .card-render > * { max-width: 100%; }
      /* Horizontal sample row — used inside card-render to flex + wrap
       * small bits without fighting the outer justify-content. */
      .sample-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        row-gap: 12px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .card:not(.card-full) .sample-row { justify-content: center; }
      .card-full .sample-row { width: 100%; }
      .sample-row-gap {
        flex-basis: 100%;
        height: 8px;
      }
      /* Fixed-column display for samples that benefit from a side-by-side
       * layout (empty-state variants, card treatments, spec-row statuses).
       * `flex: 1 1 auto` lets these grids take the full width of the
       * flex-parent `.card-render` — `width: 100%` alone is ignored
       * because flex items size to their content by default. */
      .sample-triptych,
      .sample-pair,
      .sample-quad {
        display: grid;
        gap: 16px;
        flex: 1 1 100%;
        width: 100%;
        min-width: 0;
      }
      .sample-triptych { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .sample-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sample-quad { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .sample-triptych > *,
      .sample-pair > *,
      .sample-quad > * { min-width: 0; }
      /* tone × variant matrix grid — one tone per row, one variant per
       * column, with micro-labels on the leading edge and header row.
       * Controlled by data-cols = variants + 1 (label column). */
      .sample-matrix {
        display: grid;
        grid-template-columns: auto repeat(calc(var(--cols) - 1), minmax(0, 1fr));
        gap: 10px 14px;
        width: 100%;
        align-items: center;
      }
      .sample-matrix[data-cols='5'] { --cols: 5; }
      .sample-matrix[data-cols='4'] { --cols: 4; }
      .sample-matrix[data-cols='3'] { --cols: 3; }
      .sample-matrix .matrix-h {
        font-size: 10px;
        font-weight: var(--font-weight-semibold);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted-foreground);
        text-align: center;
      }
      .sample-matrix > .matrix-h:nth-child(n+2):nth-child(-n + var(--cols)) {
        padding-bottom: 2px;
        border-bottom: 1px solid var(--border);
      }
      .sample-matrix > ship-button,
      .sample-matrix > ship-badge,
      .sample-matrix > ship-chip {
        justify-self: center;
      }
      /* Inline "toast container" wrapper so the ship-toast stack renders
       * naturally inside a card without the portal. Mirrors the spacing
       * the live container provides at rest. */
      .toast-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1 1 100%;
        width: 100%;
        max-width: 440px;
        min-width: 0;
      }
      .toast-stack ship-toast {
        width: 100%;
        max-width: none;
        --toast-max-w: 100%;
        --toast-min-w: 0;
      }
      /* Trigger cards (overlay placeholders) center the button. */
      .card-trigger {
        gap: 10px;
      }
      .card-meta {
        border-top: 1px solid var(--border);
        padding: 8px 12px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: var(--text-xs);
        background: color-mix(in oklch, var(--muted) 22%, transparent);
      }
      .card-tag {
        color: var(--primary);
        font-weight: var(--font-weight-medium);
        flex-shrink: 0;
      }
      .card-props {
        color: var(--muted-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }
      .card-error {
        color: var(--destructive);
        font-size: var(--text-xs);
        font-family: var(--font-mono, ui-monospace, monospace);
      }
      /* The pipeline DAG arrow separator is a plain span we emit around
       * <ship-pipeline-step> children; mirror the .arrow slotted style. */
      .card-render .arrow {
        display: inline-flex;
        align-items: center;
        padding: 0 6px;
        color: var(--border);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Ship</span>
      <h1>Component Gallery</h1>
      <small id="count">loading…</small>
      <span class="spacer"></span>
      <a class="icon-btn" href="/" title="Back to shell">← shell</a>
      <button class="icon-btn" id="toggle-theme" title="Toggle theme">◐</button>
    </header>
    <main id="gallery"></main>
    <script type="module" src="/src/devtools/main.ts"></script>
    <script type="module">
      const btn = document.getElementById("toggle-theme");
      btn?.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("ship-shell-theme", isDark ? "dark" : "light");
      });
    </script>
  </body>
</html>
