<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ship</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/ship-logo.svg" />

  <!-- Ship typeface stack: Syne (display/headings), DM Sans (body),
       JetBrains Mono (mono). The token layer (tokens.css) references these
       families by name; without loading them the shell fell back to system
       fonts after the SUI transition. Matches apps/site's font loading. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap" />

  <!-- Daemon operating mode. Static default is `development` (Vite dev
       server can't know what shipd is doing). When shipd serves this
       HTML directly in production it rewrites the content to
       `production` via deck::inject_mode_meta. main.ts reads it
       into window.__shipMode and the status bar's [mode] attribute. -->
  <meta name="ship-mode" content="development" />

  <!-- view-tokens.css is daemon-served and its origin is only known at runtime
       (the discovered loopback port in the proxy-less Tauri webview; same-origin
       under vite). main.ts injects the <link> against `daemonBase()` so the one
       code path works in both. Kept off the static document precisely because a
       root-absolute `/api/...` href resolves to the webview origin (tauri://) in
       prod, not the daemon — there is no proxy. -->
  <link rel="stylesheet" href="/src/chrome/layout.css" />

  <!-- Lucide icons are served per-icon by the daemon at
       `/_sui/icons/<name>.svg`. The browser HTTP-caches each one; on
       first paint the shell mounts six rail icons (dashboard, pipelines,
       bot, git-branch, sparkles, palette, play) — small enough that the
       per-icon fetch races the bundle load. Prefetch the six explicitly
       so they're warm by the time <sui-icon> mounts. -->
  <link rel="prefetch" href="/_sui/icons/layout-dashboard.svg" as="image" />
  <link rel="prefetch" href="/_sui/icons/workflow.svg" as="image" />
  <link rel="prefetch" href="/_sui/icons/bot.svg" as="image" />
  <link rel="prefetch" href="/_sui/icons/git-branch.svg" as="image" />
  <link rel="prefetch" href="/_sui/icons/sparkles.svg" as="image" />
  <link rel="prefetch" href="/_sui/icons/palette.svg" as="image" />

  <!-- Pre-paint theme: read persisted theme before first paint to prevent FOUC. -->
  <script>
    try {
      var _t = localStorage.getItem('ship-site-theme')
      if (_t) document.documentElement.setAttribute('data-theme', _t)
    } catch (_e) {}
  </script>

  <!-- Importmap MUST come before any module script — browsers freeze it
       at first module fetch. The bundle/runtime IIFEs below inject module
       scripts early, so the importmap lives at the very top to win the race. -->
  <script type="importmap">
    {
      "imports": {
        "@ship/sui-runtime":                "/_sui/runtime.js",
        "@ship/sui-runtime/route":          "/_sui/runtime.js",
        "@ship/sui-runtime/template-hooks": "/_sui/runtime.js",
        "@ship/sui-runtime/patch":          "/_sui/runtime.js",
        "@ship/sui-dom":                    "/_sui/dom.js",
        "@ship/sdk-client":                 "/_sui/sdk-client.js"
      }
    }
  </script>

  <!-- Components + chrome registration — both are side-effect imports
       that call `customElements.define()` for every tag they ship.
       Loaded via runtime IIFE so Vite's import-analysis doesn't try
       to resolve them as local modules.
         • /_sui/components.js  — @ship/ui-components umbrella
           (domain components: git-diff, pipeline-*, log-stream,
           provider-blob, auth-dialog, graph-canvas; primitives
           transitively via @ship/sui-primitives).
         • /_sui/sui-chrome.js  — apps/shell chrome aggregate
           (non-separate chrome: shell-top, shell-bottom, blank-
           canvas, view-picker, theme-picker, status-bar, brand-mark,
           view-chrome, edit-overlay, edit-mode-pill, annotation-*).
         • /_sui/sui-components/<tag>.js — heavy chrome that opts
           into its own separate bundle via `<bundle separate />`
           (launcher, panel-dock, command-bar, devtools, account-
           menu). The rail + nav-top live in this list for code
           paths that still mount them (Studio's internal rail),
           but the shell itself no longer paints them on first
           load. -->
  <script>
    (function () {
      var bundles = [
        '/_sui/components.js',
        '/_sui/sui-components/sui-chrome.js',
        '/_sui/sui-components/sui-nav-top.js',
        '/_sui/sui-components/sui-launcher.js',
        '/_sui/sui-components/sui-panel-dock.js',
        '/_sui/sui-components/sui-command-bar.js',
        '/_sui/sui-components/sui-devtools.js',
        '/_sui/sui-components/sui-account-menu.js',
        '/_sui/sui-components/sui-project-switcher.js',
      ];
      bundles.forEach(function (src) {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = src;
        document.head.appendChild(s);
      });
    })();
  </script>

  <!-- Bootstrap @ship/sui-runtime onto window before main.ts runs. The
       IIFE-injected script is opaque to Vite's import-analysis (which
       would otherwise rewrite the bare specifier or append `?import`,
       creating a SECOND runtime instance separate from the one compiled
       view modules import). The browser's importmap resolves the bare
       specifier to /_sui/runtime.js — same URL view modules use — so
       all SUI code shares ONE runtime universe.

       `window.__suiRuntimeReady` is the gate main.ts awaits before
       calling mount(). Same pattern as apps/shell. -->
  <script>
    (function () {
      window.__suiRuntimeReady = new Promise(function (res) {
        var s = document.createElement('script');
        s.type = 'module';
        s.textContent =
          "import * as r from '@ship/sui-runtime'; window.__suiRuntime = r; window.dispatchEvent(new Event('sui-runtime-ready'));";
        document.head.appendChild(s);
        window.addEventListener('sui-runtime-ready', function () { res(window.__suiRuntime); }, { once: true });
      });
    })();
  </script>
</head>
<body>
  <div id="ship-app">
    <!-- Top bar: brand · breadcrumbs · view actions · command-bar ·
         theme picker · account · dock/fullscreen. The wired nav-top
         hosts the real command-bar in its `command-bar` slot. -->
    <sui-nav-top id="ship-nav-top">
      <sui-command-bar slot="command-bar" id="ship-command-bar"></sui-command-bar>
    </sui-nav-top>

    <!-- Main canvas: view mounts here. Empty by default — shell paints
         <sui-blank-canvas> when no route is active. -->
    <main id="ship-content" class="ship-content"></main>

    <!-- Bottom panel dock: terminal + devtools tabs. Floats above the
         bottom strip when open; collapsed otherwise. -->
    <sui-panel-dock id="ship-panel-dock" active-tab="terminal">
      <!-- slot="terminal" left empty — terminal loads as island bundle on demand -->
      <sui-devtools-source slot="source"></sui-devtools-source>
      <sui-devtools-signals slot="signals"></sui-devtools-signals>
      <sui-devtools-schema slot="schema"></sui-devtools-schema>
      <sui-devtools-components slot="components"></sui-devtools-components>
    </sui-panel-dock>

    <!-- Bottom strip: connection · branch · workspace · tools · theme · version · mode -->
    <sui-shell-bottom id="ship-shell-bottom" branch="" workspace="" theme="" version=""></sui-shell-bottom>
  </div>

  <!-- App launcher: floating panel, opened via sui:launcher:open event or the [open] attribute -->
  <sui-launcher id="ship-launcher"></sui-launcher>

  <sui-toast-container position="bottom-right" id="sui-toast-container"></sui-toast-container>

  <sui-edit-overlay id="sui-edit-overlay"></sui-edit-overlay>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
