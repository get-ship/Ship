<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      // Load daemon-served core assets dynamically (avoids Vite pre-transform
      // errors). Only core runtime + element registry load here — heavy
      // island bundles (code editor, markdown editor, terminal) arrive per
      // view via the `packs:` declaration in each view's manifest. The
      // daemon injects `<script type="module" src=...>` tags for the
      // declared packs; mount.ts rehydrates them after innerHTML assignment
      // so fragment navigation still fires the module loads.
      (function() {
        var base = '/api/runtime/assets/';
        var css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = base + 'view-tokens.css';
        document.head.appendChild(css);
        ['datastar.js','ship-elements.js'].forEach(function(f) {
          var s = document.createElement('script');
          s.type = 'module'; s.src = base + f;
          document.head.appendChild(s);
        });
      })();
    </script>
    <script>
      // Theme + mode boot — sync before first paint.
      (() => {
        const saved = localStorage.getItem("ship-shell-theme");
        const prefers = matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = saved === "dark" || (!saved && prefers);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>
      /* ── Reset ── */
      html, body { height: 100%; margin: 0; }
      * { box-sizing: border-box; }

      /* ── Shell: content-first layout ──
         Top bar (32px) + full-bleed content + status bar (24px).
         Panels toggle in from edges — nothing visible by default. */
      body {
        font-family: var(--font-body);
        background: var(--background);
        color: var(--foreground);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: auto 1fr auto;
        min-height: 100vh;
        overflow: hidden;
      }

      /* ── Top bar: slim, one line ── */
      .ship-topbar {
        grid-column: 1 / -1;
        height: 36px;
        padding: 0 var(--space-3);
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        align-items: center;
        gap: var(--space-2);
        user-select: none;
        -webkit-app-region: drag; /* draggable in Tauri/Electron */
      }
      .ship-topbar .brand {
        display: flex;
        align-items: center;
        margin-right: var(--space-1);
        -webkit-app-region: no-drag;
        text-decoration: none;
      }
      .brand-logo { height: 18px; width: auto; }
      .dark-only { display: none; }
      .dark .light-only { display: none; }
      .dark .dark-only { display: block; }
      .ship-topbar .sep {
        width: 1px;
        height: 16px;
        background: var(--border);
      }
      /* Breadcrumb area */
      .ship-topbar .crumbs {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-sm);
        color: var(--muted-foreground);
        min-width: 0;
        overflow: hidden;
      }
      .ship-topbar .crumbs a {
        color: var(--muted-foreground);
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }
      .ship-topbar .crumbs a:hover { color: var(--foreground); }
      .ship-topbar .crumbs .current {
        color: var(--foreground);
        font-weight: var(--font-weight-medium);
      }
      .ship-topbar .crumbs .chevron {
        color: var(--border);
        font-size: var(--text-xs);
      }
      .ship-topbar .spacer { flex: 1; }
      /* Top bar buttons — no drag region */
      .ship-topbar ship-button,
      .ship-topbar button,
      .ship-topbar a { -webkit-app-region: no-drag; }
      /* Command palette trigger */
      .ship-topbar .cmdk-trigger {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--background);
        color: var(--muted-foreground);
        font-size: var(--text-xs);
        cursor: pointer;
        transition: border-color var(--duration-fast) var(--ease-out);
        min-width: 180px;
      }
      .ship-topbar .cmdk-trigger:hover {
        border-color: color-mix(in oklch, var(--foreground) 30%, var(--border));
      }
      .ship-topbar .cmdk-trigger kbd {
        font-family: var(--font-mono);
        font-size: 10px;
        padding: 1px 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--muted);
        color: var(--muted-foreground);
        margin-left: auto;
      }

      /* ── Nav rail: toggleable, left edge ── */
      .ship-rail {
        grid-row: 2;
        width: 0;
        overflow: hidden;
        background: var(--sidebar);
        border-right: none;
        transition: width var(--duration-normal) var(--ease-out);
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        padding: 0;
      }
      body.rail-open .ship-rail {
        width: 48px;
        border-right: 1px solid var(--border);
        padding: var(--space-2) 0;
        overflow-y: auto;
      }
      .ship-rail a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 36px;
        color: var(--muted-foreground);
        text-decoration: none;
        border-radius: 0;
        transition: background var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
        position: relative;
      }
      .ship-rail a:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
      }
      .ship-rail a.active {
        color: var(--primary);
        background: color-mix(in oklch, var(--primary) 10%, transparent);
      }
      .ship-rail a.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--primary);
        border-radius: 0 2px 2px 0;
      }
      .ship-rail .rail-spacer { flex: 1; }

      /* ── Main content: full bleed ── */
      .ship-content {
        grid-row: 2;
        overflow: auto;
        background: var(--background);
        min-width: 0;
      }

      /* ── Right drawer: chat panel ── */
      .ship-drawer {
        grid-row: 2;
        width: 0;
        overflow: hidden;
        background: var(--sidebar);
        border-left: none;
        transition: width var(--duration-normal) var(--ease-out);
      }
      body.drawer-open .ship-drawer {
        width: 360px;
        border-left: 1px solid var(--border);
        overflow: auto;
      }
      .ship-drawer style { display: none !important; }

      /* ── Bottom terminal panel: toggleable ── */
      .ship-terminal-panel {
        grid-column: 1 / -1;
        height: 0;
        overflow: hidden;
        background: var(--background);
        border-top: none;
        transition: height var(--duration-normal) var(--ease-out);
      }
      body.terminal-open .ship-terminal-panel {
        height: 240px;
        border-top: 1px solid var(--border);
        overflow: auto;
      }
      .ship-terminal-panel .panel-header {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        font-weight: var(--font-weight-medium);
      }
      .ship-terminal-panel .panel-body {
        height: calc(100% - 28px);
      }

      /* ── Status bar: hairline bottom ── */
      .ship-statusbar {
        grid-column: 1 / -1;
        height: 24px;
        padding: 0 var(--space-3);
        border-top: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        align-items: center;
        gap: var(--space-3);
        font-size: 11px;
        color: var(--muted-foreground);
        user-select: none;
      }
      .ship-statusbar .status-dot {
        width: 6px;
        height: 6px;
        border-radius: var(--radius-full);
        background: var(--success);
        flex-shrink: 0;
      }
      .ship-statusbar .status-dot.disconnected { background: var(--destructive); }
      .ship-statusbar .spacer { flex: 1; }

      /* ── Utility ── */
      .mount-error {
        margin: var(--space-5);
        padding: var(--space-3) var(--space-4);
        border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border));
        background: color-mix(in oklch, var(--destructive) 8%, transparent);
        color: var(--destructive);
        border-radius: var(--radius-md);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        white-space: pre-wrap;
      }
      .empty-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--muted-foreground);
        font-size: var(--text-sm);
      }
    </style>
  </head>
  <body>
    <!-- Top bar: brand, breadcrumbs, ⌘K, user -->
    <div class="ship-topbar">
      <a class="brand" id="topbar-brand" href="/" title="Ship home">
        <img src="/ship-logo.svg" alt="Ship" height="18" class="brand-logo light-only" />
        <img src="/ship-logo-secondary.svg" alt="Ship" height="18" class="brand-logo dark-only" />
      </a>
      <div class="sep"></div>
      <div class="crumbs" id="breadcrumbs">
        <span class="current">dashboard</span>
      </div>
      <span class="spacer"></span>
      <button class="cmdk-trigger" id="cmdk-open" title="Command palette">
        <ship-icon name="search" size="sm"></ship-icon>
        <span>Search or jump to...</span>
        <kbd>⌘K</kbd>
      </button>
      <ship-button variant="ghost" size="sm" id="toggle-rail" title="Toggle navigation (⌘B)" aria-label="Toggle navigation">
        <ship-icon slot="leading" name="menu"></ship-icon>
      </ship-button>
      <ship-button variant="ghost" size="sm" id="toggle-theme" title="Toggle theme" aria-label="Toggle theme">
        <ship-icon slot="leading" name="moon"></ship-icon>
      </ship-button>
      <ship-button variant="ghost" size="sm" id="toggle-fullscreen" title="Fullscreen (F11)" aria-label="Toggle fullscreen">
        <ship-icon slot="leading" name="maximize"></ship-icon>
      </ship-button>
      <ship-button variant="ghost" size="sm" id="toggle-drawer" title="Chat (⌘/)" aria-label="Toggle chat drawer">
        <ship-icon slot="leading" name="message-square-plus"></ship-icon>
      </ship-button>
    </div>

    <!-- Left rail: icon navigation (hidden by default) -->
    <nav class="ship-rail" id="ship-rail">
      <a data-route="/dashboard" title="Dashboard"><ship-icon name="sparkles"></ship-icon></a>
      <a data-route="/pipelines" title="Pipelines"><ship-icon name="play"></ship-icon></a>
      <a data-route="/agents" title="Agents"><ship-icon name="users"></ship-icon></a>
      <a data-route="/skills" title="Skills"><ship-icon name="zap"></ship-icon></a>
      <a data-route="/git" title="Git"><ship-icon name="git"></ship-icon></a>
      <a data-route="/data" title="Data"><ship-icon name="folder"></ship-icon></a>
      <a data-route="/canvas" title="Canvas"><ship-icon name="image"></ship-icon></a>
      <a data-route="/overview" title="Overview"><ship-icon name="git"></ship-icon></a>
      <a data-route="/events" title="Events"><ship-icon name="sparkles"></ship-icon></a>
      <div class="rail-spacer"></div>
      <a data-route="/settings" title="Settings"><ship-icon name="settings"></ship-icon></a>
    </nav>

    <!-- Main content: full bleed -->
    <main class="ship-content" id="ship-view-root">
      <div class="empty-hint">loading…</div>
    </main>

    <!-- Right drawer: chat -->
    <aside class="ship-drawer" id="drawer">
      <div id="drawer-content"><div class="empty-hint">chat</div></div>
    </aside>

    <!-- Bottom terminal panel (hidden by default) -->
    <div class="ship-terminal-panel" id="terminal-panel">
      <div class="panel-header">
        <ship-icon name="terminal" size="sm"></ship-icon>
        <span>Terminal</span>
        <span class="spacer" style="flex:1"></span>
        <ship-button variant="ghost" size="sm" id="close-terminal" aria-label="Close terminal">
          <ship-icon slot="leading" name="x"></ship-icon>
        </ship-button>
      </div>
      <div class="panel-body">
        <ship-terminal id="shell-terminal" fit readonly></ship-terminal>
      </div>
    </div>

    <!-- Status bar -->
    <div class="ship-statusbar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-branch">main</span>
      <span>·</span>
      <span id="status-agents">0 agents</span>
      <span class="spacer"></span>
      <span id="status-theme">ship</span>
    </div>

    <!-- Toast container -->
    <ship-toast-container position="bottom-right" id="ship-toasts"></ship-toast-container>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
