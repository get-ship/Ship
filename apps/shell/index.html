<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Shell</title>
    <link rel="stylesheet" href="/vendor/tokens.css" />
    <link rel="stylesheet" href="/vendor/view-tokens.css" />
    <script type="module" src="/vendor/datastar.js"></script>
    <script type="module" src="/vendor/ship-elements.js"></script>
    <script>
      // Theme boot — sync before paint to avoid a light-flash.
      (() => {
        const saved = localStorage.getItem("ship-shell-theme");
        const prefers = matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = saved ? saved === "dark" : prefers;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>
      html, body { height: 100%; margin: 0; }
      * { box-sizing: border-box; }
      body {
        font-family: var(--font-body);
        background: var(--background);
        color: var(--foreground);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: 1fr auto;
        min-height: 100vh;
      }
      header {
        grid-column: 1 / 3;
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        gap: 14px;
        align-items: center;
      }
      header .brand {
        font-family: var(--font-display);
        font-weight: var(--font-weight-semibold);
        font-size: var(--text-md);
        letter-spacing: -0.01em;
        color: var(--foreground);
        margin-right: 8px;
      }
      header nav { display: flex; gap: 2px; }
      header nav a {
        text-decoration: none;
        color: var(--muted-foreground);
        cursor: pointer;
        padding: 6px 10px;
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
        transition: background var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
      }
      header nav a:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
      }
      header nav a.active {
        background: color-mix(in oklch, var(--primary) 12%, transparent);
        color: var(--primary);
      }
      .spacer { flex: 1; }
      .icon-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted-foreground);
        padding: 5px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-family: inherit;
        font-size: var(--text-sm);
        transition: background var(--duration-fast) var(--ease-out),
                    border-color var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
      }
      .icon-btn:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
        border-color: color-mix(in oklch, var(--foreground) 20%, var(--border));
      }
      main {
        overflow: auto;
        padding: 0;
        background: var(--background);
      }
      aside#drawer {
        width: 340px;
        border-left: 1px solid var(--border);
        background: var(--sidebar);
        display: none;
        overflow: auto;
      }
      body.drawer-open aside#drawer { display: block; }
      .mount-error {
        margin: 20px;
        padding: 14px 16px;
        border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border));
        background: color-mix(in oklch, var(--destructive) 8%, transparent);
        color: var(--destructive);
        border-radius: var(--radius-md);
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: var(--text-sm);
        white-space: pre-wrap;
      }
      .empty-hint {
        margin: 40px auto;
        max-width: 32rem;
        text-align: center;
        color: var(--muted-foreground);
        font-size: var(--text-sm);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Ship</span>
      <nav>
        <a data-route="/pipelines">pipelines</a>
        <a data-route="/specs">specs</a>
        <a data-route="/git">git</a>
        <a data-route="/settings">settings</a>
        <a data-route="/agents">agents</a>
        <a data-route="/skills">skills</a>
        <a data-route="/chat">chat</a>
        <a data-route="/events">events</a>
      </nav>
      <span class="spacer"></span>
      <a class="icon-btn" href="/devtools.html" title="Component gallery" style="text-decoration: none;">gallery</a>
      <button class="icon-btn" id="toggle-theme" title="Toggle theme">◐</button>
      <button class="icon-btn" id="toggle-drawer" title="Toggle drawer">☰</button>
    </header>
    <main id="view">
      <div class="empty-hint">loading…</div>
    </main>
    <aside id="drawer"><div id="drawer-content"><div class="empty-hint">drawer empty</div></div></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
