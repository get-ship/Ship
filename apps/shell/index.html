<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Shell</title>
    <script>
      // Load daemon-served assets dynamically so Vite doesn't try to pre-transform them.
      (function() {
        var base = '/api/runtime/assets/';
        var css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = base + 'view-tokens.css';
        document.head.appendChild(css);
        ['datastar.js','ship-elements.js','ship-code-editor.js','ship-markdown-editor.js','ship-terminal.js'].forEach(function(f) {
          var s = document.createElement('script');
          s.type = 'module'; s.src = base + f;
          document.head.appendChild(s);
        });
      })();
    </script>
    <script>
      // Theme boot — sync before paint to avoid a light-flash.
      (() => {
        const saved = localStorage.getItem("ship-shell-theme");
        const prefers = matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = saved ? saved === "dark" : prefers;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>
      /* ── Reset ── */
      html, body { height: 100%; margin: 0; }
      * { box-sizing: border-box; }

      /* ── Shell layout ── */
      body {
        font-family: var(--font-body);
        background: var(--background);
        color: var(--foreground);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: 1fr auto;
        min-height: 100vh;
      }

      /* ── Header chrome ── */
      header {
        grid-column: 1 / -1;
        padding: var(--space-2) var(--space-5);
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        gap: var(--space-3);
        align-items: center;
      }
      header .brand {
        font-family: var(--font-display);
        font-weight: var(--font-weight-semibold);
        font-size: var(--text-md);
        letter-spacing: -0.01em;
        color: var(--foreground);
        margin-right: var(--space-2);
      }
      header nav { display: flex; gap: 2px; }
      header nav a {
        text-decoration: none;
        color: var(--muted-foreground);
        cursor: pointer;
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
        transition: background var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
      }
      header nav a:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
      }
      header nav a.active {
        background: color-mix(in oklch, var(--primary) 12%, transparent);
        color: var(--primary);
      }
      .spacer { flex: 1; }

      /* ── Gallery link ── */
      .icon-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted-foreground);
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-family: inherit;
        font-size: var(--text-sm);
        transition: background var(--duration-fast) var(--ease-out),
                    border-color var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
      }
      .icon-btn:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
        border-color: color-mix(in oklch, var(--foreground) 20%, var(--border));
      }

      /* ── Main content area ── */
      main {
        overflow: auto;
        padding: 0;
        background: var(--background);
        min-width: 0;
      }

      /* ── Drawer ── */
      aside#drawer {
        width: 0;
        border-left: none;
        background: var(--sidebar);
        overflow: hidden;
        transition: width var(--duration-normal) var(--ease-out);
      }
      body.drawer-open aside#drawer {
        width: 340px;
        border-left: 1px solid var(--border);
        overflow: auto;
      }
      .mount-error {
        margin: 20px;
        padding: 14px 16px;
        border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border));
        background: color-mix(in oklch, var(--destructive) 8%, transparent);
        color: var(--destructive);
        border-radius: var(--radius-md);
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: var(--text-sm);
        white-space: pre-wrap;
      }
      .empty-hint {
        margin: 40px auto;
        max-width: 32rem;
        text-align: center;
        color: var(--muted-foreground);
        font-size: var(--text-sm);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Ship</span>
      <nav>
        <a data-route="/dashboard">dashboard</a>
        <a data-route="/pipelines">pipelines</a>
        <a data-route="/agents">agents</a>
        <a data-route="/skills">skills</a>
        <a data-route="/git">git</a>
        <a data-route="/data">data</a>
        <a data-route="/canvas">canvas</a>
        <a data-route="/settings">settings</a>
        <a data-route="/events">events</a>
      </nav>
      <span class="spacer"></span>
      <a class="icon-btn" href="/devtools.html" title="Component gallery" style="text-decoration: none;">gallery</a>
      <ship-button variant="ghost" size="sm" id="toggle-theme" title="Toggle theme" aria-label="Toggle theme"><ship-icon slot="leading" name="moon"></ship-icon></ship-button>
      <ship-button variant="ghost" size="sm" id="toggle-drawer" title="Toggle drawer" aria-label="Toggle drawer"><ship-icon slot="leading" name="menu"></ship-icon></ship-button>
    </header>
    <main id="ship-view-root">
      <div class="empty-hint">loading…</div>
    </main>
    <aside id="drawer"><div id="drawer-content"><div class="empty-hint">drawer empty</div></div></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
