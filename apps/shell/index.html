<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Shell POC</title>
    <link rel="stylesheet" href="/vendor/view-tokens.css" />
    <!-- Shell-owned dependencies. Loaded once at boot, never per-fragment. -->
    <script type="module" src="/vendor/datastar.js"></script>
    <script type="module" src="/vendor/ship-elements.js"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: 1fr auto;
        min-height: 100vh;
      }
      header {
        grid-column: 1 / 3;
        padding: 12px 20px;
        border-bottom: 1px solid #ddd;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      header a { text-decoration: none; color: #0366d6; cursor: pointer; }
      header a.active { font-weight: 600; color: #000; }
      main { padding: 20px; overflow: auto; }
      aside#drawer {
        width: 320px;
        border-left: 1px solid #ddd;
        padding: 16px;
        background: #fafafa;
        display: none;
      }
      body.drawer-open aside#drawer { display: block; }
      .spacer { flex: 1; }
      button { padding: 6px 12px; }
      pre { background: #f5f5f5; padding: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>Ship Shell POC</strong>
      <a data-route="/">agents</a>
      <a data-route="/pipelines">pipelines</a>
      <a data-route="/chat">chat</a>
      <a data-route="/events">events</a>
      <span class="spacer"></span>
      <button id="toggle-drawer">toggle drawer</button>
    </header>
    <main id="view"></main>
    <aside id="drawer"><div id="drawer-content">loading…</div></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
