<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      // Load daemon-served core assets dynamically (avoids Vite pre-transform
      // errors). Only core runtime + element registry load here — heavy
      // island bundles (code editor, markdown editor, terminal) arrive per
      // view via the `packs:` declaration in each view's manifest. The
      // daemon injects `<script type="module" src=...>` tags for the
      // declared packs; mount.ts rehydrates them after innerHTML assignment
      // so fragment navigation still fires the module loads.
      (function() {
        var base = '/api/assets/';
        var css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = base + 'view-tokens.css';
        document.head.appendChild(css);
        ['datastar.js','ship-elements.js'].forEach(function(f) {
          var s = document.createElement('script');
          s.type = 'module'; s.src = base + f;
          document.head.appendChild(s);
        });
      })();
    </script>
    <script>
      // Theme boot — sync before first paint to avoid flash-of-wrong-theme.
      // Applies the persisted ship-set theme id (data-theme + .dark class).
      // Must stay in sync with @ship/set/themes → persistTheme / applyTheme.
      (() => {
        const VALID = new Set(["ship-light","ship-dark","paper","halo","console","contrast"]);
        const DARK = new Set(["ship-dark","contrast"]);
        const PREFERS_DARK = matchMedia("(prefers-color-scheme: dark)").matches;
        const raw = localStorage.getItem("ship-site-theme");
        const id = VALID.has(raw) ? raw : (PREFERS_DARK ? "ship-dark" : "ship-light");
        document.documentElement.dataset.theme = id;
        document.documentElement.classList.toggle("dark", DARK.has(id));
      })();
    </script>
    <style>
      /* ── Reset ── */
      html, body { height: 100%; margin: 0; }
      * { box-sizing: border-box; }

      /* ── Global scrollbar: thin, tokenized, reveal-on-hover ──
         Replaces platform scrollbars which read as chrome on panel-heavy
         layouts (3-panel git, agents detail, skills explorer). Firefox
         uses scrollbar-*; WebKit/Blink use ::-webkit-scrollbar. Track
         stays invisible; thumb fades in on hover. */
      * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
      *:hover { scrollbar-color: color-mix(in oklab, var(--foreground) 22%, transparent) transparent; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
        transition: background-color 160ms var(--ease-out, ease-out);
      }
      *:hover::-webkit-scrollbar-thumb {
        background-color: color-mix(in oklab, var(--foreground) 22%, transparent);
      }
      *::-webkit-scrollbar-thumb:hover {
        background-color: color-mix(in oklab, var(--foreground) 38%, transparent);
      }
      *::-webkit-scrollbar-corner { background: transparent; }

      /* ── Shell: content-first layout ──
         Top bar (32px) + full-bleed content + status bar (24px).
         Panels toggle in from edges — nothing visible by default. */
      body {
        font-family: var(--font-body);
        background: var(--background);
        color: var(--foreground);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: auto 1fr auto;
        min-height: 100vh;
        overflow: hidden;
      }

      /* Light-DOM shell components — their `:host` styles never match
         (no shadow root). Force layout/positioning here so they don't
         steal grid cells. */
      ship-shell { display: contents; }
      ship-rail, .ship-rail { grid-column: 1; }
      .ship-content { grid-column: 2; }
      ship-toast-host { display: contents; }
      ship-edit-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9500;
        display: none;
      }
      body.edit-mode ship-edit-overlay { display: block; }

      /* ── Top bar: slim, one line ── */
      .ship-topbar {
        grid-column: 1 / -1;
        height: 36px;
        padding: 0 var(--space-3);
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        align-items: center;
        gap: var(--space-2);
        user-select: none;
        -webkit-app-region: drag; /* draggable in Tauri/Electron */
      }
      .ship-topbar .brand {
        display: flex;
        align-items: center;
        margin-right: var(--space-1);
        -webkit-app-region: no-drag;
        text-decoration: none;
      }
      .brand-logo { height: 18px; width: auto; }
      .dark-only { display: none; }
      .dark .light-only { display: none; }
      .dark .dark-only { display: block; }
      .ship-topbar .sep {
        width: 1px;
        height: 16px;
        background: var(--border);
      }
      /* Breadcrumb area */
      .ship-topbar .crumbs {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-sm);
        color: var(--muted-foreground);
        min-width: 0;
        overflow: hidden;
      }
      .ship-topbar .crumbs a {
        color: var(--muted-foreground);
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }
      .ship-topbar .crumbs a:hover { color: var(--foreground); }
      .ship-topbar .crumbs .current {
        color: var(--foreground);
        font-weight: var(--font-weight-medium);
      }
      .ship-topbar .crumbs .chevron {
        color: var(--border);
        font-size: var(--text-xs);
      }
      .ship-topbar .spacer { flex: 1; }
      /* Top bar buttons — no drag region */
      .ship-topbar ship-button,
      .ship-topbar button,
      .ship-topbar a { -webkit-app-region: no-drag; }
      /* Command palette trigger */
      .ship-topbar .cmdk-trigger {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--background);
        color: var(--muted-foreground);
        font-size: var(--text-xs);
        cursor: pointer;
        transition: border-color var(--duration-fast) var(--ease-out);
        min-width: 180px;
      }
      .ship-topbar .cmdk-trigger:hover {
        border-color: color-mix(in oklch, var(--foreground) 30%, var(--border));
      }
      .ship-topbar .cmdk-trigger kbd {
        font-family: var(--font-mono);
        font-size: 10px;
        padding: 1px 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--muted);
        color: var(--muted-foreground);
        margin-left: auto;
      }

      /* ── Theme picker ── */
      .theme-grid {
        display: flex; flex-direction: column; gap: 12px;
        padding: 4px; width: 320px; max-height: min(70vh, 520px);
        overflow-y: auto;
      }
      .theme-group-cards {
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
      }
      .theme-card {
        appearance: none;
        background: var(--swatch-bg);
        border: 2px solid color-mix(in oklch, var(--swatch-primary) 0%, transparent);
        border-radius: 10px;
        padding: 8px;
        cursor: pointer;
        text-align: left;
        font: inherit;
        display: flex; flex-direction: column; gap: 8px;
        transition:
          border-color var(--duration-fast) var(--ease-out),
          box-shadow var(--duration-fast) var(--ease-out),
          transform var(--duration-fast) var(--ease-out);
      }
      .theme-card:hover {
        border-color: color-mix(in oklch, var(--swatch-primary) 50%, transparent);
        transform: translateY(-1px);
      }
      .theme-card[aria-selected='true'] {
        border-color: var(--swatch-primary);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--swatch-primary) 22%, transparent);
      }
      .theme-card-swatches {
        display: flex; gap: 3px; height: 22px; border-radius: 6px;
        overflow: hidden;
        border: 1px solid color-mix(in oklch, var(--swatch-primary) 35%, transparent);
      }
      .theme-card-swatches > span { flex: 1; display: block; }
      .theme-card-name { font-size: 12px; font-weight: 600; }
      .theme-card[data-dark='true']  .theme-card-name { color: #f5f5f5; }
      .theme-card[data-dark='false'] .theme-card-name { color: #0a0a0a; }

      /* ── Nav rail: toggleable, left edge ── */
      .ship-rail {
        grid-row: 2;
        width: 0;
        overflow: hidden;
        background: var(--sidebar);
        border-right: none;
        transition: width var(--duration-normal) var(--ease-out);
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        padding: 0;
      }
      body.rail-open .ship-rail {
        width: 48px;
        border-right: 1px solid var(--border);
        padding: var(--space-2) 0;
        overflow-y: auto;
      }
      .ship-rail a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 36px;
        color: var(--muted-foreground);
        text-decoration: none;
        border-radius: 0;
        transition: background var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
        position: relative;
      }
      .ship-rail a:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
      }
      .ship-rail a.active {
        color: var(--primary);
        background: color-mix(in oklch, var(--primary) 10%, transparent);
      }
      .ship-rail a.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--primary);
        border-radius: 0 2px 2px 0;
      }
      .ship-rail .rail-spacer { flex: 1; }
      .ship-rail .rail-new {
        margin: 4px 6px;
        width: 36px;
        height: 32px;
        border: 1px dashed color-mix(in oklch, var(--foreground) 30%, transparent);
        border-radius: var(--radius-md, 6px);
        color: var(--muted-foreground);
        opacity: 0.75;
      }
      .ship-rail .rail-new:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
        border-style: solid;
        opacity: 1;
      }
      .ship-rail .rail-launcher {
        margin-top: var(--space-1);
        opacity: 0.7;
      }
      .ship-rail .rail-launcher:hover { opacity: 1; }

      /* ── Main content: full bleed ── */
      .ship-content {
        grid-row: 2;
        overflow: auto;
        background: var(--background);
        min-width: 0;
        /* Soften view-swap flash. mount() marks the new root as
           `ship-content-entering` before the fetch, and removes the class
           only AFTER content lands — so the blank interval is invisible
           and the new view fades in once it's actually populated.
           Respect reduced-motion. */
        opacity: 1;
        transform: translateY(0);
        transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1),
                    transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .ship-content-entering {
        opacity: 0;
        transform: translateY(6px);
      }
      .ship-content-leaving {
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
      }
      /* Subtle child stagger — any direct child of a freshly-mounted view
         with [data-view-enter] inherits a 40ms cascade. Templates opt in
         by adding the attr to grids/lists they want to reveal sequentially. */
      @keyframes ship-view-enter {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: none; }
      }
      #ship-view-root [data-view-enter] > * {
        animation: ship-view-enter 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(var(--i, 0) * 24ms);
      }
      @media (prefers-reduced-motion: reduce) {
        .ship-content,
        .ship-content-entering,
        .ship-content-leaving { opacity: 1; transform: none; transition: none; }
        #ship-view-root [data-view-enter] > * { animation: none; }
      }

      /* ── Right drawer: chat panel ── */
      .ship-drawer {
        grid-row: 2;
        grid-column: 3;
        width: 0;
        overflow: hidden;
        background: var(--sidebar);
        border-left: none;
        transition: width var(--duration-normal) var(--ease-out);
      }
      body.drawer-open .ship-drawer {
        width: 360px;
        border-left: 1px solid var(--border);
        overflow: auto;
      }
      .ship-drawer style { display: none !important; }

      /* ── Bottom panel dock: toggleable, multi-tab ── */
      ship-panel-dock {
        grid-column: 1 / -1;
        height: 0;
        overflow: hidden;
        background: var(--background);
        border-top: none;
        transition: height var(--duration-normal) var(--ease-out);
      }
      body.dock-open ship-panel-dock {
        height: 240px;
        border-top: 1px solid var(--border);
      }

      /* ── Status bar: hairline bottom ── */
      .ship-statusbar {
        grid-column: 1 / -1;
        height: 24px;
        padding: 0 var(--space-3);
        border-top: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        align-items: center;
        gap: var(--space-3);
        font-size: 11px;
        color: var(--muted-foreground);
        user-select: none;
      }
      .ship-statusbar .status-dot {
        width: 6px;
        height: 6px;
        border-radius: var(--radius-full);
        background: var(--success);
        flex-shrink: 0;
      }
      .ship-statusbar .status-dot.disconnected { background: var(--destructive); }
      .ship-statusbar .spacer { flex: 1; }

      /* ── Utility ── */
      .mount-error {
        margin: var(--space-5);
        padding: var(--space-3) var(--space-4);
        border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border));
        background: color-mix(in oklch, var(--destructive) 8%, transparent);
        color: var(--destructive);
        border-radius: var(--radius-md);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        white-space: pre-wrap;
      }
      .empty-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--muted-foreground);
        font-size: var(--text-sm);
      }
    </style>
  </head>
  <body>
    <ship-shell>
    <!-- Top bar: brand, breadcrumbs, view actions, cmdk, rail toggle,
         theme picker, fullscreen, chat drawer toggle. -->
    <ship-nav-top></ship-nav-top>

    <!-- Left rail: dock-style pinned view launcher. -->
    <ship-rail id="ship-rail"></ship-rail>
    <ship-launcher></ship-launcher>

    <!-- Main content: full bleed -->
    <main class="ship-content" id="ship-view-root">
      <div class="empty-hint">loading…</div>
    </main>

    <!-- Right drawer: chat -->
    <aside class="ship-drawer" id="drawer">
      <div id="drawer-content"><div class="empty-hint">chat</div></div>
    </aside>

    <!-- Bottom panel dock (hidden by default) -->
    <ship-panel-dock id="panel-dock" active-tab="terminal">
      <ship-terminal slot="terminal" id="shell-terminal" fit readonly></ship-terminal>
      <ship-devtools-source slot="source"></ship-devtools-source>
      <ship-devtools-signals slot="signals"></ship-devtools-signals>
      <ship-devtools-lint slot="lint"></ship-devtools-lint>
      <ship-devtools-schema slot="schema"></ship-devtools-schema>
      <ship-devtools-components slot="components"></ship-devtools-components>
    </ship-panel-dock>

    <!-- Status bar -->
    <div class="ship-statusbar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-branch"></span>
      <span id="status-ab" style="font-variant-numeric:tabular-nums;color:var(--muted-foreground)"></span>
      <span id="view-status-start" style="display:inline-flex;gap:8px;align-items:center"></span>
      <span class="spacer"></span>
      <span id="view-status-end" style="display:inline-flex;gap:8px;align-items:center"></span>
      <span id="status-theme">ship</span>
    </div>

    <!-- Create is now handled by <ship-command-bar> in Create mode.
         The rail's "+" tile fires ship:create:open; the bar listens.
         -->

    <!-- Edit-mode overlay: hover highlight + click to annotate. Toggled
         by ⌘⇧E via body.edit-mode. -->
    <ship-edit-overlay></ship-edit-overlay>

    <!-- Toast host: listens for ship:notify, forwards to ship-toast-container. -->
    <ship-toast-host position="bottom-right"></ship-toast-host>
    </ship-shell>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
