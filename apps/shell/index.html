<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- SUI runtime resolution. Importmap MUST come before the first
         module script — browsers freeze it as soon as any
         <script type="module"> begins fetching. Vite's HMR client
         injects module scripts early in <head>, so this lives at the
         very top to win the race. Embedded SUI fragments (loaded via
         mountSuiView) import the runtime through these bare specifiers;
         the daemon-served bundles are loaded once at boot so every
         fragment shares the same module instances. -->
    <script type="importmap">
      {
        "imports": {
          "@ship/ui-runtime":    "/_sui/runtime.js",
          "@ship/ui-dom":        "/_sui/dom.js",
          "@ship/ui-sdk-client": "/_sui/sdk-client.js"
        }
      }
    </script>
    <script>
      // Load daemon-served stylesheet + datastar runtime. Web-component
      // registrations (`ship-elements`) are imported into the Vite bundle
      // via main.ts — keeping them in the same module graph ensures a
      // single Lit copy at runtime (no "Multiple versions" warning).
      // Heavy island bundles still arrive per view via each view's
      // `packs:` manifest, injected by the daemon at render time.
      (function() {
        var base = '/api/assets/';
        var css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = base + 'view-tokens.css';
        document.head.appendChild(css);
        var s = document.createElement('script');
        s.type = 'module'; s.src = base + 'datastar.js';
        document.head.appendChild(s);
      })();
    </script>
    <script>
      // Theme boot — sync before first paint to avoid flash-of-wrong-theme.
      // Applies the persisted ship-set theme id (data-theme + .dark class).
      // Must stay in sync with @ship/set/themes → persistTheme / applyTheme.
      (() => {
        const VALID = new Set(["ship-light","ship-dark","paper","halo","console","contrast","glass"]);
        const DARK = new Set(["ship-dark","contrast","console"]);
        const PREFERS_DARK = matchMedia("(prefers-color-scheme: dark)").matches;
        const raw = localStorage.getItem("ship-site-theme");
        const id = VALID.has(raw) ? raw : (PREFERS_DARK ? "ship-dark" : "ship-light");
        document.documentElement.dataset.theme = id;
        document.documentElement.classList.toggle("dark", DARK.has(id));
      })();
    </script>
    <style>
      /* ── Reset ── */
      html, body { height: 100%; margin: 0; }
      * { box-sizing: border-box; }

      /* Global scrollbar styling lives in ship-set tokens.css under the
         .ship-scroll-thin utility class — applied to <body> below. */

      /* ── Shell: content-first layout ──
         Top bar (32px) + full-bleed content + status bar (24px).
         Panels toggle in from edges — nothing visible by default. */
      body {
        font-family: var(--font-body);
        background: var(--background);
        color: var(--foreground);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: auto 1fr auto;
        min-height: 100vh;
        overflow: hidden;
      }

      /* Light-DOM shell components — their `:host` styles never match
         (no shadow root). Force layout/positioning here so they don't
         steal grid cells. */
      ship-shell { display: contents; }
      ship-rail, .ship-rail { grid-column: 1; }
      .ship-content { grid-column: 2; }
      ship-toast-host { display: contents; }
      ship-edit-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9500;
        display: none;
      }
      body.edit-mode ship-edit-overlay { display: block; }

      /* ── Top bar: slim, one line ── */
      .ship-topbar {
        grid-column: 1 / -1;
        height: 36px;
        padding: 0 var(--space-3);
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        align-items: center;
        gap: var(--space-2);
        user-select: none;
        -webkit-app-region: drag; /* draggable in Tauri/Electron */
      }
      .ship-topbar .brand {
        display: flex;
        align-items: center;
        margin-right: var(--space-1);
        -webkit-app-region: no-drag;
        text-decoration: none;
      }
      .brand-logo { height: 18px; width: auto; }
      .dark-only { display: none; }
      .dark .light-only { display: none; }
      .dark .dark-only { display: block; }
      .ship-topbar .sep {
        width: 1px;
        height: 16px;
        background: var(--border);
      }
      /* Breadcrumb area */
      .ship-topbar .crumbs {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-sm);
        color: var(--muted-foreground);
        min-width: 0;
        overflow: hidden;
      }
      .ship-topbar .crumbs a {
        color: var(--muted-foreground);
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }
      .ship-topbar .crumbs a:hover { color: var(--foreground); }
      .ship-topbar .crumbs .current {
        color: var(--foreground);
        font-weight: var(--font-weight-medium);
      }
      .ship-topbar .crumbs .chevron {
        color: var(--border);
        font-size: var(--text-xs);
      }
      .ship-topbar .spacer { flex: 1; }
      /* Top bar buttons — no drag region */
      .ship-topbar ship-button,
      .ship-topbar button,
      .ship-topbar a { -webkit-app-region: no-drag; }
      /* Command palette trigger */
      .ship-topbar .cmdk-trigger {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--background);
        color: var(--muted-foreground);
        font-size: var(--text-xs);
        cursor: pointer;
        transition: border-color var(--duration-fast) var(--ease-out);
        min-width: 180px;
      }
      .ship-topbar .cmdk-trigger:hover {
        border-color: color-mix(in oklch, var(--foreground) 30%, var(--border));
      }
      .ship-topbar .cmdk-trigger kbd {
        font-family: var(--font-mono);
        font-size: 10px;
        padding: 1px 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--muted);
        color: var(--muted-foreground);
        margin-left: auto;
      }

      /* ── Theme picker — grouped popover, listbox semantics ── */
      .theme-grid {
        display: flex; flex-direction: column; gap: 10px;
        padding: 8px; width: 332px; max-height: min(80vh, 720px);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      }
      .theme-grid::-webkit-scrollbar { width: var(--scrollbar-width-thin, 6px); }
      .theme-grid::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      .theme-grid::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: var(--scrollbar-radius, 999px);
        border: 2px solid transparent;
        background-clip: padding-box;
        transition: background-color var(--duration-fast) var(--ease-out);
      }
      .theme-grid::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
      .theme-group { display: flex; flex-direction: column; gap: 2px; }
      .theme-group-h {
        font-family: var(--font-mono);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted-foreground);
        padding: 0 8px 2px;
        opacity: 0.7;
      }
      .theme-group-rows { display: flex; flex-direction: column; gap: 4px; }
      .theme-card {
        appearance: none;
        background: transparent;
        border: 0;
        border-radius: 10px;
        padding: 6px;
        cursor: pointer;
        text-align: left;
        font: inherit;
        display: flex; flex-direction: column; gap: 6px;
        outline: none;
        transition:
          background var(--duration-fast) var(--ease-out),
          transform var(--duration-fast) var(--ease-out);
      }
      .theme-card:hover { background: var(--hover-bg, var(--muted)); }
      .theme-card:focus-visible {
        background: var(--hover-bg, var(--muted));
        box-shadow: 0 0 0 2px color-mix(in oklch, var(--primary) 50%, transparent);
      }
      .theme-card[aria-selected='true'] {
        background: color-mix(in oklch, var(--primary) 10%, transparent);
      }
      .tc-row {
        display: flex; align-items: center; gap: 8px;
        padding: 0 4px;
      }
      .theme-card-name {
        flex: 1;
        font-family: var(--font-body);
        font-size: 12.5px;
        font-weight: 500;
        color: var(--foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .theme-card-radio {
        width: 12px; height: 12px;
        border-radius: 999px;
        border: 1.5px solid color-mix(in oklch, var(--foreground) 40%, transparent);
        background: transparent;
        position: relative;
        flex-shrink: 0;
      }
      .theme-card[aria-selected='true'] .theme-card-radio {
        border-color: var(--primary);
      }
      .theme-card[aria-selected='true'] .theme-card-radio::after {
        content: '';
        position: absolute;
        inset: 2px;
        border-radius: 999px;
        background: var(--primary);
      }

      /* ── Mini card preview tile ───────────────────────────────── */
      /* The tile carries [data-theme-preview], so every Ship token (palette,
       * surfaces, shadows, fonts, overlays, backdrop-filter) cascades to its
       * descendants identically to a live page under :root[data-theme]. */
      .tc-bg {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        width: 100%; height: 132px;
        background: var(--background);
        color: var(--foreground);
        border-radius: 8px;
        overflow: hidden;
        isolation: isolate;
        box-shadow: inset 0 0 0 1px color-mix(in oklch, currentColor 14%, transparent);
      }
      .tc-overlay {
        position: absolute; inset: 0;
        pointer-events: none;
        background: var(--surface-overlay, none);
        mix-blend-mode: var(--surface-overlay-blend, normal);
        opacity: var(--surface-overlay-opacity, 1);
        z-index: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .tc-overlay { display: none; }
      }
      .tc-card {
        position: relative;
        z-index: 2;
        display: flex; flex-direction: column; gap: 7px;
        width: calc(100% - 24px);
        padding: 10px 12px 11px;
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius-md, 6px);
        box-shadow: var(--shadow-card-rest, var(--shadow-sm, 0 1px 2px oklch(0 0 0 / 8%)));
        backdrop-filter: var(--card-backdrop-filter, none);
        -webkit-backdrop-filter: var(--card-backdrop-filter, none);
      }
      .tc-card-head {
        display: flex; flex-direction: column; gap: 2px;
      }
      .tc-eyebrow {
        font-family: var(--label-font, var(--font-mono));
        font-weight: var(--label-weight, 600);
        letter-spacing: var(--label-tracking, 0.08em);
        font-size: 8px;
        line-height: 1;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .tc-heading {
        font-family: var(--heading-font, var(--font-body));
        font-weight: var(--heading-weight, 600);
        letter-spacing: var(--heading-tracking, normal);
        font-size: 13px;
        line-height: 1.05;
        color: var(--card-foreground);
      }
      .tc-typo {
        display: flex; align-items: baseline; gap: 6px;
        font-family: var(--body-font, var(--font-body));
        font-size: 9.5px;
        line-height: 1;
        color: var(--muted-foreground);
      }
      .tc-body { color: var(--card-foreground); opacity: 0.85; }
      .tc-mono {
        font-family: var(--font-mono);
        font-size: 9px;
        padding: 1px 4px;
        border-radius: 3px;
        background: color-mix(in oklch, var(--foreground) 6%, transparent);
        color: var(--muted-foreground);
      }
      .tc-controls {
        display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
      }
      .tc-cta {
        display: inline-flex; align-items: center;
        font-family: var(--label-font, var(--body-font, var(--font-body)));
        font-weight: var(--label-weight, 500);
        font-size: 9.5px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: var(--radius-sm, 4px);
        background: var(--primary);
        color: var(--primary-foreground);
        box-shadow: var(--shadow-xs, 0 1px 0 oklch(1 0 0 / 18%) inset);
      }
      .tc-ghost {
        display: inline-flex; align-items: center;
        font-family: var(--label-font, var(--body-font, var(--font-body)));
        font-weight: var(--label-weight, 500);
        font-size: 9.5px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: var(--radius-sm, 4px);
        background: transparent;
        color: var(--muted-foreground);
        border: 1px solid var(--border);
      }
      .tc-chip {
        display: inline-flex; align-items: center;
        font-family: var(--label-font, var(--font-body));
        font-weight: 600;
        font-size: 8.5px;
        line-height: 1;
        padding: 3px 6px;
        border-radius: 999px;
      }
      .tc-chip-accent {
        background: color-mix(in oklch, var(--accent) 18%, transparent);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 30%, transparent);
      }
      .tc-chip-muted {
        background: color-mix(in oklch, var(--foreground) 8%, transparent);
        color: var(--muted-foreground);
      }

      /* ── Nav rail: toggleable, left edge ── */
      .ship-rail {
        grid-row: 2;
        width: 0;
        overflow: hidden;
        background: var(--sidebar);
        border-right: none;
        transition: width var(--duration-normal) var(--ease-out);
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        padding: 0;
      }
      body.rail-open .ship-rail {
        width: 48px;
        border-right: 1px solid var(--border);
        padding: var(--space-2) 0;
        overflow-y: auto;
      }
      .ship-rail a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 36px;
        color: var(--muted-foreground);
        text-decoration: none;
        border-radius: 0;
        transition: background var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
        position: relative;
      }
      .ship-rail a:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
      }
      .ship-rail a.active {
        color: var(--primary);
        background: color-mix(in oklch, var(--primary) 10%, transparent);
      }
      .ship-rail a.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--primary);
        border-radius: 0 2px 2px 0;
      }
      .ship-rail .rail-spacer { flex: 1; }
      .ship-rail .rail-project { border-bottom: 1px solid var(--border); padding-bottom: var(--space-2); margin-bottom: var(--space-2); }
      .ship-rail .rail-project-badge {
        display: flex; align-items: center; justify-content: center;
        width: 32px; height: 32px; margin: 4px auto;
        border-radius: var(--radius-md);
        background: color-mix(in oklch, var(--primary) 18%, transparent);
        color: var(--primary); font-weight: var(--font-weight-medium, 500);
        font-size: 13px;
      }
      .ship-rail .rail-project-badge:hover { background: color-mix(in oklch, var(--primary) 26%, transparent); }
      .rail-project-popover {
        position: fixed;
        top: 44px; left: 56px;
        min-width: 260px;
        background: var(--card, var(--background));
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: 0 12px 24px rgba(0,0,0,0.18);
        z-index: 9400;
        padding: 6px;
        font-size: var(--text-sm);
      }
      .rail-project-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-foreground); padding: 4px 10px 6px; }
      .rail-project-row { display: grid; gap: 2px; padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; }
      .rail-project-row:hover { background: var(--muted); }
      .rail-project-row.active { color: var(--primary); }
      .rail-project-row-name { font-weight: var(--font-weight-medium, 500); font-size: var(--text-sm); }
      .rail-project-row-path { font-size: var(--text-xs); color: var(--muted-foreground); font-family: var(--font-mono); }
      .rail-project-row.add { color: var(--muted-foreground); font-size: var(--text-xs); padding: 6px 10px; }
      .rail-project-row.add:hover { color: var(--foreground); }
      .rail-project-sep { height: 1px; background: var(--border); margin: 4px 0; }
      .rail-project-empty { padding: 8px 10px; color: var(--muted-foreground); font-size: var(--text-xs); }
      .ship-rail .rail-chats { position: relative; }
      .ship-rail .rail-chats[data-badge]:not([data-badge=""])::after {
        content: attr(data-badge);
        position: absolute;
        top: 4px; right: 4px;
        min-width: 14px; height: 14px;
        padding: 0 3px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-foreground, #fff);
        font-size: 9px;
        line-height: 14px;
        text-align: center;
        font-weight: var(--font-weight-medium, 500);
      }
      .ship-rail .rail-new {
        margin: 4px 6px;
        width: 36px;
        height: 32px;
        border: 1px dashed color-mix(in oklch, var(--foreground) 30%, transparent);
        border-radius: var(--radius-md, 6px);
        color: var(--muted-foreground);
        opacity: 0.75;
      }
      .ship-rail .rail-new:hover {
        background: var(--sidebar-accent);
        color: var(--foreground);
        border-style: solid;
        opacity: 1;
      }
      .ship-rail .rail-launcher {
        margin-top: var(--space-1);
        opacity: 0.7;
      }
      .ship-rail .rail-launcher:hover { opacity: 1; }

      /* ── App launcher popover ── */
      ship-launcher { display: contents; }
      ship-launcher:not([open]) { display: none; }
      .launcher-mask {
        position: fixed;
        inset: 0;
        background: var(--scrim, transparent);
        z-index: 9000;
        animation: launcher-mask-in 140ms var(--ease-out) both;
      }
      @keyframes launcher-mask-in { from { opacity: 0 } to { opacity: 1 } }
      .launcher-panel {
        position: fixed;
        left: 56px;
        top: 50%;
        transform: translateY(-50%);
        width: 440px;
        max-height: min(640px, calc(100vh - 32px));
        background: var(--surface-3, var(--popover, var(--background)));
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        z-index: 9001;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        overflow: hidden;
        animation: launcher-panel-in 160ms var(--ease-out) both;
      }
      @keyframes launcher-panel-in {
        from { opacity: 0; transform: translateY(-50%) translateX(-4px) }
        to   { opacity: 1; transform: translateY(-50%) translateX(0) }
      }
      @media (max-height: 600px) {
        .launcher-panel { top: 16px; transform: none; }
        @keyframes launcher-panel-in {
          from { opacity: 0; transform: translateY(-4px) }
          to   { opacity: 1; transform: translateY(0) }
        }
      }
      .launcher-head {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-subtle, var(--border));
      }
      .launcher-head .launcher-title {
        font-family: var(--heading-font);
        font-weight: var(--heading-weight, 600);
        font-size: var(--text-sm);
        color: var(--foreground);
      }
      .launcher-head .launcher-ws {
        font-family: var(--mono-font, var(--font-mono));
        font-size: 10.5px;
        color: var(--muted-foreground);
        margin-left: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }
      .launcher-filter {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        margin: 8px 10px 4px;
        background: var(--muted);
        border-radius: var(--radius-md);
        color: var(--muted-foreground);
      }
      .launcher-filter input {
        flex: 1;
        border: 0;
        background: transparent;
        outline: none;
        color: var(--foreground);
        font-size: 12px;
        font-family: var(--body-font, var(--font-body));
        padding: 4px 0;
      }
      .launcher-filter .launcher-count {
        font-family: var(--mono-font, var(--font-mono));
        font-size: 10px;
        color: var(--muted-foreground);
      }
      .launcher-body {
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px 0 6px;
        min-width: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      }
      .launcher-body::-webkit-scrollbar { width: var(--scrollbar-width-thin, 6px); height: var(--scrollbar-width-thin, 6px); }
      .launcher-body::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      .launcher-body::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: var(--scrollbar-radius, 999px);
        border: 2px solid transparent;
        background-clip: padding-box;
        transition: background-color var(--duration-fast) var(--ease-out);
      }
      .launcher-body::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
      .launcher-empty {
        padding: 16px 14px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        text-align: center;
      }
      .launcher-section { padding: 6px 0; }
      .launcher-section + .launcher-section {
        border-top: 1px solid var(--border-subtle, var(--border));
      }
      .launcher-section-h {
        font-family: var(--mono-font, var(--font-mono));
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted-foreground);
        padding: 4px 14px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .launcher-section-spacer { flex: 1; }
      .launcher-section-h .launcher-hint {
        text-transform: none;
        letter-spacing: 0;
        font-family: var(--body-font, var(--font-body));
        font-size: 10.5px;
      }
      .launcher-row {
        display: grid;
        grid-template-columns: 26px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        font-size: 12px;
        color: var(--foreground);
        cursor: pointer;
        outline: none;
        position: relative;
        transition:
          background var(--duration-fast) var(--ease-out),
          transform var(--duration-fast) var(--ease-out);
      }
      .launcher-row:hover { background: var(--hover-bg, var(--muted)); }
      .launcher-row:hover { transform: translateX(1px); }
      .launcher-row.is-cursor {
        background: color-mix(in oklch, var(--primary) 12%, transparent);
        box-shadow: inset 2px 0 0 var(--primary);
      }
      .launcher-row.is-cursor .launcher-row-label {
        color: var(--foreground);
        font-weight: var(--font-weight-medium, 500);
      }
      .launcher-row.is-dragging { opacity: 0.4; }
      .launcher-row.is-drag-over {
        box-shadow: inset 0 2px 0 var(--primary);
      }
      .launcher-row-name {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
        min-width: 0;
      }
      .launcher-row-label {
        color: var(--foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .launcher-row-path {
        font-family: var(--mono-font, var(--font-mono));
        font-size: 10px;
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .launcher-pin {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        background: transparent;
        border: 0;
        color: var(--muted-foreground);
        border-radius: var(--radius-sm);
        cursor: pointer;
        opacity: 0;
        transition: opacity var(--duration-fast) var(--ease-out),
                    background var(--duration-fast) var(--ease-out);
      }
      .launcher-row:hover .launcher-pin,
      .launcher-row.is-cursor .launcher-pin { opacity: 1; }
      .launcher-pin.is-pinned {
        opacity: 1;
        color: var(--primary);
      }
      .launcher-pin:hover {
        background: var(--surface-1, var(--background));
        color: var(--foreground);
      }
      .launcher-foot {
        border-top: 1px solid var(--border-subtle, var(--border));
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted-foreground);
        background: color-mix(in oklch, var(--surface-3, var(--popover)) 60%, var(--background));
      }
      .launcher-add {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 6px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        text-decoration: none;
        color: inherit;
      }
      .launcher-add:hover { background: var(--muted); color: var(--foreground); }
      .launcher-kbd {
        font-family: var(--mono-font, var(--font-mono));
        font-size: 10px;
        padding: 1px 5px;
        border: 1px solid var(--border-subtle, var(--border));
        border-radius: 3px;
        background: var(--muted);
        color: var(--muted-foreground);
        min-width: 14px;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .launcher-mask, .launcher-panel { animation: none; }
        .launcher-row, .launcher-pin { transition: none; }
        .launcher-row:hover { transform: none; }
      }

      /* ── Main content: full bleed ── */
      .ship-content {
        grid-row: 2;
        overflow: auto;
        background: var(--background);
        min-width: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      }
      .ship-content::-webkit-scrollbar { width: var(--scrollbar-width-thin, 6px); height: var(--scrollbar-width-thin, 6px); }
      .ship-content::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      .ship-content::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: var(--scrollbar-radius, 999px);
        border: 2px solid transparent;
        background-clip: padding-box;
        transition: background-color var(--duration-fast) var(--ease-out);
      }
      .ship-content::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
      .ship-content {
        /* Soften view-swap flash. mount() marks the new root as
           `ship-content-entering` before the fetch, and removes the class
           only AFTER content lands — so the blank interval is invisible
           and the new view fades in once it's actually populated.
           Respect reduced-motion. */
        opacity: 1;
        transform: translateY(0);
        transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1),
                    transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .ship-content-entering {
        opacity: 0;
        transform: translateY(6px);
      }
      .ship-content-leaving {
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
      }
      /* Subtle child stagger — any direct child of a freshly-mounted view
         with [data-view-enter] inherits a 40ms cascade. Templates opt in
         by adding the attr to grids/lists they want to reveal sequentially. */
      @keyframes ship-view-enter {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: none; }
      }
      #ship-view-root [data-view-enter] > *,
      #ship-view-root[data-view-enter] > * {
        animation: ship-view-enter 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(var(--i, 0) * 28ms);
      }
      @media (prefers-reduced-motion: reduce) {
        .ship-content,
        .ship-content-entering,
        .ship-content-leaving { opacity: 1; transform: none; transition: none; }
        #ship-view-root [data-view-enter] > * { animation: none; }
      }

      /* ── Right drawer: chat panel ── */
      .ship-drawer {
        grid-row: 2;
        grid-column: 3;
        width: 0;
        overflow: hidden;
        background: var(--sidebar);
        border-left: none;
        transition: width var(--duration-normal) var(--ease-out);
      }
      body.drawer-open .ship-drawer {
        width: 360px;
        border-left: 1px solid var(--border);
        overflow: auto;
      }
      .ship-drawer style { display: none !important; }

      /* ── Bottom panel dock: toggleable, multi-tab ── */
      ship-panel-dock {
        grid-column: 1 / -1;
        height: 0;
        overflow: hidden;
        background: var(--card);
        border-top: none;
        opacity: 0;
        transform: translateY(8px);
        transition:
          height var(--duration-normal, 200ms) var(--ease-out),
          opacity var(--duration-normal, 200ms) var(--ease-out),
          transform var(--duration-normal, 200ms) var(--ease-out);
      }
      body.dock-open ship-panel-dock {
        height: var(--ship-dock-height, 240px);
        border-top: 1px solid var(--border);
        opacity: 1;
        transform: none;
      }
      body.dock-open.dock-popout ship-panel-dock {
        height: calc(100vh - 48px);
      }
      /* Skip height transition during interactive resize drag. */
      ship-panel-dock[resizing] {
        transition: none;
      }
      @media (prefers-reduced-motion: reduce) {
        ship-panel-dock {
          transition: none;
          transform: none;
        }
      }

      /* ── Status bar: hairline bottom ── */
      .ship-statusbar {
        grid-column: 1 / -1;
        height: 24px;
        padding: 0 var(--space-3);
        border-top: 1px solid var(--border);
        background: var(--sidebar);
        display: flex;
        align-items: center;
        gap: var(--space-3);
        font-size: 11px;
        color: var(--muted-foreground);
        user-select: none;
      }
      .ship-statusbar .status-dot {
        width: 6px;
        height: 6px;
        border-radius: var(--radius-full);
        background: var(--success);
        flex-shrink: 0;
      }
      .ship-statusbar .status-dot.disconnected { background: var(--destructive); }
      .ship-statusbar .spacer { flex: 1; }

      /* ── Utility ── */
      .mount-error {
        margin: var(--space-5);
        padding: var(--space-3) var(--space-4);
        border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border));
        background: color-mix(in oklch, var(--destructive) 8%, transparent);
        color: var(--destructive);
        border-radius: var(--radius-md);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        white-space: pre-wrap;
      }
      .empty-hint {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--muted-foreground);
        font-size: var(--text-sm);
      }
    </style>
  </head>
  <body class="ship-scroll-thin">
    <ship-shell>
    <!-- Top bar: brand, breadcrumbs, view actions, cmdk, rail toggle,
         theme picker, fullscreen, chat drawer toggle. -->
    <ship-nav-top></ship-nav-top>

    <!-- Left rail: dock-style pinned view launcher. -->
    <ship-rail id="ship-rail"></ship-rail>
    <ship-launcher></ship-launcher>

    <!-- Main content: full bleed -->
    <main class="ship-content" id="ship-view-root">
      <ship-loading></ship-loading>
    </main>

    <!-- Right drawer: chat -->
    <aside class="ship-drawer" id="drawer">
      <div id="drawer-content"><div class="empty-hint">chat</div></div>
    </aside>

    <!-- Bottom panel dock (hidden by default) -->
    <ship-panel-dock id="panel-dock" active-tab="terminal">
      <ship-terminal slot="terminal" id="shell-terminal" fit></ship-terminal>
      <ship-devtools-source slot="source"></ship-devtools-source>
      <ship-devtools-signals slot="signals"></ship-devtools-signals>
      <ship-devtools-lint slot="lint"></ship-devtools-lint>
      <ship-devtools-schema slot="schema"></ship-devtools-schema>
      <ship-devtools-components slot="components"></ship-devtools-components>
    </ship-panel-dock>

    <!-- Status bar -->
    <div class="ship-statusbar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-branch"></span>
      <span id="status-ab" style="font-variant-numeric:tabular-nums;color:var(--muted-foreground)"></span>
      <span id="view-status-start" style="display:inline-flex;gap:8px;align-items:center"></span>
      <span class="spacer"></span>
      <span id="view-status-end" style="display:inline-flex;gap:8px;align-items:center"></span>
      <span id="status-theme">ship</span>
    </div>

    <!-- Create is now handled by <ship-command-bar> in Create mode.
         The rail's "+" tile fires ship:create:open; the bar listens.
         -->

    <!-- Edit-mode overlay: hover highlight + click to annotate. Toggled
         by ⌘⇧E via body.edit-mode. -->
    <ship-edit-overlay></ship-edit-overlay>

    <!-- Toast host: listens for ship:notify, forwards to ship-toast-container. -->
    <ship-toast-host position="bottom-right"></ship-toast-host>

    <!-- Agent modal: cmdk-style chat surface. Listens for ship:chat:*
         window events. With no default-agent / default-provider attrs,
         the picker (app-agent-picker) opens first; explicit defaults
         can be set on this element to skip the picker. -->
    <app-agent-modal></app-agent-modal>
    </ship-shell>

    <!-- SUI components bundle — loaded via runtime IIFE so Vite's
         pre-transform doesn't try to resolve daemon-served URLs at
         compile time. Importmap moved to <head> so it precedes any
         module script (Vite injects HMR client modules early; the
         importmap MUST be first). -->
    <script>
      (function() {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/_sui/components.js';
        document.head.appendChild(s);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
    <!-- Agent UI single-file components. The auto-loader is future
         work in the SDK; until then each component used here lists
         its module URL. Injected via runtime IIFE (not <script src>)
         so Vite's build step doesn't try to resolve daemon-served
         URLs at compile time — same pattern the inline-loader at the
         top of <head> uses for /api/assets/. -->
    <script>
      (function() {
        var tags = [
          'app-agent-thread', 'app-agent-composer', 'app-agent-picker',
          'app-pty-attach', 'app-agent-modal',
          'app-pipeline-step', 'app-pipeline-board',
        ];
        tags.forEach(function(tag) {
          var s = document.createElement('script');
          s.type = 'module';
          s.src = '/_ship/components/' + tag + '.js';
          document.body.appendChild(s);
        });
      })();
    </script>
  </body>
</html>
