<!doctype html>
<html lang="en" data-theme="ship-light">
<head>
  <meta charset="utf-8" />
  <title>Studio · mockboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">

const Frame = ({ src, height = 1200 }) => (
  <iframe
    src={src}
    style={{
      width: '100%',
      height: '100%',
      border: 0,
      background: '#f8f6f2',
      pointerEvents: 'none',
    }}
    title={src}
  />
);

const App = () => {
  React.useEffect(() => {
    const t = setTimeout(() => {
      window.postMessage({ type: '__dc_set_zoom', scale: 0.36 }, '*');
    }, 250);
    return () => clearTimeout(t);
  }, []);

  return (
    <DesignCanvas minScale={0.1} maxScale={2}>

      <DCSection
        id="agents"
        title="Agents studio"
        subtitle="The canonical detail-page shape. List → detail → wire/settings sub-routes, with a create wizard."
      >
        <DCArtboard id="list" label="/agents" width={1100} height={1400}>
          <Frame src="agents/list.html" />
        </DCArtboard>
        <DCArtboard id="detail" label="/agents/[id]" width={1024} height={1600}>
          <Frame src="agents/detail.html" />
        </DCArtboard>
        <DCArtboard id="settings" label="/agents/[id]/settings" width={1024} height={1800}>
          <Frame src="agents/settings.html" />
        </DCArtboard>
        <DCArtboard id="wire" label="/agents/[id]/wire" width={1100} height={1600}>
          <Frame src="agents/wire.html" />
        </DCArtboard>
        <DCArtboard id="create" label="/agents/create" width={1024} height={1500}>
          <Frame src="agents/create.html" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="themes"
        title="Across themes"
        subtitle="The same agent-detail under each Ship theme — pressure-tests the token surface."
      >
        <DCArtboard id="t-light" label="ship-light · default" width={1024} height={1600}>
          <Frame src="agents/detail.html" />
        </DCArtboard>
        <DCArtboard id="t-dark" label="ship-dark" width={1024} height={1600}>
          <iframe src="agents/detail.html" style={{ width: '100%', height: '100%', border: 0, pointerEvents: 'none' }}
            onLoad={(e) => { try { const h = e.target.contentDocument.documentElement; h.setAttribute('data-theme', 'ship-dark'); h.classList.add('dark'); } catch(_) {} }} />
        </DCArtboard>
        <DCArtboard id="t-paper" label="paper" width={1024} height={1600}>
          <iframe src="agents/detail.html" style={{ width: '100%', height: '100%', border: 0, pointerEvents: 'none' }}
            onLoad={(e) => { try { e.target.contentDocument.documentElement.setAttribute('data-theme', 'paper'); } catch(_) {} }} />
        </DCArtboard>
        <DCArtboard id="t-halo" label="halo" width={1024} height={1600}>
          <iframe src="agents/detail.html" style={{ width: '100%', height: '100%', border: 0, pointerEvents: 'none' }}
            onLoad={(e) => { try { e.target.contentDocument.documentElement.setAttribute('data-theme', 'halo'); } catch(_) {} }} />
        </DCArtboard>
        <DCArtboard id="t-console" label="console" width={1024} height={1600}>
          <iframe src="agents/detail.html" style={{ width: '100%', height: '100%', border: 0, pointerEvents: 'none' }}
            onLoad={(e) => { try { const h = e.target.contentDocument.documentElement; h.setAttribute('data-theme', 'console'); h.classList.add('dark'); } catch(_) {} }} />
        </DCArtboard>
        <DCArtboard id="t-contrast" label="contrast" width={1024} height={1600}>
          <iframe src="agents/detail.html" style={{ width: '100%', height: '100%', border: 0, pointerEvents: 'none' }}
            onLoad={(e) => { try { const h = e.target.contentDocument.documentElement; h.setAttribute('data-theme', 'contrast'); h.classList.add('dark'); } catch(_) {} }} />
        </DCArtboard>
        <DCArtboard id="t-glass" label="glass" width={1024} height={1600}>
          <iframe src="agents/detail.html" style={{ width: '100%', height: '100%', border: 0, pointerEvents: 'none' }}
            onLoad={(e) => { try { e.target.contentDocument.documentElement.setAttribute('data-theme', 'glass'); } catch(_) {} }} />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="skills"
        title="Skills studio"
        subtitle="SKILL.md-shaped — list → detail (frontmatter + body + used-by) → invoke (skills.invoke)."
      >
        <DCArtboard id="s-list" label="/skills" width={1100} height={1400}>
          <Frame src="skills/list.html" />
        </DCArtboard>
        <DCArtboard id="s-detail" label="/skills/[id]" width={1024} height={1700}>
          <Frame src="skills/detail.html" />
        </DCArtboard>
        <DCArtboard id="s-invoke" label="/skills/[id]/invoke" width={1024} height={1400}>
          <Frame src="skills/invoke.html" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="themes"
        title="Themes studio"
        subtitle="Swatch-led list → token editor + live preview detail (absorbs /theme-studio)."
      >
        <DCArtboard id="th-list" label="/themes" width={1100} height={1200}>
          <Frame src="themes/list.html" />
        </DCArtboard>
        <DCArtboard id="th-detail" label="/themes/[id]" width={1280} height={1400}>
          <Frame src="themes/detail.html" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="components"
        title="Components studio"
        subtitle="Grouped index → variant×tone matrix + playground + props (absorbs /ship-ui-studio)."
      >
        <DCArtboard id="c-list" label="/components" width={1100} height={1600}>
          <Frame src="components/list.html" />
        </DCArtboard>
        <DCArtboard id="c-detail" label="/components/[id]" width={1100} height={1800}>
          <Frame src="components/detail.html" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="next"
        title="Coming next"
        subtitle="Skills · Themes · Components — same shape, type-specific content."
      >
        <DCArtboard id="placeholder" label="(complete)" width={400} height={300}>
          <div style={{
            width: '100%', height: '100%',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: 'rgba(60,50,40,0.5)', fontSize: 14, fontStyle: 'italic',
            fontFamily: '-apple-system, system-ui, sans-serif',
            background: '#f8f6f2',
          }}>
            agents · skills · themes · components — all delivered
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="archive"
        title="Archive — earlier 3-pane Studio mock"
        subtitle="Not the path forward. Kept for reference (see PATH.md)."
      >
        <DCArtboard id="archive-page" label="page.html (archived)" width={1024} height={820}>
          <Frame src="archive/page.html" />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
</html>
