<!doctype html>
<html lang="en" data-theme="ship-light">
<head>
  <meta charset="utf-8" />
  <title>Studio · Ship</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../sui/ship.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-body);
      font-size: var(--text-base);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .icon    { width: 14px; height: 14px; flex-shrink: 0; }
    .icon-xs { width: 12px; height: 12px; }
    .icon-md { width: 16px; height: 16px; }

    /* Studio's own chrome — paints inside the host shell's canvas.
       Thin top + left rail + content. Distinct from the Ship shell. */
    .studio {
      display: grid;
      height: 100vh;
      grid-template-columns: 220px 1fr;
      grid-template-rows: 40px 1fr;
      grid-template-areas:
        "rail top"
        "rail content";
    }

    /* ── Rail ───────────────────────────────────────────────── */
    .rail {
      grid-area: rail;
      background: color-mix(in oklch, var(--sidebar, var(--surface-1)) 96%, transparent);
      border-right: 1px solid var(--border-subtle);
      display: flex; flex-direction: column;
      padding: 0;
      overflow-y: auto;
    }
    .rail-h {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .rail-h-mark {
      width: 20px; height: 20px;
      border-radius: var(--radius-sm);
      display: inline-flex; align-items: center; justify-content: center;
      background: color-mix(in oklch, var(--primary) 16%, transparent);
      color: var(--primary);
      flex-shrink: 0;
    }
    .rail-h-text {
      font-family: var(--heading-font);
      font-size: 13px;
      font-weight: var(--heading-weight);
      letter-spacing: var(--heading-tracking);
      color: var(--foreground);
    }
    .rail-h-rule {
      width: 24px; height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--primary), transparent);
      margin-left: auto;
    }

    .rail-section {
      padding: 12px 8px 8px;
      position: relative;
    }
    .rail-section-h {
      display: flex; align-items: center; gap: 6px;
      padding: 0 8px 4px;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted-foreground);
    }
    .rail-section-h-count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-weight: normal;
      letter-spacing: 0;
    }

    .rail-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      color: var(--foreground);
      text-decoration: none;
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }
    .rail-item:hover { background: var(--hover-bg); }
    .rail-item.is-active {
      background: color-mix(in oklch, var(--primary) 12%, transparent);
    }
    .rail-item.is-active .rail-item-icon { color: var(--primary); }
    .rail-item.is-active .rail-item-label { font-weight: var(--font-weight-semibold); }
    .rail-item-icon {
      color: var(--muted-foreground);
      display: inline-flex;
    }
    .rail-item:hover .rail-item-icon { color: var(--foreground); }
    .rail-item-label {
      font-size: 13px;
      flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rail-item-count {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted-foreground);
      padding: 0 5px;
      border-radius: var(--radius-full);
    }
    .rail-item.is-active .rail-item-count {
      background: color-mix(in oklch, var(--primary) 18%, transparent);
      color: var(--foreground);
    }

    .rail-foot {
      margin-top: auto;
      padding: 8px;
      border-top: 1px solid var(--border-subtle);
    }
    .rail-exit {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      color: var(--muted-foreground);
      text-decoration: none;
      cursor: pointer;
      font-size: 12.5px;
    }
    .rail-exit:hover { color: var(--foreground); background: var(--hover-bg); }

    /* ── Top ────────────────────────────────────────────────── */
    .top {
      grid-area: top;
      display: flex; align-items: center; gap: var(--space-3);
      padding: 0 var(--space-4);
      background: color-mix(in oklch, var(--surface-0, var(--background)) 92%, transparent);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .crumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px;
      color: var(--muted-foreground);
    }
    .crumb-studio {
      color: var(--primary);
      font-weight: var(--font-weight-semibold);
    }
    .crumb-sep { color: var(--border); font-family: var(--font-mono); font-size: 11px; }
    .crumb a {
      color: var(--muted-foreground);
      text-decoration: none;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }
    .crumb a:hover { color: var(--foreground); background: var(--hover-bg); }
    .crumb-current {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--foreground);
      padding: 2px 6px;
      background: var(--muted);
      border-radius: var(--radius-sm);
    }
    .top-spacer { flex: 1; }
    .top-cmdk {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 10px;
      border: 1px solid var(--border-subtle);
      background: var(--background);
      border-radius: var(--radius-md);
      color: var(--muted-foreground);
      font: inherit; font-size: 12px;
      cursor: text;
      min-width: 240px;
    }
    .top-cmdk:hover { border-color: var(--border); }
    .top-cmdk-text { flex: 1; text-align: left; }
    .top-cmdk-kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
    }

    .top-btn {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--muted-foreground);
      border: 0; background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .top-btn:hover { background: var(--hover-bg); color: var(--foreground); }

    /* ── Content ────────────────────────────────────────────── */
    .content {
      grid-area: content;
      overflow: hidden;
      position: relative;
      background: var(--background);
    }
    .content iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
    <symbol id="i-merge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.4-4.5-8-10-8z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></symbol>
  </defs>
</svg>

<div class="studio">

  <!-- ── Studio rail ───────────────────────────────────────── -->
  <aside class="rail" aria-label="Studio navigation">
    <div class="rail-h">
      <span class="rail-h-mark"><svg class="icon-md"><use href="#i-grid"/></svg></span>
      <span class="rail-h-text">Studio</span>
      <span class="rail-h-rule"></span>
    </div>

    <div class="rail-section">
      <div class="rail-section-h">Configure <span class="rail-section-h-count">7</span></div>
      <a class="rail-item is-active" data-href="agent-detail.html" data-crumb="rust-compiler" href="#agents">
        <span class="rail-item-icon"><svg class="icon"><use href="#i-bot"/></svg></span>
        <span class="rail-item-label">Agents</span>
        <span class="rail-item-count">8</span>
      </a>
      <a class="rail-item" data-href="skill-detail.html" data-crumb="tdd" href="#skills">
        <span class="rail-item-icon"><svg class="icon"><use href="#i-zap"/></svg></span>
        <span class="rail-item-label">Skills</span>
        <span class="rail-item-count">14</span>
      </a>
      <a class="rail-item" data-href="#" data-crumb="filesystem" href="#mcp">
        <span class="rail-item-icon"><svg class="icon"><use href="#i-terminal"/></svg></span>
        <span class="rail-item-label">MCP servers</span>
        <span class="rail-item-count">5</span>
      </a>
      <a class="rail-item" data-href="#" data-crumb="release" href="#pipelines">
        <span class="rail-item-icon"><svg class="icon"><use href="#i-merge"/></svg></span>
        <span class="rail-item-label">Pipelines</span>
        <span class="rail-item-count">6</span>
      </a>
      <a class="rail-item" data-href="component-detail.html" data-crumb="sui-button" href="#components">
        <span class="rail-item-icon"><svg class="icon"><use href="#i-layers"/></svg></span>
        <span class="rail-item-label">Components</span>
        <span class="rail-item-count">110</span>
      </a>
      <a class="rail-item" data-href="theme-detail.html" data-crumb="ship-light" href="#themes">
        <span class="rail-item-icon"><svg class="icon"><use href="#i-palette"/></svg></span>
        <span class="rail-item-label">Themes</span>
        <span class="rail-item-count">7</span>
      </a>
      <a class="rail-item" data-href="#" data-crumb="project-write" href="#permissions">
        <span class="rail-item-icon"><svg class="icon"><use href="#i-shield"/></svg></span>
        <span class="rail-item-label">Permissions</span>
        <span class="rail-item-count">4</span>
      </a>
    </div>

    <div class="rail-foot">
      <a class="rail-exit" href="#" id="exit-studio">
        <svg class="icon"><use href="#i-chev-left"/></svg>
        <span>Close Studio</span>
      </a>
    </div>
  </aside>

  <!-- ── Studio top ────────────────────────────────────────── -->
  <div class="top">
    <div class="crumb">
      <span class="crumb-studio">Studio</span>
      <span class="crumb-sep">/</span>
      <a href="#" id="crumb-domain">Agents</a>
      <span class="crumb-sep">/</span>
      <span class="crumb-current" id="crumb-current">rust-compiler</span>
    </div>

    <div class="top-spacer"></div>

    <button class="top-cmdk" type="button" title="Search across Studio">
      <svg class="icon"><use href="#i-search"/></svg>
      <span class="top-cmdk-text">Search Studio…</span>
      <span class="top-cmdk-kbd">⌘K</span>
    </button>

    <button class="top-btn" title="New in this domain"><svg class="icon"><use href="#i-plus"/></svg></button>
    <button class="top-btn" title="Close Studio" id="close-studio"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>

  <!-- ── Content (the domain page) ─────────────────────────── -->
  <main class="content">
    <iframe id="content-frame" src="agent-detail.html" title="Studio content"></iframe>
  </main>

</div>

<script>
  const DARK = new Set(['ship-dark', 'console', 'contrast']);

  const applyTheme = (t) => {
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.classList.toggle('dark', DARK.has(t));
    const f = document.getElementById('content-frame');
    const apply = () => {
      try {
        const h = f.contentDocument.documentElement;
        h.setAttribute('data-theme', t);
        h.classList.toggle('dark', DARK.has(t));
      } catch(_) {}
    };
    apply();
    f.addEventListener('load', apply, { once: true });
  };

  // Listen for theme messages from the parent shell
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'theme') applyTheme(e.data.theme);
  });

  // Rail item navigation
  document.querySelectorAll('.rail-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.preventDefault();
      const href = item.getAttribute('data-href');
      if (!href || href === '#') return;
      document.querySelectorAll('.rail-item').forEach(x => x.classList.remove('is-active'));
      item.classList.add('is-active');
      document.getElementById('content-frame').src = href;
      // Breadcrumb update
      const label = item.querySelector('.rail-item-label')?.textContent || '';
      const crumb = item.getAttribute('data-crumb') || '';
      document.getElementById('crumb-domain').textContent = label;
      document.getElementById('crumb-current').textContent = crumb;
    });
  });

  // Close-studio bubbles up to the host shell (used by shell-mock state)
  const closeStudio = () => window.parent?.postMessage({ type: 'close-studio' }, '*');
  document.getElementById('exit-studio').addEventListener('click', (e) => { e.preventDefault(); closeStudio(); });
  document.getElementById('close-studio').addEventListener('click', closeStudio);
</script>

</body>
</html>
