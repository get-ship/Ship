packages:
  - "apps/docs"
  - "apps/shell"
  - "apps/site"
  - "apps/gateway"
  - "packages/*"
  - "apps/workers/*"

allowBuilds:
  esbuild: true
  rs-module-lexer: true
  sharp: true
  tree-sitter-cli: true
  workerd: true

catalog:
  drizzle-orm: "0.45.1"
  hono: "4.10.8"
  zod: "4.3.6"

enableGlobalVirtualStore: false

ignoredBuiltDependencies:
  - esbuild
  - lightningcss

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - lightningcss
  - sharp
  - workerd
