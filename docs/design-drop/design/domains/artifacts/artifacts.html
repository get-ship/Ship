<!doctype html>
<html lang="en" data-theme="ship-light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artifacts · Ship</title>
<link rel="stylesheet" href="../../../sui/ship.css" />
<link rel="stylesheet" href="artifacts.css" />
</head>
<body>

<!-- ░░ Review strip — design scaffolding, NOT part of the shipped view ░░ -->
<div class="rev">
  <span class="rev-tag">design · artifacts</span>
  <span class="rev-grp"><label>State</label>
    <span class="seg">
      <button data-state-btn="ok" aria-pressed="true">OK</button>
      <button data-state-btn="loading" aria-pressed="false">Loading</button>
      <button data-state-btn="empty" aria-pressed="false">Empty</button>
      <button data-state-btn="filtered" aria-pressed="false">No&nbsp;match</button>
      <button data-state-btn="error" aria-pressed="false">Error</button>
    </span>
  </span>
  <span class="rev-grp"><label>Layout</label>
    <span class="seg">
      <button data-layout-btn="split" aria-pressed="true">Split</button>
      <button data-layout-btn="drawer" aria-pressed="false">Drawer</button>
    </span>
  </span>
  <span class="rev-grp"><label>Theme</label>
    <span class="seg">
      <button data-theme-btn="ship-light" aria-pressed="true">Light</button>
      <button data-theme-btn="ship-dark" aria-pressed="false">Dark</button>
    </span>
  </span>
  <span class="rev-spacer"></span>
  <button class="rev-btn" id="play-live"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9z"/></svg>Play live</button>
  <button class="rev-btn" id="reset-live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Reset</button>
</div>

<!-- ░░ Shell scaffold ░░ -->
<div class="shell">
  <nav class="rail" aria-label="Primary">
    <div class="rail-brand">S</div>
    <a class="rail-tile" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></a>
    <a class="rail-tile" title="Agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></a>
    <a class="rail-tile" data-active title="Artifacts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></a>
    <a class="rail-tile" title="Collections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/></svg></a>
    <a class="rail-tile" title="Sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg></a>
    <a class="rail-tile" title="Git"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="9" r="3"/><path d="M18 12a6 6 0 0 1-6 6H6"/></svg></a>
  </nav>

  <div class="main">
    <div class="topbar">
      <div class="crumb"><span>Ship</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg><b>Artifacts</b></div>
      <span class="rev-spacer"></span>
    </div>

    <div class="view">
      <div class="wrap">

        <!-- header -->
        <header class="v-head">
          <div class="v-titles" data-sui="view header">
            <h1>Artifacts</h1>
            <p class="v-sub" id="count"></p>
          </div>
          <div class="v-actions">
            <button class="wb" id="wb" data-state="live" data-sui="sui-watch-badge" title="Live — Watch stream connected">
              <span class="wb-dot"></span><span class="wb-tx">Live</span>
            </button>
            <button class="btn btn-accent" data-upload data-sui="sui-artifact-upload">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Upload
            </button>
          </div>
        </header>

        <!-- filters -->
        <div class="filters" data-sui="sui-artifact-filters">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="f-q" type="search" placeholder="Search by name, id, actor…" aria-label="Search artifacts" />
          </div>
          <select class="sel" id="f-mime" aria-label="Filter by type">
            <option value="">All types</option>
            <option value="image">Images</option>
            <option value="text">Text &amp; Markdown</option>
            <option value="json">JSON</option>
            <option value="binary">Binary</option>
          </select>
          <select class="sel" id="f-actor" aria-label="Filter by actor">
            <option value="">All actors</option>
          </select>
          <select class="sel" id="f-age" aria-label="Filter by age">
            <option value="">Any age</option>
            <option value="24h">Last 24h</option>
            <option value="7d">Last 7 days</option>
            <option value="30d">Last 30 days</option>
          </select>
          <button class="lnk" id="clear-filters">Clear</button>
        </div>

        <!-- browser + preview -->
        <div class="split" id="split" data-layout="split">
          <div class="browser" id="browser" data-sui="sui-artifact-list"></div>
          <div class="preview" id="preview" data-sui="sui-artifact-preview"></div>
        </div>
        <div class="pv-backdrop" id="pvback"></div>

      </div>
    </div>
  </div>
</div>

<!-- toasts -->
<div class="toasts" id="toasts"></div>

<!-- confirm dialog -->
<div class="dlg-back" id="confirm" hidden>
  <div class="dlg" role="alertdialog" aria-modal="true">
    <h3>Delete artifact?</h3>
    <div class="dlg-body"></div>
    <div class="dlg-foot">
      <button class="btn btn-ghost btn-sm" data-no>Cancel</button>
      <button class="btn btn-danger btn-sm" data-yes>Delete</button>
    </div>
  </div>
</div>

<!-- upload dialog -->
<div class="dlg-back" id="upload" hidden>
  <div class="dlg" role="dialog" aria-modal="true">
    <h3 style="display:flex;justify-content:space-between;align-items:center">Upload artifact
      <button class="pv-x" id="upload-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </h3>
    <div class="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <div>Drop a file here, or <b>browse</b></div>
    </div>
    <div class="upl-field">
      <label for="upl-col">Collection <span class="muted" style="font-weight:400">(optional)</span></label>
      <select class="sel" id="upl-col"><option value="">No collection</option><option>notes</option><option>tasks</option></select>
    </div>
    <div class="dlg-foot">
      <button class="btn btn-ghost btn-sm" id="upload-cancel">Cancel</button>
      <button class="btn btn-accent btn-sm" id="upload-submit">Upload</button>
    </div>
  </div>
</div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1c1a17"/>
    <rect x="30" y="22" width="40" height="52" rx="5" fill="#2a2723" stroke="#d9923a" stroke-width="2"/>
    <path d="M58 22v12h12" fill="none" stroke="#d9923a" stroke-width="2"/>
    <path d="M38 46h24M38 54h24M38 62h16" stroke="#8a7f70" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
</template>

<script src="artifacts.js"></script>
</body>
</html>
