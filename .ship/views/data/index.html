<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data</title>
  <link rel="stylesheet" href="/api/runtime/assets/view-tokens.css">
  <script type="module" src="/api/runtime/assets/datastar.js"></script>
  <script type="module" src="/api/runtime/assets/ship-elements.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ship-view" id="data-app"
       data-signals='{
         collections: [],
         activeCollection: "",
         schema: null,
         items: [],
         loading: true,
         showCreate: false,
         createData: {},
         editingId: null,
         editData: {},
         filterField: "",
         filterValue: ""
       }'>
    <div class="data-wrap">

      <!-- Header -->
      <div class="data-head">
        <div>
          <h2 class="data-title">Data</h2>
          <p class="data-sub" data-text="items.length + ' item' + (items.length !== 1 ? 's' : '')"></p>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="data-toolbar">
        <select class="data-select" data-model="activeCollection" data-on-change="loadCollection()">
          <template data-for="c in collections">
            <option data-attr-value="c.id" data-text="(c.name || c.id) + ' (' + c.field_count + ')'"></option>
          </template>
        </select>
        <button class="data-btn" data-on-click="$showCreate = !$showCreate" data-show="schema">+ New</button>
        <div class="data-filter" data-show="schema">
          <select class="data-filter-select" data-model="filterField">
            <option value="">All items</option>
            <template data-for="[name, def] in Object.entries(schema?.fields || {})">
              <option data-attr-value="name" data-text="name"></option>
            </template>
          </select>
          <input class="data-filter-input" placeholder="Filter value..." data-model="filterValue"
                 data-on-keyup__debounce.300ms="runQuery()" data-show="filterField">
        </div>
        <span class="data-count" data-text="items.length + ' result' + (items.length !== 1 ? 's' : '')"></span>
      </div>

      <!-- Create form -->
      <div data-show="showCreate && schema" class="data-form">
        <div class="data-form-head">
          <span class="data-form-title" data-text="'New ' + activeCollection"></span>
          <button class="data-btn-icon" data-on-click="$showCreate = false" title="Close">✕</button>
        </div>
        <div id="create-fields"></div>
        <div class="data-form-actions">
          <button class="data-btn" data-on-click="submitCreate()">Create</button>
          <button class="data-btn data-btn-ghost" data-on-click="$showCreate = false">Cancel</button>
        </div>
      </div>

      <!-- Loading -->
      <div data-show="loading" class="data-empty">
        <p>Loading...</p>
      </div>

      <!-- Empty state -->
      <div data-show="!loading && schema && items.length === 0" class="data-empty">
        <div class="data-empty-icon">📋</div>
        <p>No items in <strong data-text="activeCollection"></strong></p>
        <button class="data-btn" data-on-click="$showCreate = true" style="margin-top:12px">Create first item</button>
      </div>

      <!-- No collections -->
      <div data-show="!loading && !schema" class="data-empty">
        <div class="data-empty-icon">📦</div>
        <p>No collections defined</p>
        <p class="data-empty-hint">Add a schema to <code>.ship/schemas/</code></p>
      </div>

      <!-- Table -->
      <div data-show="!loading && items.length > 0" id="data-table-container"></div>

      <!-- Edit panel -->
      <div data-show="editingId" class="data-edit-panel">
        <div class="data-form-head">
          <span class="data-form-title">Edit item</span>
          <button class="data-btn-icon" data-on-click="$editingId = null" title="Close">✕</button>
        </div>
        <div id="edit-fields"></div>
        <div class="data-form-actions">
          <button class="data-btn" data-on-click="submitEdit()">Save</button>
          <button class="data-btn data-btn-ghost" data-on-click="$editingId = null">Cancel</button>
          <button class="data-btn data-btn-danger" data-on-click="deleteItem(editingId); $editingId = null"
                  style="margin-left:auto">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // ── Collections SDK ──────────────────────────────────────────────
    const Collections = {
      async list() {
        return (await this._get('/api/collections')).data || [];
      },
      async schema(id) {
        return (await this._get(`/api/collections/${id}/schema`)).data;
      },
      async query(id, filter = {}, sort = {}, limit = 200) {
        return (await this._post(`/api/collections/${id}/query`, {
          collection: id, filter, sort, limit,
        })).data || [];
      },
      async create(collection, data, id) {
        const body = { data };
        if (id) body.id = id;
        return this._post(`/api/collections/${collection}/items`, body);
      },
      async get(collection, id) {
        return (await this._get(`/api/collections/${collection}/items/${id}`)).data;
      },
      async update(collection, id, data) {
        return this._put(`/api/collections/${collection}/items/${id}`, { data });
      },
      async delete(collection, id) {
        return this._delete(`/api/collections/${collection}/items/${id}`);
      },
      async _get(path) {
        const r = await fetch(path, { credentials: 'include' });
        return r.json();
      },
      async _post(path, body) {
        const r = await fetch(path, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        return r.json();
      },
      async _put(path, body) {
        const r = await fetch(path, {
          method: 'PUT', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        return r.json();
      },
      async _delete(path) {
        const r = await fetch(path, { method: 'DELETE', credentials: 'include' });
        return r.json();
      },
    };

    // ── State management ─────────────────────────────────────────────
    const app = document.getElementById('data-app');
    const state = () => app.__signals || {};

    // Expose to Datastar onclick handlers.
    window.loadCollection = loadCollection;
    window.runQuery = runQuery;
    window.submitCreate = submitCreate;
    window.submitEdit = submitEdit;
    window.deleteItem = deleteItem;
    window.editItem = editItem;

    // ── Init ─────────────────────────────────────────────────────────
    async function init() {
      const collections = await Collections.list();
      updateSignal('collections', collections);
      updateSignal('loading', false);

      if (collections.length > 0) {
        updateSignal('activeCollection', collections[0].id);
        await loadCollection();
      }

      // SSE subscription for live updates.
      connectSSE();
    }

    async function loadCollection() {
      const id = getSignal('activeCollection');
      if (!id) return;

      updateSignal('loading', true);
      updateSignal('showCreate', false);
      updateSignal('editingId', null);
      updateSignal('filterField', '');
      updateSignal('filterValue', '');

      const schema = await Collections.schema(id);
      updateSignal('schema', schema);

      const items = await Collections.query(id);
      updateSignal('items', items);
      updateSignal('loading', false);

      renderTable();
      renderCreateFields();
    }

    async function runQuery() {
      const id = getSignal('activeCollection');
      const field = getSignal('filterField');
      const value = getSignal('filterValue');

      const filter = {};
      if (field && value) {
        filter[field] = { '$contains': value };
      }

      const items = await Collections.query(id, filter);
      updateSignal('items', items);
      renderTable();
    }

    // ── Table rendering ──────────────────────────────────────────────
    function renderTable() {
      const schema = getSignal('schema');
      const items = getSignal('items');
      if (!schema || !items.length) {
        document.getElementById('data-table-container').innerHTML = '';
        return;
      }

      const fields = Object.entries(schema.fields);
      const headers = fields.map(([name]) =>
        `<th class="data-th" onclick="sortBy('${name}')">${name}<span class="data-sort-icon">↕</span></th>`
      ).join('');

      const rows = items.map(item => {
        const cells = fields.map(([name, def]) => renderCell(item, name, def)).join('');
        return `<tr class="data-row" onclick="editItem('${item.id}')">
          <td class="data-cell data-cell-id" title="${item.id}">${item.id.slice(0, 10)}</td>
          ${cells}
          <td class="data-cell data-cell-time">${formatTime(item.updated_at)}</td>
        </tr>`;
      }).join('');

      document.getElementById('data-table-container').innerHTML =
        `<table class="data-table">
          <thead><tr>
            <th class="data-th" style="width:90px">ID</th>
            ${headers}
            <th class="data-th" style="width:100px">Updated</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function renderCell(item, name, def) {
      const val = item.data?.[name];
      const defaults = def.default;

      // Apply default if value is null/undefined.
      const effective = (val === null || val === undefined) ? defaults : val;

      if (effective === null || effective === undefined) {
        return `<td class="data-cell data-cell-null">—</td>`;
      }

      switch (def.field_type) {
        case 'enum':
          return `<td class="data-cell"><ship-chip>${effective}</ship-chip></td>`;
        case 'boolean':
          // SQLite stores booleans as integers.
          const boolVal = effective === true || effective === 1;
          return `<td class="data-cell">${boolVal
            ? '<span class="data-bool data-bool-yes">✓</span>'
            : '<span class="data-bool data-bool-no">✗</span>'}</td>`;
        case 'number':
          return `<td class="data-cell data-cell-number">${effective}</td>`;
        case 'date':
          return `<td class="data-cell">${String(effective).slice(0, 10)}</td>`;
        case 'file':
          return `<td class="data-cell data-cell-file" title="${effective}">📎 ${String(effective).split('/').pop()}</td>`;
        case 'markdown':
          const preview = String(effective).slice(0, 100);
          return `<td class="data-cell data-cell-markdown" title="${escapeHtml(effective)}">${escapeHtml(preview)}${effective.length > 100 ? '…' : ''}</td>`;
        case 'array':
          if (Array.isArray(effective)) {
            const chips = effective.slice(0, 5).map(v => `<ship-chip>${escapeHtml(String(v))}</ship-chip>`).join(' ');
            const more = effective.length > 5 ? `<span class="data-more">+${effective.length - 5}</span>` : '';
            return `<td class="data-cell">${chips}${more}</td>`;
          }
          return `<td class="data-cell data-cell-null">—</td>`;
        case 'object':
          if (effective && typeof effective === 'object') {
            const keys = Object.keys(effective);
            const preview = keys.slice(0, 3).join(', ');
            const more = keys.length > 3 ? ` +${keys.length - 3}` : '';
            return `<td class="data-cell data-cell-object" title="${escapeHtml(JSON.stringify(effective, null, 2))}">{ ${preview}${more} }</td>`;
          }
          return `<td class="data-cell data-cell-null">—</td>`;
        default:
          return `<td class="data-cell">${escapeHtml(String(effective))}</td>`;
      }
    }

    // ── Create form ──────────────────────────────────────────────────
    function renderCreateFields() {
      const schema = getSignal('schema');
      if (!schema) return;
      document.getElementById('create-fields').innerHTML = renderFieldInputs(schema.fields, 'create');
    }

    function renderFieldInputs(fields, prefix) {
      return Object.entries(fields).map(([name, def]) => {
        const req = def.required ? '<span class="data-req">*</span>' : '';
        let input;

        if (def.field_type === 'enum' && def.values) {
          const opts = ['<option value="">—</option>',
            ...def.values.map(v => `<option value="${v}">${v}</option>`)].join('');
          input = `<select class="data-input" id="${prefix}-${name}">${opts}</select>`;
        } else if (def.field_type === 'boolean') {
          input = `<label class="data-checkbox"><input type="checkbox" id="${prefix}-${name}"> Yes</label>`;
        } else if (def.field_type === 'number') {
          input = `<input type="number" step="any" class="data-input" id="${prefix}-${name}" placeholder="0">`;
        } else if (def.field_type === 'markdown') {
          input = `<textarea class="data-input data-textarea" id="${prefix}-${name}" rows="4" placeholder="${name}"></textarea>`;
        } else if (def.field_type === 'array') {
          input = `<input type="text" class="data-input" id="${prefix}-${name}" placeholder='["item1", "item2"]'>`;
        } else if (def.field_type === 'object') {
          input = `<input type="text" class="data-input" id="${prefix}-${name}" placeholder='{"key": "value"}'>`;
        } else {
          input = `<input type="text" class="data-input" id="${prefix}-${name}" placeholder="${name}">`;
        }

        return `<div class="data-field-row">
          <label class="data-field-label">${name}${req}</label>
          <div class="data-field-input">${input}</div>
        </div>`;
      }).join('');
    }

    function collectFormData(prefix) {
      const schema = getSignal('schema');
      const data = {};
      for (const [name, def] of Object.entries(schema.fields)) {
        const el = document.getElementById(`${prefix}-${name}`);
        if (!el) continue;
        if (def.field_type === 'boolean') {
          data[name] = el.checked;
        } else if (def.field_type === 'number') {
          if (el.value !== '') data[name] = Number(el.value);
        } else if (def.field_type === 'array' || def.field_type === 'object') {
          if (el.value) {
            try { data[name] = JSON.parse(el.value); } catch {}
          }
        } else {
          if (el.value) data[name] = el.value;
        }
      }
      return data;
    }

    async function submitCreate() {
      const data = collectFormData('create');
      const result = await Collections.create(getSignal('activeCollection'), data);
      if (result.ok) {
        updateSignal('showCreate', false);
        await runQuery();
      } else {
        alert(result.error || 'Failed to create');
      }
    }

    // ── Edit ──────────────────────────────────────────────────────────
    function editItem(id) {
      const items = getSignal('items');
      const item = items.find(i => i.id === id);
      if (!item) return;

      updateSignal('editingId', id);

      const schema = getSignal('schema');
      document.getElementById('edit-fields').innerHTML = renderFieldInputs(schema.fields, 'edit');

      // Populate fields with current values.
      requestAnimationFrame(() => {
        for (const [name, def] of Object.entries(schema.fields)) {
          const el = document.getElementById(`edit-${name}`);
          if (!el) continue;
          const val = item.data?.[name];
          if (val === null || val === undefined) continue;

          if (def.field_type === 'boolean') {
            el.checked = val === true || val === 1;
          } else if (def.field_type === 'array' || def.field_type === 'object') {
            el.value = JSON.stringify(val);
          } else {
            el.value = val;
          }
        }
      });
    }

    async function submitEdit() {
      const id = getSignal('editingId');
      const data = collectFormData('edit');
      const result = await Collections.update(getSignal('activeCollection'), id, data);
      if (result.ok) {
        updateSignal('editingId', null);
        await runQuery();
      } else {
        alert(result.error || 'Failed to update');
      }
    }

    async function deleteItem(id) {
      if (!confirm('Delete this item?')) return;
      await Collections.delete(getSignal('activeCollection'), id);
      await runQuery();
    }

    // ── SSE live updates ─────────────────────────────────────────────
    function connectSSE() {
      const es = new EventSource('/api/runtime/events', { withCredentials: true });
      es.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event_type?.startsWith('collection.')) {
            // Refresh on any collection mutation.
            runQuery();
          }
        } catch {}
      };
      es.onerror = () => {
        // Reconnect after delay.
        setTimeout(connectSSE, 5000);
      };
    }

    // ── Helpers ───────────────────────────────────────────────────────
    function getSignal(key) {
      try {
        return app._ds_signals?.[key]?.value ?? app.__signals?.[key];
      } catch {
        return undefined;
      }
    }

    function updateSignal(key, value) {
      // Datastar stores signals on the element. Update them directly.
      if (app._ds_signals?.[key]) {
        app._ds_signals[key].value = value;
      }
      // Also store locally for our own reads.
      if (!app.__signals) app.__signals = {};
      app.__signals[key] = value;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatTime(ts) {
      if (!ts) return '—';
      return ts.slice(0, 16).replace('T', ' ');
    }

    function sortBy(field) {
      const items = getSignal('items') || [];
      items.sort((a, b) => {
        const va = a.data?.[field], vb = b.data?.[field];
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        return va < vb ? -1 : va > vb ? 1 : 0;
      });
      updateSignal('items', [...items]);
      renderTable();
    }

    // ── Start ────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
