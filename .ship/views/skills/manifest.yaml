# yaml-language-server: $schema=https://raw.githubusercontent.com/madvib/ship/main/schemas/view-manifest.schema.json
name: skills
type: html
rail:
  label: Skills
  icon: sparkles
events:
  - config.changed
  - workspace.changed
# Heavy island bundles this view needs. `editor` pulls in both the
# code-editor and markdown-editor bundles; the detail pane embeds
# <ship-markdown-editor> when rendering SKILL.md and .md files.
packs:
  - editor
