<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specs</title>
<script>window.__shipToken = "{{SHIP_TOKEN}}";</script>
<link rel="stylesheet" href="http://localhost:9315/api/runtime/assets/view-tokens.css">
<script type="module" src="http://localhost:9315/api/runtime/assets/datastar.js"></script>
<script type="module" src="http://localhost:9315/api/runtime/assets/ship-elements.js"></script>
<style>
  /* View-local layout only — visual primitives live inside <ship-*> shadow DOM. */
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

  /* Left rail */
  .rail { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .rail-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .rail-title { font-size: 13px; font-weight: 600; }
  .spec-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }

  /* Main pane */
  .main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .main-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
  .main-body { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  .editor-wrap { padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  ship-textarea.editor { flex: 1; display: flex; min-height: 0; }
  ship-textarea.editor::part(textarea) { height: 100%; min-height: 0; }

  /* Metadata panel */
  .meta { border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: var(--muted); }
  .meta-hint { font-size: 11px; color: var(--muted-foreground); margin-bottom: 4px; }

  /* Inline status text */
  .dirty-indicator { font-size: 11px; color: var(--primary); font-weight: 500; }
  .placeholder { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--muted-foreground); font-size: 13px; }
</style>
</head>
<body>
<div class="app"
     data-signals-selected-id=""
     data-signals-filter="'draft'"
     data-signals-dirty="false"
     data-signals-title=""
     data-signals-body=""
     data-signals-pipeline=""
     data-signals-status="'draft'"
     data-signals-criteria="[]"
     data-signals-criteria-text="''"
     data-signals-scope="[]"
     data-signals-scope-text="''"
     data-signals-vars="{}"
     data-signals-vars-text="''"
     data-signals-confirm-delete="false"
     data-init="@get('http://localhost:9315/api/runtime/view/specs/sse?token={{SHIP_TOKEN}}', {requestCancellation: 'disabled'})">

  <!-- Left rail -->
  <aside class="rail">
    <div class="rail-header">
      <div class="rail-title">Specs</div>
      <ship-button variant="solid" size="sm"
                   data-on:click="@post('/api/runtime/specs', {contentType: 'json', body: JSON.stringify({title: 'New spec', body: '# New spec\n\n'})})">
        + New
      </ship-button>
    </div>
    <ship-tabs variant="segmented" role="tablist" active="draft"
               data-attr-active="$filter"
               data-on-ship-tab-change="$filter = evt.detail.name">
      <ship-tab name="draft" label="Draft"></ship-tab>
      <ship-tab name="ready" label="Ready"></ship-tab>
      <ship-tab name="launched" label="Launched"></ship-tab>
      <ship-tab name="completed" label="Completed"></ship-tab>
    </ship-tabs>
    <div id="spec-list" class="spec-list">
      <ship-empty-state variant="placeholder">Connecting...</ship-empty-state>
    </div>
  </aside>

  <!-- Main pane -->
  <section class="main">
    <div data-show="!$selectedId" class="placeholder">Select a spec from the list, or click + New</div>

    <div data-show="$selectedId" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
      <header class="main-header">
        <ship-input variant="ghost" size="lg" placeholder="Spec title"
                    style="flex: 1;"
                    data-bind-title data-on:ship-input="$dirty = true"></ship-input>
        <ship-select data-bind-pipeline data-on:ship-change="$dirty = true">
          <option value="">No pipeline</option>
          <option value="tdd">tdd</option>
          <option value="plan-then-build">plan-then-build</option>
          <option value="ship-it">ship-it</option>
        </ship-select>
        <ship-badge data-attr-tone="$status === 'failed' ? 'destructive' : ($status === 'completed' || $status === 'ready' ? 'success' : ($status === 'launched' ? 'warning' : 'muted'))"
                    data-text="$status"></ship-badge>
      </header>

      <div class="main-body">
        <div class="editor-wrap">
          <ship-label>Markdown body</ship-label>
          <ship-textarea class="editor" variant="code" placeholder="# Spec body..."
                         data-bind-body data-on:ship-input="$dirty = true"></ship-textarea>
        </div>

        <aside class="meta">
          <ship-field>
            <ship-label slot="label">Acceptance criteria</ship-label>
            <div class="meta-hint">One per line</div>
            <ship-textarea size="sm" rows="4"
                           data-bind-criteria-text
                           data-on:ship-input="$dirty = true; $criteria = $criteriaText.split('\n').filter(l => l.trim())"
                           placeholder="Tests pass&#10;Docs updated"></ship-textarea>
          </ship-field>

          <ship-field>
            <ship-label slot="label">Scope</ship-label>
            <div class="meta-hint">One path per line</div>
            <ship-textarea size="sm" rows="3"
                           data-bind-scope-text
                           data-on:ship-input="$dirty = true; $scope = $scopeText.split('\n').filter(l => l.trim())"
                           placeholder="crates/core/runtime/&#10;apps/shipd/"></ship-textarea>
          </ship-field>

          <ship-field>
            <ship-label slot="label">Variables</ship-label>
            <div class="meta-hint">KEY=value per line</div>
            <ship-textarea size="sm" rows="3"
                           data-bind-vars-text
                           data-on:ship-input="$dirty = true; $vars = Object.fromEntries($varsText.split('\n').filter(l => l.includes('=')).map(l => { const i = l.indexOf('='); return [l.slice(0, i).trim(), l.slice(i+1).trim()]; }))"
                           placeholder="TARGET=stable&#10;VERSION=1.0"></ship-textarea>
          </ship-field>
        </aside>
      </div>

      <ship-toolbar variant="bordered" justify="end">
        <span class="dirty-indicator" data-show="$dirty">Unsaved changes</span>
        <span slot="spacer"></span>
        <ship-button variant="outline" tone="destructive" size="sm"
                     data-show="$selectedId"
                     data-on:click="$confirmDelete = true">Delete</ship-button>
        <ship-button variant="outline" size="sm"
                     data-show="$status === 'ready' || $status === 'draft'"
                     data-on:click="@post('/api/runtime/specs/' + $selectedId + '/launch')">Launch Pipeline</ship-button>
        <ship-button variant="solid" size="sm"
                     data-show="$dirty"
                     data-on:click="@put('/api/runtime/specs/' + $selectedId, {contentType: 'json', body: JSON.stringify({title: $title, body: $body, pipeline: $pipeline ? $pipeline : null, status: $status, criteria: $criteria, scope: $scope, vars: $vars})}); $dirty = false">Save</ship-button>
      </ship-toolbar>

      <!-- Delete confirmation — replaces window.confirm() -->
      <ship-alert-dialog
        tone="destructive"
        confirm-label="Delete"
        cancel-label="Cancel"
        data-attr-open="$confirmDelete"
        data-on-ship-cancel="$confirmDelete = false"
        data-on-ship-confirm="@delete('/api/runtime/specs/' + $selectedId); $selectedId = ''; $confirmDelete = false">
        <span slot="title">Delete spec</span>
        This removes the spec from the project. This cannot be undone.
      </ship-alert-dialog>
    </div>
  </section>
</div>
</body>
</html>
