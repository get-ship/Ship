name: smoke
description: >
  Fast pipeline mechanics smoke test. Pure shell steps, zero LLM cost.
  Exercises dispatch, step advancement, git-evidence gathering, and
  merge flow. Runs end to end in under 30 seconds. Use this as the
  iteration loop for runtime changes — NOT tdd.yaml, which burns a
  real agent toolchain every run.

steps:
  - run: |
      echo "smoke step-1: scratch work" > smoke.txt
      git add smoke.txt
      git -c user.name=smoke -c user.email=smoke@ship.dev \
        commit -m "smoke: step-1 creates smoke.txt"

  - run: |
      echo "smoke step-2: modify" >> smoke.txt
      git -c user.name=smoke -c user.email=smoke@ship.dev \
        commit -am "smoke: step-2 appends to smoke.txt"

  - run: |
      echo "smoke step-3: verify" >&2
      test -f smoke.txt && grep -q "step-2" smoke.txt
