name: tdd
description: Test-driven development — RED tests first, GREEN implementation second, gate, merge.

steps:
  - id: test
    type: agent
    agent: test-writer
    model: sonnet
    vars:
      phase: red
      instruction: >
        Write tests for behaviors described in the job spec that DO NOT EXIST YET.
        Every test you write MUST FAIL when you run it. If a test passes, delete it —
        the behavior already exists and doesn't need implementation. Commit only
        failing tests. The next agent will make them pass.

  - id: impl
    type: agent
    agent: "{{ impl_agent }}"
    after: [test]
    vars:
      phase: green
      instruction: >
        There are failing tests from the previous step. Make them pass with the
        minimum code necessary. Do not add features beyond what the tests require.
        Run the tests after each change. Stop when all tests pass.

  - id: gate
    type: gate
    agent: reviewer
    model: sonnet
    after: [impl]

  - id: merge
    type: merge
    after: [gate]
