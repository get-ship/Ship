name: tdd
description: Test-driven development — tests first, implement second, gate.
agents: [test-writer, "{{ impl_agent }}", reviewer]
step_specs:
  - |
    # Test writer — step 1 of 3

    Write failing tests that encode the acceptance criteria from
    `.artifacts/pipeline/spec.md`. Do not touch production code.

    Output contract for the impl stage:
    - Name every new test file; the impl agent is forbidden from editing
      them and the reviewer will diff-check.
    - Each test must fail for a reason tied to a specific acceptance
      criterion — never `unimplemented!()` or a bare `todo!()`.
    - Cover the golden path and at least one meaningful failure path per
      criterion.
    - Keep tests in the crate(s) listed in `spec.md`'s scope; do not
      reach outside.

    When finished, summarize the contract you set for impl in
    `mcp__ship__step_done({ summary })` — e.g. "added 4 tests in
    `crates/foo/tests/bar.rs` covering X/Y/Z".

  - |
    # Implementer — step 2 of 3

    Make the tests from step 1 pass. Read
    `.artifacts/pipeline/01-step-1.md` for the contract and
    `.artifacts/pipeline/spec.md` for scope.

    Rules:
    - Do **not** modify, delete, or weaken any test from step 1. The reviewer
      will diff-check and fail you for test-churn.
    - Write production code only in the crates/files listed in `spec.md`'s
      scope.
    - `just build` and `cargo test -p <crate>` must pass at step end.
    - If a test is genuinely wrong, `log_progress` the reason and stop —
      do not silently edit it.

    Signal completion with `mcp__ship__step_done` once tests pass on a
    clean build. Summary should cite production files changed and the
    passing test count.

  - |
    # Reviewer — step 3 of 3

    Grade the impl stage against:
    1. `.artifacts/pipeline/spec.md` acceptance criteria.
    2. `.artifacts/pipeline/01-step-1.md` test-writer contract.
    3. Diff integrity: production code must have changed, tests from step 1
       must be unchanged (except trivial whitespace).

    Verdict: call `mcp__ship__step_done` with a clear pass/fail summary
    citing the evidence. On fail, quote the offending diff hunk in the
    summary so the retry loop has something concrete to fix.
