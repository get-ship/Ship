# Ship agent hooks — compiled into provider-native hook configs by `ship use`.
# These fire regardless of terminal type (tmux, kitty, bare shell).

# Block any agent from deleting database files
[[hooks]]
id = "protect-databases"
trigger = "PreToolUse"
match_tools = ["Bash"]
command = """
if echo "$TOOL_INPUT" | grep -qE 'rm\s.*\.(db|sqlite|sqlite3)|rm\s.*platform\.db|rm\s.*events\.db'; then
  echo "BLOCKED: Agents cannot delete database files. Ask the human."
  exit 1
fi
"""

[[hooks]]
id = "job-session-end"
trigger = "Stop"
command = """
if [ -n "$SHIP_MESH_ID" ] && [ -f "$HOME/.ship/network.port" ]; then
  PORT=$(cat "$HOME/.ship/network.port")
  curl -s -X POST "http://127.0.0.1:$PORT/api/runtime/jobs/end" \
    -H 'Content-Type: application/json' \
    -d "{\"slug\": \"$SHIP_MESH_ID\"}" > /dev/null 2>&1
fi
"""
