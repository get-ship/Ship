<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ship-set: Lit vs Sail — side by side</title>
  <link rel="stylesheet" href="/api/assets/view-tokens.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-body, system-ui);
      background: var(--background, #fafafa);
      color: var(--foreground, #111);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.6rem 1.25rem;
      border-block-end: 1px solid var(--border, #e5e5e5);
      background: var(--card, white);
    }
    .topbar h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .topbar .meta {
      font-size: 0.8rem;
      color: var(--muted-foreground, #666);
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      height: calc(100vh - 48px);
    }
    .col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-inline-end: 1px solid var(--border, #e5e5e5);
    }
    .col:last-child { border-inline-end: 0; }
    .col-header {
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-foreground, #888);
      background: var(--muted, #f3f3f3);
      border-block-end: 1px solid var(--border, #e5e5e5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-header .source {
      font-family: var(--font-mono, ui-monospace, Menlo, monospace);
      font-size: 0.7rem;
      color: var(--muted-foreground, #999);
    }
    iframe {
      flex: 1 1 auto;
      border: 0;
      width: 100%;
      background: var(--background, #fafafa);
    }
    @media (max-width: 720px) {
      .pair { grid-template-columns: 1fr; height: auto; }
      .col { border-inline-end: 0; border-block-end: 1px solid var(--border, #e5e5e5); }
      iframe { height: 100vh; }
    }
  </style>
  <script defer src="/_sail/hmr-client.js"></script>
</head>
<body>
  <div class="topbar">
    <h1>ship-set: Lit (left) ↔ Sail (right)</h1>
    <div class="meta">
      <a href="/_sail/demo/lit" target="_blank">Lit only</a> ·
      <a href="/_sail/demo/sail" target="_blank">Sail only</a>
    </div>
  </div>
  <div class="pair">
    <div class="col">
      <div class="col-header">
        <span>Lit (existing ship-set)</span>
        <span class="source">packages/ship-set/src/web-components/</span>
      </div>
      <iframe src="/_sail/demo/lit" title="Lit ship-set"></iframe>
    </div>
    <div class="col">
      <div class="col-header">
        <span>Sail port</span>
        <span class="source">packages/ship-set-sail/components/</span>
      </div>
      <iframe src="/_sail/demo/sail" title="Sail ship-set"></iframe>
    </div>
  </div>
</body>
</html>
