# Codegen for HELM (helm, TS/Hono) — the only remaining buf.gen.* target
# in this repo. Post-multi-repo-cleanup (feat/next):
#   - buf.gen.yaml     DELETED. Output target was apps/gateway/src/proto/
#                      gen, but apps/gateway is gone (gateway lives in
#                      ship-edge now). No consumer.
#   - buf.gen.sdk.yaml DELETED. Output target was packages/sdk/src/gen,
#                      but packages/sdk is gone (SDK lives in
#                      ship-contracts now). The SDK's source-of-truth
#                      codegen runs from ship-contracts using its own
#                      buf.gen.yaml, not from here.
#
# This target INCLUDES the launch-internal `ship/internal` package
# (ship.internal.v1.GitService) that the public SDK excludes. Same
# proto/ tree, different generation target -> Helm sees the internal
# Post-P3 (the helm/web → ship-apps move): the descriptor is consumed by
# the SPA — `apps/helm/src/git-client.ts` calls `createClient(GitService, …)`
# — so the gen output lands in the SPA's source tree, not the helm
# server's. The Hono server in helm/ dials Connect on the server side
# using Connect's generics (`routes/dispatch.ts` reaches helmd via
# `helmdRpc`); no generated client is needed server-side.
#
# Output: `../ship-apps/apps/helm/src/gen/ship/internal/v1/`
# Run from the ship repo root:
#   buf generate --template buf.gen.helm.yaml
version: v2
inputs:
  - directory: proto
    paths:
      - proto/ship/internal
plugins:
  - local: protoc-gen-es
    out: ../ship-apps/apps/helm/src/gen
    opt:
      - target=ts
      - import_extension=js
