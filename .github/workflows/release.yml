name: Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. desktop-v0.1.0-alpha)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --config tauri.bundle-runtime.conf.json
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --config tauri.bundle-runtime.conf.json
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --config tauri.bundle-runtime.conf.json

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/host
        run: bun install

      # The desktop bundle carries the runtime: tauri.bundle-runtime.conf.json
      # declares shipctl + shipd as bundle.externalBin, and Tauri resolves
      # each entry to a target-triple-suffixed file at build time. Stage
      # both binaries under apps/host/binaries/ before tauri-action runs.
      - name: Build bundled runtime (shipctl + shipd)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p shipctl -p shipd
          mkdir -p apps/host/binaries
          ext=''
          case '${{ matrix.target }}' in *windows*) ext='.exe' ;; esac
          cp "target/${{ matrix.target }}/release/shipctl${ext}" "apps/host/binaries/shipctl-${{ matrix.target }}${ext}"
          cp "target/${{ matrix.target }}/release/shipd${ext}"   "apps/host/binaries/shipd-${{ matrix.target }}${ext}"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing & notarization — optional for alpha
          # Add these secrets when ready for notarized public release
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/host
          tagName: ${{ github.ref_name }}
          releaseName: Ship ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG](https://github.com/get-ship/ship/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          args: ${{ matrix.args }}
