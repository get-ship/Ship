name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --features unstable -- -D warnings
      - name: Build (stable)
        run: cargo build -p ship-cli -p mcp -p shipd
      - name: Build (unstable)
        run: cargo build --features unstable -p ship-cli -p mcp -p shipd
      - name: Test
        run: cargo test --workspace
