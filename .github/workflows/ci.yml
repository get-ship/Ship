name: CI

# Post-multi-repo split (chore/umbrella-resolution phase 1, 2026-06-28).
# This CI is scoped to the **ship** repo's owned surfaces only:
#   - The Rust daemon (shipd, ship-cli, ship-host, helmd) and the L0/L1
#     platform (crates/*).
#   - The xtask codegen that operates on this repo's source (gen-fixtures,
#     gen-events, the lints).
#   - The contract-conformance Rust test (tests/contract).
#   - The agents Bun test (tests/agents) — boots shipd and exercises
#     its ConnectRPC + harness adapter registry.
#
# Gates that moved to other repos' CI:
#
#   ship-apps  — apps/hub/test/e2e/* (Playwright), apps/hub/test/*,
#                apps/spaces/*, packages/components/ship/*,
#                packages/arcade-engine, apps/docs, the Astro site build,
#                skill-docs drift, deck package names, landing bundle
#                coverage, apps/shell typecheck (and the shell's vitest
#                suites).
#   sui        — tests/integration/* (resource symmetry), tests/parity/*,
#                tests/perf/*, packages/{sui,deck,components/sui}/* vitest
#                suites, sui-compiler fuzz harnesses, tokens.json drift,
#                shape-conformance integration test.
#   ship-contracts — packages/{sdk,sdk-client,cloud-types,gateway-sdk}/*
#                  typecheck, proto codegen, SDK manifest gen.
#
# See ARCHITECTURE.md in this repo's rules/ for the bounded-context map.

on:
  push:
    branches: [main, 'chore/**', 'job/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install JS deps (apps/host only; no in-repo test workspaces)
        run: bun install --frozen-lockfile || bun install
      # License audit: walk the resolved dep tree and fail on copyleft.
      - name: License audit (no copyleft)
        run: node scripts/check-licenses.mjs
      # Proto contract fixtures now live in the ship-contracts repo (the
      # proto SSOT post-multi-repo-cleanup). Drift detection for them
      # moved to ship-contracts CI; the contract tests in this repo
      # read fixtures via the `PROTO_ROOT` env var (set by build.rs
      # from `DEP_SHIP_PROTO_PROTO_DIR` — the proto root published by
      # ship-proto's own build.rs via `links = "ship-proto"`). No env
      # var is required for a normal build; `SHIP_PROTO_DIR` is the
      # supported override for alternate layouts.
      # In-repo lints: layer boundaries + import direction + anti-theater.
      - name: Lint layer boundaries
        run: cargo run -p xtask --quiet -- lint-layers
      - name: Lint import-level layer direction
        run: cargo run -p xtask --quiet -- lint-imports
      - name: Lint test-theater (R18 — no source-grep in tests)
        run: cargo run -p xtask --quiet -- lint-anti-theater
      - name: Check silent-error patterns
        run: bash scripts/lint/check-silent-errors.sh
      - name: Check migration discipline (naming + immutability)
        run: |
          bash scripts/lint/check-migration-naming.sh
          bash scripts/lint/check-migration-discipline.sh
      # Justfile recipe shell-syntax smoke (recipe bodies are opaque to
      # `just`, so a bash typo parses fine at the just layer yet breaks
      # `just <recipe>` at runtime).
      - name: Lint Justfile recipe shell syntax
        run: just lint-justfile
      # ship-host excluded: needs webkit2gtk/libsoup (release.yml
      # tauri-action provisions it).
      - name: Clippy
        run: cargo clippy --workspace --exclude ship-host --features unstable,ship-code -- -D warnings
      - name: Build shipd (stable, ship-standard)
        # shipd defaults to ship-standard — no harness-driver stack.
        # The harness-on dispatch path is exercised by the `Build (unstable)`
        # arm below.
        run: cargo build -p ship-cli -p shipd
      - name: Build shipd (unstable, harness-on)
        run: cargo build --features unstable,ship-code -p ship-cli -p shipd
      - name: Build shipd (stable, harness-on)
        run: cargo build --features ship-code -p ship-cli -p shipd
      # gen-skills is native in ship-contracts (xtask-contracts): it reads
      # ship-proto's descriptor + proto/fixtures and writes skills/sdk/
      # there. The ship repo no longer tracks `skills/sdk/`.
      # Contract conformance: every event fixture roundtrips Rust↔JSON
      # and matches the registry's metadata (scope/retention/stability).
      - name: Contract conformance
        run: cargo test -p ship-contract-tests
      # Isolation live cells (T1/T2) run as part of `cargo test
      # --workspace` but skip without a substrate. Installing podman +
      # building the sidecar bin makes the Linux podman cells execute
      # for real. T3 (Firecracker/KVM) and mac/Windows stay manual.
      - name: Install podman + pull test image (isolation live cells)
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          podman pull ubuntu:24.04
      - name: Build ship-sidecar (the live cells drive it)
        run: cargo build -p ship-sidecar
      - name: Cargo test
        run: cargo test --workspace --exclude ship-host --features unstable
      # Daemon correctness: boot shipd and exercise its ConnectRPC +
      # harness adapter registry from the client side. Needs a running
      # shipd; the suite is self-contained (boots its own, against a
      # temp SHIP_HOME).
      - name: Agents test (shipd ConnectRPC + harness compat)
        run: bun test tests/agents
