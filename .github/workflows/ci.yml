name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build daemon asset bundles
        run: pnpm build:bundles
      - name: Check silent-error patterns
        run: bash scripts/lint/check-silent-errors.sh
      - name: Check OpenAPI drift
        run: cd apps/docs && pnpm run openapi:check-drift
      - name: Collect skill docs
        run: cd apps/docs && AUDIENCE=internal pnpm run collect
      - name: Check skill-docs drift
        run: cd apps/docs && pnpm run docs:check-drift
      - name: Clippy
        run: cargo clippy --workspace --features unstable -- -D warnings
      - name: Build (stable)
        run: cargo build -p ship-cli -p mcp -p shipd
      - name: Build (unstable)
        run: cargo build --features unstable -p ship-cli -p mcp -p shipd
      - name: Test
        run: cargo test --workspace
      - name: Bundle sail-runtime
        run: pnpm -F @sail/runtime bundle
      - name: Build sail CLI
        run: cargo build --bin sail
      - name: Sail — check every shipped component
        run: |
          fail=0
          for f in packages/ship-set-sail/components/*.set; do
            cargo run -q -p sail-cli -- check "$f" || fail=$((fail+1))
          done
          if [ "$fail" -gt 0 ]; then
            echo "::error::$fail .set files failed sail check"
            exit 1
          fi
      - name: ship-set-sail vitest
        run: pnpm -F @sail/ship-set test
