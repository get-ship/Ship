name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      # Build sui-compiler upfront so build-bundles + precompile-sui find the
      # binary at target/debug/sui-compiler instead of paying `cargo run` per
      # `.sui` file. Required by scripts/precompile-sui.mjs.
      - name: Build sui-compiler
        run: cargo build -p sui-compiler
      - name: Build daemon asset bundles
        run: pnpm build:bundles
      - name: Check silent-error patterns
        run: bash scripts/lint/check-silent-errors.sh
      - name: Check OpenAPI drift
        run: cd apps/docs && pnpm run openapi:check-drift
      - name: Collect skill docs
        run: cd apps/docs && AUDIENCE=internal pnpm run collect
      - name: Check skill-docs drift
        run: cd apps/docs && pnpm run docs:check-drift
      - name: Clippy
        run: cargo clippy --workspace --features unstable -- -D warnings
      - name: Build (stable)
        run: cargo build -p ship-cli -p mcp -p shipd
      - name: Build (unstable)
        run: cargo build --features unstable -p ship-cli -p mcp -p shipd
      - name: Cargo test
        run: cargo test --workspace --features unstable
      # Runs `pretest` first (scripts/precompile-sui.mjs), which exercises
      # every framework check baked into the sui-compiler pipeline:
      # controller-purity, css-token, bind-this-ref, on-callable, and
      # the rest of the type-strengthening passes. The earlier
      # `pnpm build:bundles` step covers the same checks for views/*.
      - name: JS tests (precompiles SUI via pretest hook)
        run: pnpm -F @ship/ui-components test
      - name: Bundle sui-runtime
        run: pnpm -F @ship/ui-runtime bundle
