name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install JS deps
        run: bun install --frozen-lockfile
      # sdk-*.json bootstrap cycle (mirrors Justfile `bootstrap`): ship-views
      # `include_str!`s packages/deck/sdk/src/generated/sdk-*.json, and gen-sdk
      # runs *through* shipd (via xtask) — so shipd can't compile until the
      # files exist. Seed empty placeholders so the xtask build links, run
      # gen-sdk to overwrite them with real content, then assert each exists and
      # is non-empty. Without this, a cold-cache runner fails the first
      # `cargo build -p shipd` on a missing include_str! target.
      - name: Seed + generate SDK manifests (cold-cache include_str! unblock)
        run: |
          set -euo pipefail
          mkdir -p packages/deck/sdk/src/generated
          for f in sdk-urls sdk-view-contexts sdk-views sdk-collections sdk-triggers; do
            [ -s "packages/deck/sdk/src/generated/$f.json" ] || echo '{}' > "packages/deck/sdk/src/generated/$f.json"
          done
          cargo run -p xtask --quiet -- gen-sdk
          for f in sdk-urls sdk-view-contexts sdk-views sdk-collections sdk-triggers; do
            test -s "packages/deck/sdk/src/generated/$f.json" \
              || { echo "sdk manifest $f.json missing or empty after gen-sdk" >&2; exit 1; }
          done
      # License audit: walk the resolved dep tree and fail on copyleft
      # (GPL/AGPL/LGPL/EPL/MPL/CDDL…). Replaces hand-copied vendor LICENSE
      # files now that third-party engines are declared deps inlined at build
      # (see docs/ship-adrs/.../ship-component-architecture.md). Pre-approved
      # build-time-only exceptions are documented in the script's ALLOW map.
      - name: License audit (no copyleft)
        run: node scripts/check-licenses.mjs
      # Build sui-compiler upfront so the deck asset bake + the vitest
      # on-demand `.sui` compile find target/debug/sui-compiler instead of
      # paying `cargo run` per `.sui` file.
      - name: Build sui-compiler
        run: cargo build -p sui-compiler
      # Production-compile gate: run the REAL native compiler over EVERY
      # first-party `.sui` (packages/components, views, .ship/views). jsdom unit
      # tests don't exercise the full `check_all` pass, so a `.sui` can be green
      # in vitest yet fail the real compiler (#263). This catches that before it
      # ships. Honest exit (#255): any Error-severity finding fails the gate.
      - name: Check every first-party .sui compiles (production gate)
        run: node scripts/check-sui-compiles.mjs
      - name: Build daemon asset bundles
        run: bun run build:bundles
      # TS typecheck — the enforcement + sanity layer (not optional). The SDK is
      # the typecheck SSOT: a call to a deleted/quarantined op (e.g. ops.discovery.*
      # after the backend service was culled, or `(ship as any).foo`) is a COMPILE
      # ERROR here, caught instantly — not a silent runtime 404 surfaced a week
      # later. Runs after the .sui → .sui.d.ts bundle bake so view/controller
      # imports resolve. If this is red, the frontend is calling a surface that
      # does not exist; fix the caller (deleted stays deleted) — never silence it.
      - name: Typecheck shell (dead-op / surface-drift gate)
        run: bun run --cwd apps/shell typecheck
      - name: Check silent-error patterns
        run: bash scripts/lint/check-silent-errors.sh
      - name: Check migration discipline (naming + immutability)
        run: |
          bash scripts/lint/check-migration-naming.sh
          bash scripts/lint/check-migration-discipline.sh
      - name: Check SUI layer-cut (no framework -> host imports)
        run: bash scripts/lint/check-sui-layer-cut.sh
      # SUI/Deck boundary gates — these scripts existed but were never invoked.
      # check-sui-runtime-no-ship-api: the SUI runtime must not name Ship APIs.
      # check-deck-package-names: deck packages stay on the canonical names.
      - name: Check SUI runtime names no Ship API
        run: bash scripts/lint/check-sui-runtime-no-ship-api.sh
      - name: Check deck package names
        run: bash scripts/lint/check-deck-package-names.sh
      # Justfile recipe shell-syntax smoke: `just` treats recipe bodies as opaque
      # text, so a bash typo (e.g. a dropped `if … then`) parses fine at the just
      # layer yet breaks `just build` at runtime. `bash -n` over each recipe body
      # catches that class before it lands.
      - name: Lint Justfile recipe shell syntax
        run: just lint-justfile
      - name: Check SUI bundle sizes (within budget)
        run: bash scripts/lint/check-sui-bundle-size.sh
      - name: Check landing custom-element bundle coverage (no inert tags)
        run: node scripts/lint/check-landing-bundle-coverage.mjs
      - name: Collect skill docs
        run: cd apps/docs && AUDIENCE=internal bun run collect
      - name: Check skill-docs drift
        run: cd apps/docs && bun run docs:check-drift
      # Build the Astro site so a red docs build can never ship. Runs after the
      # collect/drift gates: the build's own prebuild re-runs the collector, so
      # a sourceless sidebar section or a broken page fails here loudly.
      - name: Build docs site (astro build)
        run: bun run --filter @ship/docs build
      # ship-host (apps/host) is Ship's single native host — Tauri webview
      # wrapping a daemon-served scaffold. Needs webkit2gtk/libsoup that this
      # runner doesn't provision (only release.yml's tauri-action does).
      # Excluded from the framework clippy/test sweep; the host is built on
      # the release runners.
      - name: Clippy
        run: cargo clippy --workspace --exclude ship-host --features unstable -- -D warnings
      - name: Build (stable)
        run: cargo build -p ship-cli -p shipd
      - name: Build (unstable)
        run: cargo build --features unstable -p ship-cli -p shipd
      # sdk-skills are generated from the op registry (schema::OPS/COMMANDS) and
      # tracked, like reads.gen.proto. Regenerate and assert no diff so an op
      # change can't land without its skill + API-doc page being refreshed.
      - name: Check sdk-skills drift
        run: |
          cargo run -p xtask --quiet -- gen-skills
          git diff --exit-code skills/sdk/ \
            || { echo "skills/sdk is stale — run 'cargo run -p xtask -- gen-skills' and commit"; exit 1; }
      # tokens.json is the registry the sui-css-token lint reads. It is generated
      # from the canonical CSS token files (packages/sui/tokens/src/{tokens,
      # themes}.css). Regenerate + assert no diff so a CSS token add/remove can't
      # drift the lint registry (a zombie token it accepts, or a real token it's
      # blind to).
      - name: Check tokens.json drift
        run: |
          cargo run -p xtask --quiet -- gen-tokens --check \
            || { echo "tokens.json is stale — run 'cargo run -p xtask -- gen-tokens' and commit"; exit 1; }
      # Proto contract fixtures are generated from proto/fixtures/theme.json and
      # validated against the ship.ops.v1 proto types. Regenerate + assert no
      # diff so a proto shape change can't outrun its fixture (which the Rust +
      # TS contract tests both read).
      - name: Check proto fixtures drift
        run: |
          cargo run -p xtask --quiet -- gen-fixtures
          git diff --exit-code proto/fixtures/ \
            || { echo "proto/fixtures is stale — run 'cargo run -p xtask -- gen-fixtures' and commit"; exit 1; }
      # @ship/sdk Connect gen is generated from proto/ship/ops/v1/*.proto by buf
      # (buf.gen.sdk.yaml → protoc-gen-es). buf never cleans its output dir, so a
      # deleted proto used to leave a zombie *_pb.ts behind. proto:generate now
      # `rm -rf`s the gen dir first; regenerate and assert no diff so a stale or
      # zombie generated module can't survive a proto deletion.
      - name: Check @ship/sdk proto gen drift
        run: |
          bun run --cwd packages/deck/sdk proto:generate
          git diff --exit-code packages/deck/sdk/src/gen \
            || { echo "packages/deck/sdk/src/gen is stale — run 'bun run --cwd packages/deck/sdk proto:generate' and commit"; exit 1; }
      - name: Lint layer boundaries
        run: cargo run -p xtask --quiet -- lint-layers
      - name: Lint import-level layer direction
        run: cargo run -p xtask --quiet -- lint-imports
      # Contract conformance: every event fixture roundtrips Rust↔JSON and matches
      # the registry's metadata (scope/retention/stability). Fixtures themselves
      # are gated by the "Check proto fixtures drift" step above.
      - name: Contract conformance
        run: cargo test -p ship-contract-tests
      # Shape-conformance integration test runs as part of
      # `cargo test --workspace` (it's a normal integration test under
      # `crates/sui/compiler/tests/shape_conformance.rs`). The tsc gate
      # inside that test depends on the earlier `bun install` step
      # populating `node_modules/.bin/tsc`.
      # Isolation live cells (T1/T2) run as part of `cargo test --workspace`
      # but skip without a substrate. Installing podman + building the sidecar
      # bin makes the Linux podman cells (podman_sidecar/fs/zero_egress/pids,
      # container_reach, docker_lifecycle) execute for real — cheap, reusing
      # the compile this job already pays for. T3 (Firecracker/KVM) and
      # mac/Windows stay manual: no nested KVM / expensive runners here.
      - name: Install podman + pull test image (isolation live cells)
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          podman pull ubuntu:24.04
      - name: Build ship-sidecar (the live cells drive it)
        run: cargo build -p ship-sidecar
      - name: Cargo test
        run: cargo test --workspace --exclude ship-host --features unstable
      # Resource symmetry: every checked-in view mounts + disposes in
      # jsdom with zero leaked EventSources / Observers / intervals.
      # See `tests/integration/resource-symmetry.test.ts`.
      - name: Integration test (resource symmetry)
        run: bunx vitest run --config tests/integration/vitest.config.ts
      # The vitest factory compiles each `.sui` on demand through the
      # sui-compiler, exercising every framework check baked into the
      # pipeline: controller-purity, css-token, bind-this-ref, on-callable,
      # and the rest of the type-strengthening passes. The earlier
      # `bun run build:bundles` step covers the same checks for views/*.
      # Zero-collection guard: a `*.test.ts` that collects no tests passes
      # vacuously (green while proving nothing). Static half — every test file
      # must declare at least one it()/test(); the runtime half is
      # `passWithNoTests:false` in the shared vitest defaults.
      - name: Check no test file collects zero tests
        run: node scripts/check-zero-collection.mjs
      # Workspace JS suites — the SUI framework runtime + every component pack.
      # The vitest factory compiles each `.sui` on demand (mirroring to .ship/sui-out),
      # so this exercises the real compile -> register -> render path for every tag.
      # Scope is built from POSITIVE path-glob filters only — bun's `!`-negation filters
      # silently break path-scoping (they pull in apps/*, e.g. apps/gateway), so any
      # exclusion is expressed by omission, never by `!`:
      #   ./packages/sui/**   -> @ship/sui-runtime, @ship/sui-dom, tree-sitter-sui (grammar)
      #   ./packages/deck/**  -> @ship/sdk, @ship/sdk-client, @ship/deck-host, @ship/sui-eval, @ship/sui-lsp-browser
      #   every healthy component pack under packages/components/{sui,ship}/*
      # Runs --sequential with VITEST_MAX_FORKS=2: parallel cross-package execution
      # oversubscribes the runner and flakes timing-sensitive suites (the GC leak gate,
      # the scroll-anchor test, compile-timeouts); sequential keeps them deterministically green.
      # Deliberately EXCLUDED:
      #   - apps/shell: not under packages/** (shell component suites run via their own
      #     package scripts; wiring them into CI is tracked work).
      - name: JS tests — SUI framework + component packs (compiles SUI on demand via the vitest factory)
        run: |
          set -eo pipefail
          VITEST_MAX_FORKS=2 bun run \
            --filter './packages/sui/**' \
            --filter './packages/deck/**' \
            --filter './packages/components/sui/charts' \
            --filter './packages/components/sui/chat-elements' \
            --filter './packages/components/sui/media' \
            --filter './packages/components/sui/primitives' \
            --filter './packages/components/sui/viewer' \
            --filter './packages/components/ship/agents' \
            --filter './packages/components/ship/arcade' \
            --filter './packages/components/ship/authority' \
            --filter './packages/components/ship/canvas' \
            --filter './packages/components/ship/chrome' \
            --filter './packages/components/ship/code' \
            --filter './packages/components/ship/markdown' \
            --filter './packages/components/ship/pdf' \
            --filter './packages/components/ship/pipelines' \
            --filter './packages/components/ship/spaces' \
            --filter './packages/components/ship/viewer' \
            --sequential test 2>&1 | tee js-test.log
          # bun exits 0 on "No packages matched the filter" — turn an empty match or a
          # zero-suite run into a hard failure so this gate can never pass vacuously.
          grep -q "No packages matched the filter" js-test.log && { echo "::error::JS test filter matched no packages"; exit 1; }
          [ "$(grep -cE '^[^|]+:test +\|' js-test.log)" -gt 0 ] || { echo "::error::JS test step ran zero package suites"; exit 1; }
      - name: Bundle sui-runtime
        run: bun run --filter '@ship/sui-runtime' bundle
      # SUI rendering fuzz gate. Three targets, 60s each — keeps PR
      # wall-time small while catching the panic class that surfaced
      # six bugs in `crates/sui/compiler/src/{render/eval/lex,check/
      # expr_subset,emit/expr_rewrite,parse/template/blocks/for_header}.rs`.
      # Nightly Rust required (libfuzzer-sys).
      - name: Install Rust nightly for fuzz
        run: rustup toolchain install nightly --profile minimal && rustup +nightly component add rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1 || true
      - name: Fuzz — sui-compiler parse_fragment (60s)
        run: cd crates/sui/compiler/fuzz && cargo +nightly fuzz run parse_fragment -- -max_total_time=60
      - name: Fuzz — sui-compiler compile_full (60s)
        run: cd crates/sui/compiler/fuzz && cargo +nightly fuzz run compile_full -- -max_total_time=60
      - name: Fuzz — sui-compiler bindings_build (60s)
        run: cd crates/sui/compiler/fuzz && cargo +nightly fuzz run bindings_build -- -max_total_time=60
