name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install JS deps
        run: bun install --frozen-lockfile
      # License audit: walk the resolved dep tree and fail on copyleft
      # (GPL/AGPL/LGPL/EPL/MPL/CDDL…). Replaces hand-copied vendor LICENSE
      # files now that third-party engines are declared deps inlined at build
      # (see docs/ship-adrs/.../ship-component-architecture.md). Pre-approved
      # build-time-only exceptions are documented in the script's ALLOW map.
      - name: License audit (no copyleft)
        run: node scripts/check-licenses.mjs
      # Build sui-compiler upfront so the deck asset bake + the vitest
      # on-demand `.sui` compile find target/debug/sui-compiler instead of
      # paying `cargo run` per `.sui` file.
      - name: Build sui-compiler
        run: cargo build -p sui-compiler
      - name: Build daemon asset bundles
        run: bun run build:bundles
      - name: Check silent-error patterns
        run: bash scripts/lint/check-silent-errors.sh
      - name: Check migration discipline (naming + immutability)
        run: |
          bash scripts/lint/check-migration-naming.sh
          bash scripts/lint/check-migration-discipline.sh
      - name: Check SUI layer-cut (no framework -> host imports)
        run: bash scripts/lint/check-sui-layer-cut.sh
      - name: Check SUI bundle sizes (within budget)
        run: bash scripts/lint/check-sui-bundle-size.sh
      - name: Check OpenAPI drift
        run: cd apps/docs && bun run openapi:check-drift
      - name: Collect skill docs
        run: cd apps/docs && AUDIENCE=internal bun run collect
      - name: Check skill-docs drift
        run: cd apps/docs && bun run docs:check-drift
      # ship-shell (apps/shell/src-tauri) is the Tauri desktop shell — it needs
      # webkit2gtk/libsoup that this runner doesn't provision (only release.yml's
      # tauri-action does). Excluded from the framework clippy/test sweep; the
      # desktop crate is built on the release runners.
      - name: Clippy
        run: cargo clippy --workspace --exclude ship-shell --features unstable -- -D warnings
      - name: Build (stable)
        run: cargo build -p ship-cli -p shipd
      - name: Build (unstable)
        run: cargo build --features unstable -p ship-cli -p shipd
      # sdk-skills are generated from the op registry (schema::OPS/COMMANDS) and
      # tracked, like reads.gen.proto. Regenerate and assert no diff so an op
      # change can't land without its skill + API-doc page being refreshed.
      - name: Check sdk-skills drift
        run: |
          cargo run -p xtask --quiet -- gen-skills
          git diff --exit-code skills/sdk/ \
            || { echo "skills/sdk is stale — run 'cargo run -p xtask -- gen-skills' and commit"; exit 1; }
      # Proto contract fixtures are generated from proto/fixtures/theme.json and
      # validated against the ship.ops.v1 proto types. Regenerate + assert no
      # diff so a proto shape change can't outrun its fixture (which the Rust +
      # TS contract tests both read).
      - name: Check proto fixtures drift
        run: |
          cargo run -p xtask --quiet -- gen-fixtures
          git diff --exit-code proto/fixtures/ \
            || { echo "proto/fixtures is stale — run 'cargo run -p xtask -- gen-fixtures' and commit"; exit 1; }
      - name: Lint layer boundaries
        run: cargo run -p xtask --quiet -- lint-layers
      - name: Lint import-level layer direction
        run: cargo run -p xtask --quiet -- lint-imports
      # Contract conformance: every event fixture roundtrips Rust↔JSON and matches
      # the registry's metadata (scope/retention/stability). Fixtures themselves
      # are gated by the "Check proto fixtures drift" step above.
      - name: Contract conformance
        run: cargo test -p ship-contract-tests
      # Shape-conformance integration test runs as part of
      # `cargo test --workspace` (it's a normal integration test under
      # `crates/sui/compiler/tests/shape_conformance.rs`). The tsc gate
      # inside that test depends on the earlier `bun install` step
      # populating `node_modules/.bin/tsc`.
      - name: Cargo test
        run: cargo test --workspace --exclude ship-shell --features unstable
      # Resource symmetry: every checked-in view mounts + disposes in
      # jsdom with zero leaked EventSources / Observers / intervals.
      # See `tests/integration/resource-symmetry.test.ts`.
      - name: Integration test (resource symmetry)
        run: bunx vitest run --config tests/integration/vitest.config.ts
      # The vitest factory compiles each `.sui` on demand through the
      # sui-compiler, exercising every framework check baked into the
      # pipeline: controller-purity, css-token, bind-this-ref, on-callable,
      # and the rest of the type-strengthening passes. The earlier
      # `bun run build:bundles` step covers the same checks for views/*.
      - name: JS tests (compiles SUI on demand via the vitest factory)
        run: bun run --filter '@ship/ui-components' test
      - name: Bundle sui-runtime
        run: bun run --filter '@ship/sui-runtime' bundle
      # SUI rendering fuzz gate. Three targets, 60s each — keeps PR
      # wall-time small while catching the panic class that surfaced
      # six bugs in `crates/sui/compiler/src/{render/eval/lex,check/
      # expr_subset,emit/expr_rewrite,parse/template/blocks/for_header}.rs`.
      # Nightly Rust required (libfuzzer-sys).
      - name: Install Rust nightly for fuzz
        run: rustup toolchain install nightly --profile minimal && rustup +nightly component add rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1 || true
      - name: Fuzz — sui-compiler parse_fragment (60s)
        run: cd crates/sui/compiler/fuzz && cargo +nightly fuzz run parse_fragment -- -max_total_time=60
      - name: Fuzz — sui-compiler compile_full (60s)
        run: cd crates/sui/compiler/fuzz && cargo +nightly fuzz run compile_full -- -max_total_time=60
      - name: Fuzz — sui-compiler bindings_build (60s)
        run: cd crates/sui/compiler/fuzz && cargo +nightly fuzz run bindings_build -- -max_total_time=60
