[package]
name = "ship-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "R1 contract conformance: roundtrip + registry-metadata assertions for all fixtures"

[lib]
name = "ship_contract_tests"
path = "src/lib.rs"

[[test]]
name = "roundtrip"
path = "src/roundtrip.rs"

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
# Direct dep so this build.rs can read `DEP_SHIP_PROTO_PROTO_DIR` and resolve
# `<proto>/fixtures/` without a hand-set SHIP_PROTO_DIR. Mirrors the
# git+branch shape used by every other proto-binding consumer.
ship-proto = { git = "https://github.com/get-ship/ship-contracts.git", branch = "feat/next" }
ship-ops-rpc = { path = "../../crates/core/ship-ops-rpc" }
ship-types = { path = "../../crates/core/ship-substrate/crates/ship-types" }
ship-substrate = { path = "../../crates/core/ship-substrate" }
# Pulled in ONLY to force their `register_event!` inventory submissions to
# link (see roundtrip.rs `as _` imports) — the events corpus gate needs the
# FULL registry, not just ship-substrate's own residual events.
agent-def = { path = "../../crates/core/ship-platform/crates/agent-def" }
ship-space = { path = "../../crates/core/ship-platform/crates/ship-space" }
ship-cloud = { path = "../../crates/core/ship-cloud" }
ship-settings = { path = "../../crates/core/ship-platform/crates/ship-settings" }
ship-account = { path = "../../crates/core/ship-platform/crates/ship-account" }
ship-collection = { path = "../../crates/core/ship-platform/crates/ship-collection" }
ship-artifacts = { path = "../../crates/core/ship-platform/crates/ship-artifacts" }
ship-auth = { path = "../../crates/core/ship-platform/crates/ship-auth" }
