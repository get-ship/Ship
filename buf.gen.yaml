# Codegen for TypeScript clients/servers. The Rust side regenerates
# from build.rs via `connectrpc-build` (see crates/core/ship-gateway-client/),
# so this file only covers the TS plugin. In v2 of @bufbuild/protoc-gen-es
# the same plugin emits both message types and service shapes (consumed
# by @connectrpc/connect@2 at runtime) — no separate connect plugin needed.
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: apps/gateway/src/proto/gen
    opt:
      - target=ts
      - import_extension=js
