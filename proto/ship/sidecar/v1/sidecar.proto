// Ship sidecar v1 — the protocol every Tier 1+ isolation backend speaks
// to its host. Same wire whether the sidecar runs in:
//
//   - a local Docker container (Tier 2 — DockerEngine)
//   - a local youki rootless container (Tier 2 — YoukiRootless)
//   - a local microVM (Tier 3 — LimaVm)
//   - a Fly machine or other vendor sandbox (Tier 4 — FlyMachines)
//
// One contract; the host adapts the transport (unix socket / vsock /
// TCP+TLS) to the deployment.
//
// ## Versioning
//
// Package is `ship.sidecar.v1`. Wire path is
// `/ship.sidecar.v1.<Service>/<Method>`. Field numbers are stable.
// Additive changes (new fields, new methods, new enum values with
// the `_UNSPECIFIED = 0` sentinel) are backwards compatible — old
// hosts ignore unknown fields; old sidecars return error if asked for
// a method they don't implement.
//
// Breaking changes go through `ship.sidecar.v2` with an overlap
// window. Sidecars MUST report their `protocol_version` in
// `Handshake` so the host knows whether to talk v1 or fall through.
syntax = "proto3";

package ship.sidecar.v1;

// ──────────────────────────────────────────────────────────────────────
// Handshake & capabilities
//
// Every host opens a `Handshake` first. The sidecar advertises what
// it supports; the host uses only what's declared and ignores unknown
// capability strings. Standard discipline: never make presence of a
// method imply availability — check capabilities.
// ──────────────────────────────────────────────────────────────────────

service Handshake {
  rpc Hello(HelloRequest) returns (HelloResponse);
}

message HelloRequest {
  // Host build/version, advisory; sidecar may log it.
  string host_user_agent = 1;
}

message HelloResponse {
  // Major.minor, semver-flavored. v1 sidecars return "1.x".
  string protocol_version = 1;
  // Sidecar build identity, surfaced in errors and the UI.
  string sidecar_version = 2;
  // Capability bits; absence means "not supported".
  // Known values (v1): "processes", "pty", "secrets", "settings",
  // "events.acp", "fs.bind_mount".
  repeated string capabilities = 3;
}

// ──────────────────────────────────────────────────────────────────────
// Processes — the agent's harness binary, MCP servers it spawns,
// hooks, ad-hoc tooling. Mirrors rivet-dev/sandbox-agent's resource
// shape but slimmed: no FS endpoints (we bind-mount), no agent
// install (image is the unit), no desktop ops.
// ──────────────────────────────────────────────────────────────────────

service Processes {
  // Long-lived process. Returns immediately with a handle; status
  // events flow through `Events.Stream`.
  rpc Create(ProcessCreateRequest) returns (ProcessInfo);

  // One-shot — runs to completion and returns. For lifecycle scripts,
  // doctor probes, anything where the host wants the full output back.
  rpc Run(ProcessRunRequest) returns (ProcessRunResponse);

  rpc List(ProcessListRequest) returns (ProcessListResponse);
  rpc Get(ProcessGetRequest) returns (ProcessInfo);
  rpc Stop(ProcessStopRequest) returns (ProcessActionResponse);
  rpc Kill(ProcessKillRequest) returns (ProcessActionResponse);

  // Write to stdin (or PTY master when the process was created with
  // `pty: true`). Bytes are written verbatim — caller does its own
  // line-buffering.
  rpc WriteInput(ProcessWriteInputRequest) returns (ProcessActionResponse);

  // Resize the PTY. No-op when the process isn't PTY-backed.
  rpc ResizeTerminal(ProcessResizeTerminalRequest) returns (ProcessActionResponse);

  // Server-streaming PTY output. Sidecars without "pty" capability
  // never accept ProcessCreateRequest.pty=true so this stream simply
  // returns Unimplemented.
  rpc AttachPty(ProcessAttachPtyRequest) returns (stream PtyChunk);
}

message ProcessCreateRequest {
  string bin = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string cwd = 4;
  // PTY-back the child. Required true for any agent that needs a
  // real TTY (claude interactive, codex, cursor-agent).
  bool pty = 5;
  PtySize pty_size = 6;
  // Caller-supplied logical id for the process. Sidecar uses it as
  // the registry key and surfaces it in events; if blank, sidecar
  // mints a ulid.
  string id_hint = 7;
}

message ProcessRunRequest {
  string bin = 1;
  repeated string args = 2;
  map<string, string> env = 3;
  string cwd = 4;
  // Bytes to feed on stdin before close. Use the streaming
  // WriteInput RPC instead when input doesn't fit in memory.
  bytes stdin = 5;
  // Hard cap on wall-clock duration. 0 means no limit.
  uint64 timeout_ms = 6;
}

message ProcessRunResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  uint64 duration_ms = 4;
}

message ProcessInfo {
  string id = 1;
  string bin = 2;
  repeated string args = 3;
  uint32 pid = 4;
  ProcessState state = 5;
  int64 created_at_unix_ms = 6;
  // When state is EXITED.
  int32 exit_code = 7;
  bool pty_backed = 8;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_RUNNING = 1;
  PROCESS_STATE_EXITED = 2;
  PROCESS_STATE_KILLED = 3;
}

message ProcessListRequest {}
message ProcessListResponse {
  repeated ProcessInfo processes = 1;
}

message ProcessGetRequest {
  string id = 1;
}

message ProcessStopRequest {
  string id = 1;
  // Grace period before escalating to SIGKILL. 0 means use sidecar's
  // built-in default (5s).
  uint64 grace_ms = 2;
}

message ProcessKillRequest {
  string id = 1;
}

message ProcessActionResponse {
  bool ok = 1;
  string detail = 2;
}

message ProcessWriteInputRequest {
  string id = 1;
  bytes data = 2;
}

message ProcessResizeTerminalRequest {
  string id = 1;
  PtySize size = 2;
}

message ProcessAttachPtyRequest {
  string id = 1;
}

message PtySize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message PtyChunk {
  bytes data = 1;
}

// ──────────────────────────────────────────────────────────────────────
// Events — the universal channel. Stdout/stderr/exit/signal/permission
// requests/hook callbacks/log_progress all flow through here as
// `Envelope`s. Replaces what would otherwise be 5+ separate endpoints.
//
// Bidirectional stream so the sidecar can request from the host
// (permission, secret, settings read) and the host can push to the
// sidecar (permission grant, secret response, settings update).
// ──────────────────────────────────────────────────────────────────────

service Events {
  // Bidi stream of envelopes. Each side sends; each side receives.
  // Multiplexed by `Envelope.request_id` for the request/reply pairs.
  rpc Stream(stream Envelope) returns (stream Envelope);
}

message Envelope {
  // Logical event id. Monotonic per stream, set by sender.
  uint64 sequence = 1;
  // Optional id used to correlate request/reply pairs.
  // `permission_request` from sidecar carries one; `permission_reply`
  // from host echoes it. Same for secret/setting fetches.
  string request_id = 2;
  oneof payload {
    // ── server-initiated (sidecar -> host) ─────────────────────────
    ProcessOutput process_output = 10;
    ProcessExited process_exited = 11;
    PermissionRequest permission_request = 12;
    SecretRequest secret_request = 13;
    SettingRequest setting_request = 14;
    HookFired hook_fired = 15;
    LogProgress log_progress = 16;

    // ── client-initiated (host -> sidecar) ─────────────────────────
    PermissionReply permission_reply = 50;
    SecretReply secret_reply = 51;
    SettingReply setting_reply = 52;
    HookReturn hook_return = 53;
  }
}

message ProcessOutput {
  string process_id = 1;
  // 1=stdout, 2=stderr. PTY chunks come through AttachPty, not here.
  uint32 stream = 2;
  bytes data = 3;
}

message ProcessExited {
  string process_id = 1;
  int32 exit_code = 2;
  // Signal name when killed by signal, otherwise empty.
  string signal = 3;
}

message PermissionRequest {
  string tool = 1;
  string detail = 2;
  // E.g. "shell:run", "fs:write".
  string scope = 3;
}

message PermissionReply {
  // "allow", "allow_once", "deny".
  string decision = 1;
}

message SecretRequest {
  // Logical secret name; sidecar never sees raw values until the
  // reply. E.g. "anthropic.api_key", "github.token".
  string name = 1;
}

message SecretReply {
  bool ok = 1;
  // Only present when `ok` is true. Never logged.
  string value = 2;
  string error = 3;
}

message SettingRequest {
  string key = 1;
}

message SettingReply {
  bool ok = 1;
  string value_json = 2;
  string error = 3;
}

message HookFired {
  string hook_id = 1;
  string event = 2;
  string payload_json = 3;
}

message HookReturn {
  string hook_id = 1;
  bool ok = 2;
  string detail = 3;
}

message LogProgress {
  string actor_id = 1;
  string message = 2;
  // Optional escalation level: "info", "warning", "blocker", "question".
  string level = 3;
}

// ──────────────────────────────────────────────────────────────────────
// Note on what's NOT in v1
//
// - No /fs/* endpoints. Workspace + creds bind-mount from host;
//   in-container reads/writes go straight to the bind-mounted path.
//   Cloud Tier 4 uses the same convention via the vendor's volume.
// - No agent install. The container image bakes the harness CLI.
//   "BYO image" power users add `ship-sidecar` to their Dockerfile;
//   the sidecar doesn't install anything at runtime.
// - No desktop / X11 / WebRTC. Out of scope.
// - No /metrics/*. Host queries process state via Get/List; richer
//   metrics are a separate concern for the daemon's analytics path.
// ──────────────────────────────────────────────────────────────────────
