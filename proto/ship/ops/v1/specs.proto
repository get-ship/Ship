// `specs.*` as a hand-authored per-domain proto-SSOT service (#89), mounted
// ADDITIVELY beside the generated ReadOps (which keeps serving until #72).
// Request messages use `*Req` suffix to avoid collision with the generated
// SpecsListRequest / SpecsGetRequest / SpecsSummariesRequest / SpecsDetailRequest
// in this same ship.ops.v1 package. Return types reuse the shared shapes from
// types.proto (SpecsListResponse, SpecGetResponse, SpecDetail) and the generic
// JsonResponse from ops.proto.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";
import "ship/ops/v1/ops.proto";

message SpecsListReq {}

message SpecsGetReq {
  string id = 1;
}

message SpecsSummariesReq {
  string q = 1;
  string selected = 2;
}

message SpecsDetailReq {
  string id = 1;
}

// Specs read surface. All reads are C0 (edge-authenticated).
service SpecsService {
  rpc List(SpecsListReq) returns (SpecsListResponse) {
    option (ship.ops.v1.description) = "Raw spec records from the DB.";
    option (ship.ops.v1.capability) = "ship.specs.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Get(SpecsGetReq) returns (SpecGetResponse) {
    option (ship.ops.v1.description) = "Full spec record + body.";
    option (ship.ops.v1.capability) = "ship.specs.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Summaries(SpecsSummariesReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Rail shape: grouped + counts + pipelines.";
    option (ship.ops.v1.capability) = "ship.specs.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Detail(SpecsDetailReq) returns (SpecDetail) {
    option (ship.ops.v1.description) = "Full view-shaped spec detail: parsed sections, launch ctx.";
    option (ship.ops.v1.capability) = "ship.specs.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
