// `annotation.*` as a hand-authored, per-domain proto-SSOT service — migrated
// domain under decision #89. Mounted ADDITIVELY beside the generated
// CommandOpsService (which still serves annotation.* until the GUI flip, #72).
// Old descriptor tables + dispatch stay untouched.
//
// Request message takes a fresh name (PostAnnotationRequest) because the
// generated commands.gen.proto already declares AnnotationPostRequest in this
// same package — two definitions would collide. Return type is JsonResponse
// from ops.proto, imported, not redeclared.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";

message PostAnnotationRequest {
  // JSON-serialized annotation event payload.
  string event_json = 1;
}

// Annotation write-only service. The write is C1 and routes through the one
// gate (services::command::call). No reads — annotations are write-only from
// the client surface.
service AnnotationService {
  rpc Post(PostAnnotationRequest) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.annotations.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
}
