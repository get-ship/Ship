// `artifacts.*` metadata ops as a hand-authored per-domain proto-SSOT service
// (#89) — the sole serving path (the generated ReadOps/CommandOps umbrella was
// retired, #78). The byte-moving store/get stay on serving routes — blobs don't
// ride a JSON op — so only the metadata reads + mutations live here. Distinct
// request-message names (ListArtifactsRequest, …) are historical
// collision-avoidance against the deleted ArtifactsListRequest et al.; kept for
// wire stability. Return types reuse the shared shapes in types.proto
// (ArtifactsListResponse / ArtifactRecord / Deletion).
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";
import "ship/ops/v1/reactive.proto";

message ListArtifactsRequest {
  string scope = 1;
  string mime = 2;
  string collection_id = 3;
  string item_id = 4;
  string owner_actor = 5;
  string content_hash = 6;
  uint64 limit = 8;
}

message PatchArtifactRequest {
  string id = 1;
  string name = 2;
  string owner_actor = 3;
  string expires_at = 4;
}

message PromoteArtifactRequest {
  string id = 1;
  string target_scope = 2;
  string run_id = 3;
}

message DeleteArtifactRequest {
  string id = 1;
}

// Watch scope: all artifacts, or filtered by scope/mime.
message ArtifactsWatchReq {
  string scope = 1;
  string mime = 2;
}

// Artifact metadata records + lifecycle. Reads are C0; metadata mutations are
// C1 workspace writes — gated by the blast tier ONLY (open to any in-scope agent).
// SHORTCOMING: the per-artifact scope ACL is GRANTED in roles (ship-auth-types
// scopes::roles::pipeline_agent_artifact_scopes — agents get run-scope R/W/D +
// project READ, NOT project write/delete) but is NOT enforced at the wire
// (ship-artifacts/src/wire.rs). Tracked for a dedicated artifacts authz pass.
service ArtifactsService {
  rpc List(ListArtifactsRequest) returns (ArtifactsListResponse) {
    option (ship.ops.v1.description) = "Artifact metadata records, filterable by scope/mime/collection/item/owner.";
    option (ship.ops.v1.capability) = "ship.artifacts.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Watch(ArtifactsWatchReq) returns (stream WatchEvent) {
    option (ship.ops.v1.description) = "Live watch — typed patch stream for artifact metadata changes.";
    option (ship.ops.v1.capability) = "ship.artifacts.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Patch(PatchArtifactRequest) returns (ArtifactRecord) {
    option (ship.ops.v1.description) = "Patch an artifact's metadata (name / owner / expiry).";
    option (ship.ops.v1.capability) = "ship.artifacts.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc Promote(PromoteArtifactRequest) returns (ArtifactRecord) {
    option (ship.ops.v1.description) = "Promote an artifact to a target scope (run → project).";
    option (ship.ops.v1.capability) = "ship.artifacts.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc Delete(DeleteArtifactRequest) returns (Deletion) {
    option (ship.ops.v1.description) = "Soft-delete an artifact by id.";
    option (ship.ops.v1.capability) = "ship.artifacts.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
}
