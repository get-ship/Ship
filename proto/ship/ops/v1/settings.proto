// SettingsService — the unified, scope-discriminated settings keystone (the
// settings home; replaces the per-tier config/space/account settings split with
// ONE contract). Hand-authored clean proto-SSOT (decision #89, _arc.md
// principles 1/2/11).
//
// The shape:
//   - ONE service over THREE scopes (SPACE / ACCOUNT / RUNTIME). The scope is an
//     explicit discriminant on every request, not three separate services.
//   - typed SettingList / Setting reads, NOT the opaque JsonResponse envelope.
//   - the crate owns its own `Setting` message (one contract per boundary) — no
//     shared types.proto `SettingValue` return.
//   - event-sourced: `Set` authors a `settings.changed` event in the chosen
//     scope; the per-scope projection is the read model `Get`/`List` read.
//   - `Watch` streaming the shared `WatchEvent` is THE reactive surface (mirrors
//     collection.proto's / space.proto's Watch). No *Live streaming twins.
//
// Distinct message + service names from any other proto in the `ship.ops.v1`
// package (the old ConfigService — `ListReq` / `WatchConfigReq` — is gone; the
// space-domain `SpaceSettingValue` / `SetSpaceSettingReq` stay where they are).
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/reactive.proto"; // WatchEvent

// ── Scope ─────────────────────────────────────────────────────────────────────

// Which settings tier a request targets — the scope discriminant.
enum SettingScope {
  SETTING_SCOPE_UNSPECIFIED = 0;
  // The connection's ACTIVE space — the per-space overlay in that space's
  // `space.db`. No active space ⟹ the write/read errors cleanly (post-S2 there
  // is no `global` fallback).
  SETTING_SCOPE_SPACE = 1;
  // The user's account — `account.db`.
  SETTING_SCOPE_ACCOUNT = 2;
  // Machine-local launch defaults — `runtime.db` / `daemon_settings`.
  SETTING_SCOPE_RUNTIME = 3;
}

// ── Messages ──────────────────────────────────────────────────────────────────

// One resolved setting.
message Setting {
  string key = 1;
  // Arbitrary JSON value, serialized as bytes (a setting value can be any JSON
  // type — string, number, bool, object).
  bytes value_json = 2;
  // The scope this setting was resolved from.
  SettingScope scope = 3;
  // true = no stored row; this is the hardcoded default returned for the key.
  bool is_default = 4;
}

message SettingList {
  repeated Setting settings = 1;
}

message GetSettingReq {
  string key = 1;
  SettingScope scope = 2;
}

message ListSettingsReq {
  SettingScope scope = 1;
}

message SetSettingReq {
  string key = 1;
  // Arbitrary JSON value, serialized as bytes.
  bytes value_json = 2;
  SettingScope scope = 3;
}

// Watch one scope's settings changes.
message WatchSettingsReq {
  SettingScope scope = 1;
}

// ── Service ─────────────────────────────────────────────────────────────────

service SettingsService {
  // reads (C0)
  rpc Get(GetSettingReq) returns (Setting) {
    option (ship.ops.v1.description) = "Read a single setting by key in a scope (falls back to its default).";
    option (ship.ops.v1.capability) = "ship.settings.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc List(ListSettingsReq) returns (SettingList) {
    option (ship.ops.v1.description) = "All settings in a scope (stored rows merged with defaults).";
    option (ship.ops.v1.capability) = "ship.settings.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  // writes (C1)
  rpc Set(SetSettingReq) returns (Setting) {
    option (ship.ops.v1.description) = "Set a setting in a scope (value is arbitrary JSON); authors settings.changed.";
    option (ship.ops.v1.capability) = "ship.settings.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  // live (Watch is THE reactive surface)
  rpc Watch(WatchSettingsReq) returns (stream WatchEvent) {
    option (ship.ops.v1.capability) = "ship.settings.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
