// Runtime introspection reads — proto-as-SSOT (decision #67 a), authored
// directly like analytics.proto. `RuntimeService.ListProcs` reads the
// `process.*` projection (records the orchestrator emits for every spawned
// process). Pure read — C0, capability "ship.runtime.read".
//
// `daemon_status` stays a REST JsonResponse for now: it is a dynamic aggregate
// (status-count map + health-task snapshot Value), not a clean typed shape.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";

// One signal delivered to a process (kill-tree, cancel, …).
message RuntimeSignalEntry {
  string signum = 1;
  string reason = 2;
  string actor = 3;
  string at = 4; // rfc3339
}

// One row of the `process.*` projection.
message RuntimeProcess {
  optional uint32 pid = 1;
  string slug = 2;
  optional string pipeline_run_id = 3;
  optional string step_id = 4;
  string cmd = 5;
  string executor_kind = 6;
  string spawned_at = 7; // rfc3339
  optional string exited_at = 8; // rfc3339
  optional int32 exit_code = 9;
  optional string exit_signal = 10;
  repeated RuntimeSignalEntry signals_sent = 11;
  string status = 12; // running | exited | killed | orphaned
}

message ListProcsRequest {
  // Filter to one run/session slug.
  optional string slug = 1;
  // Session class: agent | pipeline-step | shell (mapped to executor_kind).
  optional string kind = 2;
  // Newest-first cap; defaults to 100.
  optional uint32 limit = 3;
}
message ListProcsResponse {
  repeated RuntimeProcess processes = 1;
}

service RuntimeService {
  rpc ListProcs(ListProcsRequest) returns (ListProcsResponse) {
    option (ship.ops.v1.capability) = "ship.runtime.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
