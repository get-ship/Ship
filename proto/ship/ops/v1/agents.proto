// `agents.*` as a hand-authored, per-domain proto-SSOT service (#89).
// Mounted ADDITIVELY beside the generated ReadOpsService/CommandOpsService
// (which keep serving agents.* until the GUI flip, #72). Request messages
// take fresh names (ListAgentsRequest, …) because the generated
// reads.gen.proto/commands.gen.proto already declare AgentsListRequest et al.
// in this same package — two definitions would collide. Return types reuse
// the shared shapes in types.proto and JsonResponse from ops.proto.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/ops.proto";
import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";

// ── Read request messages ─────────────────────────────────────────────────

message ListAgentsRequest {}

message ListAgentsSummariesRequest {}

message GetAgentDetailRequest {
  string id = 1;
}

message ListAgentsCatalogsRequest {}

message GetAgentRequest {
  string id = 1;
  // "project" | "user"; empty walks Project → User.
  string scope = 2;
}

message GetAgentWireRequest {
  string id = 1;
}

message GetAgentSettingsRequest {
  string id = 1;
}

message ListAgentTemplatesRequest {}

message ListAgentPermissionPresetsRequest {}

message ListAgentHarnessesRequest {}

message GetAgentCreateCtxRequest {}

// ── Typed read responses (S4: kill JsonResponse on the structured reads) ────
//
// Catalogs / Wire / Settings become field-by-field structured; Get stays
// opaque-by-design — an agent def doc is arbitrary user JSONC, so the doc body
// rides as a serialized JSON string (`doc_json`), the same open-payload
// convention as CollectionItem.data_json / SettingValue.value_json. Only the
// id + resolved scope around it are typed. These mirror the platform wire
// structs in `ship-platform/services/agents/*`; the handler maps the existing
// read output onto them (snake_case aliases on the generated messages decode
// the registry's snake_case JSON unchanged).

// One picker-catalog row (skill / mcp / rule / preset). Mirrors
// `view_state::CatalogEntry`.
message AgentCatalogEntry {
  string id = 1;
  string name = 2;
  optional string description = 3;
}

// One tool-pattern autocomplete row. Mirrors `view_state::ToolPatternEntry`.
message AgentToolPattern {
  string pattern = 1;
  string label = 2;
  string source = 3;
}

// The picker catalogs shared by the wire + settings panes. Mirrors
// `view_state::AgentCatalogs`.
message AgentCatalogsResponse {
  repeated AgentCatalogEntry skills = 1;
  repeated AgentCatalogEntry mcp = 2;
  repeated AgentCatalogEntry rules = 3;
  repeated AgentCatalogEntry presets = 4;
  repeated AgentToolPattern tool_patterns = 5;
}

// The opaque-by-design agent-def read. `doc_json` is the raw def document
// serialized as a JSON string (a def is arbitrary user JSONC — NOT field-by-
// field typed); `id` + `scope` ("project" | "user") are the resolved envelope.
message AgentDoc {
  string id = 1;
  string scope = 2;
  string doc_json = 3;
}

// A positioned node on the wire canvas. Mirrors `wire::WireNode`.
message AgentWireNode {
  string kind = 1;
  string id = 2;
  string title = 3;
  string sub = 4;
  float x = 5;
  float y = 6;
  float w = 7;
}

// A bezier edge on the wire canvas. Mirrors `wire::WireEdge`.
message AgentWireEdge {
  string kind = 1;
  string id = 2;
  string path_d = 3;
  bool dashed = 4;
}

// Graph payload for the agent-wire canvas. Mirrors `wire::AgentWireCtx`.
message AgentWireResponse {
  AgentDetail agent = 1;
  repeated AgentWireNode nodes = 2;
  repeated AgentWireEdge edges = 3;
  AgentCatalogsResponse catalogs = 4;
}

// One permission-tier radio-card row. Mirrors `settings_view::TierRow`.
message AgentTierRow {
  string id = 1;
  string label = 2;
  string description = 3;
  bool selected = 4;
}

// Tier list + catalogs for the per-agent settings pane. Mirrors
// `settings_view::AgentSettingsCtx`.
message AgentSettingsResponse {
  AgentDetail agent = 1;
  repeated AgentTierRow tiers = 2;
  AgentCatalogsResponse catalogs = 3;
}

// ── Write request messages ────────────────────────────────────────────────

message CreateAgentRequest {
  string id = 1;
  string doc_json = 2;
  string scope = 3;
}

message PutAgentRequest {
  string id = 1;
  string doc_json = 2;
  string scope = 3;
}

message PatchAgentRequest {
  string id = 1;
  string patch_json = 2;
  string scope = 3;
}

message DeleteAgentRequest {
  string id = 1;
  string scope = 2;
}

message RenameAgentRequest {
  string id = 1;
  string new_id = 2;
  string scope = 3;
}

message DuplicateAgentRequest {
  string id = 1;
  string new_id = 2;
  string scope = 3;
  string to = 4;
}

message MoveAgentScopeRequest {
  string id = 1;
  string from = 2;
  string to = 3;
}

// Agent profile CRUD and read-context surface. Reads are C0 (edge-
// authenticated); writes are C1 workspace mutations gated through
// services::command::call — the ONE gate — exactly as the generated
// CommandOpsService does. Authoring agent profiles is restricted ship-
// authoring (same blast radius as skills/rules).
service AgentsService {
  rpc List(ListAgentsRequest) returns (AgentIndexResponse) {
    option (ship.ops.v1.description) = "List all agents as minimal IndexEntry rows.";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Summaries(ListAgentsSummariesRequest) returns (AgentsSummariesResponse) {
    option (ship.ops.v1.description) = "List all agents with display metadata (label, harnesses, tags).";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc SummariesLive(ListAgentsSummariesRequest) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Detail(GetAgentDetailRequest) returns (AgentDetail) {
    option (ship.ops.v1.description) = "Full view-shaped agent detail — catalogs, permissions, harnesses, tags.";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Catalogs(ListAgentsCatalogsRequest) returns (AgentCatalogsResponse) {
    option (ship.ops.v1.description) = "Catalog rows for the agents list (harnesses, skills, etc.).";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Get(GetAgentRequest) returns (AgentDoc) {
    option (ship.ops.v1.description) = "Raw agent doc from disk at the requested scope (opaque doc_json wrapper).";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Wire(GetAgentWireRequest) returns (AgentWireResponse) {
    option (ship.ops.v1.description) = "Graph payload (nodes + edges) for the agent-wire canvas.";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Settings(GetAgentSettingsRequest) returns (AgentSettingsResponse) {
    option (ship.ops.v1.description) = "Tier list + catalog rows for the per-agent settings pane.";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  // Live read variants (#138) — full value now + on every `config` event.
  rpc CatalogsLive(ListAgentsCatalogsRequest) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc DetailLive(GetAgentDetailRequest) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc WireLive(GetAgentWireRequest) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc SettingsLive(GetAgentSettingsRequest) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Templates(ListAgentTemplatesRequest) returns (AgentTemplatesResponse) {
    option (ship.ops.v1.description) = "Starter templates for the agent-create wizard.";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc PermissionPresets(ListAgentPermissionPresetsRequest) returns (PermissionPresetsResponse) {
    option (ship.ops.v1.description) = "Permission presets for the agent-create wizard.";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Harnesses(ListAgentHarnessesRequest) returns (HarnessesResponse) {
    option (ship.ops.v1.description) = "Enumerate known harnesses (claude, openai, gemini, ...).";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc CreateCtx(GetAgentCreateCtxRequest) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Convenience: templates + presets + harnesses for the create view.";
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc CreateCtxLive(GetAgentCreateCtxRequest) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.agents.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Create(CreateAgentRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Create a new agent profile from a doc.";
    option (ship.ops.v1.capability) = "ship.agents.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc Put(PutAgentRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Replace an agent profile's doc (use agents.create for net-new).";
    option (ship.ops.v1.capability) = "ship.agents.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc Patch(PatchAgentRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Apply RFC-6902 ops to an agent profile's doc.";
    option (ship.ops.v1.capability) = "ship.agents.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc Delete(DeleteAgentRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Delete an agent profile (scope omitted walks project → user).";
    option (ship.ops.v1.capability) = "ship.agents.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc Rename(RenameAgentRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Rename an agent profile's id.";
    option (ship.ops.v1.capability) = "ship.agents.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc Duplicate(DuplicateAgentRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Copy an agent profile to a new id.";
    option (ship.ops.v1.capability) = "ship.agents.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc MoveScope(MoveAgentScopeRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Move an agent profile between project and user scope.";
    option (ship.ops.v1.capability) = "ship.agents.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
}
