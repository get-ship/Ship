// Clean per-domain space contract — the space identity + config + registry
// surface, hand-authored as the shape we WANT (_arc.md principle 1, 11).
//
// A space = the unit of isolation/coordination/config (one .ship/ directory).
// This is the SOLE space service (the legacy SpaceService — JsonResponse /
// ProjectRecord / WorkspaceActiveResponse vestiges, the *Live streaming twins,
// and the window RPCs — was retired in the space cutover). It is served by the
// `ship-space` crate (`SpaceWire`) over substrate ports.
//
// Shape:
//   - Typed returns everywhere (Space / SpaceList / ActiveSpace / SpaceInfo) —
//     no opaque JsonResponse blobs, no Workspace/Project vestiges.
//   - Watch is the ONE reactive surface — no *Live streaming twins.
//   - Window-management RPCs/messages are NOT here — they belong to the
//     ship-device topic (device.proto): the carve split space identity from
//     device/window control.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/reactive.proto";

// ── Messages (real domain types) ────────────────────────────────────────────

// One registered space (a .ship/ directory the daemon has been pointed at).
message Space {
  string id = 1;
  string path = 2;
  string name = 3;
  string created_at = 4;
  string last_seen_at = 5;
}

// The registered-space list + the active-space pointer.
message SpaceList {
  repeated Space spaces = 1;
  optional string active_id = 2;
}

// The active space, if one has been activated.
message ActiveSpace {
  optional Space active = 1;
}

// A space's identity. Identity fields are unset in global-only mode.
message SpaceInfo {
  optional string space_id = 1;
  optional string root = 2;
  optional string name = 3;
}

// ── Request messages ────────────────────────────────────────────────────────

message SpaceListReq {}
message SpaceActiveReq {}
message SpaceInfoReq {}

message AddSpaceReq {
  string path = 1;
  string name = 2;
}

message ActivateSpaceReq {
  string id = 1;
}

// Watch request — currently watches the registry (list + active pointer).
// The settings surface moved to SettingsService.Watch(scope=SPACE) (S4).
message SpaceWatchReq {
}

// ── Service ─────────────────────────────────────────────────────────────────

service SpaceService {
  // reads (C0)

  rpc List(SpaceListReq) returns (SpaceList) {
    option (ship.ops.v1.description) = "List the registered spaces (each a .ship/ directory).";
    option (ship.ops.v1.capability) = "ship.space.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }

  rpc Active(SpaceActiveReq) returns (ActiveSpace) {
    option (ship.ops.v1.description) = "The active space, if one has been activated.";
    option (ship.ops.v1.capability) = "ship.space.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }

  rpc Info(SpaceInfoReq) returns (SpaceInfo) {
    option (ship.ops.v1.description) = "The active space's identity and effective (global→space) config.";
    option (ship.ops.v1.capability) = "ship.space.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }

  // writes (C1)

  rpc Add(AddSpaceReq) returns (Space) {
    option (ship.ops.v1.description) = "Register a directory as a space (ensures its .ship/ exists).";
    option (ship.ops.v1.capability) = "ship.space.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }

  rpc Activate(ActivateSpaceReq) returns (ActiveSpace) {
    option (ship.ops.v1.description) = "Switch the daemon's active space.";
    option (ship.ops.v1.capability) = "ship.space.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }

  // live — the ONE reactive surface (replaces the dropped *Live twins).

  rpc Watch(SpaceWatchReq) returns (stream WatchEvent) {
    option (ship.ops.v1.description) = "Live watch — the space registry (list + active).";
    option (ship.ops.v1.capability) = "ship.space.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
