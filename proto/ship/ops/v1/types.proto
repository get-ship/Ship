// Hand-authored typed response messages for the command surface.
//
// The proto-canonical contract: commands that have settled on a stable return
// shape name a message here via `CommandDescriptor.response_type`, and
// `cargo xtask gen-ops` emits `returns (<Message>)` for that rpc instead of the
// legacy `JsonResponse` blob. The impl maps the command's `serde_json::Value`
// onto the message with `serde_json::from_value` — buffa messages derive serde
// (camelCase rename + snake_case alias) and ignore unknown fields, so the
// command's existing JSON return decodes without hand-mapping.
//
// Add a message here, set the descriptor's `response_type`, re-run gen-ops.
syntax = "proto3";

package ship.ops.v1;

// Result of a scope-resolving config mutation (rules / mcp / permissions /
// collections CRUD): the entity's id and the scope it resolved to
// ("Project" | "User"). One shared shape — these commands all answer the same
// question ("which id, which scope?"), so they share one typed return.
message ScopedMutation {
  string id = 1;
  string scope = 2;
}

// Result of a delete-by-id command. `deleted` is false when the id resolved to
// nothing (idempotent delete). Shared by any command whose service returns a
// bool deletion result (artifacts, collection items, …).
message Deletion {
  string id = 1;
  bool deleted = 2;
}

// An artifact's metadata record — the typed return of artifacts.patch /
// .promote (the byte-moving store/get stay on serving routes). Mirrors
// `ship_platform::artifacts::ArtifactRecord`; snake-case JSON decodes via the
// generated field aliases.
message ArtifactRecord {
  string id = 1;
  string name = 2;
  string mime = 3;
  uint64 size = 4;
  string path = 5;
  string scope = 6;
  optional string project_id = 7;
  optional string run_id = 8;
  optional string user_id = 9;
  optional string content_hash = 10;
  optional string expires_at = 11;
  optional string owner_actor = 12;
  optional string collection_id = 13;
  optional string item_id = 14;
  string created_at = 15;
}

// ── Read return types (mirror the platform wire structs) ──────────────

// One entry in a scope-resolving index (the `*.list` reads). Shared shape —
// every service's `IndexEntry` is {id, scope}, like ScopedMutation.
message IndexEntry {
  string id = 1;
  string scope = 2;
}

// Wire shape of rules.list.
message RulesIndexResponse {
  repeated IndexEntry items = 1;
}

// Wire shape of rules.get — raw rule body at the resolved scope.
message RuleGetResponse {
  string id = 1;
  string scope = 2;
  string body = 3;
}

// Wire shape of mcp.list / permissions.list (both → IndexEntry items). The
// matching *.get reads return an embedded opaque config Value (entry), so they
// stay JsonResponse — same open-payload line as the command surface.
message McpIndexResponse {
  repeated IndexEntry items = 1;
}
message PermissionsIndexResponse {
  repeated IndexEntry items = 1;
}

// One autocomplete entry from permissions.tool_patterns.
message ToolPattern {
  string pattern = 1;
  string label = 2;
  string source = 3;
}
message ToolPatternsResponse {
  repeated ToolPattern patterns = 1;
}

// A registered project — the typed return of project.add. Mirrors
// `ship_platform::projects::ProjectRecord`.
message ProjectRecord {
  string id = 1;
  string path = 2;
  string name = 3;
  string created_at = 4;
  string last_seen_at = 5;
}

// The typed return of settings.set: the key and its new value (serialized
// JSON, since a setting value is arbitrary). Mirrors the route's echo.
message SettingValue {
  string key = 1;
  string value_json = 2;
}

// A collection item — the typed return of collections.create_item /
// .update_item. The envelope (id/collection/timestamps) is typed; `data_json`
// carries the user's schema-defined payload as serialized JSON. Proto Struct
// would model `data` as a native object, but it pulls the `buffa-types` crate
// (a fragile version match against connectrpc's transitive buffa — see
// ship-ops-rpc/Cargo.toml), so we use the JSON-string convention already in use
// for open payloads (server_json / patch_json / value_json). The consumer
// parses one field against its own runtime schema — which it must do anyway,
// since collection data is schema-dynamic. Mirrors `…::collections::store::Item`.
message CollectionItem {
  string id = 1;
  string collection = 2;
  string data_json = 3;
  optional string created_by = 4;
  string created_at = 5;
  string updated_at = 6;
}
