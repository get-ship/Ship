// `registry.*` as a hand-authored per-domain proto-SSOT service (#141).
// The daemon is the single hop to the gateway: `ship publish` sends the
// manifest + per-export hashes; the daemon attaches the user's stored API
// key and forwards verbatim to `<cloud.base_url>/api/v1/registry/publish`.
// Payload is opaque JSON — the manifest shape is owned by the gateway, not
// stable enough to type in proto, so it rides as a JSON string.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";

message PublishReq {
  // The publish manifest + hashes, encoded as a JSON object string.
  string payload_json = 1;
}

// Package-registry gateway proxy. Publish is a C2 write — it forwards the
// authenticated user's package to the cloud registry.
service RegistryService {
  rpc Publish(PublishReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.registry.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
}
