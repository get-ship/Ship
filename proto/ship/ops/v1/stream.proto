// Server-streaming surface — the Connect-native replacement for the SSE event
// stream. Hand-authored (streaming isn't projected from the registry; it's a
// single long-lived observe channel). The daemon streams every kernel event as
// JSON (JsonResponse.json = the serialized EventEnvelope). C0: observe-only.
//
// Intended to replace the SSE event stream (Route::EventStream, GET
// /api/v1/events/stream) — SSE is one stream adapter over the same kernel
// subscription and is STILL MOUNTED today; deck migration to this Connect
// stream is pending.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";

service StreamService {
  rpc Events(EventsRequest) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.events.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }

  // Raw PTY byte stream for a session: replay the log then tail live output.
  // `bytes` is byte-exact (Connect-JSON base64-encodes on the wire; the client
  // decodes to a Uint8Array straight into xterm — no CR/LF mangling like SSE).
  // Retires the `/api/v1/sessions/{id}/stream` SSE route. C0: observe a session.
  rpc SessionBytes(SessionStreamRequest) returns (stream BytesChunk) {
    option (ship.ops.v1.capability) = "ship.sessions.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}

message EventsRequest {}
message SessionStreamRequest {
  string session_id = 1;
}
message BytesChunk {
  bytes data = 1;
}
