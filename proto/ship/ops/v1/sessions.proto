// `sessions.*` as a hand-authored per-domain proto-SSOT service (#89),
// mounted ADDITIVELY beside the generated ReadOpsService which keeps serving
// sessions.* until the GUI flip (#72). Old path UNCHANGED.
//
// Request message uses a fresh name (ListSessionsReq) to avoid collision with
// SessionsListRequest declared in reads.gen.proto in this same package.
// Return type reuses the shared SessionsListResponse shape from types.proto.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";
import "ship/ops/v1/ops.proto";

message ListSessionsReq {}

// PTY/agent session index. Single C0 read — no writes in this domain.
service SessionsService {
  rpc List(ListSessionsReq) returns (SessionsListResponse) {
    option (ship.ops.v1.description) = "All live PTY sessions (agent chats, pipeline runs, shells) — Mission Control data.";
    option (ship.ops.v1.capability) = "ship.sessions.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc ListLive(ListSessionsReq) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.sessions.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
