// `events.*` as a hand-authored per-domain proto-SSOT service (#89). This is
// the sole serving path — the generated ReadOps umbrella was retired (#78).
// The `*Req` suffix is historical (it avoided collision with the umbrella's
// EventsListRequest, since deleted); kept for wire stability. Return type
// reuses EventsListResponse from types.proto.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";
import "ship/ops/v1/ops.proto";

// Cursor-walk poll for `ship tail` (#141): replays the event log forward
// from a ULID cursor with slug/namespace filters.
message EventsPollReq {
  string since_id = 1;
  string slug = 2;
  string namespace = 3;
  int64 limit = 4;
}

// Events read surface. Reads are C0 (edge-authenticated).
service EventsService {
  rpc Poll(EventsPollReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.events.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
