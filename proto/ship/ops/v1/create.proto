// `create.*` surface-authoring writes as a hand-authored per-domain proto-SSOT
// service (#89), mounted ADDITIVELY beside the generated CommandOpsService
// (which keeps serving `create.surface` until the GUI flip, #72). Old path
// UNCHANGED.
//
// Scaffolds a new surface (view | skill). Ship-authoring-restricted write,
// routed through the ONE gate (services::command::call) which enforces the
// `ship.surfaces.write` capability.
//
// Request message takes a FRESH name (CreateSurfaceReq) to avoid colliding with
// the CreateSurfaceRequest the generated commands.gen.proto still declares in
// this same ship.ops.v1 package. Return mirrors the generated path exactly
// (opaque JsonResponse) so the GUI flip is a transport swap, not a shape change.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";

message CreateSurfaceReq {
  string surface = 1;
  string name = 2;
  string shape = 3;
  string purpose = 4;
}

// Surface scaffolding. Single C1 workspace write gated on `ship.surfaces.write`.
service CreateService {
  rpc Surface(CreateSurfaceReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.surfaces.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
}
