// Isolation read surface — capability probe + recommender results + wizard
// previews, authored under proto-as-SSOT (decision #67 a). These are the
// agent-facing + GUI reads that previously lived as the `isolation_status` MCP
// tool and the `/api/v1/isolation/{status,recommendations,preview,verify}` REST
// reads; they move here so the surface survives the MCP cull and is reachable
// transport-agnostically via `ship ops call isolation.*`.
//
// All four are pure C0 reads (capability "ship.isolation.read"): they probe the
// host and run the recommender, mutating nothing the caller doesn't own.
//
// **Typed contract (per ADR `rpc-is-the-typed-contract`).** Each RPC returns a
// structured proto message that mirrors the `ship_isolation` serde types
// field-for-field (`Capabilities`, `IsolationDecision`, `Recommendations`,
// `VerifyResult`). The serde types remain the crate's source of truth — the
// wire layer in `crates/core/ship-isolation/src/wire.rs` maps them onto these
// proto messages — and the conformance gate (`cargo run -p xtask --
// gen-fixtures --check`) decodes every fixture against this proto to catch
// drift. The data-bearing `ResolutionReason` discriminant is modeled as a
// proto `oneof` so the wire contract preserves the variant payload shape
// (e.g. `OsDefault.os`, `Downgrade.from` + `Downgrade.why`).
//
// Enum-shaped fields (`os`, `tier`, `strategy`) ride as `string` — the
// snake_case ids match the serde `rename_all` rules, which keeps the
// wire round-trip trivial (no enum-value mapping at the wire). The
// `ship_isolation` crate remains the source of truth for the variant
// sets (see `IsolationTier::ALL`, `IsolationStrategy::ALL`).
//
// `isolation.init` (the install wizard's C1 daemon-settings write) is NOT here:
// it is operator-only (never agent-facing) and a C1 write must route through the
// one gate (services::command::call), which is a separable migration from this
// read surface and is not threatened by the MCP cull.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";

// ── Read requests ─────────────────────────────────────────────────────────────

// Probe the host's sandbox capabilities + the strategy Ship would pick next.
message IsolationStatusRequest {
  // Force a fresh probe instead of the cached snapshot.
  bool rescan = 1;
}

// Tier + strategy candidates with the recommender's resolved pick.
message IsolationRecommendationsRequest {}

// Resolve a decision for an explicitly chosen tier/strategy (wizard preview).
message IsolationPreviewRequest {
  // Tier id (e.g. "vm", "container"); unset = recommender's choice.
  optional string tier = 1;
  // Strategy id (e.g. "firecracker", "docker_engine"); unset = recommender's choice.
  optional string strategy = 2;
}

// Dry-run the recommended decision end to end (does it actually stand up).
message IsolationVerifyRequest {}

// ── Typed read responses ──────────────────────────────────────────────────────

// Detected host capabilities. Mirrors
// `crates/core/ship-isolation/src/capabilities.rs::Capabilities`.
message IsolationCapabilities {
  // Detected host OS id (snake_case; see `Capabilities::os` /
  // `HostOs::as_id` — values: "linux", "macos_arm", "macos_intel",
  // "windows", "wsl2", "unknown").
  string os = 1;
  // `true` if we appear to already be running inside someone else's sandbox
  // (CI container, codespace, Docker, etc.). Recommender treats this as
  // "Tier 0; don't double-wrap" (per strategy.md §4).
  bool in_sandbox = 2;
  bool docker = 3;
  bool podman = 4;
  optional string youki = 5;
  optional string youki_rootfs = 6;
  optional string lima = 7;
  optional string tart = 8;
  bool wsl2 = 9;
  bool srt = 10;
  bool sandbox_exec = 11;
  bool vz_framework = 12;
  // `/dev/kvm` is readable+writable — the Firecracker microVM substrate is
  // reachable (Ship bundles the firecracker binary + kernel + rootfs, so KVM
  // access is the capability signal). Linux/WSL2 only.
  bool firecracker = 13;
  // Apple's `container` CLI is present — microVM-per-container substrate on
  // Apple Silicon. macOS only.
  bool apple_container = 14;
  bool fly_cli = 15;
  bool fly_authed = 16;
}

// Why the recommender picked what it picked. Data-bearing — a proto `oneof`
// preserves the variant payload shape (`OsDefault.os`, `Downgrade.from` +
// `Downgrade.why`). Mirrors
// `crates/core/ship-isolation/src/recommender.rs::ResolutionReason`.
message IsolationResolutionReason {
  oneof reason {
    // Explicit per-run override (`ship use --isolation=…`).
    IsolationResolutionRunOverride run_override = 1;
    // Pinned in agent profile YAML.
    IsolationResolutionAgentOverride agent_override = 2;
    // User's daemon-wide default.
    IsolationResolutionUserDefault user_default = 3;
    // Per-OS recommended tier from `strategy.md` §4.
    IsolationResolutionOsDefault os_default = 4;
    // The previous choice wasn't available; this is the fallback.
    IsolationResolutionDowngrade downgrade = 5;
    // Already inside someone else's sandbox; no point double-wrapping.
    IsolationResolutionAlreadyInSandbox already_in_sandbox = 6;
  }
}

message IsolationResolutionRunOverride {}
message IsolationResolutionAgentOverride {}
message IsolationResolutionUserDefault {}
message IsolationResolutionOsDefault {
  // Snake_case host OS id; same set as `IsolationCapabilities.os`.
  string os = 1;
}
message IsolationResolutionDowngrade {
  // Snake_case tier id; values: "none", "process", "container", "vm", "cloud".
  string from = 1;
  string why = 2;
}
message IsolationResolutionAlreadyInSandbox {}

// The resolved (strategy, tier, reason, downgraded) tuple. Mirrors
// `crates/core/ship-isolation/src/recommender.rs::ResolvedIsolation`.
message IsolationResolved {
  // Snake_case strategy id; values: "noop", "harness_native", "srt",
  // "harness", "docker", "youki", "wsl2", "lima", "apple_container",
  // "firecracker", "fly".
  string strategy = 1;
  // Snake_case tier id; values: "none", "process", "container", "vm", "cloud".
  string tier = 2;
  IsolationResolutionReason reason = 3;
  bool downgraded = 4;
}

// User-facing profile that bundles a tier choice with overrides. Mirrors
// `crates/core/ship-isolation/src/tier.rs::IsolationProfile`. All fields
// optional — an empty profile means "inherit from the next level".
message IsolationProfile {
  optional string tier = 1;
  optional string strategy = 2;
  // Optional policy override (mounts, network, limits) — the open payload
  // rides as serialized JSON to keep the proto stable across the policy DSL.
  optional string policy_json = 3;
}

// What the orchestrator gets back when it asks "what isolation should this
// agent run use?". Mirrors
// `crates/core/ship-isolation/src/decision.rs::IsolationDecision`.
message IsolationDecision {
  IsolationResolved resolved = 1;
  IsolationCapabilities capabilities = 2;
  IsolationProfile user_profile_used = 3;
}

// The top-level Status response: the capability snapshot + the resolved
// decision. Mirrors the `Status.response` JSON shape from the previous
// `JsonResponse` era.
message IsolationStatusResponse {
  IsolationCapabilities capabilities = 1;
  // The resolved decision. On error (e.g. pinned tier unavailable, no
  // fallback and Tier 0 forbidden) the wire layer surfaces `ConnectError`
  // instead of populating this field with an error marker; the gate returns
  // the error to the caller, not a half-typed response.
  IsolationDecision decision = 2;
}

// One strategy row inside a tier recommendation. Mirrors
// `crates/core/ship-isolation/src/decision_ops.rs::StrategyRow`.
message IsolationStrategyRow {
  // Snake_case strategy id; same set as `IsolationResolved.strategy`.
  string strategy = 1;
  bool available = 2;
  // Short reason a strategy isn't available — for the tooltip. Empty
  // string when `available` is true.
  string unavailable_reason = 3;
}

// One tier row in the picker. Mirrors
// `crates/core/ship-isolation/src/decision_ops.rs::TierRow`.
message IsolationTierRow {
  // Snake_case tier id; same set as `IsolationResolved.tier`.
  string tier = 1;
  string label = 2;
  repeated IsolationStrategyRow strategies = 3;
  // What `decide()` would return if the user pinned this tier. Unset
  // when no strategy in this tier is available on this host.
  optional IsolationResolved would_resolve_to = 4;
  bool recommended = 5;
}

// The full recommendations payload. Mirrors
// `crates/core/ship-isolation/src/decision_ops.rs::Recommendations`.
message IsolationRecommendationsResponse {
  // Snake_case host OS id; same set as `IsolationCapabilities.os`.
  string host_os = 1;
  // Snake_case tier id; same set as `IsolationResolved.tier`.
  string os_default_tier = 2;
  repeated IsolationTierRow tiers = 3;
}

// Verify a dry-run step. Mirrors
// `crates/core/ship-isolation/src/decision_ops.rs::VerifyStep`.
message IsolationVerifyStep {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}

// The result of dry-running the recommended decision. Mirrors
// `crates/core/ship-isolation/src/decision_ops.rs::VerifyResult`.
message IsolationVerifyResponse {
  bool ok = 1;
  repeated IsolationVerifyStep steps = 2;
  // The decision that was verified. Present on success and on most failures;
  // omitted only when `decide()` itself errored (unreachable decision).
  optional IsolationDecision resolved = 3;
}

// The Preview response is the same shape as the decision embedded in
// Status — both are `IsolationDecision`.
message IsolationPreviewResponse {
  IsolationDecision decision = 1;
}

// ── Service ──────────────────────────────────────────────────────────────────

// Capability probe + recommender results. Pure reads, C0 (edge-authenticated);
// the gate reads "ship.isolation.read" from this descriptor set.
service IsolationService {
  rpc Status(IsolationStatusRequest) returns (IsolationStatusResponse) {
    option (ship.ops.v1.capability) = "ship.isolation.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
    option (ship.ops.v1.description) =
        "Detected host sandbox capabilities + the strategy Ship would pick for the next agent run.";
  }
  rpc Recommendations(IsolationRecommendationsRequest) returns (IsolationRecommendationsResponse) {
    option (ship.ops.v1.capability) = "ship.isolation.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
    option (ship.ops.v1.description) =
        "Per-tier isolation options with each strategy's availability and the recommended pick.";
  }
  rpc Preview(IsolationPreviewRequest) returns (IsolationPreviewResponse) {
    option (ship.ops.v1.capability) = "ship.isolation.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
    option (ship.ops.v1.description) =
        "Resolve the isolation decision for an explicit tier/strategy without applying it.";
  }
  rpc Verify(IsolationVerifyRequest) returns (IsolationVerifyResponse) {
    option (ship.ops.v1.capability) = "ship.isolation.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
    option (ship.ops.v1.description) =
        "Dry-run the recommended isolation decision end to end and report each check.";
  }
}
