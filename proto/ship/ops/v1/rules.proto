// `rules.*` — the FIRST migrated domain under proto-as-SSOT (decision #89;
// the analytics/runtime/view_errors exemplars were greenfield reads, this one
// proves reads AND gated writes against an existing domain). RulesService is
// now the SOLE serving path — the generated ReadOpsService/CommandOpsService
// umbrella was retired (#78).
//
// Request messages take fresh names (CreateRuleRequest, …) — historical
// collision-avoidance against the deleted commands.gen.proto/reads.gen.proto
// (which declared RulesCreateRequest et al.); kept for wire stability. Return
// types are the SHARED shapes in types.proto (ScopedMutation / RulesIndexResponse
// / RuleGetResponse), imported, not redeclared.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";

message ListRulesRequest {}

message GetRuleRequest {
  string id = 1;
  // "project" | "user"; empty walks Project → User.
  string scope = 2;
}

message CreateRuleRequest {
  string id = 1;
  string content = 2;
  string scope = 3;
}

message PutRuleRequest {
  string id = 1;
  string content = 2;
  string scope = 3;
}

message DeleteRuleRequest {
  string id = 1;
  string scope = 2;
}

// Markdown behavior-config CRUD. Reads are C0 (edge-authenticated); writes are
// C1 workspace mutations, gated through the one gate (services::command::call)
// on dispatch — same policy the retired CommandOpsService carried.
service RulesService {
  rpc List(ListRulesRequest) returns (RulesIndexResponse) {
    option (ship.ops.v1.description) = "List markdown rules across scopes.";
    option (ship.ops.v1.capability) = "ship.rules.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Get(GetRuleRequest) returns (RuleGetResponse) {
    option (ship.ops.v1.description) = "Raw rule body at the requested scope.";
    option (ship.ops.v1.capability) = "ship.rules.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Create(CreateRuleRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Create a new markdown rule (errors if the id is taken).";
    option (ship.ops.v1.capability) = "ship.rules.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc Put(PutRuleRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Replace a rule's body (use rules.create for net-new).";
    option (ship.ops.v1.capability) = "ship.rules.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc Delete(DeleteRuleRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Trash a rule (scope omitted walks project → user).";
    option (ship.ops.v1.capability) = "ship.rules.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
}
