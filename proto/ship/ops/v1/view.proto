// `view.*` — the sole view.* serving path. The generated CommandOpsService
// umbrella was retired (#78).
//
// These are the agent view-authoring protocol: session fragment edits
// (patch/append/signal), edit-mode grant/revoke, and the authoring-tool
// dispatch. All are identity-bound, ship-authoring-restricted writes — each
// routes through the ONE gate (services::command::call), which enforces the
// `ship.views.write` capability + the per-session edit-mode grant.
//
// Request messages take FRESH names (ViewPatchReq, …) — historical
// collision-avoidance against the deleted commands.gen.proto (which declared
// ViewPatchSessionRequest et al.); kept for wire stability. Returns are opaque
// JsonResponse.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";

message ViewPatchReq {
  string id = 1;
  string selector = 2;
  string html = 3;
}

message ViewAppendReq {
  string id = 1;
  string selector = 2;
  string html = 3;
}

message ViewSignalReq {
  string id = 1;
  string name = 2;
  string value_json = 3;
}

// Shared by EnterEditMode + ExitEditMode (same args; the rpc decides grant).
message ViewEditModeReq {
  string view = 1;
  string session_id = 2;
}

message ViewToolReq {
  string view = 1;
  string session_id = 2;
  string op = 3;
  string args_json = 4;
}

// Scaffold a new view from a named shape template.
message ViewScaffoldReq {
  // Kebab-case id for the new view directory.
  string name = 1;
  // Shape template (e.g. "list" | "form" | "dashboard" | "blank").
  string shape = 2;
  // Optional one-line purpose written into the scaffold.
  string purpose = 3;
}

message ViewScaffoldResponse {
  // Browsable route for the new view (e.g. "/api/v1/v/<name>").
  string route = 1;
  // Absolute path to the scaffolded view directory.
  string path = 2;
}

// View-authoring writes for an agent's own SUI session. Every rpc is a C1
// workspace write gated on `ship.views.write`. Scaffold is C1 (workspace write).
service ViewService {
  rpc PatchSession(ViewPatchReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc AppendSession(ViewAppendReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc SignalSession(ViewSignalReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc EnterEditMode(ViewEditModeReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc ExitEditMode(ViewEditModeReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc Tool(ViewToolReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  // Scaffold a new view from a shape template. Moves the create.surface/view
  // route-core into the owning crate's wire.
  rpc Scaffold(ViewScaffoldReq) returns (ViewScaffoldResponse) {
    option (ship.ops.v1.description) = "Scaffold a new view directory from a named shape template.";
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
}
