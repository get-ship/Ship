// View client-error capture — proto-as-SSOT (decision #67 a). A bounded
// in-memory ring of browser-side errors agents read while iterating on views.
//
// All three ops are C0: appending/reading/clearing an ephemeral, capped,
// non-persisted, unscoped buffer is harmless to Ship (matches the prior
// ReadWorkspace REST auth). Mutations served on a hand-authored service are
// edge-authenticated; gated (C1/C2) commands need the transport gate (see the
// ops backlog) before they can be served this way.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";

// One captured client error. `detail` is arbitrary client JSON, carried as a
// string (the open-payload convention) since it has no fixed shape.
message ViewError {
  uint64 id = 1;
  optional string view = 2;
  optional string url = 3;
  // js-error | unhandled-rejection | datastar-fetch | console-error | …
  string kind = 4;
  string message = 5;
  optional string stack = 6;
  optional string filename = 7;
  optional uint32 line = 8;
  optional uint32 column = 9;
  optional string detail_json = 10;
  optional string user_agent = 11;
  optional string timestamp_client = 12;
  uint64 timestamp_server_ms = 13;
}

message PostViewErrorRequest {
  optional string view = 1;
  optional string url = 2;
  optional string kind = 3;
  string message = 4;
  optional string stack = 5;
  optional string filename = 6;
  optional uint32 line = 7;
  optional uint32 column = 8;
  optional string detail_json = 9;
  optional string user_agent = 10;
  optional string timestamp_client = 11;
}
message PostViewErrorResponse {
  uint64 id = 1;
  bool accepted = 2;
}

message ListViewErrorsRequest {
  // Only return errors with id > since.
  optional uint64 since = 1;
  optional string view = 2;
  // Newest-first cap; defaults to 50.
  optional uint32 limit = 3;
}
message ListViewErrorsResponse {
  repeated ViewError errors = 1;
  uint64 total = 2;
}

message ClearViewErrorsRequest {}
message ClearViewErrorsResponse {
  uint64 cleared = 1;
}

service ViewErrorsService {
  rpc Post(PostViewErrorRequest) returns (PostViewErrorResponse) {
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc List(ListViewErrorsRequest) returns (ListViewErrorsResponse) {
    option (ship.ops.v1.capability) = "ship.views.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Clear(ClearViewErrorsRequest) returns (ClearViewErrorsResponse) {
    option (ship.ops.v1.capability) = "ship.views.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
