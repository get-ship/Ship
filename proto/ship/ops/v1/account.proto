// `account.*` as a hand-authored per-domain proto-SSOT service (#89),
// mounted ADDITIVELY beside the generated ReadOpsService which keeps serving
// account.* until the GUI flip (#72). Old path UNCHANGED.
//
// Request message uses a fresh name (GetAccountStateReq) to avoid collision
// with AccountStateRequest declared in reads.gen.proto in this same package.
// Return type is opaque JsonResponse — AccountState embeds provider-specific
// fields that vary by harness and are not stable enough to type in proto.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";

message GetAccountStateReq {}
message LogoutReq {}

// Ship Cloud account state + the logout write. (login/complete/key remain a
// pre-credential REST bootstrap — they're how you obtain the bearer a Connect
// call requires, so they can't speak authenticated Connect. See #141.)
service AccountService {
  rpc State(GetAccountStateReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.account.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc StateLive(GetAccountStateReq) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.account.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  // Clear the daemon's stored gateway token (idempotent). C2 — account
  // mutation requiring user presence.
  rpc Logout(LogoutReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.account.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
}
