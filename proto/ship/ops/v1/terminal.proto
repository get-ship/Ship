// Terminal service — the Connect-native surface for interactive shell / PTY
// sessions on the daemon. Replaces the legacy REST surface in
// `apps/shipd/src/sessions/` (`/api/v1/sessions/...` + `/api/v1/pty-sessions`).
//
// Why a dedicated service: PTY sessions are NOT an agent concept. They are a
// dev / power-user surface, distinct from `AgentsService` (run control) and
// the canonical session projection (agent sessions). Terminal state lives in
// the L1 `ship-terminal` crate (`ship_terminal::SessionRegistry`); this
// service is the L2 Connect wire over that state.
//
// Streaming: `SessionBytes` is server-streaming (raw PTY output, byte-exact).
// `SessionEvents` is server-streaming (typed harness events, when present).
// Both use the same broadcast subscribers the legacy SSE routes used — the
// Connect adapter is the only difference.
//
// Capability policy: C0 for reads, C1 for lifecycle/IO. The `Input` blast
// is C1 because PTY input is treated as mutating the user's own space
// (matches the policy the legacy REST `/input` route enforced via
// `ManageRuns` scope).

syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";
import "ship/ops/v1/stream.proto";

service TerminalService {
  rpc Spawn(SpawnTerminalRequest) returns (TerminalSession) {
    option (ship.ops.v1.capability) = "ship.terminals.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc Stop(StopTerminalRequest) returns (StopTerminalResponse) {
    option (ship.ops.v1.capability) = "ship.terminals.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc List(ListTerminalsRequest) returns (ListTerminalsResponse) {
    option (ship.ops.v1.capability) = "ship.terminals.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Get(GetTerminalRequest) returns (TerminalSession) {
    option (ship.ops.v1.capability) = "ship.terminals.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc SendInput(SendInputRequest) returns (SendInputResponse) {
    option (ship.ops.v1.capability) = "ship.terminals.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  rpc Resize(ResizeTerminalRequest) returns (ResizeTerminalResponse) {
    option (ship.ops.v1.capability) = "ship.terminals.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc SessionBytes(SessionStreamRequest) returns (stream BytesChunk) {
    option (ship.ops.v1.capability) = "ship.terminals.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc SessionEvents(SessionEventsRequest) returns (stream JsonResponse) {
    option (ship.ops.v1.capability) = "ship.terminals.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}

message SpawnTerminalRequest {
  string workspace_id = 1;
  string kind = 2;
  string work_dir = 3;
}
message StopTerminalRequest { string session_id = 1; }
message StopTerminalResponse {}
message ListTerminalsRequest { bool include_ended = 1; }
message ListTerminalsResponse { repeated TerminalSession sessions = 1; }
message GetTerminalRequest { string session_id = 1; }
message SendInputRequest { string session_id = 1; bytes data = 2; }
message SendInputResponse {}
message ResizeTerminalRequest { string session_id = 1; uint32 cols = 2; uint32 rows = 3; }
message ResizeTerminalResponse {}
message SessionEventsRequest { string session_id = 1; }

message TerminalSession {
  string id = 1;
  string kind = 2;
  string workspace_id = 3;
  string agent_id = 4;
  string harness = 5;
  string model = 6;
  string status = 7;
  string outcome = 8;
  string reason = 9;
  string input = 10;
  string parent = 11;
  uint32 turn_count = 12;
  string started_at = 13;
  string ended_at = 14;
  string pid = 15;
  string log_path = 16;
  string harness_session_id = 17;
  string work_dir = 18;
}

// Shared streaming message types (moved from stream.proto).
message SessionStreamRequest {
  string session_id = 1;
}
message BytesChunk {
  bytes data = 1;
}
