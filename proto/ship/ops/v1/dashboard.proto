// `dashboard.*` as a hand-authored per-domain proto-SSOT service (#89),
// mounted ADDITIVELY beside the generated ReadOps (which keeps serving until
// #72). Dashboard is an aggregate (*Ctx) — the registry returns an open blob,
// so the return stays JsonResponse. Request uses `*Req` suffix to avoid
// collision with the generated DashboardStateRequest in this package.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";

message DashboardStateReq {}

// Dashboard read surface. Reads are C0 (edge-authenticated).
service DashboardService {
  rpc State(DashboardStateReq) returns (JsonResponse) {
    option (ship.ops.v1.capability) = "ship.dashboard.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
