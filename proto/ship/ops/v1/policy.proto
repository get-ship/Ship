// Custom method options carrying the capability gate's policy. The proto is
// the single source for op shapes AND policy (decision #67, option a). The
// daemon gate reads these options from the compiled FileDescriptorSet at
// startup (buffa reflection) — see ship-ops-rpc + the agent-access spec.
syntax = "proto3";

package ship.ops.v1;

import "google/protobuf/descriptor.proto";

// Blast-radius class — see .artifacts/op-blast-radius-audit.md.
enum BlastRadius {
  BLAST_RADIUS_UNSPECIFIED = 0;
  // Read / own-scope; harmless to Ship. Allowed on any authenticated surface.
  BLAST_RADIUS_C0_SAFE = 1;
  // Mutates the caller's own space — the user's own risk.
  BLAST_RADIUS_C1_SPACE = 2;
  // Elevated — dispatch/control agents, settings, mcp, authoring. Off the
  // default agent surface; granted to trusted agents (e.g. commander) via a
  // raised per-service ceiling. Not human-only.
  BLAST_RADIUS_C2_ELEVATED = 3;
  // Critical — cloud/credential/billing/permissions. Operator (human, GUI/2FA)
  // only; never granted to an agent regardless of ceiling.
  BLAST_RADIUS_C3_CRITICAL = 4;
}

extend google.protobuf.MethodOptions {
  // Required capability, e.g. "ship.meta.read". Field numbers in the
  // 50000-99999 range are reserved for in-house, non-registered extensions.
  string capability = 50001;
  // Blast-radius class driving the gate.
  BlastRadius blast_radius = 50002;
  // Content-exposure flag (redaction / log hygiene); orthogonal to blast radius.
  bool op_sensitive = 50003;
  // One-line human description of the op — the SSOT for sdk-skill + `ship --help`
  // doc text. Moves the last prose that lived in the Rust registry into proto,
  // so the registry's descriptor tables lose their final reader.
  string description = 50004;
}
