// `git.*` as a hand-authored per-domain proto-SSOT service (#89), mounted
// ADDITIVELY beside the generated ReadOps/CommandOps (which keep serving
// git.* until the GUI flip, #72). Request messages use `*Req` suffix to
// avoid colliding with the generated GitStatusRequest et al. in this same
// ship.ops.v1 package. Return types reuse the shared shapes in types.proto
// (StatusBuckets / GitLogResponse / GitBranchesResponse / GitOverviewResponse /
// GitDiffResponse) and the generic JsonResponse from ops.proto.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";
import "ship/ops/v1/ops.proto";

// ── Read requests ─────────────────────────────────────────────────────────────

message GitStatusReq {}

message GitLogReq {
  int64 limit = 1;
}

message GitBranchesReq {}

message GitOverviewReq {
  string workspace_id = 1;
  int64 limit = 2;
}

message GitDiffReq {
  string commit = 1;
  string workspace_id = 2;
}

message GitAnnotationsReq {
  string file = 1;
  string workspace_id = 2;
}

// ── Write requests ────────────────────────────────────────────────────────────

message GitPushReq {
  string workspace_id = 1;
  string remote = 2;
  optional bool force = 3;
}

message GitFetchReq {
  string workspace_id = 1;
  string remote = 2;
}

message GitPullReq {
  string workspace_id = 1;
  string remote = 2;
}

message GitStageReq {
  string workspace_id = 1;
  repeated string paths = 2;
}

message GitUnstageReq {
  string workspace_id = 1;
  repeated string paths = 2;
}

message GitCommitReq {
  string workspace_id = 1;
  string message = 2;
  string author = 3;
}

message GitCheckoutReq {
  string workspace_id = 1;
  string refname = 2;
}

message GitBranchCreateReq {
  string workspace_id = 1;
  string name = 2;
  optional bool checkout = 3;
}

message GitBranchDeleteReq {
  string workspace_id = 1;
  string name = 2;
  optional bool force = 3;
}

message GitInitReq {
  string workspace_id = 1;
}

// Git read + write surface. Reads are C0 (edge-authenticated); writes are
// C1 workspace mutations routed through services::command::call (the one gate).
service GitService {
  rpc Status(GitStatusReq) returns (StatusBuckets) {
    option (ship.ops.v1.description) = "Working tree + index status buckets.";
    option (ship.ops.v1.capability) = "ship.git.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Log(GitLogReq) returns (GitLogResponse) {
    option (ship.ops.v1.description) = "Commit log up to `limit` entries.";
    option (ship.ops.v1.capability) = "ship.git.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Branches(GitBranchesReq) returns (GitBranchesResponse) {
    option (ship.ops.v1.description) = "Local + remote branches with ahead/behind vs upstream.";
    option (ship.ops.v1.capability) = "ship.git.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Overview(GitOverviewReq) returns (GitOverviewResponse) {
    option (ship.ops.v1.description) = "One-call shape for the git view's default route.";
    option (ship.ops.v1.capability) = "ship.git.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Diff(GitDiffReq) returns (GitDiffResponse) {
    option (ship.ops.v1.description) = "Diff for a commit or 'WORKING'.";
    option (ship.ops.v1.capability) = "ship.git.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Annotations(GitAnnotationsReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "AnnotationsByLine for the active diff file.";
    option (ship.ops.v1.capability) = "ship.git.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Push(GitPushReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Push the caller's worktree to a remote.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc Fetch(GitFetchReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Fetch a remote in the caller's worktree.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc Pull(GitPullReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Pull (ff-only) in the caller's worktree.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc Stage(GitStageReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Stage paths in the caller's worktree.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc Unstage(GitUnstageReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Unstage paths in the caller's worktree.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc Commit(GitCommitReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Commit staged changes in the caller's worktree.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc Checkout(GitCheckoutReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Checkout a ref/branch in the caller's worktree.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc BranchCreate(GitBranchCreateReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Create a branch in the caller's worktree (optionally checkout).";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc BranchDelete(GitBranchDeleteReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Delete a branch in the caller's worktree.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
  rpc Init(GitInitReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Initialize a git repository in the caller's worktree.";
    option (ship.ops.v1.capability) = "ship.git.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
}
