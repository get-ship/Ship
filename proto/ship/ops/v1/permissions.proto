// `permissions.*` as a hand-authored, per-domain proto-SSOT service — second
// migrated domain (decision #89, following rules.proto as the worked exemplar).
// Mounted ADDITIVELY beside the generated ReadOpsService/CommandOpsService, which
// still serve permissions.* until the GUI flip (#72). Old descriptor tables and
// dispatch stay untouched.
//
// Request messages take fresh names (CreatePermissionRequest, …) because the
// generated commands.gen.proto/reads.gen.proto already declare
// PermissionsCreateRequest et al. in this same package — two definitions would
// collide. Return types are SHARED shapes from types.proto
// (ScopedMutation / PermissionsIndexResponse / ToolPatternsResponse), and
// GetPermissionResponse is declared here (domain-local, like IsolationService's
// response messages in isolation.proto).
//
// Per ADR `rpc-is-the-typed-contract`, Get returns a typed proto message
// (GetPermissionResponse) rather than an opaque JsonResponse. The preset body
// rides as `preset_json` (JSON string) — same open-payload convention as
// RuleGetResponse.body and CollectionItem.data_json — keeping the proto stable
// across the permission schema DSL. The wire layer in
// `ship_agents::services::permissions::wire` maps the serde PermissionEntry
// onto this message by hand, with a serde round-trip self-check.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";

message ListPermissionsRequest {}

message GetPermissionRequest {
  string id = 1;
  // "project" | "user"; empty walks Project → User.
  string scope = 2;
}

message GetToolPatternsRequest {}

message CreatePermissionRequest {
  string id = 1;
  // JSON-serialized preset object.
  string preset_json = 2;
  string scope = 3;
}

message PutPermissionRequest {
  string id = 1;
  string preset_json = 2;
  string scope = 3;
}

message PatchPermissionRequest {
  string id = 1;
  // JSON-serialized RFC-6902 patch array.
  string patch_json = 2;
  string scope = 3;
}

message DeletePermissionRequest {
  string id = 1;
  string scope = 2;
}

// Typed response for permissions.get — raw preset at the resolved scope.
// Mirrors `ship_agents::services::permissions::service::PermissionEntry`.
// The preset body rides as JSON (`preset_json`) to keep the proto stable
// across the permission schema DSL — same open-payload convention as
// `RuleGetResponse.body` and `CollectionItem.data_json`.
message GetPermissionResponse {
  string id = 1;
  // "project" | "user" — the scope where this preset was found.
  string scope = 2;
  // JSON-serialized preset object. Parse against the permission DSL.
  string preset_json = 3;
}

// Permission-preset CRUD + autocomplete catalog.
// Reads are C0 (edge-authenticated). Writes are C2_ELEVATED (operator-only):
// these are the security policies that govern agents, so agents must never
// mutate the policy that constrains them regardless of grants. The gate enforces
// operator-only via services::command::call; this service only routes.
service PermissionsService {
  rpc List(ListPermissionsRequest) returns (PermissionsIndexResponse) {
    option (ship.ops.v1.description) = "List permission presets across scopes.";
    option (ship.ops.v1.capability) = "ship.permissions.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  // Returns the permission preset body at the resolved scope.
  // Per ADR `rpc-is-the-typed-contract` the response is typed; the preset
  // body rides as `preset_json` (serialised JSON string) so the proto stays
  // stable across permission DSL changes.
  rpc Get(GetPermissionRequest) returns (GetPermissionResponse) {
    option (ship.ops.v1.description) = "Permission preset at the requested scope — id, scope, and JSON body.";
    option (ship.ops.v1.capability) = "ship.permissions.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc ToolPatterns(GetToolPatternsRequest) returns (ToolPatternsResponse) {
    option (ship.ops.v1.description) = "Enumerate tool-pattern capability names (for agent builders).";
    option (ship.ops.v1.capability) = "ship.permissions.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Create(CreatePermissionRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Create a new permission preset (errors if the id is taken).";
    option (ship.ops.v1.capability) = "ship.permissions.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc Put(PutPermissionRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Replace a permission preset's body (use permissions.create for net-new).";
    option (ship.ops.v1.capability) = "ship.permissions.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc Patch(PatchPermissionRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Apply RFC-6902 ops to a permission preset's body.";
    option (ship.ops.v1.capability) = "ship.permissions.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
  rpc Delete(DeletePermissionRequest) returns (ScopedMutation) {
    option (ship.ops.v1.description) = "Remove a permission preset (scope omitted walks project → user).";
    option (ship.ops.v1.capability) = "ship.permissions.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C2_ELEVATED;
  }
}
