// `workspaces.*` as a hand-authored per-domain proto-SSOT service (#89),
// mounted ADDITIVELY beside the generated ReadOpsService which keeps serving
// workspaces.* until the GUI flip (#72). Old path UNCHANGED.
//
// Request messages use fresh names (ListWorkspacesReq, GetActiveWorkspaceReq)
// to avoid collision with WorkspacesListRequest / WorkspacesActiveRequest
// declared in reads.gen.proto in this same package. Return types reuse shared
// shapes: WorkspaceActiveResponse from types.proto and JsonResponse from
// ops.proto (workspaces.list embeds platform-specific fields, so it stays
// opaque).
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/types.proto";
import "ship/ops/v1/ops.proto";

message ListWorkspacesReq {}

message GetActiveWorkspaceReq {}

// Project workspace index + active-workspace pointer. C0 reads only.
service WorkspacesService {
  rpc List(ListWorkspacesReq) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Known project workspaces with active flag per row.";
    option (ship.ops.v1.capability) = "ship.workspaces.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc Active(GetActiveWorkspaceReq) returns (WorkspaceActiveResponse) {
    option (ship.ops.v1.description) = "Currently-active workspace id (null if none).";
    option (ship.ops.v1.capability) = "ship.workspaces.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
