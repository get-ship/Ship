// Analytics read surface — the FIRST hand-authored domain proto under
// proto-as-SSOT (decision #67 a). Unlike reads.gen.proto / commands.gen.proto
// (generated from the legacy Rust descriptor tables), this file is authored
// directly: it is the single source for these ops' shapes AND policy. The
// daemon implements the generated `AnalyticsService` trait reading the
// `ship_analytics` projection; the gate reads the per-rpc capability/blast
// options from the compiled descriptor set (no Rust descriptor table).
//
// Backs bucket-C gap #1 (the four /api/v1/analytics/* REST reads). Pure
// projection reads — C0, capability "ship.analytics.read".
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";

// One row of `analytics_sessions` — a harness session's lifecycle + tool tally.
message AnalyticsSession {
  string session_key = 1;
  string actor_id = 2;
  optional string harness = 3;
  optional string model = 4;
  string started_at = 5;
  optional string ended_at = 6;
  optional int64 duration_ms = 7;
  int64 tool_use_count = 8;
  int64 tool_error_count = 9;
  optional string reason = 10;
}

// Per-tool call/error tally with mean successful-call duration.
message AnalyticsToolUsage {
  string tool = 1;
  int64 calls = 2;
  int64 errors = 3;
  optional int64 avg_duration_ms = 4;
}

// One observed turn's token usage. Cost is verbatim from the harness; Ship
// never computes it (absent when the harness didn't surface it).
message AnalyticsTurn {
  string id = 1;
  string session_key = 2;
  string actor_id = 3;
  optional int64 turn_idx = 4;
  optional string model = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
  int64 reasoning_tokens = 8;
  int64 cache_creation_tokens = 9;
  int64 cache_read_tokens = 10;
  optional string stop_reason = 11;
  optional double harness_reported_cost_usd = 12;
  string observed_at = 13;
}

message AnalyticsListSessionsRequest {
  // Server caps at 500 regardless; defaults to 100 when unset.
  optional int64 limit = 1;
}
message AnalyticsSessionsResponse {
  repeated AnalyticsSession sessions = 1;
}

message AnalyticsGetSessionRequest {
  string session_key = 1;
}
message AnalyticsSessionResponse {
  // Absent when the session_key matched nothing.
  optional AnalyticsSession session = 1;
}

message AnalyticsToolUsageRequest {
  // RFC3339 lower bound; unset = all time.
  optional string since = 1;
}
message AnalyticsToolUsageResponse {
  repeated AnalyticsToolUsage tools = 1;
}

message AnalyticsSessionTurnsRequest {
  string session_key = 1;
}
message AnalyticsSessionTurnsResponse {
  repeated AnalyticsTurn turns = 1;
}

// Pure projection reads. Each rpc carries its policy inline — the SSOT for the
// gate (read back from the FileDescriptorSet, not a Rust table).
service AnalyticsService {
  rpc ListSessions(AnalyticsListSessionsRequest) returns (AnalyticsSessionsResponse) {
    option (ship.ops.v1.capability) = "ship.analytics.read";
    option (ship.ops.v1.description) = "List agent sessions with rollup metrics (tokens, cost, tool use).";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc GetSession(AnalyticsGetSessionRequest) returns (AnalyticsSessionResponse) {
    option (ship.ops.v1.capability) = "ship.analytics.read";
    option (ship.ops.v1.description) = "Analytics detail for one session.";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc ToolUsage(AnalyticsToolUsageRequest) returns (AnalyticsToolUsageResponse) {
    option (ship.ops.v1.capability) = "ship.analytics.read";
    option (ship.ops.v1.description) = "Tool-usage rollup across sessions.";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  rpc SessionTurns(AnalyticsSessionTurnsRequest) returns (AnalyticsSessionTurnsResponse) {
    option (ship.ops.v1.capability) = "ship.analytics.read";
    option (ship.ops.v1.description) = "Per-turn cost/token/timing breakdown for a session.";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
