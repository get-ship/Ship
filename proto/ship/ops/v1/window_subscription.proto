// Live-data subscription multiplex — ONE Connect server-stream per webview for
// all live data, plus a unary control plane. Replaces the per-`<data live>` and
// per-`<Op>Live` server-stream pattern that exhausted the browser's ~6/origin
// HTTP/1.1 connection budget (measured: shell home held 12 concurrent sockets).
//
// A window opens `Open` once (mints win.<ulid> + session), opens ONE `Stream`,
// and adds/removes logical reads via unary `Subscribe`/`Unsubscribe`. The daemon
// keys a per-window subscription table on window_id and demuxes the single
// stream by subscription_id. Hand-authored (streaming isn't registry-projected).
// See docs/ship-adrs/0001-live-data-subscription-multiplex.md.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/reactive.proto";

// ── Control plane (unary) ────────────────────────────────────────────────────

// Mint or re-bind a window id. The server returns the canonical id; the client
// MUST use that, never invent one.
message OpenRequest {}
message OpenResponse {
  string window_id = 1;    // win.<ulid>
  string session_id = 2;   // opaque; presented on every other call
  uint32 heartbeat_ms = 3; // server heartbeat interval
}

// Add a logical subscription to the window's bucket.
message SubscribeRequest {
  string window_id = 1;
  string domain = 2;    // e.g. "agents"
  string op = 3;        // e.g. "summaries"
  bytes args_json = 4;  // encoded JSON
  string cursor = 5;    // optional, v1: ignored
}
message SubscribeAck {
  string subscription_id = 1; // sub.<ulid>
  bytes initial_value = 2;    // optional pre-resolved value
}

// Remove a logical subscription.
message UnsubscribeRequest {
  string window_id = 1;
  string subscription_id = 2;
}
message UnsubscribeAck {}

// Apply a Patch to a subscription's value; the server re-resolves after.
message PatchRequest {
  string window_id = 1;
  string subscription_id = 2;
  Patch patch = 3; // ship.ops.v1.Patch from reactive.proto
}
message PatchAck { uint32 version = 1; }

// ── Data plane (the single per-window server-stream) ─────────────────────────

message MultiplexData { bytes value = 1; uint32 version = 2; }
message MultiplexAck { uint32 version = 1; }

enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CLOSE_REASON_WINDOW_GONE = 1;
  CLOSE_REASON_POLICY_DENIED = 2;
  CLOSE_REASON_INTERNAL_ERROR = 3;
  CLOSE_REASON_VERSION_CONFLICT = 4;
  CLOSE_REASON_HEARTBEAT_TIMEOUT = 5;
}
message MultiplexClose { CloseReason reason = 1; string message = 2; }

// Tagged by subscription_id; empty subscription_id = top-level heartbeat/close.
message MultiplexEvent {
  string subscription_id = 1;
  oneof body {
    MultiplexData data = 2;
    MultiplexAck ack = 3;
    MultiplexClose close = 4;
    Heartbeat hb = 5; // ship.ops.v1.Heartbeat from reactive.proto
  }
}

message StreamRequest {
  string window_id = 1;
  string session_id = 2;
}

service WindowSubscriptionService {
  // Mint the canonical window_id + session token (once per webview process).
  rpc Open(OpenRequest) returns (OpenResponse) {
    option (ship.ops.v1.capability) = "ship.events.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  // Register a (domain, op, args) live read; returns a subscription_id.
  rpc Subscribe(SubscribeRequest) returns (SubscribeAck) {
    option (ship.ops.v1.capability) = "ship.events.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  // Drop a live read.
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeAck) {
    option (ship.ops.v1.capability) = "ship.events.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
  // Optimistic patch of a subscription value; the per-op policy gate applies in
  // the handler against the target (domain, op).
  rpc Patch(PatchRequest) returns (PatchAck) {
    option (ship.ops.v1.capability) = "ship.events.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_SPACE;
  }
  // The one per-window server-stream; demux MultiplexEvent by subscription_id.
  rpc Stream(StreamRequest) returns (stream MultiplexEvent) {
    option (ship.ops.v1.capability) = "ship.events.read";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C0_SAFE;
  }
}
