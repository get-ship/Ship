// `feedback.*` as a hand-authored, per-domain proto-SSOT service — migrated
// domain under decision #89. Mounted ADDITIVELY beside the generated
// CommandOpsService (which still serves feedback.* until the GUI flip, #72).
// Old descriptor tables + dispatch stay untouched.
//
// Request message takes a fresh name (PostFeedbackRequest) because the
// generated commands.gen.proto already declares FeedbackPostRequest in this
// same package — two definitions would collide. Return type is JsonResponse
// from ops.proto, imported, not redeclared.
syntax = "proto3";

package ship.ops.v1;

import "ship/ops/v1/policy.proto";
import "ship/ops/v1/ops.proto";

message PostFeedbackRequest {
  // JSON-serialized feedback event payload.
  string event_json = 1;
}

// Feedback write-only service. The write is C1 and routes through the one
// gate (services::command::call). No reads — feedback is write-only from the
// client surface.
service FeedbackService {
  rpc Post(PostFeedbackRequest) returns (JsonResponse) {
    option (ship.ops.v1.description) = "Post feedback (canvas/observation; rate-limited).";
    option (ship.ops.v1.capability) = "ship.feedback.write";
    option (ship.ops.v1.blast_radius) = BLAST_RADIUS_C1_WORKSPACE;
  }
}
