// Ship gateway RegistryService — the redesigned, signed-bundle package
// registry. Supersedes the legacy opaque-JSON publish proxy
// (`ops/v1/registry.proto` Publish → REST `/api/v1/registry/publish`) and the
// old GitHub-sourced flow.
//
// Shape: the daemon is the single hop to the gateway. Typed metadata +
// attestations ride this Connect service; bundle BYTES move over a signed CDN
// URL (bundles are MBs — Connect unary carries the `{url, attestation}`, the
// tarball downloads from the URL). A bundle is a content-addressed tarball of
// `.ship` artifacts + manifest; its authenticity is a publisher-signed EdDSA
// attestation (verified daemon-side by `registry::bundle_sig`).
//
// Versioning lives in the package (`ship.gateway.v1`); wire path is
// `/ship.gateway.v1.RegistryService/<Method>` per Connect convention. The TS
// gateway implements the server from this same proto (buf) — single source of
// truth, like AuthService.
syntax = "proto3";

package ship.gateway.v1;

service RegistryService {
  // Resolve a semver constraint to a concrete published version + its content
  // hash — the transitive resolver's per-dependency query (replaces git
  // tag/commit resolution for gated packages).
  rpc ResolveVersion(ResolveVersionRequest) returns (ResolveVersionResponse);

  // Fetch a published bundle: a signed CDN URL for the tarball bytes plus the
  // publisher attestation. The daemon downloads the URL, then verifies the
  // attestation (EdDSA; claim binds path/version/sha256) AND that the
  // downloaded bytes hash to `sha256` before the bundle enters the cache.
  rpc FetchBundle(FetchBundleRequest) returns (FetchBundleResponse);

  // Publish a signed bundle (new shape — typed coordinate + content hash +
  // author attestation), replacing the opaque-JSON forward. The byte-upload
  // mechanism (signed PUT URL vs. multipart) is the gateway's to specify; this
  // carries the typed metadata the daemon owns.
  rpc PublishBundle(PublishBundleRequest) returns (PublishBundleResponse);
}

message ResolveVersionRequest {
  // Package path, e.g. `github.com/owner/pkg` or `@scope/name`.
  string path = 1;
  // Semver constraint, e.g. `^1.2.0`.
  string constraint = 2;
}
message ResolveVersionResponse {
  string version = 1;
  // `sha256:<hex>` content hash of the resolved bundle.
  string sha256 = 2;
}

message FetchBundleRequest {
  string path = 1;
  string version = 2;
}
message FetchBundleResponse {
  // Signed, time-limited CDN URL for the bundle tarball bytes.
  string download_url = 1;
  // Publisher-signed EdDSA attestation (the JWT `registry::bundle_sig`
  // verifies). Its claim binds `{ path, version, sha256 }`.
  string attestation_jwt = 2;
  // `sha256:<hex>` content hash — also bound inside the attestation; the daemon
  // requires the downloaded bytes to match.
  string sha256 = 3;
}

message PublishBundleRequest {
  string path = 1;
  string version = 2;
  // `sha256:<hex>` of the tarball being published.
  string sha256 = 3;
  // The author-signed attestation over the bundle.
  string attestation_jwt = 4;
}
message PublishBundleResponse {
  bool published = 1;
  string version = 2;
}
