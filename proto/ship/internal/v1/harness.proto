// INTERNAL harness-compiler surface — ship.internal.v1.
//
// SPIKE (session_01RP76PB8FAHirne921cx3Rg): the harness compiler (`.ship` →
// third-party harness configs: Claude Code / Codex / Cursor / OpenCode / pi) as
// a DEV-RPC op Helm calls — NOT a CLI command. The operator's principle: the
// compile is an RPC op; if a CLI ever exists (`ship use` / `ship compile`) it is
// just another RPC consumer of THIS surface.
//
// Sibling of GitService (git.proto): both are LEAF wires mounted by `apps/helmd`
// — GitService over the `ship-git` leaf, HarnessService over the `compiler`
// leaf (L0 pure transform: serde / minijinja / toml, no substrate / kernel /
// runtime). helmd stays leaf-clean; `cargo tree` proves it.
//
// Codegen split (same as GitService): `buf.gen.helm.yaml` includes all of
// `ship/internal` so Helm's generated client picks this up; `buf.gen.sdk.yaml`
// excludes `ship/internal` so the public @ship/sdk never carries it.

syntax = "proto3";

package ship.internal.v1;

// The harness compiler as a dev-RPC surface. Backed by the compiler-free
// `compiler` crate (the same engine `ship use` / `ship compile` drive in the
// CLI). Helm is the second client: it dials `Compile` to turn a project's
// `.ship/` into harness-native config files, and `ListHarnesses` to enumerate
// the compile targets the engine supports.
service HarnessService {
  // ListHarnesses: the compile targets the engine supports — id, display name,
  // feature flags (mcp / hooks / tool-permissions / memory), and the project-
  // relative MCP config path. Maps to `compiler::list_harnesses()` — a pure
  // read off the static HARNESSES table; NO `.ship/` load, NO filesystem. This
  // is the FIRST real op on the harness wire (mirrors GitService.Overview as
  // the proof-of-pattern read).
  rpc ListHarnesses(ListHarnessesRequest) returns (ListHarnessesResponse);

  // Compile: the headline op — `.ship/` → per-harness config files. The RPC
  // form of `ship use <agent>` / `ship compile` (operator name: `UseConfig`).
  // Resolves the project library, applies the active agent's overrides, and
  // emits each target harness's config as a flat (path, content) set the caller
  // writes verbatim (`dry_run` returns the same set WITHOUT writing). Maps to
  // the compiler pipeline `resolve_library` → `compile` (the engine
  // `agent-def::compile::compile_project` wraps natively).
  //
  // SPIKE STATUS: the contract is locked here and the handler is wired into
  // helmd, but full execution needs the `.ship/` → `ProjectLibrary` loader as a
  // LEAF crate (today it lives in the substrate-coupled `agent-def`). See the
  // helmd handler + the session report for the exact loader-carve step.
  rpc Compile(CompileRequest) returns (CompileResponse);
}

message ListHarnessesRequest {}

// One compile target the engine supports. Mirrors `compiler::HarnessDescriptor`
// (the static HARNESSES table) — the single source of truth for harness shape.
message Harness {
  // Stable harness id, e.g. "claude" / "codex" / "cursor" / "opencode" / "pi".
  string id = 1;
  // Human display name, e.g. "Claude Code".
  string name = 2;
  // Emits MCP server config for this harness.
  bool supports_mcp = 3;
  // Emits lifecycle hooks for this harness.
  bool supports_hooks = 4;
  // Emits tool-permission config for this harness.
  bool supports_tool_permissions = 5;
  // Emits a memory / context file (CLAUDE.md / AGENTS.md) for this harness.
  bool supports_memory = 6;
  // Project-relative MCP config path, e.g. ".mcp.json"; "" when MCP is merged
  // into a larger settings file rather than a standalone file.
  string mcp_config_path = 7;
}

message ListHarnessesResponse {
  // The supported compile targets, in the engine's stable table order.
  repeated Harness harnesses = 1;
}

message CompileRequest {
  // Absolute path to the project working tree whose `.ship/` to compile.
  string repo_path = 1;
  // Optional single harness id to restrict to (""=all harnesses the resolved
  // config selects). Matches `ship compile --harness <id>`.
  string harness = 2;
  // Optional active agent id (the agent being "used"). ""=the project's
  // resolved/default active agent. Matches `ship use <agent>`.
  string active_agent = 3;
  // When true, resolve + compile but write NOTHING — the response carries the
  // files that WOULD be written. Matches `ship compile --dry-run`.
  bool dry_run = 4;
}

// One compiled config artifact — a single file the caller writes verbatim into
// the project (or previews, on a dry run). The flattened shape of the engine's
// `CompileOutput` (context file, settings patch, skill files, agent files, …)
// projected to (harness, path, content) so the caller needs no per-harness
// knowledge to lay the tree down.
message CompiledFile {
  // The harness this artifact belongs to (an id from ListHarnesses).
  string harness_id = 1;
  // Project-relative path, e.g. "CLAUDE.md" / ".claude/settings.json".
  string path = 2;
  // Full file content, ready to write.
  string content = 3;
}

message CompileResponse {
  // The harnesses that were compiled (or would be, on a dry run).
  repeated string harnesses = 1;
  // Every config artifact across all compiled harnesses, in write order.
  repeated CompiledFile files = 2;
  // Capability grants the resolved skill set requests (advisory; the daemon
  // mints only the operator-approved subset). Mirrors `CompileSummary`.
  repeated string requested_grants = 3;
  // Echoes the request's dry_run — true when nothing was written.
  bool dry_run = 4;
}
