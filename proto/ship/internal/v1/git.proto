// INTERNAL launch surface — ship.internal.v1.
//
// SPIKE (session_01RP76PB8FAHirne921cx3Rg): proves the "internal vs public"
// codegen split. This package is *deliberately* not part of the public
// @ship/sdk: `buf.gen.sdk.yaml` excludes `ship/internal`, while
// `buf.gen.helm.yaml` (Helm's own codegen target) includes it. The asymmetry
// — same proto/ tree, two generation targets, one of which sees the internal
// ops — is the whole point.
//
// GitService is a LEAF RPC over the compiler-free `ship-git` crate. It is
// served by a small standalone Rust binary (`crates/core/ship-git-rpc`) that
// depends only on ship-git + connectrpc (no compiler/substrate). One read op
// is enough to prove the pattern end to end.
syntax = "proto3";

package ship.internal.v1;

// A window onto a git repository, backed by `ship-git`'s git2 ops. Reads
// (Overview) and the first integration write (Land — squash-merge).
service GitService {
  // Repo overview: current branch, short HEAD sha, ahead/behind vs upstream,
  // and staged/unstaged/untracked counts. Maps from ship-git's
  // `state::GitOverview` / `read::load_status_buckets`.
  rpc Overview(GitOverviewRequest) returns (GitOverviewResponse);

  // Land: squash-merge a `job/<slug>` branch onto a mission's integration
  // branch as ONE commit. Maps to ship-git's `write::squash_merge`. On a merge
  // conflict NOTHING is written — the conflicting paths are returned for the
  // lander to resolve and retry (the workflow's land queue discipline; see
  // ship-ops/src/workflow/model.ts `land()` -> `{ok:false, conflicts}`).
  rpc Land(LandRequest) returns (LandResponse);
}

message GitOverviewRequest {
  // Absolute path to the repository working tree to inspect.
  string repo_path = 1;
}

message GitOverviewResponse {
  // Current branch shorthand, or short sha when HEAD is detached.
  string branch = 1;
  // Short (7-char) HEAD commit sha.
  string head_short = 2;
  // Commits ahead of the upstream (origin/<branch>); 0 when no upstream.
  uint32 ahead = 3;
  // Commits behind the upstream; 0 when no upstream.
  uint32 behind = 4;
  // Count of staged (index) entries.
  uint32 staged = 5;
  // Count of unstaged (working-tree modified/deleted) entries.
  uint32 unstaged = 6;
  // Count of untracked entries.
  uint32 untracked = 7;
  // True when the working tree has no staged/unstaged/untracked changes.
  bool clean = 8;
}

message LandRequest {
  // Absolute path to the repository working tree.
  string repo_path = 1;
  // The branch to squash-merge FROM, e.g. `job/<slug>`.
  string source_branch = 2;
  // The mission's integration branch to squash-merge ONTO, e.g. `feat/sui-rebuild`.
  string target_branch = 3;
  // The single squash commit's message.
  string message = 4;
  // Optional `"Name <email>"`; falls back to the repo's git config when empty.
  string author = 5;
}

// Exactly one of `committed` / `conflicts` is populated:
//   - clean land  -> `committed` = new squash commit sha, `conflicts` empty.
//   - conflict    -> `conflicts` = conflicting paths, `committed` empty,
//                    and NOTHING was written to the repo.
message LandResponse {
  // The new (single-parent) squash-merge commit sha, on a clean land.
  string committed = 1;
  // Conflicting paths, on a conflict. Non-empty <=> the land was rejected and
  // the repo is untouched. The lander resolves these and retries.
  repeated string conflicts = 2;
}
