// INTERNAL launch surface — ship.internal.v1.
//
// SPIKE (session_01RP76PB8FAHirne921cx3Rg): proves the "internal vs public"
// codegen split. This package is *deliberately* not part of the public
// @ship/sdk: `buf.gen.sdk.yaml` excludes `ship/internal`, while
// `buf.gen.helm.yaml` (Helm's own codegen target) includes it. The asymmetry
// — same proto/ tree, two generation targets, one of which sees the internal
// ops — is the whole point.
//
// GitService is a LEAF RPC over the compiler-free `ship-git` crate. It is
// served by a small standalone Rust binary (`crates/core/ship-git-rpc`) that
// depends only on ship-git + connectrpc (no compiler/substrate). One read op
// is enough to prove the pattern end to end.
syntax = "proto3";

package ship.internal.v1;

// A window onto a git repository, backed by `ship-git`'s git2 ops. Reads
// (Overview) and the first integration write (Land — squash-merge).
service GitService {
  // Repo overview: current branch, short HEAD sha, ahead/behind vs upstream,
  // and staged/unstaged/untracked counts. Maps from ship-git's
  // `state::GitOverview` / `read::load_status_buckets`.
  rpc Overview(GitOverviewRequest) returns (GitOverviewResponse);

  // Land: squash-merge a `job/<slug>` branch onto a mission's integration
  // branch as ONE commit. Maps to ship-git's `write::squash_merge`. On a merge
  // conflict NOTHING is written — the conflicting paths are returned for the
  // lander to resolve and retry (the workflow's land queue discipline; see
  // ship-ops/src/workflow/model.ts `land()` -> `{ok:false, conflicts}`).
  rpc Land(LandRequest) returns (LandResponse);

  // Release: the operator-gated "ship this to main" step — the second half of
  // the git workflow after Land. Squash-merge a mission's integration branch
  // onto `main` (reuses `write::squash_merge`) then stamp the result with the
  // version tag (`write::create_tag`). Integration->main should rarely conflict
  // (the branch is already integrated), but Release surfaces the SAME conflict
  // shape as Land: a conflict writes NOTHING and returns the conflicting paths.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);

  // Footprint: the files a job's branch changed since its integration base —
  // `git diff --name-only base...branch` (merge-base semantics). Maps to
  // ship-git's `read::changed_files`. This is the read half of PRESENCE: a job's
  // footprint vs the active set yields overlap (a file touched by >=2 jobs), the
  // git-derived "who's touching what". Advisory only — overlap WARNS, never
  // blocks; there is no lock. A pure read: no index, no working tree, no writes.
  rpc Footprint(FootprintRequest) returns (FootprintResponse);

  // Diff: the render-ready diff for Helm's git modal — the working tree vs HEAD
  // (no `ref` — the in-flight, uncommitted change) or a single commit's own
  // change vs its first parent (a `ref`), scoped to an optional `pathspec`. Maps
  // to ship-git's `read::structured_diff`: a flat file/hunk/row tree that
  // <ship-git-diff> renders directly (rows past a cap are dropped + `truncated`
  // is set; the add/del counts still reflect the FULL diff). A pure read — no
  // index, no working tree, no writes. This is the FIRST UI surface on dev-RPC:
  // the browser dials this op DIRECTLY (the "second client", alongside Hono).
  rpc Diff(DiffRequest) returns (DiffResponse);
}

message GitOverviewRequest {
  // Absolute path to the repository working tree to inspect.
  string repo_path = 1;
}

message GitOverviewResponse {
  // Current branch shorthand, or short sha when HEAD is detached.
  string branch = 1;
  // Short (7-char) HEAD commit sha.
  string head_short = 2;
  // Commits ahead of the upstream (origin/<branch>); 0 when no upstream.
  uint32 ahead = 3;
  // Commits behind the upstream; 0 when no upstream.
  uint32 behind = 4;
  // Count of staged (index) entries.
  uint32 staged = 5;
  // Count of unstaged (working-tree modified/deleted) entries.
  uint32 unstaged = 6;
  // Count of untracked entries.
  uint32 untracked = 7;
  // True when the working tree has no staged/unstaged/untracked changes.
  bool clean = 8;
}

message LandRequest {
  // Absolute path to the repository working tree.
  string repo_path = 1;
  // The branch to squash-merge FROM, e.g. `job/<slug>`.
  string source_branch = 2;
  // The mission's integration branch to squash-merge ONTO, e.g. `feat/sui-rebuild`.
  string target_branch = 3;
  // The single squash commit's message.
  string message = 4;
  // Optional `"Name <email>"`; falls back to the repo's git config when empty.
  string author = 5;
}

// Exactly one of `committed` / `conflicts` is populated:
//   - clean land  -> `committed` = new squash commit sha, `conflicts` empty.
//   - conflict    -> `conflicts` = conflicting paths, `committed` empty,
//                    and NOTHING was written to the repo.
message LandResponse {
  // The new (single-parent) squash-merge commit sha, on a clean land.
  string committed = 1;
  // Conflicting paths, on a conflict. Non-empty <=> the land was rejected and
  // the repo is untouched. The lander resolves these and retries.
  repeated string conflicts = 2;
}

message ReleaseRequest {
  // Absolute path to the repository working tree.
  string repo_path = 1;
  // The mission's integration branch to squash-merge FROM, e.g. `feat/sui-rebuild`.
  string integration_branch = 2;
  // The release target to squash-merge ONTO + tag, e.g. `main`.
  string main_branch = 3;
  // The version to tag the release commit with, e.g. `v0.0.1`.
  string version = 4;
  // The single release (squash) commit's message.
  string message = 5;
  // Optional `"Name <email>"` for the commit + tag; falls back to git config.
  string author = 6;
}

// Exactly one of (`committed`+`tag`) / `conflicts` is populated:
//   - clean release -> `committed` = release squash commit sha on main,
//                      `tag` = the annotated version tag, `conflicts` empty.
//   - conflict      -> `conflicts` = conflicting paths, `committed`/`tag` empty,
//                      and NOTHING was written (no commit, no tag).
message ReleaseResponse {
  // The release squash commit sha on `main`, on a clean release.
  string committed = 1;
  // The annotated version tag created at the release commit (== request version).
  string tag = 2;
  // Conflicting paths, on a conflict. Non-empty <=> the release was rejected and
  // the repo is untouched (integration->main rarely conflicts, but it can).
  repeated string conflicts = 3;
}

message FootprintRequest {
  // Absolute path to the repository working tree.
  string repo_path = 1;
  // The integration base the branch diverged from, e.g. `feat/sui-rebuild` or `main`.
  string base_ref = 2;
  // The job's branch whose footprint to compute, e.g. `job/<slug>`.
  string branch_ref = 3;
}

message FootprintResponse {
  // The files `branch_ref` changed since its merge-base with `base_ref`, sorted +
  // de-duplicated. Empty when the branch is at (or behind) the base. Presence
  // derives overlap (a file in >=2 jobs' footprints) from this — a warning, not a lock.
  repeated string files = 1;
}

message DiffRequest {
  // Absolute path to the repository working tree.
  string repo_path = 1;
  // Optional path/glob scope (a git pathspec); "" = the whole repo.
  string pathspec = 2;
  // "" = the working tree vs HEAD (the uncommitted change); else a commit/ref
  // whose OWN change (vs its first parent) to render.
  string ref = 3;
}

// One rendered row inside a file: a hunk-header row (`hunk` = true, only
// `header` set) OR a single diff line (`hunk` = false). Maps 1:1 onto a
// <ship-git-diff-hunk> / <ship-git-diff-line> child.
message DiffRow {
  // True → a hunk-header row; false → a line row.
  bool hunk = 1;
  // The `@@ -a,b +c,d @@ …` header (hunk rows only).
  string header = 2;
  // "add" | "del" | "context" (line rows); "" for hunk rows.
  string kind = 3;
  // Old-side line number ("" on an add).
  string old_line = 4;
  // New-side line number ("" on a del).
  string new_line = 5;
  // The line's code text (origin char stripped, trailing EOL trimmed).
  string text = 6;
  // Stable per-render key (a monotonic counter across the whole diff).
  string key = 7;
}

// One changed file: its paths + status + counts + the row tree.
message DiffFile {
  // New path (or the old path for a delete).
  string path = 1;
  // Pre-rename path (== `path` when not renamed).
  string old_path = 2;
  // "added" | "deleted" | "modified" | "renamed".
  string status = 3;
  uint32 additions = 4;
  uint32 deletions = 5;
  // Binary files carry no rows.
  bool binary = 6;
  repeated DiffRow rows = 7;
}

message DiffResponse {
  // The changed files in stable diff order, each with its render-ready rows.
  repeated DiffFile files = 1;
  // Total additions across all files (reflects the FULL diff even if truncated).
  uint32 additions = 2;
  // Total deletions across all files (reflects the FULL diff even if truncated).
  uint32 deletions = 3;
  // True when the row cap was hit and rows beyond it were dropped.
  bool truncated = 4;
}
