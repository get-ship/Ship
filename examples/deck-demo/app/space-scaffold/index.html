<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space</title>

  <!-- Runtime importmap — the same shape as view-host.html so any SUI
       component mounted in this space resolves the same singletons. -->
  <script type="importmap">
    {
      "imports": {
        "@ship/sui-runtime":                "/space/_assets/runtime.js",
        "@ship/sui-runtime/route":          "/space/_assets/runtime.js",
        "@ship/sui-runtime/template-hooks": "/space/_assets/runtime.js",
        "@ship/sui-dom":                    "/space/_assets/dom.js",
        "@ship/sdk-client":                 "/space/_assets/sdk-client.js"
      }
    }
  </script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #sui-root { height: 100vh; }
  </style>
</head>
<body>
  <div id="sui-root"></div>
</body>
</html>
